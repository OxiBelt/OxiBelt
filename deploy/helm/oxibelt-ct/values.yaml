profile: local # local | production

image:
  repository: ghcr.io/oxibelt/oxibelt
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

role: operator # operator | gateway
replicaCount: 1
log:
  # This complete OxiBelt TOML is the sole runtime source of truth. Structured
  # chart values configure only Kubernetes resources and the signer process.
  config: |
    [certificate_transparency]
    enabled = false
  rootBundleSecret: oxibelt-ct-roots
  rootBundleSecretKey: root-bundle.json
  publicKeySecret: oxibelt-ct-public-key
  publicKeySecretKey: public-key.der

signer:
  enabled: true
  image:
    repository: ghcr.io/oxibelt/oxibelt-keysigner
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  keyId: local-ct-log
  profile: rfc6962_p256_sha256
  keySecret: oxibelt-ct-signing-key
  keySecretKey: private-key.pem
  tokenSecret: oxibelt-ct-signer-token
  tokenSecretKey: token.b64
  socketMode: "0660"
  maxConnections: 64
  ioTimeoutMillis: 5000
  tokenReloadIntervalMillis: 5000
  operatorUid: 10001
  signerUid: 10002
  sharedGid: 20001

postgres:
  secret: ""
  key: database-url
  migrate: false

objectStorage:
  enabled: false
  credentialsSecret: ""
  accessKeyKey: access-key-id
  secretKeyKey: secret-access-key
  sessionTokenKey: session-token
  objectLock: true
  retentionSeconds: 604800
  deleteDenialAttestationConfigMap: ""
  deleteDenialAttestationKey: delete-denial.json

localStorage:
  existingClaim: ""
  sizeLimit: 2Gi

service:
  enabled: false
  acknowledgeNoReadinessProbe: false
  port: 8443

networkPolicy:
  enabled: true
  # Empty lists deny the corresponding direction. Production deployments
  # must supply explicit ingress and PostgreSQL/S3/DNS egress rules.
  ingress:
  - from:
    - podSelector: {}
    ports: [{port: https, protocol: TCP}]
  egress: []

resources:
  requests: {cpu: 500m, memory: 512Mi}
  limits: {cpu: "2", memory: 2Gi}

signerResources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 500m, memory: 256Mi}

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 20001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile: {type: RuntimeDefault}
