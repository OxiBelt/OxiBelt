{{- if and (eq .Values.role "operator") .Values.postgres.migrate }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "oxibelt-ct.name" . }}-migrate
  annotations: {"helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxibelt-ct
        app.kubernetes.io/instance: {{ include "oxibelt-ct.name" . }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
      - name: migrate
        image: {{ include "oxibelt-ct.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/oxibeltctl"]
        args: ["ct", "postgres", "migrate", "--database-url-env", "OXIBELT_CT_DATABASE_URL"]
        env:
        - name: OXIBELT_CT_DATABASE_URL
          valueFrom: {secretKeyRef: {name: {{ .Values.postgres.secret }}, key: {{ .Values.postgres.key }}}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        resources:
{{ toYaml .Values.signerResources | indent 10 }}
{{- end }}
