{{- include "oxibelt.validateNetworkPolicy" . -}}
{{- include "oxibelt.validateTurn" . -}}
{{- include "oxibelt.validateOperationalProfile" . -}}
{{- include "oxibelt.validateAdmin" . -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.cilium.enabled }}
{{- $cilium := .Values.networkPolicy.cilium -}}
{{- $turnIngressPorts := list -}}
{{- if and .Values.turn.enabled .Values.networkPolicy.ingress.public.allowAll -}}
{{- if .Values.turn.control.udp.enabled -}}
{{- $turnIngressPorts = append $turnIngressPorts (dict "port" (toString .Values.turn.control.udp.targetPort) "protocol" "UDP") -}}
{{- end -}}
{{- if .Values.turn.control.tcp.enabled -}}
{{- $turnIngressPorts = append $turnIngressPorts (dict "port" (toString .Values.turn.control.tcp.targetPort) "protocol" "TCP") -}}
{{- end -}}
{{- if .Values.turn.control.tls.enabled -}}
{{- $turnIngressPorts = append $turnIngressPorts (dict "port" (toString .Values.turn.control.tls.targetPort) "protocol" "TCP") -}}
{{- end -}}
{{- if .Values.turn.relay.udp.enabled -}}
{{- range $port := untilStep (int .Values.turn.relay.udp.start) (int (add (int .Values.turn.relay.udp.end) 1)) 1 -}}
{{- $turnIngressPorts = append $turnIngressPorts (dict "port" (toString $port) "protocol" "UDP") -}}
{{- end -}}
{{- end -}}
{{- if .Values.turn.relay.tcp.enabled -}}
{{- range $port := untilStep (int .Values.turn.relay.tcp.start) (int (add (int .Values.turn.relay.tcp.end) 1)) 1 -}}
{{- $turnIngressPorts = append $turnIngressPorts (dict "port" (toString $port) "protocol" "TCP") -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "oxibelt.networkPolicyName" (dict "root" . "suffix" "fqdn-egress") }}
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
spec:
  endpointSelector:
    matchLabels:
{{ include "oxibelt.ciliumSelectorLabels" . | indent 6 }}
  {{- if gt (len $turnIngressPorts) 0 }}
  # Cilium has no portable Kubernetes `endPort` equivalent here; the chart
  # expands the same bounded TURN ranges into individual port rules.
  ingress:
  - toPorts:
    - ports:
{{ toYaml $turnIngressPorts | indent 8 }}
  {{- end }}
  egress:
  # DNS proxy visibility is intentionally scoped to trusted configured DNS
  # endpoints. Exact FQDN connection rules below remain the egress authority.
  - toEndpoints:
{{ toYaml $cilium.dns.toEndpoints | indent 6 }}
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
      rules:
        dns:
        - matchPattern: "*"
{{ range $destination := $cilium.fqdnDestinations }}
  - toFQDNs:
{{ range $matchName := $destination.matchNames }}
    - matchName: {{ $matchName | quote }}
{{ end }}
    toPorts:
    - ports:
{{ range $port := $destination.ports }}
      - port: {{ toString $port.port | quote }}
        protocol: {{ $port.protocol }}
{{ end }}
{{ end }}
{{- end }}
