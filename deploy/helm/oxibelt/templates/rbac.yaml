{{- include "oxibelt.validateKubernetesServiceAccount" . -}}
{{- if .Values.kubernetesDiscovery.rbac.create }}
{{- $root := . -}}
{{- $name := include "oxibelt.name" . -}}
{{- $namespaces := default (list .Release.Namespace) .Values.kubernetesDiscovery.rbac.namespaces -}}
{{- range $namespace := $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-discovery
  namespace: {{ $namespace | quote }}
  labels:
{{ include "oxibelt.labels" $root | indent 4 }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-discovery
  namespace: {{ $namespace | quote }}
  labels:
{{ include "oxibelt.labels" $root | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-discovery
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt.serviceAccountName" $root }}
  namespace: {{ $root.Release.Namespace }}
---
{{- end }}
{{- end }}
