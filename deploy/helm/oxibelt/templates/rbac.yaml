{{- if .Values.kubernetesDiscovery.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oxibelt.name" . }}-discovery
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
rules:
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oxibelt.name" . }}-discovery
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oxibelt.name" . }}-discovery
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
