{{- include "oxibelt.validateSupplyChainAdmission" . -}}
{{- if .Values.supplyChainAdmission.enabled -}}
{{- $name := include "oxibelt.supplyChainAdmissionName" . -}}
{{- $resourceName := include "oxibelt.supplyChainAdmissionResourceName" . -}}
{{- $revision := include "oxibelt.supplyChainAdmissionRevision" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $resourceName }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    oxibelt.dev/supply-chain-bundle-digest: {{ .Values.supplyChainAdmission.bundle.payloadDigest | quote }}
immutable: true
binaryData:
  public-key: {{ .Values.supplyChainAdmission.bundle.publicKeyBase64 | quote }}
data:
  bundle.json: |-
{{ .Values.supplyChainAdmission.bundle.inline | indent 4 }}
  revocations.json: |-
{{ .Values.supplyChainAdmission.bundle.revocations | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    oxibelt.dev/supply-chain-bundle: {{ $revision | quote }}
  ports:
  - name: https
    port: 443
    protocol: TCP
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $resourceName }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    oxibelt.dev/supply-chain-bundle: {{ $revision | quote }}
spec:
  replicas: {{ int .Values.supplyChainAdmission.webhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      oxibelt.dev/supply-chain-bundle: {{ $revision | quote }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        oxibelt.dev/supply-chain-bundle: {{ $revision | quote }}
      annotations:
        oxibelt.dev/supply-chain-bundle-digest: {{ .Values.supplyChainAdmission.bundle.payloadDigest | quote }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "oxibelt.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: admission
        image: {{ printf "%s@%s" .Values.supplyChainAdmission.webhook.image.repository .Values.supplyChainAdmission.webhook.image.digest | quote }}
        imagePullPolicy: {{ .Values.supplyChainAdmission.webhook.image.pullPolicy }}
        command:
        - /usr/local/bin/oxibeltctl
        args:
        - supply-chain
        - admission-server
        - --bundle
        - /var/run/oxibelt-admission/evidence/bundle.json
        - --public-key-file
        - /var/run/oxibelt-admission/evidence/public-key
        - --key-id
        - {{ .Values.supplyChainAdmission.bundle.keyId | quote }}
        - --revocations
        - /var/run/oxibelt-admission/evidence/revocations.json
        - --tls-cert
        - /var/run/oxibelt-admission/tls/tls.crt
        - --tls-key
        - /var/run/oxibelt-admission/tls/tls.key
        - --listen
        - 0.0.0.0:8443
        ports:
        - name: https
          containerPort: 8443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /readyz
            port: https
            scheme: HTTPS
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: evidence
          mountPath: /var/run/oxibelt-admission/evidence
          readOnly: true
        - name: tls
          mountPath: /var/run/oxibelt-admission/tls
          readOnly: true
      volumes:
      - name: evidence
        configMap:
          name: {{ $resourceName }}
      - name: tls
        secret:
          secretName: {{ .Values.supplyChainAdmission.webhook.tlsSecretName | quote }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $resourceName }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      oxibelt.dev/supply-chain-bundle: {{ $revision | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
{{- range .Values.supplyChainAdmission.webhook.apiServerSourceCidrs }}
    - ipBlock:
        cidr: {{ . | quote }}
{{- end }}
    ports:
    - port: https
      protocol: TCP
  egress: []
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "oxibelt.supplyChainAdmissionClusterName" . }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
webhooks:
- name: {{ printf "%s.%s.supply-chain.oxibelt.dev" .Release.Name .Release.Namespace | trunc 253 | trimSuffix "-" }}
  admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: {{ .Values.supplyChainAdmission.webhook.caBundle | quote }}
    service:
      name: {{ $name }}
      namespace: {{ .Release.Namespace }}
      path: /validate
      port: 443
  failurePolicy: Fail
  matchPolicy: Exact
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  objectSelector:
    matchLabels:
{{ include "oxibelt.selectorLabels" . | indent 6 }}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
    scope: Namespaced
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - UPDATE
    resources:
    - pods/ephemeralcontainers
    scope: Namespaced
  sideEffects: None
  timeoutSeconds: {{ int .Values.supplyChainAdmission.webhook.timeoutSeconds }}
{{- end -}}
