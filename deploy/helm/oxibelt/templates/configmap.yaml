{{- include "oxibelt.validateConfigRollout" . -}}
{{- include "oxibelt.validateBaseConfigKey" . -}}
{{- include "oxibelt.validateAdmin" . -}}
{{- if and .Values.config.create (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "oxibelt.configMapName" . }}
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    oxibelt.dev/config-digest: {{ include "oxibelt.generatedConfigDigest" . | quote }}
immutable: true
data:
  {{ .Values.config.key }}: |-
{{ include "oxibelt.generatedConfigContent" . | indent 4 }}
{{- if eq .Values.configRollout.mode "kubernetes_immutable" }}
  # This empty sentinel projects as both `conf.d/.keep` and the exact managed
  # path so a controller can safely bind-mount an immutable generated include.
  gateway-config-directory: ""
{{- end }}
{{- end }}
