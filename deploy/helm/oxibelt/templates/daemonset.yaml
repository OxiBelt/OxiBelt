{{- include "oxibelt.validateConfigRollout" . -}}
{{- include "oxibelt.validateBaseConfigKey" . -}}
{{- include "oxibelt.validateWorkloadRollout" . -}}
{{- include "oxibelt.validateAdmin" . -}}
{{- if eq .Values.workload.kind "DaemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "oxibelt.name" . }}
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
{{ if eq .Values.configRollout.mode "kubernetes_immutable" }}
  annotations:
    oxibelt.dev/immutable-config-rollout: "true"
{{ end }}
spec:
  minReadySeconds: {{ .Values.workload.daemonSet.minReadySeconds }}
  revisionHistoryLimit: {{ .Values.workload.daemonSet.revisionHistoryLimit }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.workload.daemonSet.maxUnavailable }}
  selector:
    matchLabels:
{{ include "oxibelt.selectorLabels" . | indent 6 }}
  template:
    metadata:
      labels:
{{ include "oxibelt.selectorLabels" . | indent 8 }}
{{- with .Values.podLabels }}
{{ toYaml . | indent 8 }}
{{- end }}
      annotations:
{{ with .Values.podAnnotations }}
{{ toYaml . | indent 8 }}
{{ end }}
        checksum/oxibelt-config: {{ include "oxibelt.configDigest" . | quote }}
        {{- if .Values.oxirule.enabled }}
        checksum/oxibelt-oxirule: {{ include "oxibelt.oxiruleConfigMapDigest" . | quote }}
        {{- end }}
        {{- if eq .Values.configRollout.mode "kubernetes_immutable" }}
        oxibelt.dev/immutable-config-rollout: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "oxibelt.serviceAccountName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
      - name: oxibelt
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/oxibelt"]
        args:
        - "--config"
        - "{{ .Values.config.mountPath }}/{{ .Values.config.key }}"
        {{- if or .Values.admin.enabled .Values.extraEnv (eq .Values.configRollout.mode "kubernetes_immutable") }}
        env:
        {{- if .Values.admin.enabled }}
        - name: OXIBELT_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ required "admin.tokenSecretName is required when admin.enabled=true" .Values.admin.tokenSecretName }}
              key: {{ .Values.admin.tokenSecretKey }}
        {{- end }}
        {{- if eq .Values.configRollout.mode "kubernetes_immutable" }}
        - name: OXIBELT_CONFIG_ROLLOUT_MODE
          value: kubernetes_immutable
        - name: OXIBELT_CONFIG_REVISION
          valueFrom:
            fieldRef:
              fieldPath: "metadata.annotations['oxibelt.dev/config-revision']"
        - name: OXIBELT_CONFIG_DIGEST
          valueFrom:
            fieldRef:
              fieldPath: "metadata.annotations['oxibelt.dev/config-digest']"
        - name: OXIBELT_CONFIG_REVISION_FILE
          value: {{ printf "%s/%s" (trimSuffix "/" .Values.config.mountPath) .Values.configRollout.managedConfigPath | quote }}
        - name: OXIBELT_INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        {{- end }}
        {{- with .Values.extraEnv }}
{{ toYaml . | indent 8 }}
        {{- end }}
        {{- end }}
        ports:
        {{- if .Values.service.ports.http.enabled }}
        - name: http
          containerPort: {{ .Values.service.ports.http.targetPort }}
          protocol: TCP
        {{- end }}
        {{- if .Values.service.ports.https.enabled }}
        - name: https
          containerPort: {{ .Values.service.ports.https.targetPort }}
          protocol: TCP
        {{- end }}
        {{- if .Values.service.ports.http3.enabled }}
        - name: http3
          containerPort: {{ .Values.service.ports.http3.targetPort }}
          protocol: UDP
        {{- end }}
        - name: metrics
          containerPort: {{ .Values.metrics.service.port }}
          protocol: TCP
        - name: health
          containerPort: {{ .Values.health.port }}
          protocol: TCP
        {{- if .Values.admin.enabled }}
        - name: admin
          containerPort: {{ .Values.admin.service.port }}
          protocol: TCP
        {{- end }}
        readinessProbe:
          httpGet:
            path: {{ .Values.health.readyPath }}
            port: health
        livenessProbe:
          httpGet:
            path: {{ .Values.health.livePath }}
            port: health
        startupProbe:
          httpGet:
            path: {{ .Values.health.livePath }}
            port: health
          failureThreshold: 30
          periodSeconds: 2
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        volumeMounts:
        - name: config
          mountPath: {{ .Values.config.mountPath }}
          readOnly: true
        {{- if or .Values.tls.enabled (and .Values.admin.enabled .Values.admin.tls.enabled) }}
        - name: tls
          mountPath: {{ include "oxibelt.certMountPath" . }}
          readOnly: true
        {{- end }}
        {{- if .Values.oxirule.enabled }}
        - name: oxirule
          mountPath: {{ .Values.oxirule.mountPath }}
          readOnly: true
        {{- end }}
        - name: cache
          mountPath: /var/cache/oxibelt
        {{- with .Values.extraVolumeMounts }}
{{ toYaml . | indent 8 }}
        {{- end }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "oxibelt.configMapName" . }}
          items:
          - key: {{ .Values.config.key }}
            path: {{ .Values.config.key }}
{{ if eq .Values.configRollout.mode "kubernetes_immutable" }}
          - key: gateway-config-directory
            path: {{ printf "%s/.keep" (dir .Values.configRollout.managedConfigPath) | quote }}
          - key: gateway-config-directory
            path: {{ .Values.configRollout.managedConfigPath | quote }}
{{ end }}
      {{- if or .Values.tls.enabled (and .Values.admin.enabled .Values.admin.tls.enabled) }}
      - name: tls
        projected:
          # Decimal 288 is POSIX mode 0440. Kubernetes applies the Pod fsGroup
          # so the non-root OxiBelt process can read certificate material.
          defaultMode: 288
          sources:
          {{- if .Values.tls.enabled }}
          - secret:
              name: {{ required "tls.secretName is required when tls.enabled=true" .Values.tls.secretName }}
          {{- end }}
          {{- if and .Values.admin.enabled .Values.admin.tls.enabled }}
          - secret:
              name: {{ required "admin.tls.secretName is required when admin TLS is enabled" .Values.admin.tls.secretName }}
              items:
              - key: {{ .Values.admin.tls.certKey }}
                path: admin-server/tls.crt
              - key: {{ .Values.admin.tls.privateKeyKey }}
                path: admin-server/tls.key
          {{- if .Values.admin.mtls.enabled }}
          - secret:
              name: {{ required "admin.mtls.clientCaSecretName is required when admin mTLS is enabled" .Values.admin.mtls.clientCaSecretName }}
              items:
              - key: {{ .Values.admin.mtls.clientCaSecretKey }}
                path: admin-client-ca/ca.crt
          {{- end }}
          {{- end }}
      {{- end }}
      {{- if .Values.oxirule.enabled }}
      - name: oxirule
        configMap:
          name: {{ required "oxirule.existingConfigMap is required when oxirule.enabled=true" .Values.oxirule.existingConfigMap }}
      {{- end }}
      - name: cache
        emptyDir: {}
{{- with .Values.extraVolumes }}
{{ toYaml . | indent 6 }}
{{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
