{{- include "oxibelt.validateAdmin" . -}}
{{- if and .Values.admin.enabled .Values.admin.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oxibelt.name" . }}-admin
  labels:
{{ include "oxibelt.labels" . | indent 4 }}
  annotations:
{{ toYaml .Values.admin.service.annotations | indent 4 }}
spec:
  type: {{ .Values.admin.service.type }}
  selector:
{{ include "oxibelt.selectorLabels" . | indent 4 }}
  ports:
  - name: admin
    port: {{ .Values.admin.service.port }}
    targetPort: admin
    protocol: TCP
{{- end }}
