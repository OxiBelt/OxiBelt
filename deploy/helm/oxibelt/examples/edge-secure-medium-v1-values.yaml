# `edge-secure-medium` v1 deployment preset. Create the referenced Secrets
# separately; this file names Secret keys only and contains no key material.
# Replace `edge.example.test` and Secret names with production values before
# applying this preset.

operationalProfile:
  name: edge-secure-medium
  version: 1
  # Use `monitor` only for an explicit, temporary WAF rollout phase.
  wafMode: enforcing

tls:
  enabled: true
  secretName: oxibelt-public-tls
  serverNames:
  - edge.example.test

# The mounted Secret value must be base64 text for exactly 64 random bytes.
# `kubectl create secret generic ... --from-file=quic-host-key.b64` preserves
# that text; a Kubernetes `data:` manifest must base64-encode the text again.
# The chart projects only this item to `/etc/oxibelt/cert/quic-host-key.b64`.
quic:
  hostKeySecretName: oxibelt-quic-host-key
  hostKeySecretKey: quic-host-key.b64

replicaCount: 3

# Keep a three-Pod floor whether or not an HPA is enabled later. The Deployment
# strategy retains ready capacity while the DaemonSet strategy uses surge to
# avoid an unavailable eligible node during its update.
autoscaling:
  minReplicas: 3

workload:
  deployment:
    maxUnavailable: 0
    maxSurge: 1
  daemonSet:
    maxUnavailable: 0
    maxSurge: 1

# The fixed chart-owned hook sends SIGUSR1 to OxiBelt before Kubernetes sends
# the final termination signal. 360 seconds covers the profile's 300-second
# long-connection drain, 10-second readiness withdrawal, 30-second ordinary
# drain, and a 20-second orchestration margin.
lifecycle:
  terminationGracePeriodSeconds: 360
  preStop:
    enabled: true
    drainSeconds: 300

# This companion profile targets Kubernetes 1.31 or later. It keeps replicas
# on distinct hostnames whenever scheduling capacity permits, prefers separate
# zones without making a single-zone cluster unschedulable, and protects only
# one voluntary disruption at a time.
podDistribution:
  enabled: true
  nodeSpread:
    enabled: true
    maxSkew: 1
    minDomains: 2
    whenUnsatisfiable: DoNotSchedule
  zoneSpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  podAntiAffinity:
    enabled: true
    weight: 100

podDisruptionBudget:
  enabled: true
  minAvailable: null
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow

# The companion preset enables the portable NetworkPolicy baseline. It exposes
# only public listener ports to arbitrary Internet sources; monitoring and
# egress identities remain explicit and fail closed when replaced or removed.
networkPolicy:
  enabled: true
  ingress:
    public:
      allowAll: true
    metrics:
      # Replace these labels when the local monitoring deployment differs.
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    admin:
      from: []
  egress:
    dns:
      enabled: true
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # Add every origin, shared-state backend, Kubernetes API, revocation
    # endpoint CIDR, and other dependency required by the deployed config.
    destinations: []
  # Cilium FQDN policy is intentionally opt-in because the baseline chart must
  # remain portable to any NetworkPolicy-capable CNI.
  cilium:
    enabled: false

# Keep the Admin Service absent by default. Enabling Admin is an explicit
# deployment decision and remains subject to chart and runtime mTLS/audit
# validation.
admin:
  enabled: false
  service:
    enabled: false
