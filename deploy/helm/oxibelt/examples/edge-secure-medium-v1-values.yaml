# `edge-secure-medium` v1 deployment preset. Create the referenced Secrets
# separately; this file names Secret keys only and contains no key material.
# Replace `edge.example.test` and Secret names with production values before
# applying this preset.

operationalProfile:
  name: edge-secure-medium
  version: 1
  # Use `monitor` only for an explicit, temporary WAF rollout phase.
  wafMode: enforcing

tls:
  enabled: true
  secretName: oxibelt-public-tls
  serverNames:
  - edge.example.test

# The mounted Secret value must be base64 text for exactly 64 random bytes.
# `kubectl create secret generic ... --from-file=quic-host-key.b64` preserves
# that text; a Kubernetes `data:` manifest must base64-encode the text again.
# The chart projects only this item to `/etc/oxibelt/cert/quic-host-key.b64`.
quic:
  hostKeySecretName: oxibelt-quic-host-key
  hostKeySecretKey: quic-host-key.b64

# Covers the profile's 10-second readiness withdrawal, 30-second ordinary
# drain, and 300-second long-connection drain with a small orchestration
# margin.
lifecycle:
  terminationGracePeriodSeconds: 360

# The companion preset enables the portable NetworkPolicy baseline. It exposes
# only public listener ports to arbitrary Internet sources; monitoring and
# egress identities remain explicit and fail closed when replaced or removed.
networkPolicy:
  enabled: true
  ingress:
    public:
      allowAll: true
    metrics:
      # Replace these labels when the local monitoring deployment differs.
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
    admin:
      from: []
  egress:
    dns:
      enabled: true
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # Add every origin, shared-state backend, Kubernetes API, revocation
    # endpoint CIDR, and other dependency required by the deployed config.
    destinations: []
  # Cilium FQDN policy is intentionally opt-in because the baseline chart must
  # remain portable to any NetworkPolicy-capable CNI.
  cilium:
    enabled: false

# Keep the Admin Service absent by default. Enabling Admin is an explicit
# deployment decision and remains subject to chart and runtime mTLS/audit
# validation.
admin:
  enabled: false
  service:
    enabled: false
