image:
  repository: oxibelt
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
replicaCount: 2

# Leave `name` empty to retain the chart's existing, unprofiled behavior.
# A selected profile is rendered as top-level OxiBelt TOML before `config.inline`
# and therefore has a content-addressed ConfigMap revision of its own.
operationalProfile:
  name: ""
  version: 1
  # `monitor` is the explicit temporary rollout state; the profile otherwise
  # starts in enforcing mode.
  wafMode: enforcing # enforcing | monitor

workload:
  kind: Deployment # Deployment | DaemonSet
  deployment:
    maxUnavailable: 0
    maxSurge: 1
    minReadySeconds: 5
    progressDeadlineSeconds: 300
    revisionHistoryLimit: 3
  daemonSet:
    maxUnavailable: 1
    minReadySeconds: 5
    revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  # Kubernetes API credentials are never ambient. Use the scoped projection
  # below only when upstream discovery needs the Pod ServiceAccount.
  automountServiceAccountToken: false

# A nonzero value is emitted on the Pod spec. The default intentionally omits
# the field to preserve Kubernetes' existing 30-second default for unprofiled
# chart users. The edge-secure-medium v1 preset uses 360 seconds.
lifecycle:
  terminationGracePeriodSeconds: 0

kubernetesDiscovery:
  serviceAccountToken:
    # Set this for externally managed discovery RBAC. Chart-created RBAC also
    # enables the projection so an operator cannot grant unusable access.
    enabled: false
    # Bound projected tokens rotate before expiry. Keep their requested
    # lifetime at or below one hour.
    expirationSeconds: 3600
  rbac:
    create: false
    # Empty scopes chart-created discovery Roles to the release namespace.
    # List every additional namespace that configured upstream discovery reads.
    namespaces: []

# NetworkPolicy is opt-in for compatibility with existing Helm deployments.
# When enabled, each omitted peer or destination stays denied rather than
# widening the data-plane trust boundary. Standard Kubernetes NetworkPolicy is
# the portable baseline; the optional Cilium section adds exact-FQDN egress for
# external endpoints whose IPs cannot be maintained as explicit CIDRs.
networkPolicy:
  enabled: false
  ingress:
    public:
      # An Internet-facing edge can intentionally expose only its public named
      # ports. Otherwise, specify one or more source peers below.
      allowAll: false
      from: []
    metrics:
      # Use a namespace plus a monitoring-Pod identity in one peer when both
      # boundaries are available.
      from: []
    admin:
      # The chart never assumes that the Gateway Controller uses Admin. Add
      # explicit management/controller peers only when the listener is used.
      from: []
  egress:
    dns:
      enabled: true
      # Override for clusters that do not label their DNS Pods as kube-dns.
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    # Every non-DNS destination must be declared explicitly. `category` is an
    # audit label; it does not broaden the generated policy.
    destinations: []
    # - name: primary-upstream
    #   category: upstream # upstream | shared-state | revocation | kubernetes-api | external-dependency
    #   to:
    #   - namespaceSelector:
    #       matchLabels:
    #         kubernetes.io/metadata.name: application
    #     podSelector:
    #       matchLabels:
    #         app.kubernetes.io/name: upstream
    #   ports:
    #   - port: 8443
    #     protocol: TCP
  cilium:
    enabled: false
    # Cilium labels Kubernetes identities with the `k8s:` source prefix.
    # Restrict DNS-proxy trust to the selected resolver endpoint(s).
    dns:
      toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: kube-system
          k8s:k8s-app: kube-dns
    fqdnDestinations: []
    # - name: ocsp
    #   category: revocation
    #   matchNames:
    #   - ocsp.example.com
    #   ports:
    #   - port: 80
    #     protocol: TCP

service:
  type: LoadBalancer
  annotations: {}
  externalTrafficPolicy: Local
  ports:
    http:
      enabled: true
      port: 80
      targetPort: 8080
    https:
      enabled: true
      port: 443
      targetPort: 8443
    http3:
      enabled: true
      port: 443
      targetPort: 8443

admin:
  enabled: false
  # Kubernetes-relevant listener addresses only. The chart combines this with
  # `admin.service.port` so the Pod and Service cannot drift to different
  # Admin ports.
  bindAddress: 127.0.0.1 # 127.0.0.1 | 0.0.0.0 | ::1 | ::
  insecureDevelopmentMode:
    # An intentionally named plaintext escape hatch for local development.
    # It cannot be combined with TLS, mTLS, NodePort, or LoadBalancer exposure.
    enabled: false
  service:
    enabled: false
    type: ClusterIP
    port: 9092
    annotations: {}
  tokenSecretName: ""
  tokenSecretKey: token
  tls:
    # Non-loopback Admin binds require this unless insecureDevelopmentMode is
    # explicitly enabled. The server identity is mounted below the runtime
    # certificate root as `admin-server/tls.crt` and `admin-server/tls.key`.
    enabled: false
    secretName: ""
    certKey: tls.crt
    privateKeyKey: tls.key
    serverNames: []
  mtls:
    # When enabled, require a client certificate rooted in the mounted CA
    # Secret. `enforcement` controls where a TLS-plus-bearer deployment may
    # intentionally omit mTLS.
    enabled: false
    enforcement: required_non_loopback # required_non_loopback | required_external | optional
    clientCaSecretName: ""
    clientCaSecretKey: ca.crt
    verifyDepth: 4

metrics:
  enabled: true
  service:
    enabled: true
    type: ClusterIP
    port: 9090
    annotations: {}

health:
  port: 9091
  readyPath: /ready
  livePath: /live

config:
  # Set false only with a nonempty operator-managed existingConfigMap and its digest.
  create: true
  existingConfigMap: ""
  # Required for an operator-managed ConfigMap. The referenced ConfigMap must
  # be immutable, uniquely named per content revision, and carry these exact
  # lower-case SHA-256 bytes.
  existingConfigMapDigest: ""
  # A single safe ConfigMap key / filename. It cannot be a path or the
  # controller's reserved `gateway-config-directory` sentinel key.
  key: oxibelt.toml
  mountPath: /etc/oxibelt/config
  inline: |
    include = ["conf.d/*.toml"]

    [config]
    strict_unknown_fields = true
    warn_on_deprecated_fields = true

    [logging]
    level = "info"

    [runtime]
    linux_only = true
    read_only_rootfs_compatible = true
    memory_only_state = true
    unprivileged_mode = true

    [runtime.hot_reload]
    mode = "off"

    # The default accept-worker count scales with available CPU. Multiple
    # accept workers require SO_REUSEPORT so generated chart configuration is
    # accepted on multi-core Kubernetes nodes.
    [runtime.accept]
    reuse_port = true

    {{- if .Values.quic.hostKeySecretName }}
    [quic]
    host_key_file = "quic-host-key.b64"

    {{- end }}
    # HTTP/3 uses automatic QUIC socket workers by default. Keep the listener
    # socket policy aligned with the multi-worker runtime invariant.
    [quic.socket]
    reuse_port = true

    [listeners]
    http_binds = ["0.0.0.0:8080"]
    https_binds = ["0.0.0.0:8443"]
    http_mode = "redirect_to_https"
    http1 = true
    http2 = true
    http3 = true

    [tls]
    cert_chain = "tls.crt"
    private_key = "tls.key"
    min_version = "tls1.3"
    max_version = "tls1.3"
    {{ include "oxibelt.publicTlsConfig" . }}

    [health]
    enabled = true
    bind = "0.0.0.0:{{ .Values.health.port }}"
    ready_path = "{{ .Values.health.readyPath }}"
    live_path = "{{ .Values.health.livePath }}"

    [metrics]
    enabled = {{ .Values.metrics.enabled }}
    bind = "0.0.0.0:9090"
    format = "prometheus"
    detail = {{ if .Values.operationalProfile.name }}"detailed"{{ else }}"basic"{{ end }}

    # Keep overload shedding opt-in for unprofiled chart upgrades. The secure
    # operational profile requires it while operators can tune the full block
    # through config.inline.
    [overload]
    enabled = {{ if .Values.operationalProfile.name }}true{{ else }}false{{ end }}

    # Circuit breakers and priority admission are enabled by default and resolve
    # `"auto"` per Pod. Low-priority background/crawler traffic is share-capped;
    # configure any public request reserve only for IPM- or mTLS-authenticated
    # routes. Dedicated Admin, health, and metrics slots remain bounded even
    # while overload pressure sampling is disabled. Set enabled = false only as
    # a temporary compatibility escape hatch.
    [circuit_breakers]
    enabled = true

    {{ include "oxibelt.adminConfig" . }}

# `helm_immutable` is the ordinary Helm-managed content-addressed ConfigMap
# rollout. `kubernetes_immutable` opts the workload into controller-owned
# Gateway API revisions; Helm deliberately does not own the generated volume,
# file mount, or revision annotations in that mode.
configRollout:
  mode: helm_immutable # helm_immutable | kubernetes_immutable
  # A safe nested path under the mounted config root; root-level paths are
  # rejected because the controller needs a pre-existing parent directory.
  managedConfigPath: conf.d/gateway-api.generated.toml

tls:
  enabled: true
  secretName: oxibelt-tls
  mountPath: /etc/oxibelt/cert
  # Providing names turns on required SNI and unknown-SNI rejection for the
  # public certificate. Leave empty for existing unprofiled behavior.
  serverNames: []

# Project exactly one Secret item whose mounted value is base64 text for a
# 64-byte QUIC host key into the certificate root as `quic-host-key.b64`. The
# profile preset requires this Secret but the unprofiled chart leaves it opt-in
# for compatibility.
quic:
  hostKeySecretName: ""
  hostKeySecretKey: quic-host-key.b64

# Project Redis TLS, ACL username, and ACL password keys into the same
# certificate root that OxiBelt resolves for `shared_state.backends.redis_*`.
# Each item becomes `/etc/oxibelt/cert/redis/<name>/<path>` and must be
# referenced by that relative path in `config.inline` or an existing ConfigMap.
sharedState:
  redisSecretProjections: []
  # - name: redis-main
  #   secretName: redis-main-credentials
  #   items:
  #   - key: ca.crt
  #     path: ca.pem
  #   - key: username
  #     path: username
  #   - key: password
  #     path: password

oxirule:
  enabled: false
  existingConfigMap: ""
  # Required when `oxirule.enabled` is true. The ConfigMap must be immutable
  # and uniquely named for the referenced content revision.
  existingConfigMapDigest: ""
  mountPath: /etc/oxibelt/oxirule

extraEnv: []
extraVolumes: []
extraVolumeMounts: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
