apiVersion: gateway.oxibelt.dev/v1alpha1
kind: OxiBeltRoutePolicy
metadata:
  name: app-security
  namespace: default
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: app
  waf:
    requestRuleGroups:
    - edge-baseline
  limits:
    maxRequestBodyBytes: 1048576
  timeouts:
    upstreamRequestMilliseconds: 2500
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app
  namespace: default
spec:
  parentRefs:
  - name: edge
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.oxibelt.dev
        kind: OxiBeltRoutePolicy
        name: app-security
    backendRefs:
    - name: app
      port: 8080
