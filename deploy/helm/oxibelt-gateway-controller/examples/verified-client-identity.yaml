# Install the controller with `verified-client-identity-values.yaml`. The
# data-plane base configuration must independently set
# `[tls.client_auth] mode = "require"` with the frontend client CA; an
# OxiBeltRoutePolicy cannot provision downstream client authentication.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: verified-client-edge
  namespace: storefront
spec:
  gatewayClassName: oxibelt
  tls:
    backend:
      clientCertificateRef:
        group: ""
        kind: Secret
        name: orders-client
        namespace: backend-secrets
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: storefront.example.com
    # Gateway API requires this listener TLS reference. `oxibelt-tls` is the
    # same-namespaced, operator-owned server certificate configured by the
    # data-plane base configuration.
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: oxibelt-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: storefront
spec:
  parentRefs:
  - name: verified-client-edge
    sectionName: https
  hostnames: [storefront.example.com]
  rules:
  - matches:
    - path: {type: PathPrefix, value: /orders}
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.oxibelt.dev
        kind: OxiBeltRoutePolicy
        name: orders-client-identity
    backendRefs:
    - name: orders
      port: 8443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: orders-server-authentication
  namespace: storefront
spec:
  targetRefs:
  - {group: "", kind: Service, name: orders}
  validation:
    hostname: orders.backend.example.com
    caCertificateRefs:
    - {group: "", kind: ConfigMap, name: orders-server-ca}
---
apiVersion: gateway.oxibelt.dev/v1alpha1
kind: OxiBeltRoutePolicy
metadata:
  name: orders-client-identity
  namespace: storefront
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: orders
  clientCertificateForwarding:
    header: client-cert
    format: rfc9440
---
# This grant must live with the target Secret. It authorizes the Gateway itself,
# not every Route in the namespace, and remains narrower than the operator's
# source Secret allowlist.
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-storefront-gateway-orders-client
  namespace: backend-secrets
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: storefront
  to:
  - group: ""
    kind: Secret
    name: orders-client
