image:
  repository: ghcr.io/oxibelt/oxibelt-gateway-controller
  tag: latest
  # Set an immutable `sha256:...` digest for verified production rollouts.
  # A non-empty digest takes precedence over `tag`.
  digest: ""
  pullPolicy: IfNotPresent

# Empty uses Chart.appVersion. Development and release-equivalent image
# qualification must set the immutable image's effective SemVer explicitly.
effectiveVersion: ""

# Two replicas are the supported highly available default. Set this to 1 only
# for an intentional single-replica development deployment.
replicaCount: 2

leaderElection:
  # Empty uses the chart's controller name. The Helm release owns this exact
  # metadata-only Lease; the controller may get, watch, and patch it but cannot
  # create arbitrary Leases.
  leaseName: ""
  leaseDurationSeconds: 15
  renewDeadlineSeconds: 10
  retryPeriodSeconds: 2

controllerName: oxibelt.dev/gateway-controller
# A safe nested relative `.toml` path under the selected workload config root.
managedConfigPath: conf.d/gateway-api.generated.toml
# Empty scopes namespaced Gateway API reads to the controller release
# namespace. Set watchAllNamespaces only for an intentionally cluster-wide
# controller.
watchNamespace: ""
watchAllNamespaces: false
statusService: ""
# Explicit Gateway addresses take precedence over statusService. Each entry is
# passed as one --status-address argument; keep the list bounded and free of
# credentials because it is published in Gateway status.
statusAddresses: []
backendResolution: cluster_dns
dryRun: false

# Gateway.spec.tls.backend.clientCertificateRef remains inactive until its
# exact source Secret is admitted here. The controller only performs bounded,
# exact-name GETs and supports kubernetes.io/tls or Opaque Secret types.
upstreamClientTls:
  sourceSecretAllowlist: []
  # - namespace: backend-secrets
  #   name: orders-client
  #   certificateKey: tls.crt
  #   privateKeyKey: tls.key

# Operator-owned admission bounds for route-authored Gateway filters. A zero
# body limit retains bodyless mirroring/auth compatibility. ExternalAuth stays
# blocked until credential forwarding is explicitly admitted.
filters:
  requestMirror:
    maxBodyBytes: 0
  externalAuth:
    maxBodyBytes: 0
    allowedContentTypes: []
    allowedRequestHeaders: []
    allowedIdentityHeaders: []
    allowedTerminalHeaders: []
    allowCredentials: false

routePolicy:
  maxRequestBodyBytes: 10485760
  maxTimeoutMs: 30000

# Normal reconciliation requires the selected data-plane workload to carry
# `oxibelt.dev/effective-version` equal to the controller build version.
# `rolling_upgrade` is a temporary, bounded exception for one explicitly named
# immediately preceding minor. Both additional fields are then required and
# the deadline must be no more than 24 hours in the future.
compatibility:
  mode: exact # exact | rolling_upgrade
  previousVersion: ""
  deadline: ""

# Controller-owned bounds used only for generated TCPRoute and UDPRoute stream
# listeners. Listener ports still come from the operator-owned status Service.
l4:
  bindAddress: 0.0.0.0
  connectTimeoutMs: 3000
  idleTimeoutMs: 75000
  udp:
    # Generated UDPRoute listeners stay disabled unless every target data-plane
    # Pod is configured for required shared UDP flow state.
    flowState: disabled # disabled | shared_required
    maxFlows: 3072
    newFlowRate: 200r/s
    newFlowBurst: 400
    datagramRate: 200r/s
    datagramBurst: 400
    batch: auto # auto | off | required
    batchSize: 16

serviceAccount:
  # The controller receives only the explicit projection rendered below.
  automountServiceAccountToken: false
  tokenProjection:
    expirationSeconds: 3600

rollout:
  # Optional operator-owned static replicated target set. When non-empty, the
  # controller ignores the legacy target below and reconciles these resources
  # sequentially with a global concurrency bound of one. Target entries contain
  # workload identity only; Admin URLs and credential references are not part
  # of the v1alpha1 contract.
  targets: []
  # - name: west
  #   gatewayClassName: oxibelt
  #   allowedNamespaces: [default]
  #   workloadRef:
  #     namespace: default
  #     kind: Deployment
  #     name: oxibelt-west
  #     containerName: oxibelt
  #     volumeName: gateway-config
  #   capabilities: [gateway-api]
  #   timeoutSeconds: 300
  #   configMapPrefix: oxibelt-west-config
  target:
    # Empty means the controller release namespace.
    namespace: ""
    kind: deployment # deployment | daemonset
    name: oxibelt
    containerName: oxibelt
  volumeName: gateway-config
  timeoutSeconds: 300
  configMapPrefix: oxibelt-gateway-config

healthBind: 0.0.0.0:9090
resources: {}
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
nodeSelector: {}
tolerations: []
affinity: {}
podAntiAffinity:
  enabled: true
  weight: 100
  topologyKey: kubernetes.io/hostname
topologySpreadConstraints: []
podDisruptionBudget:
  enabled: true
  minAvailable: 1
