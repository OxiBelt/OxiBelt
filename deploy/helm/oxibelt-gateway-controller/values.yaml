image:
  repository: oxibelt
  tag: latest
  pullPolicy: IfNotPresent

controllerName: oxibelt.dev/gateway-controller
managedConfigPath: conf.d/gateway-api.generated.toml
watchNamespace: ""
statusService: ""
backendResolution: cluster_dns
dryRun: false

admin:
  url: http://oxibelt-admin.oxibelt.svc.cluster.local:9092
  tokenSecretName: oxibelt-admin-token
  tokenSecretKey: token
  caSecretName: ""
  caSecretKey: ca.crt
  clientTlsSecretName: ""
  clientCertKey: tls.crt
  clientKeyKey: tls.key

healthBind: 0.0.0.0:9090
resources: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
nodeSelector: {}
tolerations: []
affinity: {}
