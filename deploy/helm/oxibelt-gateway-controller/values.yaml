image:
  repository: oxibelt
  tag: latest
  pullPolicy: IfNotPresent

controllerName: oxibelt.dev/gateway-controller
# A safe nested relative `.toml` path under the selected workload config root.
managedConfigPath: conf.d/gateway-api.generated.toml
# Empty scopes namespaced Gateway API reads to the controller release
# namespace. Set watchAllNamespaces only for an intentionally cluster-wide
# controller.
watchNamespace: ""
watchAllNamespaces: false
statusService: ""
backendResolution: cluster_dns
dryRun: false

serviceAccount:
  # The controller receives only the explicit projection rendered below.
  automountServiceAccountToken: false
  tokenProjection:
    expirationSeconds: 3600

rollout:
  target:
    # Empty means the controller release namespace.
    namespace: ""
    kind: deployment # deployment | daemonset
    name: oxibelt
    containerName: oxibelt
  volumeName: gateway-config
  timeoutSeconds: 300
  configMapPrefix: oxibelt-gateway-config

healthBind: 0.0.0.0:9090
resources: {}
podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
nodeSelector: {}
tolerations: []
affinity: {}
