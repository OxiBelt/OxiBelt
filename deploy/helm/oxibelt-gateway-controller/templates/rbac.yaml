{{- include "oxibelt-gateway-controller.validateSecurity" . -}}
{{- $targetNamespace := default .Release.Namespace .Values.rollout.target.namespace -}}
{{- $targetName := required "rollout.target.name is required" .Values.rollout.target.name -}}
{{- $targetKind := .Values.rollout.target.kind -}}
{{- $watchNamespace := default .Release.Namespace .Values.watchNamespace -}}
{{- $watchAllNamespaces := .Values.watchAllNamespaces -}}
{{- if not (has $targetKind (list "deployment" "daemonset")) -}}
{{- fail "rollout.target.kind must be deployment or daemonset" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-cluster
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses"]
  verbs: ["list"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses/status"]
  verbs: ["patch"]
{{- if $watchAllNamespaces }}
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["list"]
{{- else }}
- apiGroups: [""]
  resources: ["namespaces"]
  resourceNames:
  - {{ $watchNamespace | quote }}
  verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oxibelt-gateway-controller.name" . }}-cluster
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  resourceNames:
  - {{ include "oxibelt-gateway-controller.leaseName" . | quote }}
  verbs: ["get", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-leader-election
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oxibelt-gateway-controller.name" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
{{- if $watchAllNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "referencegrants", "tcproutes", "udproutes", "backendtlspolicies"]
  verbs: ["list"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status", "tcproutes/status", "udproutes/status", "backendtlspolicies/status"]
  verbs: ["patch"]
- apiGroups: ["gateway.oxibelt.dev"]
  resources: ["oxibeltroutepolicies", "oxibeltdataplanetargets"]
  verbs: ["list"]
- apiGroups: ["gateway.oxibelt.dev"]
  resources: ["oxibeltroutepolicies/status", "oxibeltdataplanetargets/status"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
  namespace: {{ $watchNamespace | quote }}
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "referencegrants", "tcproutes", "udproutes", "backendtlspolicies"]
  verbs: ["list"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gateways/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status", "tcproutes/status", "udproutes/status", "backendtlspolicies/status"]
  verbs: ["patch"]
- apiGroups: ["gateway.oxibelt.dev"]
  resources: ["oxibeltroutepolicies", "oxibeltdataplanetargets"]
  verbs: ["list"]
- apiGroups: ["gateway.oxibelt.dev"]
  resources: ["oxibeltroutepolicies/status", "oxibeltdataplanetargets/status"]
  verbs: ["patch"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
  namespace: {{ $watchNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oxibelt-gateway-controller.name" . }}-watch
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
{{- end }}
{{- range $secret := .Values.upstreamClientTls.sourceSecretAllowlist }}
{{- $identity := printf "%s/%s" $secret.namespace $secret.name -}}
{{- $roleName := printf "%s-client-secret-%s" (include "oxibelt-gateway-controller.name" $) (sha256sum $identity | trunc 12) | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $secret.namespace | quote }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames:
  - {{ $secret.name | quote }}
  verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $secret.namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
---
{{- if eq (len .Values.rollout.targets) 0 }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
  namespace: {{ $targetNamespace | quote }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
{{- if gt (len .Values.upstreamClientTls.sourceSecretAllowlist) 0 }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
{{- end }}
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- if eq $targetKind "deployment" }}
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list"]
{{- end }}
- apiGroups: ["apps"]
  resources: [{{ ternary "deployments" "daemonsets" (eq $targetKind "deployment") | quote }}]
  resourceNames:
  - {{ $targetName | quote }}
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
  namespace: {{ $targetNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{ range $index, $target := .Values.rollout.targets }}
{{ $targetNamespace := default $.Release.Namespace $target.workloadRef.namespace }}
{{ $roleName := printf "%s-rollout-%s" (include "oxibelt-gateway-controller.name" $) $target.name | trunc 63 | trimSuffix "-" }}
{{ if gt $index 0 }}
---
{{ end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ $targetNamespace | quote }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
{{ if gt (len $.Values.upstreamClientTls.sourceSecretAllowlist) 0 }}
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "delete"]
{{ end }}
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{ if eq $target.workloadRef.kind "Deployment" }}
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list"]
{{ end }}
- apiGroups: ["apps"]
  resources: [{{ ternary "deployments" "daemonsets" (eq $target.workloadRef.kind "Deployment") | quote }}]
  resourceNames:
  - {{ $target.workloadRef.name | quote }}
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ $targetNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" $ }}
  namespace: {{ $.Release.Namespace }}
{{ end }}
