{{- $targetNamespace := default .Release.Namespace .Values.rollout.target.namespace -}}
{{- $targetName := required "rollout.target.name is required" .Values.rollout.target.name -}}
{{- $targetKind := .Values.rollout.target.kind -}}
{{- if not (has $targetKind (list "deployment" "daemonset")) -}}
{{- fail "rollout.target.kind must be deployment or daemonset" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}
rules:
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "tlsroutes", "referencegrants"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["tcproutes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["gateway.networking.k8s.io"]
  resources: ["tcproutes/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "oxibelt-gateway-controller.name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
  namespace: {{ $targetNamespace | quote }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
{{- if eq $targetKind "deployment" }}
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["list"]
{{- end }}
- apiGroups: ["apps"]
  resources: [{{ ternary "deployments" "daemonsets" (eq $targetKind "deployment") | quote }}]
  resourceNames:
  - {{ $targetName | quote }}
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
  namespace: {{ $targetNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "oxibelt-gateway-controller.name" . }}-rollout
subjects:
- kind: ServiceAccount
  name: {{ include "oxibelt-gateway-controller.name" . }}
  namespace: {{ .Release.Namespace }}
