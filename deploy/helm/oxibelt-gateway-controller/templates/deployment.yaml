{{- include "oxibelt-gateway-controller.validateManagedConfigPath" . -}}
{{- include "oxibelt-gateway-controller.validateSecurity" . -}}
{{- $watchNamespace := default .Release.Namespace .Values.watchNamespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}
  labels:
    app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
    spec:
      serviceAccountName: {{ include "oxibelt-gateway-controller.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
      - name: controller
        image: {{ include "oxibelt-gateway-controller.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/oxibelt-gateway-controller"]
        args:
        - "--controller-name={{ .Values.controllerName }}"
        - "--managed-config-path={{ .Values.managedConfigPath }}"
        - "run"
        - "--rollout-target-namespace={{ default .Release.Namespace .Values.rollout.target.namespace }}"
        - "--rollout-target-kind={{ .Values.rollout.target.kind }}"
        - "--rollout-target-name={{ required "rollout.target.name is required" .Values.rollout.target.name }}"
        - "--rollout-target-container-name={{ .Values.rollout.target.containerName }}"
        - "--rollout-volume-name={{ .Values.rollout.volumeName }}"
        - "--rollout-timeout-seconds={{ .Values.rollout.timeoutSeconds }}"
        - "--rollout-config-map-prefix={{ .Values.rollout.configMapPrefix }}"
        - "--leader-election-namespace={{ .Release.Namespace }}"
        - "--leader-election-lease-name={{ include "oxibelt-gateway-controller.leaseName" . }}"
        - "--leader-election-lease-duration-seconds={{ .Values.leaderElection.leaseDurationSeconds }}"
        - "--leader-election-renew-deadline-seconds={{ .Values.leaderElection.renewDeadlineSeconds }}"
        - "--leader-election-retry-period-seconds={{ .Values.leaderElection.retryPeriodSeconds }}"
        - "--health-bind={{ .Values.healthBind }}"
        {{- if not .Values.watchAllNamespaces }}
        - "--watch-namespace={{ $watchNamespace }}"
        {{- end }}
        {{- if .Values.statusService }}
        - "--status-service={{ .Values.statusService }}"
        {{- end }}
        {{- range $address := .Values.statusAddresses }}
        - "--status-address={{ $address }}"
        {{- end }}
        - "--l4-bind-address={{ .Values.l4.bindAddress }}"
        - "--l4-connect-timeout-ms={{ .Values.l4.connectTimeoutMs }}"
        - "--l4-idle-timeout-ms={{ .Values.l4.idleTimeoutMs }}"
        - "--udp-max-flows={{ .Values.l4.udp.maxFlows }}"
        - "--udp-new-flow-rate={{ .Values.l4.udp.newFlowRate }}"
        - "--udp-new-flow-burst={{ .Values.l4.udp.newFlowBurst }}"
        - "--udp-datagram-rate={{ .Values.l4.udp.datagramRate }}"
        - "--udp-datagram-burst={{ .Values.l4.udp.datagramBurst }}"
        - "--udp-batch={{ .Values.l4.udp.batch }}"
        - "--udp-batch-size={{ .Values.l4.udp.batchSize }}"
        - "--backend-resolution={{ .Values.backendResolution }}"
        {{- if .Values.dryRun }}
        - "--dry-run"
        {{- end }}
        ports:
        - name: health
          containerPort: 9090
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        startupProbe:
          httpGet:
            path: /healthz
            port: health
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        resources:
{{ toYaml .Values.resources | indent 10 }}
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: {{ .Values.serviceAccount.tokenProjection.expirationSeconds }}
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: {{ .Values.podAntiAffinity.weight }}
            podAffinityTerm:
              topologyKey: {{ .Values.podAntiAffinity.topologyKey | quote }}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
{{- with .Values.affinity.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
{{- end }}
{{- with .Values.affinity.podAffinity }}
        podAffinity:
{{ toYaml . | indent 10 }}
{{- end }}
{{- else }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
{{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
{{- end }}
