{{- include "oxibelt-gateway-controller.validateManagedConfigPath" . -}}
{{- include "oxibelt-gateway-controller.validateSecurity" . -}}
{{- $watchNamespace := default .Release.Namespace .Values.watchNamespace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oxibelt-gateway-controller.name" . }}
  labels:
{{ include "oxibelt-gateway-controller.labels" . | indent 4 }}
  annotations:
    oxibelt.dev/effective-version: {{ include "oxibelt-gateway-controller.effectiveVersion" . | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
  template:
    metadata:
      labels:
{{ include "oxibelt-gateway-controller.labels" . | indent 8 }}
      annotations:
        oxibelt.dev/effective-version: {{ include "oxibelt-gateway-controller.effectiveVersion" . | quote }}
    spec:
      serviceAccountName: {{ include "oxibelt-gateway-controller.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
      - name: controller
        image: {{ include "oxibelt-gateway-controller.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/usr/local/bin/oxibelt-gateway-controller"]
        args:
        - "--controller-name={{ .Values.controllerName }}"
        - "--managed-config-path={{ .Values.managedConfigPath }}"
        - "run"
        - "--rollout-target-namespace={{ default .Release.Namespace .Values.rollout.target.namespace }}"
        - "--rollout-target-kind={{ .Values.rollout.target.kind }}"
        - "--rollout-target-name={{ required "rollout.target.name is required" .Values.rollout.target.name }}"
        - "--rollout-target-container-name={{ .Values.rollout.target.containerName }}"
        - "--rollout-volume-name={{ .Values.rollout.volumeName }}"
        - "--rollout-timeout-seconds={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "rollout.timeoutSeconds" "value" .Values.rollout.timeoutSeconds) }}"
        - "--rollout-config-map-prefix={{ .Values.rollout.configMapPrefix }}"
        - "--leader-election-namespace={{ .Release.Namespace }}"
        - "--leader-election-lease-name={{ include "oxibelt-gateway-controller.leaseName" . }}"
        - "--leader-election-lease-duration-seconds={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "leaderElection.leaseDurationSeconds" "value" .Values.leaderElection.leaseDurationSeconds) }}"
        - "--leader-election-renew-deadline-seconds={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "leaderElection.renewDeadlineSeconds" "value" .Values.leaderElection.renewDeadlineSeconds) }}"
        - "--leader-election-retry-period-seconds={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "leaderElection.retryPeriodSeconds" "value" .Values.leaderElection.retryPeriodSeconds) }}"
        - "--health-bind={{ .Values.healthBind }}"
        {{- if not .Values.watchAllNamespaces }}
        - "--watch-namespace={{ $watchNamespace }}"
        {{- end }}
        {{- if .Values.statusService }}
        - "--status-service={{ .Values.statusService }}"
        {{- end }}
        {{- range $address := .Values.statusAddresses }}
        - "--status-address={{ $address }}"
        {{- end }}
        - "--l4-bind-address={{ .Values.l4.bindAddress }}"
        - "--l4-connect-timeout-ms={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.connectTimeoutMs" "value" .Values.l4.connectTimeoutMs) }}"
        - "--l4-idle-timeout-ms={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.idleTimeoutMs" "value" .Values.l4.idleTimeoutMs) }}"
        - "--udp-flow-state={{ .Values.l4.udp.flowState }}"
        - "--udp-max-flows={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.udp.maxFlows" "value" .Values.l4.udp.maxFlows) }}"
        - "--udp-new-flow-rate={{ .Values.l4.udp.newFlowRate }}"
        - "--udp-new-flow-burst={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.udp.newFlowBurst" "value" .Values.l4.udp.newFlowBurst) }}"
        - "--udp-datagram-rate={{ .Values.l4.udp.datagramRate }}"
        - "--udp-datagram-burst={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.udp.datagramBurst" "value" .Values.l4.udp.datagramBurst) }}"
        - "--udp-batch={{ .Values.l4.udp.batch }}"
        - "--udp-batch-size={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "l4.udp.batchSize" "value" .Values.l4.udp.batchSize) }}"
        - "--backend-resolution={{ .Values.backendResolution }}"
        - "--request-mirror-max-body-bytes={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "filters.requestMirror.maxBodyBytes" "value" .Values.filters.requestMirror.maxBodyBytes) }}"
        - "--external-auth-max-body-bytes={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "filters.externalAuth.maxBodyBytes" "value" .Values.filters.externalAuth.maxBodyBytes) }}"
        {{- range $contentType := .Values.filters.externalAuth.allowedContentTypes }}
        - "--external-auth-allowed-content-type={{ $contentType }}"
        {{- end }}
        {{- range $header := .Values.filters.externalAuth.allowedRequestHeaders }}
        - "--external-auth-allowed-request-header={{ $header }}"
        {{- end }}
        {{- range $header := .Values.filters.externalAuth.allowedIdentityHeaders }}
        - "--external-auth-allowed-identity-header={{ $header }}"
        {{- end }}
        {{- range $header := .Values.filters.externalAuth.allowedTerminalHeaders }}
        - "--external-auth-allowed-terminal-header={{ $header }}"
        {{- end }}
        {{- if .Values.filters.externalAuth.allowCredentials }}
        - "--external-auth-allow-credentials"
        {{- end }}
        - "--route-policy-max-request-body-bytes={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "routePolicy.maxRequestBodyBytes" "value" .Values.routePolicy.maxRequestBodyBytes) }}"
        - "--route-policy-max-timeout-ms={{ include "oxibelt-gateway-controller.decimalInteger" (dict "name" "routePolicy.maxTimeoutMs" "value" .Values.routePolicy.maxTimeoutMs) }}"
        {{- range $secret := .Values.upstreamClientTls.sourceSecretAllowlist }}
        - "--upstream-client-tls-source-secret={{ $secret.namespace }}/{{ $secret.name }}:{{ default "tls.crt" $secret.certificateKey }}:{{ default "tls.key" $secret.privateKeyKey }}"
        {{- end }}
        - "--compatibility-mode={{ .Values.compatibility.mode }}"
        {{- if eq .Values.compatibility.mode "rolling_upgrade" }}
        - "--compatibility-previous-version={{ .Values.compatibility.previousVersion }}"
        - "--compatibility-deadline={{ .Values.compatibility.deadline }}"
        {{- end }}
        {{- if .Values.dryRun }}
        - "--dry-run"
        {{- end }}
        ports:
        - name: health
          containerPort: 9090
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
        startupProbe:
          httpGet:
            path: /healthz
            port: health
        securityContext:
{{ toYaml .Values.securityContext | indent 10 }}
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        resources:
{{ toYaml .Values.resources | indent 10 }}
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 288
          sources:
          - serviceAccountToken:
              expirationSeconds: {{ .Values.serviceAccount.tokenProjection.expirationSeconds }}
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
{{- if .Values.podAntiAffinity.enabled }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: {{ .Values.podAntiAffinity.weight }}
            podAffinityTerm:
              topologyKey: {{ .Values.podAntiAffinity.topologyKey | quote }}
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "oxibelt-gateway-controller.name" . }}
{{- with .Values.affinity.nodeAffinity }}
        nodeAffinity:
{{ toYaml . | indent 10 }}
{{- end }}
{{- with .Values.affinity.podAffinity }}
        podAffinity:
{{ toYaml . | indent 10 }}
{{- end }}
{{- else }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
{{- end }}
{{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
{{- end }}
