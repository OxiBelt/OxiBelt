policy:
  enabled: true
  subjectRegExp: '^https://github[.]com/OxiBelt/OxiBelt/[.]github/workflows/(release|release-image-arch)[.]yml@refs/tags/(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-beta[.](0|[1-9][0-9]*)|-build[.][0-9a-f]{8})?$'
  predicateType: https://slsa.dev/provenance/v1
  images:
    - 'ghcr.io/oxibelt/oxibelt@sha256:*'
  exemptImages: []
  trust:
    # OxiBelt is public, so `actions/attest` uses the Sigstore public-good
    # instance rather than GitHub's private artifact-attestation trust root.
    github: false
    githubTrustDomain: ''
    sigstorePublic: true
