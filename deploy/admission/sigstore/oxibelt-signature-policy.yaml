apiVersion: policy.sigstore.dev/v1beta1
kind: ClusterImagePolicy
metadata:
  name: oxibelt-keyless-signature
spec:
  images:
    - glob: 'ghcr.io/oxibelt/oxibelt@sha256:*'
    - glob: 'ghcr.io/oxibelt/oxibelt-dataplane@sha256:*'
    - glob: 'ghcr.io/oxibelt/oxibelt-gateway-controller@sha256:*'
    - glob: 'ghcr.io/oxibelt/oxibelt-tools@sha256:*'
    - glob: 'ghcr.io/oxibelt/oxibelt-keysigner@sha256:*'
  authorities:
    - name: oxibelt-github-release-signature
      keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - issuer: https://token.actions.githubusercontent.com
            subjectRegExp: '^https://github[.]com/OxiBelt/OxiBelt/[.]github/workflows/(release|release-image-arch)[.]yml@refs/tags/(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(-beta[.](0|[1-9][0-9]*)|-build[.][0-9a-f]{8})?$'
      ctlog:
        url: https://rekor.sigstore.dev
  mode: enforce
