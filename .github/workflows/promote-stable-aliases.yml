name: Promote qualified stable aliases

on:
  workflow_run:
    workflows: ["Independently verify release rebuilds"]
    types: [completed]

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

concurrency:
  group: oxibelt-stable-alias-promotion
  cancel-in-progress: false

env:
  OXIBELT_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  validate:
    name: Validate sealed stable qualification
    if: >-
      github.repository == 'OxiBelt/OxiBelt' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
      revision: ${{ steps.identity.outputs.revision }}

    steps:
      - name: Resolve exactly one qualification artifact
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERIFIER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VERIFIER_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const runId = Number(process.env.VERIFIER_RUN_ID)
            const runAttempt = Number(process.env.VERIFIER_RUN_ATTEMPT)
            const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId})).data
            if (`${context.repo.owner}/${context.repo.repo}` !== 'OxiBelt/OxiBelt' ||
                run.path !== '.github/workflows/verify-release-rebuild.yml' || run.event !== 'workflow_run' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.run_attempt !== runAttempt ||
                run.repository?.full_name !== 'OxiBelt/OxiBelt' || run.head_repository?.full_name !== 'OxiBelt/OxiBelt' ||
                !/^[0-9a-f]{40}$/.test(run.head_sha ?? '')) {
              core.setFailed('automatic verifier run identity is not eligible for promotion')
              return
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: runId, per_page: 100})
            const qualifications = artifacts.filter((artifact) =>
              !artifact.expired && /^release-qualification-[0-9a-f]{40}$/.test(artifact.name))
            if (qualifications.length !== 1) {
              core.setFailed(`verifier must expose exactly one unexpired release qualification, found ${qualifications.length}`)
              return
            }
            const revision = qualifications[0].name.slice('release-qualification-'.length)
            core.setOutput('revision', revision)

      - name: Download sealed release qualification from verifier run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: release-qualification-${{ steps.identity.outputs.revision }}
          path: ${{ runner.temp }}/release-qualification
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Classify sealed release qualification
        id: eligibility
        env:
          QUALIFICATION: ${{ runner.temp }}/release-qualification/release-qualification.json
          QUALIFICATION_REVISION: ${{ steps.identity.outputs.revision }}
          VERIFIER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VERIFIER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ ! -f "${QUALIFICATION}" || -L "${QUALIFICATION}" ]]; then
            echo "qualification must be one bounded regular file" >&2
            exit 1
          fi
          qualification_size="$(wc -c <"${QUALIFICATION}")"
          if [[ ! "${qualification_size}" =~ ^[0-9]+$ ]] ||
             (( qualification_size < 1 || qualification_size > 4 * 1024 * 1024 )); then
            echo "qualification must be one bounded regular file" >&2
            exit 1
          fi
          release_kind="$(jq -er \
            --arg revision "${QUALIFICATION_REVISION}" \
            --argjson verifier_run_id "${VERIFIER_RUN_ID}" \
            --argjson verifier_run_attempt "${VERIFIER_RUN_ATTEMPT}" '
            def exact_keys($expected):
              type == "object" and ((keys | sort) == ($expected | sort));
            def common_envelope:
              .schemaVersion == 3
              and .kind == "release-qualification"
              and .repository == "OxiBelt/OxiBelt"
              and (.tagObjectSha | type == "string" and test("^[0-9a-f]{40}$"))
              and .commit == $revision
              and ($revision | test("^[0-9a-f]{40}$"))
              and (.releaseId | type == "number" and isfinite and floor == . and . > 0)
              and (.publishedAt | type == "string" and (fromdateiso8601 | type == "number"))
              and (.producer | exact_keys(["workflowPath","runId","runAttempt","event","headSha","conclusion"])
                and .workflowPath == ".github/workflows/release.yml"
                and (.runId | type == "number" and isfinite and floor == . and . > 0)
                and (.runAttempt | type == "number" and isfinite and floor == . and . > 0)
                and .event == "release" and .headSha == $revision and .conclusion == "success")
              and (.verifier | exact_keys(["workflowPath","workflowSha","runId","runAttempt","event","conclusion"])
                and .workflowPath == ".github/workflows/verify-release-rebuild.yml"
                and (.workflowSha | type == "string" and test("^[0-9a-f]{40}$"))
                and .runId == $verifier_run_id and .runAttempt == $verifier_run_attempt
                and .event == "workflow_run" and .conclusion == "success")
              and (.receipts | exact_keys(["images","charts"]))
              and (.receipts.images | type == "array" and length == 30)
              and (.receipts.charts | type == "array" and length == 2)
              and (.manifests | type == "array" and length == 12)
              and (.aliases | type == "array");
            def release_identity:
              exact_keys(["version","ref","tagObjectSha","commit","releaseId","publishedAt"])
              and (.version | type == "string")
              and .ref == ("refs/tags/" + .version)
              and (.tagObjectSha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.commit | type == "string" and test("^[0-9a-f]{40}$"))
              and (.releaseId | type == "number" and isfinite and floor == . and . > 0)
              and (.publishedAt | type == "string" and (fromdateiso8601 | type == "number"));
            def beta_gate_waiver:
              exact_keys(["policyId","stable","beta","waivedRequirements"])
              and .policyId == "0.9.0-beta.1-to-0.9.0-predecessor-gate-waiver"
              and (.stable | release_identity)
              and (.beta | release_identity)
              and .stable.version == "0.9.0" and .stable.ref == "refs/tags/0.9.0"
              and .beta.version == "0.9.0-beta.1" and .beta.ref == "refs/tags/0.9.0-beta.1"
              and .waivedRequirements == ["beta-independent-qualification","24-hour-delay"];
            if (exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","kind","verifier","receipts","manifests","aliases"])
                and common_envelope
                and .releaseKind == "beta"
                and (.version | type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)-beta\\.[1-9][0-9]*$"))
                and .ref == ("refs/tags/" + .version)
                and (.aliases | length == 0)) then
              "beta"
            elif (exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaQualification","kind","verifier","receipts","manifests","aliases"])
                  and common_envelope
                  and .releaseKind == "stable"
                  and (.version | type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
                  and .ref == ("refs/tags/" + .version)
                  and (.betaQualification | type == "object")
                  and (.aliases | length == 48)) then
              "stable"
            elif (exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaGateWaiver","kind","verifier","receipts","manifests","aliases"])
                  and common_envelope
                  and .releaseKind == "stable" and .version == "0.9.0" and .ref == "refs/tags/0.9.0"
                  and (.betaGateWaiver | beta_gate_waiver)
                  and (.betaGateWaiver.stable.version == .version and .betaGateWaiver.stable.ref == .ref
                    and .betaGateWaiver.stable.tagObjectSha == .tagObjectSha and .betaGateWaiver.stable.commit == .commit
                    and .betaGateWaiver.stable.releaseId == .releaseId and .betaGateWaiver.stable.publishedAt == .publishedAt)
                  and (.aliases | length == 48)) then
              "stable"
            else
              error("qualification release envelope is not canonical")
            end
          ' "${QUALIFICATION}")"
          case "${release_kind}" in
            beta)
              echo "eligible=false" >>"${GITHUB_OUTPUT}"
              ;;
            stable)
              echo "eligible=true" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "qualification release kind is not supported" >&2
              exit 1
              ;;
          esac

      - name: Reauthenticate release, producer, and verifier identities
        if: steps.eligibility.outputs.eligible == 'true'
        id: reauthenticate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          QUALIFICATION: ${{ runner.temp }}/release-qualification/release-qualification.json
          VERIFIER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          VERIFIER_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require('fs')
            const path = process.env.QUALIFICATION
            const stat = fs.lstatSync(path)
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size < 1 || stat.size > 4 * 1024 * 1024) {
              core.setFailed('qualification must be one bounded regular file')
              return
            }
            const q = JSON.parse(fs.readFileSync(path, 'utf8'))
            const exactKeys = (value, keys, label) => {
              if (!value || Array.isArray(value) || typeof value !== 'object' ||
                  Object.keys(value).sort().join(',') !== [...keys].sort().join(',')) throw new Error(`${label} keys are not canonical`)
            }
            const hasBetaQualification = Object.prototype.hasOwnProperty.call(q, 'betaQualification')
            const hasBetaGateWaiver = Object.prototype.hasOwnProperty.call(q, 'betaGateWaiver')
            if (hasBetaQualification === hasBetaGateWaiver) throw new Error('stable qualification must bind exactly one beta gate mode')
            exactKeys(q, hasBetaQualification
              ? ['schemaVersion','repository','releaseKind','version','ref','tagObjectSha','commit','releaseId','publishedAt','producer','betaQualification','kind','verifier','receipts','manifests','aliases']
              : ['schemaVersion','repository','releaseKind','version','ref','tagObjectSha','commit','releaseId','publishedAt','producer','betaGateWaiver','kind','verifier','receipts','manifests','aliases'], 'qualification')
            if (q.schemaVersion !== 3 || q.kind !== 'release-qualification' || q.releaseKind !== 'stable' || q.repository !== 'OxiBelt/OxiBelt' ||
                !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(q.version ?? '') ||
                q.ref !== `refs/tags/${q.version}` || !/^[0-9a-f]{40}$/.test(q.commit ?? '') ||
                !/^[0-9a-f]{40}$/.test(q.tagObjectSha ?? '') || !Number.isSafeInteger(q.releaseId) || q.releaseId < 1) {
              throw new Error('qualification stable release identity is malformed')
            }
            if (q.verifier.workflowPath !== '.github/workflows/verify-release-rebuild.yml' || q.verifier.event !== 'workflow_run' ||
                q.verifier.conclusion !== 'success' || q.verifier.runId !== Number(process.env.VERIFIER_RUN_ID) ||
                q.verifier.runAttempt !== Number(process.env.VERIFIER_RUN_ATTEMPT) || !/^[0-9a-f]{40}$/.test(q.verifier.workflowSha ?? '')) {
              throw new Error('qualification verifier identity does not match the triggering automatic run')
            }
            if (!Array.isArray(q.receipts?.images) || q.receipts.images.length !== 30 ||
                !Array.isArray(q.receipts?.charts) || q.receipts.charts.length !== 2 ||
                !Array.isArray(q.manifests) || q.manifests.length !== 12 || !Array.isArray(q.aliases) || q.aliases.length !== 48 ||
                new Set(q.aliases.map((entry) => entry.alias)).size !== 48 ||
                q.aliases.some((entry) => entry.alias.startsWith('ghcr.io/oxibelt/charts/'))) {
              throw new Error('qualification receipt, manifest, or alias inventory is incomplete or duplicated')
            }
            const roleImages = new Map([
              ['standalone', 'ghcr.io/oxibelt/oxibelt'],
              ['dataplane', 'ghcr.io/oxibelt/oxibelt-dataplane'],
              ['dataplane-strict', 'ghcr.io/oxibelt/oxibelt-dataplane-strict'],
              ['controller', 'ghcr.io/oxibelt/oxibelt-gateway-controller'],
              ['tools', 'ghcr.io/oxibelt/oxibelt-tools'],
              ['keysigner', 'ghcr.io/oxibelt/oxibelt-keysigner'],
            ])
            const childIdentity = (child) => JSON.stringify({
              artifactArch: child.artifactArch, digest: child.digest, os: child.os,
              architecture: child.architecture, variant: child.variant,
              mediaType: child.mediaType, size: child.size,
            })
            for (const manifest of q.manifests) {
              exactKeys(manifest, ['role','image','canonicalTag','digest','children'], 'qualified index')
              if (roleImages.get(manifest.role) !== manifest.image ||
                  ![`${manifest.image}:${q.version}`, `${manifest.image}:${q.version}-alpine-musl`].includes(manifest.canonicalTag) ||
                  !/^sha256:[0-9a-f]{64}$/.test(manifest.digest ?? '') || !Array.isArray(manifest.children) || manifest.children.length !== 3) {
                throw new Error('qualified index identity is malformed')
              }
              for (const child of manifest.children) {
                exactKeys(child, ['artifactArch','digest','os','architecture','variant','mediaType','size'], 'qualified index child')
                const expectedArchitecture = {amd64: 'amd64', arm64: 'arm64', riscv64: 'riscv64'}[child.artifactArch]
                if (expectedArchitecture !== child.architecture || child.os !== 'linux' ||
                    !/^sha256:[0-9a-f]{64}$/.test(child.digest ?? '') ||
                    !['application/vnd.oci.image.manifest.v1+json','application/vnd.docker.distribution.manifest.v2+json'].includes(child.mediaType) ||
                    !Number.isSafeInteger(child.size) || child.size < 1 ||
                    !(child.variant === null || (child.architecture === 'arm64' && child.variant === 'v8'))) {
                  throw new Error('qualified index child identity is malformed')
                }
                const receipt = q.receipts.images.filter((entry) => entry.role === manifest.role &&
                  entry.artifactArch === child.artifactArch && entry.digest === child.digest &&
                  entry.os === child.os && entry.architecture === child.architecture)
                if (receipt.length !== 1) throw new Error('qualified index child is not bound to one independent platform receipt')
              }
              if (new Set(manifest.children.map((child) => child.artifactArch)).size !== 3 ||
                  new Set(manifest.children.map((child) => child.digest)).size !== 3) {
                throw new Error('qualified index descriptors are incomplete or duplicated')
              }
            }
            for (const [role, image] of roleImages) {
              const manifests = q.manifests.filter((entry) => entry.role === role && entry.image === image)
              if (manifests.length !== 2 || manifests[0].digest !== manifests[1].digest ||
                  manifests[0].children.map(childIdentity).sort().join('\n') !== manifests[1].children.map(childIdentity).sort().join('\n')) {
                throw new Error('qualified index tags for one role do not bind one digest and child set')
              }
            }
            const verifier = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: q.verifier.runId})).data
            if (verifier.path !== q.verifier.workflowPath || verifier.event !== 'workflow_run' || verifier.status !== 'completed' ||
                verifier.conclusion !== 'success' || verifier.run_attempt !== q.verifier.runAttempt || verifier.head_sha !== q.verifier.workflowSha) {
              throw new Error('verifier API readback changed identity')
            }
            const producer = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: q.producer.runId})).data
            if (q.producer.workflowPath !== '.github/workflows/release.yml' || q.producer.event !== 'release' || q.producer.conclusion !== 'success' ||
                producer.path !== q.producer.workflowPath || producer.event !== 'release' || producer.status !== 'completed' || producer.conclusion !== 'success' ||
                producer.run_attempt !== q.producer.runAttempt || producer.head_sha !== q.commit || producer.head_branch !== q.version) {
              throw new Error('producer API readback changed identity')
            }
            const ref = (await github.rest.git.getRef({...context.repo, ref: `tags/${q.version}`})).data
            const tag = ref.object.type === 'tag' ? (await github.rest.git.getTag({...context.repo, tag_sha: ref.object.sha})).data : null
            const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag: q.version})).data
            const latest = (await github.rest.repos.getLatestRelease(context.repo)).data
            if (ref.ref !== q.ref || ref.object.sha !== q.tagObjectSha || tag?.object?.type !== 'commit' || tag.object.sha !== q.commit ||
                release.id !== q.releaseId || release.id !== latest.id || release.tag_name !== q.version || release.draft || release.prerelease ||
                release.target_commitish !== q.commit || release.published_at !== q.publishedAt) {
              throw new Error('stable tag or latest published release API readback changed identity')
            }
            const parseReleaseIdentity = (value, label) => {
              exactKeys(value, ['version','ref','tagObjectSha','commit','releaseId','publishedAt'], label)
              if (typeof value.version !== 'string' || value.ref !== `refs/tags/${value.version}` ||
                  !/^[0-9a-f]{40}$/.test(value.tagObjectSha ?? '') || !/^[0-9a-f]{40}$/.test(value.commit ?? '') ||
                  !Number.isSafeInteger(value.releaseId) || value.releaseId < 1 || !Number.isFinite(Date.parse(value.publishedAt ?? ''))) {
                throw new Error(`${label} identity is malformed`)
              }
              return value
            }
            const waiver = hasBetaGateWaiver ? q.betaGateWaiver : null
            if (waiver !== null) {
              exactKeys(waiver, ['policyId','stable','beta','waivedRequirements'], 'beta gate waiver')
              const stable = parseReleaseIdentity(waiver.stable, 'beta gate waiver stable')
              const waivedBeta = parseReleaseIdentity(waiver.beta, 'beta gate waiver beta')
              if (waiver.policyId !== '0.9.0-beta.1-to-0.9.0-predecessor-gate-waiver' ||
                  !Array.isArray(waiver.waivedRequirements) || waiver.waivedRequirements.join(',') !== 'beta-independent-qualification,24-hour-delay' ||
                  q.version !== '0.9.0' || stable.version !== q.version || stable.ref !== q.ref || stable.tagObjectSha !== q.tagObjectSha ||
                  stable.commit !== q.commit || stable.releaseId !== q.releaseId || stable.publishedAt !== q.publishedAt ||
                  waivedBeta.version !== '0.9.0-beta.1' || waivedBeta.ref !== 'refs/tags/0.9.0-beta.1') {
                throw new Error('beta gate waiver is not the exact authorized release pair')
              }
            }
            const beta = waiver === null ? q.betaQualification : waiver.beta
            if (waiver === null && (!beta || !/^.+-beta\.[1-9][0-9]*$/.test(beta.version ?? '') || beta.ref !== `refs/tags/${beta.version}` ||
                !/^[0-9a-f]{40}$/.test(beta.tagObjectSha ?? '') || !/^[0-9a-f]{40}$/.test(beta.commit ?? '') ||
                !/^[0-9a-f]{64}$/.test(beta.aggregateSha256 ?? '') || !Number.isSafeInteger(beta.verifierRunId) ||
                beta.artifactName !== `release-qualification-${beta.commit}`)) {
              throw new Error('stable qualification does not bind one exact beta aggregate')
            }
            const betaRef = (await github.rest.git.getRef({...context.repo, ref: `tags/${beta.version}`})).data
            const betaTag = betaRef.object.type === 'tag' ? (await github.rest.git.getTag({...context.repo, tag_sha: betaRef.object.sha})).data : null
            const betaRelease = (await github.rest.repos.getReleaseByTag({...context.repo, tag: beta.version})).data
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100})
            const betaPattern = new RegExp(`^${q.version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}-beta\\.([1-9][0-9]*)$`)
            const validBetas = releases.filter((candidate) => !candidate.draft && candidate.prerelease && candidate.published_at !== null && betaPattern.test(candidate.tag_name))
            validBetas.sort((left, right) => Number(betaPattern.exec(right.tag_name)[1]) - Number(betaPattern.exec(left.tag_name)[1]))
            const betaRun = waiver === null ? (await github.rest.actions.getWorkflowRun({...context.repo, run_id: beta.verifierRunId})).data : null
            const betaArtifacts = waiver === null ? await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: beta.verifierRunId, per_page: 100}) : []
            const betaArtifact = waiver === null ? betaArtifacts.filter((artifact) => !artifact.expired && artifact.id === beta.artifactId && artifact.name === beta.artifactName) : []
            const soakStart = waiver === null ? Math.max(Date.parse(beta.publishedAt), Date.parse(beta.verifierCompletedAt)) : Date.parse(beta.publishedAt)
            const requiredStableQualificationDelayMs = waiver !== null || (q.version === '0.8.1' && beta.version === '0.8.1-beta.9')
              ? 0
              : 24 * 60 * 60 * 1000
            const stablePublicationDelayMs = Date.parse(q.publishedAt) - soakStart
            if (betaRef.object.sha !== beta.tagObjectSha || betaTag?.object?.sha !== beta.commit ||
                betaRelease.id !== beta.releaseId || betaRelease.tag_name !== beta.version || betaRelease.target_commitish !== beta.commit || validBetas[0]?.id !== beta.releaseId || betaRelease.draft || !betaRelease.prerelease ||
                betaRelease.published_at !== beta.publishedAt || (waiver === null && (betaRun.path !== '.github/workflows/verify-release-rebuild.yml' ||
                betaRun.event !== 'workflow_run' || betaRun.status !== 'completed' || betaRun.conclusion !== 'success' ||
                betaRun.run_attempt !== beta.verifierRunAttempt || betaRun.head_sha !== beta.verifierWorkflowSha || betaRun.updated_at !== beta.verifierCompletedAt || betaArtifact.length !== 1)) ||
                !Number.isFinite(soakStart) || !Number.isFinite(stablePublicationDelayMs) ||
                stablePublicationDelayMs < requiredStableQualificationDelayMs) {
              throw new Error('beta qualification API identity or completed required delay changed')
            }
            if (waiver === null) {
              core.setOutput('beta_mode', 'qualification')
              core.setOutput('beta_run_id', String(beta.verifierRunId))
              core.setOutput('beta_revision', beta.commit)
            }

      - name: Download beta aggregate bound by the stable qualification
        if: ${{ steps.eligibility.outputs.eligible == 'true' && steps.reauthenticate.outputs.beta_mode == 'qualification' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: release-qualification-${{ steps.reauthenticate.outputs.beta_revision }}
          path: ${{ runner.temp }}/beta-release-qualification
          github-token: ${{ github.token }}
          run-id: ${{ steps.reauthenticate.outputs.beta_run_id }}

      - name: Verify exact beta aggregate bytes and identity
        if: ${{ steps.eligibility.outputs.eligible == 'true' && steps.reauthenticate.outputs.beta_mode == 'qualification' }}
        env:
          BETA: ${{ runner.temp }}/beta-release-qualification/release-qualification.json
          STABLE: ${{ runner.temp }}/release-qualification/release-qualification.json
        run: |
          set -euo pipefail
          expected_sha="$(jq -r '.betaQualification.aggregateSha256' "${STABLE}")"
          actual_sha="$(sha256sum "${BETA}" | awk '{print $1}')"
          [[ "${actual_sha}" == "${expected_sha}" ]]
          jq -e --slurpfile stable "${STABLE}" '
            .schemaVersion == 3 and .kind == "release-qualification" and .releaseKind == "beta"
            and .version == $stable[0].betaQualification.version and .commit == $stable[0].betaQualification.commit
            and .tagObjectSha == $stable[0].betaQualification.tagObjectSha
            and .releaseId == $stable[0].betaQualification.releaseId
            and .verifier.runId == $stable[0].betaQualification.verifierRunId
            and .verifier.runAttempt == $stable[0].betaQualification.verifierRunAttempt
            and (.receipts.images | length) == 30 and (.receipts.charts | length) == 2
          ' "${BETA}" >/dev/null

      - name: Authenticate exact stable alias mapping
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          QUALIFICATION: ${{ runner.temp }}/release-qualification/release-qualification.json
        run: |
          set -euo pipefail
          validate_stable_alias_mapping() {
            local input="$1"
            local mode="$2"
            jq -e --arg mode "${mode}" --argjson current_run_id "${GITHUB_RUN_ID}" --argjson current_run_attempt "${GITHUB_RUN_ATTEMPT}" '
              def exact_keys($expected):
                type == "object" and ((keys | sort) == ($expected | sort));
              def role_image($role):
                if $role == "standalone" then "ghcr.io/oxibelt/oxibelt"
                elif $role == "dataplane" then "ghcr.io/oxibelt/oxibelt-dataplane"
                elif $role == "dataplane-strict" then "ghcr.io/oxibelt/oxibelt-dataplane-strict"
                elif $role == "controller" then "ghcr.io/oxibelt/oxibelt-gateway-controller"
                elif $role == "tools" then "ghcr.io/oxibelt/oxibelt-tools"
                elif $role == "keysigner" then "ghcr.io/oxibelt/oxibelt-keysigner"
                else error("unsupported qualified image role") end;
              def expected_architecture($arch):
                if $arch == "amd64v2" or $arch == "amd64" or $arch == "amd64v4" then "amd64"
                elif $arch == "arm64" then "arm64"
                elif $arch == "riscv64" then "riscv64"
                else error("unsupported qualified artifact architecture") end;
              def release_identity:
                exact_keys(["version","ref","tagObjectSha","commit","releaseId","publishedAt"])
                and (.version | type == "string") and .ref == ("refs/tags/" + .version)
                and (.tagObjectSha | type == "string" and test("^[0-9a-f]{40}$"))
                and (.commit | type == "string" and test("^[0-9a-f]{40}$"))
                and (.releaseId | type == "number" and isfinite and floor == . and . > 0)
                and (.publishedAt | type == "string" and (fromdateiso8601 | type == "number"));
              def beta_gate_waiver:
                exact_keys(["policyId","stable","beta","waivedRequirements"])
                and .policyId == "0.9.0-beta.1-to-0.9.0-predecessor-gate-waiver"
                and (.stable | release_identity) and (.beta | release_identity)
                and .stable.version == "0.9.0" and .stable.ref == "refs/tags/0.9.0"
                and .beta.version == "0.9.0-beta.1" and .beta.ref == "refs/tags/0.9.0-beta.1"
                and .waivedRequirements == ["beta-independent-qualification","24-hour-delay"];
              def expected_aliases:
                . as $q |
                ([ $q.receipts.images[] |
                  {alias: (role_image(.role) + ":" + ($q.version | split(".")[0]) + "-alpine-musl-" + .artifactArch),
                   sourceTag: (role_image(.role) + ":" + $q.version + "-alpine-musl-" + .artifactArch),
                   sourceDigest: .digest, kind: "platform"} ]
                 + ([ $q.manifests[] |
                    if .canonicalTag == (.image + ":" + $q.version) then
                      [{alias: (.image + ":latest"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"}]
                    elif .canonicalTag == (.image + ":" + $q.version + "-alpine-musl") then
                      [{alias: (.image + ":" + ($q.version | split(".")[0]) + "-alpine-musl"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"},
                       {alias: (.image + ":alpine-musl"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"}]
                    else error("qualified index source tag is not canonical") end
                  ] | add));
              . as $q |
              (($mode == "qualification" and
                (($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaQualification","kind","verifier","receipts","manifests","aliases"]))
                 or ($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaGateWaiver","kind","verifier","receipts","manifests","aliases"]))))
               or
               ($mode == "promotion" and
                (($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaQualification","kind","verifier","receipts","manifests","aliases","promotionValidation","aliasSnapshots"]))
                 or ($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaGateWaiver","kind","verifier","receipts","manifests","aliases","promotionValidation","aliasSnapshots"])))))
              and $q.schemaVersion == 3 and $q.kind == "release-qualification" and $q.releaseKind == "stable"
              and $q.repository == "OxiBelt/OxiBelt"
              and ($q.version | type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              and ((($q | has("betaQualification")) and ($q.betaQualification | type == "object")) or
                (($q | has("betaGateWaiver")) and ($q.betaGateWaiver | beta_gate_waiver)
                  and $q.version == "0.9.0" and $q.ref == "refs/tags/0.9.0"
                  and $q.betaGateWaiver.stable.version == $q.version and $q.betaGateWaiver.stable.ref == $q.ref
                  and $q.betaGateWaiver.stable.tagObjectSha == $q.tagObjectSha and $q.betaGateWaiver.stable.commit == $q.commit
                  and $q.betaGateWaiver.stable.releaseId == $q.releaseId and $q.betaGateWaiver.stable.publishedAt == $q.publishedAt))
              and ($q.receipts | exact_keys(["images","charts"]))
              and ($q.receipts.images | type == "array" and length == 30)
              and ([ $q.receipts.images[] | (.role + "/" + .artifactArch) ] | unique | length == 30)
              and all($q.receipts.images[];
                exact_keys(["role","artifactArch","image","canonicalTag","digest","receiptSha256","os","architecture"])
                and (.artifactArch | IN("amd64v2","amd64","amd64v4","arm64","riscv64"))
                and .image == role_image(.role)
                and .canonicalTag == (.image + ":" + $q.version + "-alpine-musl-" + .artifactArch)
                and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                and (.receiptSha256 | type == "string" and test("^[0-9a-f]{64}$"))
                and .os == "linux" and .architecture == expected_architecture(.artifactArch))
              and ($q.manifests | type == "array" and length == 12)
              and ([ $q.manifests[].canonicalTag ] | unique | length == 12)
              and all($q.manifests[];
                exact_keys(["role","image","canonicalTag","digest","children"])
                and .image == role_image(.role)
                and (.canonicalTag == (.image + ":" + $q.version) or
                     .canonicalTag == (.image + ":" + $q.version + "-alpine-musl"))
                and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
              and ($q.aliases | type == "array" and length == 48)
              and all($q.aliases[]; exact_keys(["alias","sourceTag","sourceDigest","kind"]))
              and (($q | expected_aliases | sort_by(.alias)) as $expected |
                ($expected | length == 48) and ([ $expected[].alias ] | unique | length == 48)
                and ($q.aliases | sort_by(.alias)) == $expected
                and (if $mode == "promotion" then
                  ($q.promotionValidation | exact_keys(["workflowPath","runId","runAttempt"]))
                  and $q.promotionValidation.workflowPath == ".github/workflows/promote-stable-aliases.yml"
                  and $q.promotionValidation.runId == $current_run_id
                  and $q.promotionValidation.runAttempt == $current_run_attempt
                  and ($q.aliasSnapshots | type == "array" and length == 48)
                  and all($q.aliasSnapshots[];
                    exact_keys(["alias","sourceTag","sourceDigest","kind","currentDigest"])
                    and (.currentDigest == null or (.currentDigest | type == "string" and test("^sha256:[0-9a-f]{64}$"))))
                  and ([ $q.aliasSnapshots[] | {alias,sourceTag,sourceDigest,kind} ] | sort_by(.alias)) == $expected
                else true end))
            ' "${input}" >/dev/null
          }
          validate_stable_alias_mapping "${QUALIFICATION}" qualification

      - name: Start isolated rootless Docker for registry validation
        if: steps.eligibility.outputs.eligible == 'true'
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.7.2
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts": ["native.cgroupdriver=cgroupfs"]}

      - name: Setup pinned Docker Buildx
        if: steps.eligibility.outputs.eligible == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Install pinned ORAS acquisition client
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GOBIN: ${{ runner.temp }}/oras-bin
        run: |
          set -euo pipefail
          mkdir -m 0700 "${GOBIN}"
          go install oras.land/oras/cmd/oras@v1.3.3
          "${GOBIN}/oras" version | grep -E '(^|[[:space:]])1\.3\.3($|[[:space:]])'

      - name: Reread every immutable image and chart digest
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORAS_BIN: ${{ runner.temp }}/oras-bin/oras
          QUALIFICATION: ${{ runner.temp }}/release-qualification/release-qualification.json
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          normalize_index_children() {
            jq -ce '
              if ((.mediaType == "application/vnd.oci.image.index.v1+json"
                    or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
                  and (.manifests | type == "array" and length == 3)
                  and all(.manifests[];
                    ((.mediaType == "application/vnd.oci.image.manifest.v1+json"
                      or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
                     and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                     and (.size | type == "number" and . > 0)
                     and .platform.os == "linux"
                     and (.platform.architecture | IN("amd64", "arm64", "riscv64"))
                     and ((.platform.variant // null) == null
                       or (.platform.architecture == "arm64" and .platform.variant == "v8"))))
                  and ([.manifests[].digest] | unique | length == 3)
                  and ([.manifests[].platform.architecture] | sort == ["amd64", "arm64", "riscv64"]))
              then [.manifests[] | {digest, os: .platform.os, architecture: .platform.architecture,
                variant: (.platform.variant // null), mediaType, size}] | sort_by(.os, .architecture, .digest)
              else error("qualified index descriptors are incomplete or duplicated")
              end
            '
          }
          while IFS=$'\t' read -r tag digest; do
            resolved="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "${resolved}" == "${digest}" ]] || { echo "immutable image digest drift: ${tag}" >&2; exit 1; }
          done < <(jq -r '.receipts.images[] | [.canonicalTag, .digest] | @tsv' "${QUALIFICATION}")
          while IFS=$'\t' read -r tag digest expected_children_base64; do
            manifest="$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}')"
            resolved="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${manifest}")"
            [[ "${resolved}" == "${digest}" ]] || { echo "immutable index digest drift: ${tag}" >&2; exit 1; }
            actual_children="$(normalize_index_children <<<"${manifest}")"
            expected_children="$(base64 --decode <<<"${expected_children_base64}")"
            [[ "${actual_children}" == "${expected_children}" ]] || { echo "index children changed after qualification: ${tag}" >&2; exit 1; }
          done < <(jq -r '.manifests[] | [.canonicalTag, .digest,
            (.children | map({digest, os, architecture, variant, mediaType, size}) | sort_by(.os, .architecture, .digest) | @base64)] | @tsv' "${QUALIFICATION}")
          while IFS=$'\t' read -r repository digest; do
            resolved="$("${ORAS_BIN}" manifest fetch --descriptor "${repository}@${digest}" | jq -r '.digest')"
            [[ "${resolved}" == "${digest}" ]] || { echo "immutable chart digest drift: ${repository}" >&2; exit 1; }
            gh attestation verify "oci://${repository}@${digest}" --repo OxiBelt/OxiBelt \
              --signer-workflow OxiBelt/OxiBelt/.github/workflows/release.yml \
              --signer-digest "$(jq -r '.commit' "${QUALIFICATION}")" --source-digest "$(jq -r '.commit' "${QUALIFICATION}")" \
              --source-ref "$(jq -r '.ref' "${QUALIFICATION}")" --cert-oidc-issuer https://token.actions.githubusercontent.com \
              --deny-self-hosted-runners --predicate-type https://oxibelt.dev/attestations/helm-chart-rebuild/v3 --limit 100 >/dev/null
          done < <(jq -r '.receipts.charts[] | [.subject.repository, .subject.digest] | @tsv' "${QUALIFICATION}")

      - name: Snapshot alias state for the final mutation boundary
        if: steps.eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT: ${{ runner.temp }}/release-qualification/release-qualification.json
          OUTPUT: ${{ runner.temp }}/stable-alias-promotion-plan.json
        run: |
          set -euo pipefail
          snapshots='[]'
          while IFS=$'\t' read -r alias source_tag source_digest kind; do
            error_file="${RUNNER_TEMP}/alias-inspect-error.log"
            if manifest="$(docker buildx imagetools inspect "${alias}" --format '{{json .Manifest}}' 2>"${error_file}")"; then
              current="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${manifest}")"
            elif grep -Eqi 'manifest unknown|404|not found' "${error_file}"; then
              current=null
            else
              cat "${error_file}" >&2
              exit 1
            fi
            snapshots="$(jq -c --arg alias "${alias}" --arg source_tag "${source_tag}" --arg source_digest "${source_digest}" --arg kind "${kind}" --arg current "${current}" '. + [{alias: $alias, sourceTag: $source_tag, sourceDigest: $source_digest, kind: $kind, currentDigest: (if $current == "null" then null else $current end)}]' <<<"${snapshots}")"
          done < <(jq -r '.aliases[] | [.alias, .sourceTag, .sourceDigest, .kind] | @tsv' "${INPUT}")
          jq -S --argjson snapshots "${snapshots}" --argjson validation_run_id "${GITHUB_RUN_ID}" --argjson validation_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '. + {promotionValidation: {workflowPath: ".github/workflows/promote-stable-aliases.yml", runId: $validation_run_id, runAttempt: $validation_run_attempt}, aliasSnapshots: ($snapshots | sort_by(.alias))}' "${INPUT}" >"${OUTPUT}"
          jq -e '(.aliasSnapshots | length) == 48 and ([.aliasSnapshots[].alias] | unique | length) == 48' "${OUTPUT}" >/dev/null

      - name: Upload validated promotion plan
        if: steps.eligibility.outputs.eligible == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: stable-alias-promotion-plan-${{ steps.identity.outputs.revision }}
          path: ${{ runner.temp }}/stable-alias-promotion-plan.json
          if-no-files-found: error
          retention-days: 1

  promote:
    name: Promote stable aliases sequentially
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.eligible == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download validated promotion plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: stable-alias-promotion-plan-${{ needs.validate.outputs.revision }}
          path: ${{ runner.temp }}/stable-alias-promotion-plan

      - name: Setup pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Reauthenticate latest stable release immediately before mutation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ runner.temp }}/stable-alias-promotion-plan/stable-alias-promotion-plan.json
        with:
          script: |
            const fs = require('fs')
            const q = JSON.parse(fs.readFileSync(process.env.PLAN, 'utf8'))
            const ref = (await github.rest.git.getRef({...context.repo, ref: `tags/${q.version}`})).data
            const tag = ref.object.type === 'tag' ? (await github.rest.git.getTag({...context.repo, tag_sha: ref.object.sha})).data : null
            const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag: q.version})).data
            const latest = (await github.rest.repos.getLatestRelease(context.repo)).data
            const producer = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: q.producer.runId})).data
            const verifier = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: q.verifier.runId})).data
            const hasBetaQualification = Object.prototype.hasOwnProperty.call(q, 'betaQualification')
            const hasBetaGateWaiver = Object.prototype.hasOwnProperty.call(q, 'betaGateWaiver')
            if (hasBetaQualification === hasBetaGateWaiver) throw new Error('stable promotion plan must bind exactly one beta gate mode')
            const waiver = hasBetaGateWaiver ? q.betaGateWaiver : null
            const parseReleaseIdentity = (value, label) => {
              if (!value || Array.isArray(value) || typeof value !== 'object' ||
                  Object.keys(value).sort().join(',') !== ['version','ref','tagObjectSha','commit','releaseId','publishedAt'].sort().join(',') ||
                  typeof value.version !== 'string' || value.ref !== `refs/tags/${value.version}` ||
                  !/^[0-9a-f]{40}$/.test(value.tagObjectSha ?? '') || !/^[0-9a-f]{40}$/.test(value.commit ?? '') ||
                  !Number.isSafeInteger(value.releaseId) || value.releaseId < 1 || !Number.isFinite(Date.parse(value.publishedAt ?? ''))) {
                throw new Error(`${label} identity is malformed`)
              }
              return value
            }
            if (waiver !== null) {
              if (!waiver || Array.isArray(waiver) || typeof waiver !== 'object' ||
                  Object.keys(waiver).sort().join(',') !== ['policyId','stable','beta','waivedRequirements'].sort().join(',') ||
                  waiver.policyId !== '0.9.0-beta.1-to-0.9.0-predecessor-gate-waiver' ||
                  !Array.isArray(waiver.waivedRequirements) || waiver.waivedRequirements.join(',') !== 'beta-independent-qualification,24-hour-delay') {
                throw new Error('beta gate waiver is malformed')
              }
              const stable = parseReleaseIdentity(waiver.stable, 'beta gate waiver stable')
              const waivedBeta = parseReleaseIdentity(waiver.beta, 'beta gate waiver beta')
              if (q.version !== '0.9.0' || stable.version !== q.version || stable.ref !== q.ref || stable.tagObjectSha !== q.tagObjectSha ||
                  stable.commit !== q.commit || stable.releaseId !== q.releaseId || stable.publishedAt !== q.publishedAt ||
                  waivedBeta.version !== '0.9.0-beta.1' || waivedBeta.ref !== 'refs/tags/0.9.0-beta.1') {
                throw new Error('beta gate waiver is not the exact authorized release pair')
              }
            }
            const beta = waiver === null ? q.betaQualification : waiver.beta
            if (waiver === null && (!beta || !/^.+-beta\.[1-9][0-9]*$/.test(beta.version ?? '') || beta.ref !== `refs/tags/${beta.version}` ||
                !/^[0-9a-f]{40}$/.test(beta.tagObjectSha ?? '') || !/^[0-9a-f]{40}$/.test(beta.commit ?? '') ||
                !/^[0-9a-f]{64}$/.test(beta.aggregateSha256 ?? '') || !Number.isSafeInteger(beta.verifierRunId) ||
                beta.artifactName !== `release-qualification-${beta.commit}`)) {
              throw new Error('stable promotion plan does not bind one exact beta aggregate')
            }
            const betaRef = (await github.rest.git.getRef({...context.repo, ref: `tags/${beta.version}`})).data
            const betaTag = betaRef.object.type === 'tag' ? (await github.rest.git.getTag({...context.repo, tag_sha: betaRef.object.sha})).data : null
            const betaRelease = (await github.rest.repos.getReleaseByTag({...context.repo, tag: beta.version})).data
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100})
            const betaPattern = new RegExp(`^${q.version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}-beta\\.([1-9][0-9]*)$`)
            const validBetas = releases.filter((candidate) => !candidate.draft && candidate.prerelease && candidate.published_at !== null && betaPattern.test(candidate.tag_name))
            validBetas.sort((left, right) => Number(betaPattern.exec(right.tag_name)[1]) - Number(betaPattern.exec(left.tag_name)[1]))
            const betaVerifier = waiver === null ? (await github.rest.actions.getWorkflowRun({...context.repo, run_id: beta.verifierRunId})).data : null
            const betaArtifacts = waiver === null ? await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: beta.verifierRunId, per_page: 100}) : []
            const betaArtifact = waiver === null ? betaArtifacts.filter((artifact) => !artifact.expired && artifact.id === beta.artifactId && artifact.name === beta.artifactName) : []
            const soakStart = waiver === null ? Math.max(Date.parse(beta.publishedAt), Date.parse(beta.verifierCompletedAt)) : Date.parse(beta.publishedAt)
            const requiredStableQualificationDelayMs = waiver !== null || (q.version === '0.8.1' && beta.version === '0.8.1-beta.9')
              ? 0
              : 24 * 60 * 60 * 1000
            const stablePublicationDelayMs = Date.parse(q.publishedAt) - soakStart
            if (ref.object.sha !== q.tagObjectSha || tag?.object?.sha !== q.commit || release.id !== q.releaseId ||
                release.id !== latest.id || release.draft || release.prerelease || release.target_commitish !== q.commit || release.published_at !== q.publishedAt ||
                producer.path !== q.producer.workflowPath || producer.run_attempt !== q.producer.runAttempt || producer.conclusion !== 'success' ||
                verifier.path !== q.verifier.workflowPath || verifier.run_attempt !== q.verifier.runAttempt || verifier.conclusion !== 'success' ||
                betaRef.object.sha !== beta.tagObjectSha || betaTag?.object?.sha !== beta.commit || betaRelease.id !== beta.releaseId || betaRelease.target_commitish !== beta.commit || validBetas[0]?.id !== beta.releaseId ||
                betaRelease.draft || !betaRelease.prerelease || betaRelease.published_at !== beta.publishedAt ||
                (waiver === null && (betaVerifier.path !== '.github/workflows/verify-release-rebuild.yml' || betaVerifier.event !== 'workflow_run' ||
                betaVerifier.run_attempt !== beta.verifierRunAttempt || betaVerifier.head_sha !== beta.verifierWorkflowSha || betaVerifier.conclusion !== 'success' ||
                betaVerifier.updated_at !== beta.verifierCompletedAt || betaArtifact.length !== 1)) || !Number.isFinite(soakStart) ||
                !Number.isFinite(stablePublicationDelayMs) || stablePublicationDelayMs < requiredStableQualificationDelayMs ||
                q.promotionValidation.workflowPath !== '.github/workflows/promote-stable-aliases.yml') {
              core.setFailed('promotion identity changed after read-only validation')
            }

      - name: Promote only qualified image aliases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN: ${{ runner.temp }}/stable-alias-promotion-plan/stable-alias-promotion-plan.json
        run: |
          set -euo pipefail
          validate_stable_alias_mapping() {
            local input="$1"
            local mode="$2"
            jq -e --arg mode "${mode}" --argjson current_run_id "${GITHUB_RUN_ID}" --argjson current_run_attempt "${GITHUB_RUN_ATTEMPT}" '
              def exact_keys($expected):
                type == "object" and ((keys | sort) == ($expected | sort));
              def role_image($role):
                if $role == "standalone" then "ghcr.io/oxibelt/oxibelt"
                elif $role == "dataplane" then "ghcr.io/oxibelt/oxibelt-dataplane"
                elif $role == "dataplane-strict" then "ghcr.io/oxibelt/oxibelt-dataplane-strict"
                elif $role == "controller" then "ghcr.io/oxibelt/oxibelt-gateway-controller"
                elif $role == "tools" then "ghcr.io/oxibelt/oxibelt-tools"
                elif $role == "keysigner" then "ghcr.io/oxibelt/oxibelt-keysigner"
                else error("unsupported qualified image role") end;
              def expected_architecture($arch):
                if $arch == "amd64v2" or $arch == "amd64" or $arch == "amd64v4" then "amd64"
                elif $arch == "arm64" then "arm64"
                elif $arch == "riscv64" then "riscv64"
                else error("unsupported qualified artifact architecture") end;
              def release_identity:
                exact_keys(["version","ref","tagObjectSha","commit","releaseId","publishedAt"])
                and (.version | type == "string") and .ref == ("refs/tags/" + .version)
                and (.tagObjectSha | type == "string" and test("^[0-9a-f]{40}$"))
                and (.commit | type == "string" and test("^[0-9a-f]{40}$"))
                and (.releaseId | type == "number" and isfinite and floor == . and . > 0)
                and (.publishedAt | type == "string" and (fromdateiso8601 | type == "number"));
              def beta_gate_waiver:
                exact_keys(["policyId","stable","beta","waivedRequirements"])
                and .policyId == "0.9.0-beta.1-to-0.9.0-predecessor-gate-waiver"
                and (.stable | release_identity) and (.beta | release_identity)
                and .stable.version == "0.9.0" and .stable.ref == "refs/tags/0.9.0"
                and .beta.version == "0.9.0-beta.1" and .beta.ref == "refs/tags/0.9.0-beta.1"
                and .waivedRequirements == ["beta-independent-qualification","24-hour-delay"];
              def expected_aliases:
                . as $q |
                ([ $q.receipts.images[] |
                  {alias: (role_image(.role) + ":" + ($q.version | split(".")[0]) + "-alpine-musl-" + .artifactArch),
                   sourceTag: (role_image(.role) + ":" + $q.version + "-alpine-musl-" + .artifactArch),
                   sourceDigest: .digest, kind: "platform"} ]
                 + ([ $q.manifests[] |
                    if .canonicalTag == (.image + ":" + $q.version) then
                      [{alias: (.image + ":latest"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"}]
                    elif .canonicalTag == (.image + ":" + $q.version + "-alpine-musl") then
                      [{alias: (.image + ":" + ($q.version | split(".")[0]) + "-alpine-musl"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"},
                       {alias: (.image + ":alpine-musl"), sourceTag: .canonicalTag, sourceDigest: .digest, kind: "index"}]
                    else error("qualified index source tag is not canonical") end
                  ] | add));
              . as $q |
              (($mode == "qualification" and
                (($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaQualification","kind","verifier","receipts","manifests","aliases"]))
                 or ($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaGateWaiver","kind","verifier","receipts","manifests","aliases"]))))
               or
               ($mode == "promotion" and
                (($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaQualification","kind","verifier","receipts","manifests","aliases","promotionValidation","aliasSnapshots"]))
                 or ($q | exact_keys(["schemaVersion","repository","releaseKind","version","ref","tagObjectSha","commit","releaseId","publishedAt","producer","betaGateWaiver","kind","verifier","receipts","manifests","aliases","promotionValidation","aliasSnapshots"])))))
              and $q.schemaVersion == 3 and $q.kind == "release-qualification" and $q.releaseKind == "stable"
              and $q.repository == "OxiBelt/OxiBelt"
              and ($q.version | type == "string" and test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
              and ((($q | has("betaQualification")) and ($q.betaQualification | type == "object")) or
                (($q | has("betaGateWaiver")) and ($q.betaGateWaiver | beta_gate_waiver)
                  and $q.version == "0.9.0" and $q.ref == "refs/tags/0.9.0"
                  and $q.betaGateWaiver.stable.version == $q.version and $q.betaGateWaiver.stable.ref == $q.ref
                  and $q.betaGateWaiver.stable.tagObjectSha == $q.tagObjectSha and $q.betaGateWaiver.stable.commit == $q.commit
                  and $q.betaGateWaiver.stable.releaseId == $q.releaseId and $q.betaGateWaiver.stable.publishedAt == $q.publishedAt))
              and ($q.receipts | exact_keys(["images","charts"]))
              and ($q.receipts.images | type == "array" and length == 30)
              and ([ $q.receipts.images[] | (.role + "/" + .artifactArch) ] | unique | length == 30)
              and all($q.receipts.images[];
                exact_keys(["role","artifactArch","image","canonicalTag","digest","receiptSha256","os","architecture"])
                and (.artifactArch | IN("amd64v2","amd64","amd64v4","arm64","riscv64"))
                and .image == role_image(.role)
                and .canonicalTag == (.image + ":" + $q.version + "-alpine-musl-" + .artifactArch)
                and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                and (.receiptSha256 | type == "string" and test("^[0-9a-f]{64}$"))
                and .os == "linux" and .architecture == expected_architecture(.artifactArch))
              and ($q.manifests | type == "array" and length == 12)
              and ([ $q.manifests[].canonicalTag ] | unique | length == 12)
              and all($q.manifests[];
                exact_keys(["role","image","canonicalTag","digest","children"])
                and .image == role_image(.role)
                and (.canonicalTag == (.image + ":" + $q.version) or
                     .canonicalTag == (.image + ":" + $q.version + "-alpine-musl"))
                and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$")))
              and ($q.aliases | type == "array" and length == 48)
              and all($q.aliases[]; exact_keys(["alias","sourceTag","sourceDigest","kind"]))
              and (($q | expected_aliases | sort_by(.alias)) as $expected |
                ($expected | length == 48) and ([ $expected[].alias ] | unique | length == 48)
                and ($q.aliases | sort_by(.alias)) == $expected
                and (if $mode == "promotion" then
                  ($q.promotionValidation | exact_keys(["workflowPath","runId","runAttempt"]))
                  and $q.promotionValidation.workflowPath == ".github/workflows/promote-stable-aliases.yml"
                  and $q.promotionValidation.runId == $current_run_id
                  and $q.promotionValidation.runAttempt == $current_run_attempt
                  and ($q.aliasSnapshots | type == "array" and length == 48)
                  and all($q.aliasSnapshots[];
                    exact_keys(["alias","sourceTag","sourceDigest","kind","currentDigest"])
                    and (.currentDigest == null or (.currentDigest | type == "string" and test("^sha256:[0-9a-f]{64}$"))))
                  and ([ $q.aliasSnapshots[] | {alias,sourceTag,sourceDigest,kind} ] | sort_by(.alias)) == $expected
                else true end))
            ' "${input}" >/dev/null
          }
          validate_stable_alias_mapping "${PLAN}" promotion
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          normalize_index_children() {
            jq -ce '
              if ((.mediaType == "application/vnd.oci.image.index.v1+json"
                    or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
                  and (.manifests | type == "array" and length == 3)
                  and all(.manifests[];
                    ((.mediaType == "application/vnd.oci.image.manifest.v1+json"
                      or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
                     and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                     and (.size | type == "number" and . > 0)
                     and .platform.os == "linux"
                     and (.platform.architecture | IN("amd64", "arm64", "riscv64"))
                     and ((.platform.variant // null) == null
                       or (.platform.architecture == "arm64" and .platform.variant == "v8"))))
                  and ([.manifests[].digest] | unique | length == 3)
                  and ([.manifests[].platform.architecture] | sort == ["amd64", "arm64", "riscv64"]))
              then [.manifests[] | {digest, os: .platform.os, architecture: .platform.architecture,
                variant: (.platform.variant // null), mediaType, size}] | sort_by(.os, .architecture, .digest)
              else error("qualified index descriptors are incomplete or duplicated")
              end
            '
          }
          while IFS=$'\t' read -r alias source_tag source_digest kind expected_current; do
            source_manifest="$(docker buildx imagetools inspect "${source_tag}" --format '{{json .Manifest}}')"
            source_current="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${source_manifest}")"
            [[ "${source_current}" == "${source_digest}" ]] || { echo "qualified immutable source drifted: ${source_tag}" >&2; exit 1; }
            if [[ "${kind}" == index ]]; then
              actual_children="$(normalize_index_children <<<"${source_manifest}")"
              expected_children_base64="$(jq -er --arg source_tag "${source_tag}" '
                [.manifests[] | select(.canonicalTag == $source_tag)] |
                if length == 1 then (.[0].children | map({digest, os, architecture, variant, mediaType, size}) |
                  sort_by(.os, .architecture, .digest) | @base64)
                else error("qualified index source is not unique") end
              ' "${PLAN}")"
              expected_children="$(base64 --decode <<<"${expected_children_base64}")"
              [[ "${actual_children}" == "${expected_children}" ]] || { echo "index children changed after qualification: ${source_tag}" >&2; exit 1; }
            fi
            error_file="${RUNNER_TEMP}/alias-promote-inspect.log"
            if manifest="$(docker buildx imagetools inspect "${alias}" --format '{{json .Manifest}}' 2>"${error_file}")"; then
              actual_current="$(jq -r '.digest' <<<"${manifest}")"
            elif grep -Eqi 'manifest unknown|404|not found' "${error_file}"; then
              actual_current=null
            else
              cat "${error_file}" >&2
              exit 1
            fi
            [[ "${actual_current}" == "${expected_current}" ]] || { echo "alias changed after validation: ${alias}" >&2; exit 1; }
            if [[ "${actual_current}" != "${source_digest}" ]]; then
              prefer_index=false; [[ "${kind}" == index ]] && prefer_index=true
              source_repository="${source_tag%:*}"
              [[ "${source_repository}" =~ ^ghcr\.io/oxibelt/[a-z0-9-]+$ ]]
              docker buildx imagetools create --prefer-index="${prefer_index}" --tag "${alias}" "${source_repository}@${source_digest}"
            fi
            promoted="$(docker buildx imagetools inspect "${alias}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "${promoted}" == "${source_digest}" ]] || { echo "alias readback mismatch: ${alias}" >&2; exit 1; }
          done < <(jq -r '.aliasSnapshots[] | [.alias, .sourceTag, .sourceDigest, .kind, (.currentDigest // "null")] | @tsv' "${PLAN}")
