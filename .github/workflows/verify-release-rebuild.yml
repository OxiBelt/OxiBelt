name: Independently verify release rebuilds

on:
  workflow_run:
    workflows: ["Release OxiBelt images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable, beta, or build tag to verify
        required: true
        type: string
      image_role:
        description: Image role to verify
        required: true
        type: choice
        options:
          - standalone
          - dataplane
          - dataplane-strict
          - controller
          - tools
          - keysigner
      artifact_arch:
        description: Architecture artifact to verify
        required: true
        type: choice
        options:
          - amd64v2
          - amd64
          - amd64v4
          - arm64
          - riscv64

permissions:
  actions: read
  attestations: read
  contents: read
  packages: read

env:
  OXIBELT_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  resolve:
    name: Resolve immutable rebuild matrix
    if: >-
      github.repository == 'OxiBelt/OxiBelt' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release'))
    runs-on: ubuntu-26.04
    outputs:
      automatic: ${{ steps.plan.outputs.automatic }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release_version: ${{ steps.plan.outputs.release_version }}
      release_ref: ${{ steps.plan.outputs.release_ref }}
      revision: ${{ steps.plan.outputs.revision }}
      verifier_sha: ${{ steps.plan.outputs.verifier_sha }}
      producer_run_id: ${{ steps.plan.outputs.producer_run_id }}
      producer_run_attempt: ${{ steps.plan.outputs.producer_run_attempt }}

    steps:
      - name: Checkout approved verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout independent release source as build inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.event.workflow_run.head_sha }}
          path: release
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Enable hash-pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
        working-directory: verifier

      - name: Install release-planning dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: verifier

      - name: Resolve tag and generate release plan
        id: plan
        working-directory: verifier
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ARCH: ${{ inputs.artifact_arch }}
          MANUAL_ROLE: ${{ inputs.image_role }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          APPROVED_VERIFIER_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          verifier_sha="$(git rev-parse HEAD)"
          if [[ ! "${verifier_sha}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "${verifier_sha}" != "${APPROVED_VERIFIER_SHA}" ]]; then
            echo "verifier checkout does not match the approved workflow revision" >&2
            exit 1
          fi

          revision="$(git -C ../release rev-parse HEAD)"
          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "checkout did not resolve to a full Git commit" >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${MANUAL_TAG}"
            automatic=false
            producer_run_id=0
            producer_run_attempt=0
          else
            automatic=true
            producer_run_id="${{ github.event.workflow_run.id }}"
            producer_run_attempt="${{ github.event.workflow_run.run_attempt }}"
            release_tag="${WORKFLOW_RUN_HEAD_BRANCH}"
            if [[ ! "${release_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
              mapfile -t matching_tags < <(
                git -C ../release tag --points-at "${revision}" |
                  grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' || true
              )
              if [[ "${#matching_tags[@]}" -ne 1 ]]; then
                echo "successful release run must resolve to exactly one stable or beta tag" >&2
                exit 1
              fi
              release_tag="${matching_tags[0]}"
            fi
          fi
          if [[ ! "${release_tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+|-build\.[0-9a-f]{8})?$ ]]; then
            echo "invalid release tag: ${release_tag}" >&2
            exit 1
          fi

          release_ref="refs/tags/${release_tag}"
          tag_revision="$(git -C ../release rev-parse "${release_ref}^{commit}")"
          if [[ "${tag_revision}" != "${revision}" ]]; then
            echo "${release_ref} resolves to ${tag_revision}, not checked-out ${revision}" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" != "workflow_dispatch" && "${revision}" != "${WORKFLOW_RUN_HEAD_SHA}" ]]; then
            echo "release workflow completed for ${WORKFLOW_RUN_HEAD_SHA}, not ${revision}" >&2
            exit 1
          fi

          if [[ "${release_tag}" == *-build.* ]]; then
            release_event="push"
            release_prerelease="false"
          elif [[ "${release_tag}" == *-beta.* ]]; then
            release_event="release"
            release_prerelease="true"
          else
            release_event="release"
            release_prerelease="false"
          fi

          plan="${RUNNER_TEMP}/independent-image-plan.json"
          OXIBELT_RELEASE_REF="${release_ref}" \
          OXIBELT_RELEASE_REVISION="${revision}" \
          OXIBELT_RELEASE_IS_PRERELEASE="${release_prerelease}" \
          OXIBELT_IMAGE_PLAN_OUTPUT="${plan}" \
          GITHUB_EVENT_NAME="${release_event}" \
            node --import tsx devops/sources/versioning.ts \
              --workspace-path ../release \
              --manifest-path Cargo.toml \
              --package-name oxibelt \
              --lockfile-path Cargo.lock \
              --ref "${release_ref}" \
              --revision "${revision}" \
              --event-name "${release_event}" \
              --release-prerelease "${release_prerelease}" \
              --image-plan-output "${plan}" \
              --release-publish

          selection='.'
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            # shellcheck disable=SC2016
            selection='select(.role == $role and .artifactArch == $arch)'
          fi
          matrix="$(jq -c \
            --arg role "${MANUAL_ROLE}" \
            --arg arch "${MANUAL_ARCH}" \
            --arg selection "${selection}" '
              def prefix:
                if .role == "standalone" then "oxibelt"
                elif .role == "dataplane" then "oxibelt-dataplane"
                elif .role == "dataplane-strict" then "oxibelt-dataplane-strict"
                elif .role == "controller" then "oxibelt-gateway-controller"
                elif .role == "tools" then "oxibelt-tools"
                elif .role == "keysigner" then "oxibelt-keysigner"
                else error("unsupported image role") end;
              def runner:
                if .artifactArch == "arm64" then "ubuntu-24.04-arm"
                elif .artifactArch == "amd64v2" or .artifactArch == "amd64" or
                     .artifactArch == "amd64v4" or .artifactArch == "riscv64"
                then "ubuntu-24.04"
                else error("unsupported image artifact architecture") end;
              {include: [.artifacts[] |
                if $selection == "." then . else select(.role == $role and .artifactArch == $arch) end |
                {role, artifact_arch: .artifactArch, image, canonical_tag: .canonicalGhcrTag,
                 platform, artifact_prefix: prefix, runner: runner}]}
            ' "${plan}")"
          expected_count=30
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            expected_count=1
          fi
          if [[ "$(jq '.include | length' <<<"${matrix}")" -ne "${expected_count}" ]]; then
            echo "independent rebuild matrix is incomplete" >&2
            exit 1
          fi
          {
            echo "automatic=${automatic}"
            echo "matrix=${matrix}"
            echo "release_version=${release_tag}"
            echo "release_ref=${release_ref}"
            echo "revision=${revision}"
            echo "verifier_sha=${verifier_sha}"
            echo "producer_run_id=${producer_run_id}"
            echo "producer_run_attempt=${producer_run_attempt}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload independently derived image plan
        if: steps.plan.outputs.automatic == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: independent-image-plan-${{ steps.plan.outputs.revision }}
          path: ${{ runner.temp }}/independent-image-plan.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Rebuild ${{ matrix.role }}/${{ matrix.artifact_arch }} independently
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - name: Checkout approved verifier at its immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.resolve.outputs.verifier_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Assert approved verifier revision
        env:
          APPROVED_VERIFIER_SHA: ${{ needs.resolve.outputs.verifier_sha }}
        run: |
          set -euo pipefail
          verifier_sha="$(git -C verifier rev-parse HEAD)"
          if [[ ! "${verifier_sha}" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "${verifier_sha}" != "${APPROVED_VERIFIER_SHA}" ]]; then
            echo "verifier checkout does not match the approved workflow revision" >&2
            exit 1
          fi

      - name: Start isolated rootless Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.7.2
          rootless: true
          set-host: true
          # Hosted runners do not delegate systemd cgroup scopes to rootless Docker.
          daemon-config: |
            {
              "exec-opts": ["native.cgroupdriver=cgroupfs"]
            }

      - name: Assert rootless Docker boundary
        run: |
          set -euo pipefail
          docker info --format '{{json .SecurityOptions}}' |
            jq -e '
              index("name=rootless") != null and
              index("name=cgroupns") != null and
              index("name=seccomp,profile=builtin") != null
            ' >/dev/null
          cgroup_driver="$(docker info --format '{{.CgroupDriver}}')"
          if [[ "${cgroup_driver}" != "none" ]]; then
            echo "rootless verifier must use no host cgroup resource controller, got ${cgroup_driver}" >&2
            exit 1
          fi

      - name: Pre-pull pinned BuildKit
        run: tests/scripts/retry-docker-pull.sh "${OXIBELT_BUILDKIT_IMAGE}"
        working-directory: verifier

      - name: Setup pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Setup pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false

      - name: Enable hash-pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install
        working-directory: verifier

      - name: Install verifier dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: verifier

      - name: Resolve immutable published digest
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.canonical_tag }}
        run: |
          set -euo pipefail
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          digest="$(docker buildx imagetools inspect "${TAG}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "canonical tag ${TAG} returned invalid digest ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Rebuild from fresh source and compare
        working-directory: verifier
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          OUTPUT: ${{ runner.temp }}/rebuild-receipt-${{ matrix.role }}-${{ matrix.artifact_arch }}.json
          PUBLISHED_DIGEST: ${{ steps.subject.outputs.digest }}
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          VERIFIER_SHA: ${{ needs.resolve.outputs.verifier_sha }}
          ROLE: ${{ matrix.role }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          tests/scripts/verify-release-rebuild.sh \
            --image "${IMAGE}" \
            --digest "${PUBLISHED_DIGEST}" \
            --revision "${RELEASE_REVISION}" \
            --release-ref "${RELEASE_REF}" \
            --verifier-sha "${VERIFIER_SHA}" \
            --role "${ROLE}" \
            --artifact-arch "${ARTIFACT_ARCH}" \
            --output "${OUTPUT}"

      - name: Upload independent rebuild receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: rebuild-receipt-${{ matrix.role }}-${{ matrix.artifact_arch }}
          path: ${{ runner.temp }}/rebuild-receipt-${{ matrix.role }}-${{ matrix.artifact_arch }}.json
          if-no-files-found: error
          retention-days: 30

  verify-helm-chart:
    name: Rebuild ${{ matrix.chart }} Helm OCI chart independently
    needs: resolve
    if: needs.resolve.outputs.automatic == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: oxibelt
            repository: ghcr.io/oxibelt/charts/oxibelt
          - chart: oxibelt-gateway-controller
            repository: ghcr.io/oxibelt/charts/oxibelt-gateway-controller

    steps:
      - name: Checkout approved verifier at its immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.resolve.outputs.verifier_sha }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout independent release source as chart inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.resolve.outputs.release_ref }}
          path: release
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup canonical Helm rebuild packager
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Enable hash-pinned pnpm and install verifier dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts
        working-directory: verifier

      - name: Install pinned ORAS acquisition client
        env:
          GOBIN: ${{ runner.temp }}/oras-bin
        run: |
          set -euo pipefail
          mkdir -m 0700 "${GOBIN}"
          go install oras.land/oras/cmd/oras@v1.3.3
          "${GOBIN}/oras" version | grep -E '(^|[[:space:]])1\.3\.3($|[[:space:]])'

      - name: Rebuild, authenticate, and compare exact chart bytes
        working-directory: verifier
        env:
          CHART: ${{ matrix.chart }}
          GH_TOKEN: ${{ github.token }}
          ORAS_BIN: ${{ runner.temp }}/oras-bin/oras
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          RELEASE_WORKSPACE: ${{ github.workspace }}/release
          REPOSITORY: ${{ matrix.repository }}
          VERIFIER_SHA: ${{ needs.resolve.outputs.verifier_sha }}
        run: |
          set -euo pipefail
          rebuilt="${RUNNER_TEMP}/rebuilt-helm-charts"
          work="${RUNNER_TEMP}/verify-${CHART}"
          mkdir -m 0700 "${rebuilt}" "${work}"
          node --import tsx devops/sources/helm_chart_release.ts prepare \
            --workspace-path "${RELEASE_WORKSPACE}" --ref "${RELEASE_REF}" --revision "${RELEASE_REVISION}" --output-directory "${rebuilt}"
          descriptor="${RUNNER_TEMP}/${CHART}-descriptor.json"
          "${ORAS_BIN}" manifest fetch --descriptor "${REPOSITORY}:${RELEASE_VERSION}" >"${descriptor}"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "${descriptor}")"
          attestations="${RUNNER_TEMP}/${CHART}-attestations.json"
          gh attestation verify "oci://${REPOSITORY}@${digest}" \
            --repo OxiBelt/OxiBelt \
            --signer-workflow OxiBelt/OxiBelt/.github/workflows/release.yml \
            --signer-digest "${RELEASE_REVISION}" \
            --source-digest "${RELEASE_REVISION}" \
            --source-ref "${RELEASE_REF}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://oxibelt.dev/attestations/helm-chart-rebuild/v3 \
            --limit 100 --format json >"${attestations}"
          predicate="${RUNNER_TEMP}/${CHART}-predicate.json"
          jq -c '
            [.. | objects |
              select(.predicateType? == "https://oxibelt.dev/attestations/helm-chart-rebuild/v3" and (.predicate? | type) == "object") |
              .predicate] | unique |
            if length == 1 then .[0] else error("expected one unique schema-v3 chart predicate") end
          ' "${attestations}" >"${predicate}"
          node --import tsx devops/sources/helm_chart_oci_release.ts validate-predicate --input "${predicate}"
          jq -e --arg ref "${RELEASE_REF}" --arg revision "${RELEASE_REVISION}" --arg version "${RELEASE_VERSION}" '
            .schemaVersion == 3
            and .predicateType == "https://oxibelt.dev/attestations/helm-chart-rebuild/v3"
            and .receipt.source == {ref: $ref, revision: $revision, commitEpoch: .receipt.source.commitEpoch, releaseVersion: $version}
            and .comparison.exactPackageBytes == true
            and .comparison.deterministicPackager == "v4.2.4"
          ' "${predicate}" >/dev/null
          ORAS_BIN="${ORAS_BIN}" HELM_CHART_RELEASE_HELPER="$(pwd)/devops/sources/helm_chart_release.ts" \
            tests/scripts/verify-release-helm-chart.sh \
              --mode rebuild --repository "${REPOSITORY}" --digest "${digest}" \
              --version "${RELEASE_VERSION}" --chart-name "${CHART}" \
              --expected-archive "${rebuilt}/${CHART}-${RELEASE_VERSION}.tgz" \
              --work-directory "${work}" --workspace-path "${RELEASE_WORKSPACE}" \
              --release-ref "${RELEASE_REF}" --revision "${RELEASE_REVISION}"
          archive_sha="$(sha256sum "${rebuilt}/${CHART}-${RELEASE_VERSION}.tgz" | awk '{print $1}')"
          predicate_sha="$(sha256sum "${predicate}" | awk '{print $1}')"
          jq -S -n \
            --arg chart "${CHART}" --arg repository "${REPOSITORY}" --arg digest "${digest}" \
            --arg archive_sha256 "${archive_sha}" --arg predicate_sha256 "${predicate_sha}" \
            --arg ref "${RELEASE_REF}" --arg revision "${RELEASE_REVISION}" \
            --arg workflow_sha "${VERIFIER_SHA}" --argjson run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" '
            {schemaVersion: 1, outcome: "exact", chart: $chart,
             subject: {repository: $repository, digest: $digest}, archiveSha256: $archive_sha256,
             predicate: {schemaVersion: 3, sha256: $predicate_sha256,
               type: "https://oxibelt.dev/attestations/helm-chart-rebuild/v3"},
             source: {repository: "OxiBelt/OxiBelt", ref: $ref, revision: $revision},
             workflow: {repository: "OxiBelt/OxiBelt", path: ".github/workflows/verify-release-rebuild.yml",
               sha: $workflow_sha, runId: $run_id, runAttempt: $run_attempt}}' \
            >"${RUNNER_TEMP}/helm-rebuild-receipt-${CHART}.json"

      - name: Upload independent chart rebuild receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: helm-rebuild-receipt-${{ matrix.chart }}
          path: ${{ runner.temp }}/helm-rebuild-receipt-${{ matrix.chart }}.json
          if-no-files-found: error
          retention-days: 30

  release-qualification:
    name: Seal release qualification
    needs:
      - resolve
      - verify
      - verify-helm-chart
    if: needs.resolve.outputs.automatic == 'true'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Download independently derived image plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: independent-image-plan-${{ needs.resolve.outputs.revision }}
          path: ${{ runner.temp }}/independent-release-metadata

      - name: Download exact producer release contract for stable qualification
        if: ${{ !contains(needs.resolve.outputs.release_version, '-beta.') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: release-contract-${{ needs.resolve.outputs.revision }}
          path: ${{ runner.temp }}/producer-release-contract
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve.outputs.producer_run_id }}

      - name: Authenticate immutable producer, tag, and release identity
        id: identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OUTPUT: ${{ runner.temp }}/release-identity.json
          PRODUCER_RUN_ATTEMPT: ${{ needs.resolve.outputs.producer_run_attempt }}
          PRODUCER_RUN_ID: ${{ needs.resolve.outputs.producer_run_id }}
          RELEASE_CONTRACT: ${{ runner.temp }}/producer-release-contract/release-contract.json
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        with:
          script: |
            const fs = require('fs')
            const version = process.env.RELEASE_VERSION
            const revision = process.env.RELEASE_REVISION
            const runId = Number(process.env.PRODUCER_RUN_ID)
            const runAttempt = Number(process.env.PRODUCER_RUN_ATTEMPT)
            const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version ?? '')
            const beta = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.([1-9][0-9]*)$/.test(version ?? '')
            if (`${context.repo.owner}/${context.repo.repo}` !== 'OxiBelt/OxiBelt' || (!stable && !beta) ||
                !/^[0-9a-f]{40}$/.test(revision ?? '') || !Number.isSafeInteger(runId) || runId < 1 ||
                !Number.isSafeInteger(runAttempt) || runAttempt < 1) {
              core.setFailed('stable qualification source identity is malformed')
              return
            }
            const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId})).data
            if (run.path !== '.github/workflows/release.yml' || run.event !== 'release' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.run_attempt !== runAttempt ||
                run.head_sha !== revision || run.head_branch !== version ||
                run.repository?.full_name !== 'OxiBelt/OxiBelt' || run.head_repository?.full_name !== 'OxiBelt/OxiBelt') {
              core.setFailed('producer workflow identity or conclusion does not match the stable release')
              return
            }
            const ref = (await github.rest.git.getRef({...context.repo, ref: `tags/${version}`})).data
            if (ref.ref !== `refs/tags/${version}` || ref.object.type !== 'tag' || !/^[0-9a-f]{40}$/.test(ref.object.sha)) {
              core.setFailed('stable release must use one immutable annotated tag object')
              return
            }
            const tag = (await github.rest.git.getTag({...context.repo, tag_sha: ref.object.sha})).data
            if (tag.tag !== version || tag.object.type !== 'commit' || tag.object.sha !== revision) {
              core.setFailed('stable annotated tag does not resolve to the producer commit')
              return
            }
            const release = (await github.rest.repos.getReleaseByTag({...context.repo, tag: version})).data
            const latest = stable ? (await github.rest.repos.getLatestRelease(context.repo)).data : null
            if ((stable && release.id !== latest.id) || release.tag_name !== version || release.draft || release.prerelease !== beta ||
                release.target_commitish !== revision || release.published_at === null) {
              core.setFailed('release is draft, stale, has the wrong channel, or is not bound to the exact commit')
              return
            }
            let betaQualification = null
            if (stable) {
              const contractStat = fs.lstatSync(process.env.RELEASE_CONTRACT)
              if (!contractStat.isFile() || contractStat.isSymbolicLink() || contractStat.size < 1 || contractStat.size > 262144) {
                throw new Error('stable producer release contract is not one bounded regular file')
              }
              const contract = JSON.parse(fs.readFileSync(process.env.RELEASE_CONTRACT, 'utf8'))
              const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              const betaPattern = new RegExp(`^${escaped}-beta\\.([1-9][0-9]*)$`)
              const betaSources = contract.supportedUpgradeSources?.filter((source) => betaPattern.test(source)) ?? []
              if (contract.schemaVersion !== 1 || contract.kind !== 'stable' || contract.version !== version ||
                  contract.ref !== `refs/tags/${version}` || contract.revision !== revision || betaSources.length !== 1) {
                throw new Error('stable release contract must bind exactly one same-target beta source')
              }
              const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100})
              const validBetas = releases.filter((candidate) => !candidate.draft && candidate.prerelease &&
                candidate.published_at !== null && betaPattern.test(candidate.tag_name))
              validBetas.sort((left, right) => Number(betaPattern.exec(right.tag_name)[1]) - Number(betaPattern.exec(left.tag_name)[1]))
              const betaRelease = validBetas[0]
              if (!betaRelease || betaRelease.tag_name !== betaSources[0]) {
                throw new Error('release contract beta source is not the latest valid published beta')
              }
              const betaRef = (await github.rest.git.getRef({...context.repo, ref: `tags/${betaRelease.tag_name}`})).data
              if (betaRef.object.type !== 'tag' || !/^[0-9a-f]{40}$/.test(betaRef.object.sha)) {
                throw new Error('qualified beta must use an annotated tag')
              }
              const betaTag = (await github.rest.git.getTag({...context.repo, tag_sha: betaRef.object.sha})).data
              if (betaTag.tag !== betaRelease.tag_name || betaTag.object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(betaTag.object.sha)) {
                throw new Error('qualified beta tag object is invalid')
              }
              const comparison = (await github.rest.repos.compareCommits({...context.repo, base: betaTag.object.sha, head: revision})).data
              const changed = (comparison.files ?? []).map((file) => file.filename).sort()
              if (comparison.ahead_by !== 1 || comparison.behind_by !== 0 || comparison.commits.length !== 1 ||
                  changed.join(',') !== ['CHANGELOG.md', 'docs/Upgrading.md'].sort().join(',')) {
                throw new Error('stable release must be the single approved documentation-only commit after its beta source')
              }
              const verifierRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo, workflow_id: '.github/workflows/verify-release-rebuild.yml', event: 'workflow_run', status: 'success', per_page: 100,
              })
              const candidates = []
              for (const candidate of verifierRuns) {
                if (candidate.path !== '.github/workflows/verify-release-rebuild.yml' || candidate.event !== 'workflow_run' ||
                    candidate.status !== 'completed' || candidate.conclusion !== 'success' || !Number.isInteger(candidate.run_attempt)) continue
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: candidate.id, per_page: 100})
                const matching = artifacts.filter((artifact) => !artifact.expired && artifact.name === `release-qualification-${betaTag.object.sha}`)
                if (matching.length === 1) candidates.push({run: candidate, artifact: matching[0]})
              }
              candidates.sort((left, right) => right.run.id - left.run.id)
              if (candidates.length < 1) throw new Error('latest beta has no successful automatic full qualification aggregate')
              const accepted = candidates[0]
              const soakStart = Math.max(Date.parse(betaRelease.published_at), Date.parse(accepted.run.updated_at))
              const requiredStableQualificationDelayMs = version === '0.8.1' && betaRelease.tag_name === '0.8.1-beta.9'
                ? 0
                : 24 * 60 * 60 * 1000
              const stablePublicationDelayMs = Date.parse(release.published_at) - soakStart
              if (!Number.isFinite(soakStart) || !Number.isFinite(stablePublicationDelayMs) ||
                  stablePublicationDelayMs < requiredStableQualificationDelayMs) {
                throw new Error('stable publication occurred before the beta qualification completed its required delay')
              }
              betaQualification = {version: betaRelease.tag_name, ref: `refs/tags/${betaRelease.tag_name}`,
                tagObjectSha: betaRef.object.sha, commit: betaTag.object.sha, releaseId: betaRelease.id,
                publishedAt: betaRelease.published_at, verifierRunId: accepted.run.id,
                verifierRunAttempt: accepted.run.run_attempt, verifierWorkflowSha: accepted.run.head_sha,
                verifierCompletedAt: accepted.run.updated_at,
                artifactId: accepted.artifact.id, artifactName: accepted.artifact.name}
              core.setOutput('beta_run_id', String(accepted.run.id))
              core.setOutput('beta_revision', betaTag.object.sha)
            }
            const identity = {schemaVersion: 3, repository: 'OxiBelt/OxiBelt', releaseKind: stable ? 'stable' : 'beta', version,
              ref: `refs/tags/${version}`, tagObjectSha: ref.object.sha, commit: revision, releaseId: release.id,
              publishedAt: release.published_at, producer: {workflowPath: '.github/workflows/release.yml',
                runId, runAttempt, event: 'release', headSha: revision, conclusion: 'success'},
              ...(betaQualification === null ? {} : {betaQualification})}
            fs.writeFileSync(process.env.OUTPUT, `${JSON.stringify(identity)}\n`, {encoding: 'utf8', flag: 'wx', mode: 0o600})

      - name: Download exact beta qualification aggregate for stable soak binding
        if: ${{ !contains(needs.resolve.outputs.release_version, '-beta.') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: release-qualification-${{ steps.identity.outputs.beta_revision }}
          path: ${{ runner.temp }}/beta-release-qualification
          github-token: ${{ github.token }}
          run-id: ${{ steps.identity.outputs.beta_run_id }}

      - name: Bind stable identity to exact beta aggregate bytes
        if: ${{ !contains(needs.resolve.outputs.release_version, '-beta.') }}
        env:
          BETA_QUALIFICATION: ${{ runner.temp }}/beta-release-qualification/release-qualification.json
          IDENTITY: ${{ runner.temp }}/release-identity.json
        run: |
          set -euo pipefail
          jq -e --slurpfile identity "${IDENTITY}" '
            .schemaVersion == 3 and .kind == "release-qualification" and .releaseKind == "beta"
            and .version == $identity[0].betaQualification.version
            and .ref == $identity[0].betaQualification.ref
            and .tagObjectSha == $identity[0].betaQualification.tagObjectSha
            and .commit == $identity[0].betaQualification.commit
            and .releaseId == $identity[0].betaQualification.releaseId
            and .publishedAt == $identity[0].betaQualification.publishedAt
            and .verifier.runId == $identity[0].betaQualification.verifierRunId
            and .verifier.runAttempt == $identity[0].betaQualification.verifierRunAttempt
            and .verifier.workflowSha == $identity[0].betaQualification.verifierWorkflowSha
            and .verifier.event == "workflow_run" and .verifier.conclusion == "success"
            and (.receipts.images | length) == 30 and (.receipts.charts | length) == 2
          ' "${BETA_QUALIFICATION}" >/dev/null
          aggregate_sha256="$(sha256sum "${BETA_QUALIFICATION}" | awk '{print $1}')"
          jq -S --arg aggregate_sha256 "${aggregate_sha256}" '.betaQualification.aggregateSha256 = $aggregate_sha256' "${IDENTITY}" >"${IDENTITY}.next"
          mv "${IDENTITY}.next" "${IDENTITY}"

      - name: Download exactly 30 image receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: rebuild-receipt-*
          path: ${{ runner.temp }}/image-receipts
          merge-multiple: true

      - name: Download exactly two chart receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: helm-rebuild-receipt-*
          path: ${{ runner.temp }}/chart-receipts
          merge-multiple: true

      - name: Start isolated rootless Docker for registry readback
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          version: v29.7.2
          rootless: true
          set-host: true
          daemon-config: |
            {"exec-opts": ["native.cgroupdriver=cgroupfs"]}

      - name: Setup pinned Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Validate receipt inventory and snapshot immutable subjects
        env:
          CHART_RECEIPTS: ${{ runner.temp }}/chart-receipts
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ runner.temp }}/release-identity.json
          INDEPENDENT_IMAGE_PLAN: ${{ runner.temp }}/independent-release-metadata/independent-image-plan.json
          IMAGE_RECEIPTS: ${{ runner.temp }}/image-receipts
          OUTPUT: ${{ runner.temp }}/release-qualification.json
          RELEASE_REF: ${{ needs.resolve.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.revision }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
          VERIFIER_SHA: ${{ needs.resolve.outputs.verifier_sha }}
        run: |
          set -euo pipefail
          if [[ ! -f "${INDEPENDENT_IMAGE_PLAN}" || -L "${INDEPENDENT_IMAGE_PLAN}" ]]; then
            echo "independent image plan must be one regular non-symlink file" >&2
            exit 1
          fi
          plan_size="$(stat -c %s "${INDEPENDENT_IMAGE_PLAN}")"
          if [[ ! "${plan_size}" =~ ^[0-9]+$ ]] || (( plan_size < 1 || plan_size > 4 * 1024 * 1024 )); then
            echo "independent image plan has an invalid size" >&2
            exit 1
          fi
          expected_kind=stable
          [[ "${RELEASE_VERSION}" == *-beta.* ]] && expected_kind=beta
          release_major="${RELEASE_VERSION%%.*}"
          jq -e --arg version "${RELEASE_VERSION}" --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" --arg expected_kind "${expected_kind}" --arg major "${release_major}" '
            def role_image:
              if . == "standalone" then "ghcr.io/oxibelt/oxibelt"
              elif . == "dataplane" then "ghcr.io/oxibelt/oxibelt-dataplane"
              elif . == "dataplane-strict" then "ghcr.io/oxibelt/oxibelt-dataplane-strict"
              elif . == "controller" then "ghcr.io/oxibelt/oxibelt-gateway-controller"
              elif . == "tools" then "ghcr.io/oxibelt/oxibelt-tools"
              elif . == "keysigner" then "ghcr.io/oxibelt/oxibelt-keysigner"
              else error("unsupported image role") end;
            .schemaVersion == 8 and .tag == $version and .version == $version
            and .revision == $revision and .sourceRef == $ref and .kind == $expected_kind
            and (.roles | type == "array" and length == 6)
            and ([.roles[].role] | sort == ["controller","dataplane","dataplane-strict","keysigner","standalone","tools"])
            and all(.roles[]; .image == (.role | role_image))
            and (.artifacts | type == "array" and length == 30)
            and ([.artifacts[] | (.role + "/" + .artifactArch)] | unique | length == 30)
            and all(.artifacts[];
              (.artifactArch | IN("amd64v2","amd64","amd64v4","arm64","riscv64"))
              and .image == (.role | role_image)
              and .canonicalGhcrTag == (.image + ":" + $version + "-alpine-musl-" + .artifactArch)
              and .aliasGhcrTags == (if $expected_kind == "stable" then [(.image + ":" + $major + "-alpine-musl-" + .artifactArch)] else [] end))
            and (.manifests | type == "array" and length == 12)
            and ([.manifests[] | (.role + "/" + .name)] | unique | length == 12)
            and all(.manifests[];
              (.name | IN("release","alpine-musl"))
              and .image == (.role | role_image)
              and .canonicalGhcrTag == (if .name == "release" then (.image + ":" + $version) else (.image + ":" + $version + "-alpine-musl") end)
              and .aliasGhcrTags ==
                (if $expected_kind == "beta" then []
                 elif .name == "release" then [(.image + ":latest")]
                 else [(.image + ":" + $major + "-alpine-musl"), (.image + ":alpine-musl")] end))
          ' "${INDEPENDENT_IMAGE_PLAN}" >/dev/null
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mapfile -d '' image_files < <(find "${IMAGE_RECEIPTS}" -maxdepth 1 -type f -name 'rebuild-receipt-*.json' -print0)
          mapfile -d '' chart_files < <(find "${CHART_RECEIPTS}" -maxdepth 1 -type f -name 'helm-rebuild-receipt-*.json' -print0)
          [[ "${#image_files[@]}" -eq 30 && "${#chart_files[@]}" -eq 2 ]]
          images_json='[]'
          aliases_json='[]'
          for receipt in "${image_files[@]}"; do
            jq -e --arg ref "${RELEASE_REF}" --arg revision "${RELEASE_REVISION}" --arg sha "${VERIFIER_SHA}" \
              --argjson run_id "${GITHUB_RUN_ID}" --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" '
              .schemaVersion == 1 and (.outcome == "exact" or .outcome == "normalized_equivalent")
              and .source == {repository: "OxiBelt/OxiBelt", ref: $ref, revision: $revision}
              and .workflow == {repository: "OxiBelt/OxiBelt", path: ".github/workflows/verify-release-rebuild.yml",
                sha: $sha, runId: $run_id, runAttempt: $run_attempt}
              and (.build.role | IN("standalone", "dataplane", "dataplane-strict", "controller", "tools", "keysigner"))
              and (.build.artifactArch | IN("amd64v2", "amd64", "amd64v4", "arm64", "riscv64"))
              and (.published.imageDigest | test("^sha256:[0-9a-f]{64}$"))' "${receipt}" >/dev/null
            role="$(jq -r '.build.role' "${receipt}")"; arch="$(jq -r '.build.artifactArch' "${receipt}")"
            case "${role}" in standalone) image=ghcr.io/oxibelt/oxibelt;; dataplane) image=ghcr.io/oxibelt/oxibelt-dataplane;; dataplane-strict) image=ghcr.io/oxibelt/oxibelt-dataplane-strict;; controller) image=ghcr.io/oxibelt/oxibelt-gateway-controller;; tools) image=ghcr.io/oxibelt/oxibelt-tools;; keysigner) image=ghcr.io/oxibelt/oxibelt-keysigner;; esac
            digest="$(jq -r '.published.imageDigest' "${receipt}")"; receipt_sha="$(sha256sum "${receipt}" | awk '{print $1}')"
            platform="$(jq -er --arg role "${role}" --arg arch "${arch}" '
              [.artifacts[] | select(.role == $role and .artifactArch == $arch)] |
              if length == 1 then .[0].platform else error("release plan artifact identity is not unique") end
            ' "${INDEPENDENT_IMAGE_PLAN}")"
            case "${arch}:${platform}" in
              amd64v2:linux/amd64|amd64:linux/amd64|amd64v4:linux/amd64|arm64:linux/arm64|riscv64:linux/riscv64) ;;
              *) echo "release plan artifact platform does not match ${arch}: ${platform}" >&2; exit 1 ;;
            esac
            platform_os="${platform%%/*}"; platform_architecture="${platform#*/}"
            canonical="${image}:${RELEASE_VERSION}-alpine-musl-${arch}"
            resolved="$(docker buildx imagetools inspect "${canonical}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "${resolved}" == "${digest}" ]]
            images_json="$(jq -c --arg role "${role}" --arg arch "${arch}" --arg image "${image}" --arg canonical "${canonical}" --arg digest "${digest}" --arg receipt_sha "${receipt_sha}" --arg os "${platform_os}" --arg architecture "${platform_architecture}" '. + [{role: $role, artifactArch: $arch, image: $image, canonicalTag: $canonical, digest: $digest, receiptSha256: $receipt_sha, os: $os, architecture: $architecture}]' <<<"${images_json}")"
            while read -r alias; do
              [[ -n "${alias}" ]] || continue
              aliases_json="$(jq -c --arg alias "${alias}" --arg source "${canonical}" --arg digest "${digest}" '. + [{alias: $alias, sourceTag: $source, sourceDigest: $digest, kind: "platform"}]' <<<"${aliases_json}")"
            done < <(jq -r --arg role "${role}" --arg arch "${arch}" '.artifacts[] | select(.role == $role and .artifactArch == $arch) | .aliasGhcrTags[]' "${INDEPENDENT_IMAGE_PLAN}")
          done
          [[ "$(jq '[.[] | (.role + "/" + .artifactArch)] | unique | length' <<<"${images_json}")" -eq 30 ]]
          charts_json='[]'
          for receipt in "${chart_files[@]}"; do
            jq -e --arg ref "${RELEASE_REF}" --arg revision "${RELEASE_REVISION}" --arg sha "${VERIFIER_SHA}" --argjson run_id "${GITHUB_RUN_ID}" --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" '
              .schemaVersion == 1 and .outcome == "exact" and (.chart | IN("oxibelt", "oxibelt-gateway-controller"))
              and .source == {repository: "OxiBelt/OxiBelt", ref: $ref, revision: $revision}
              and .workflow == {repository: "OxiBelt/OxiBelt", path: ".github/workflows/verify-release-rebuild.yml", sha: $sha, runId: $run_id, runAttempt: $run_attempt}
              and .predicate.schemaVersion == 3 and .predicate.type == "https://oxibelt.dev/attestations/helm-chart-rebuild/v3"
              and (.subject.digest | test("^sha256:[0-9a-f]{64}$"))' "${receipt}" >/dev/null
            receipt_sha="$(sha256sum "${receipt}" | awk '{print $1}')"
            receipt_json="$(jq -c . "${receipt}")"
            charts_json="$(jq -cn --argjson current "${charts_json}" --argjson receipt "${receipt_json}" --arg receipt_sha "${receipt_sha}" '$current + [$receipt + {receiptSha256: $receipt_sha}]')"
          done
          [[ "$(jq '[.[].chart] | unique | length' <<<"${charts_json}")" -eq 2 ]]
          normalize_index_children() {
            jq -ce '
              if ((.mediaType == "application/vnd.oci.image.index.v1+json"
                    or .mediaType == "application/vnd.docker.distribution.manifest.list.v2+json")
                  and (.manifests | type == "array" and length == 3)
                  and all(.manifests[];
                    ((.mediaType == "application/vnd.oci.image.manifest.v1+json"
                      or .mediaType == "application/vnd.docker.distribution.manifest.v2+json")
                     and (.digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
                     and (.size | type == "number" and . > 0)
                     and .platform.os == "linux"
                     and (.platform.architecture | IN("amd64", "arm64", "riscv64"))
                     and ((.platform.variant // null) == null
                       or (.platform.architecture == "arm64" and .platform.variant == "v8"))))
                  and ([.manifests[].digest] | unique | length == 3)
                  and ([.manifests[].platform.architecture] | sort == ["amd64", "arm64", "riscv64"]))
              then [.manifests[] | {digest, os: .platform.os, architecture: .platform.architecture,
                variant: (.platform.variant // null), mediaType, size}] | sort_by(.os, .architecture, .digest)
              else error("qualified index descriptors are incomplete or duplicated")
              end
            '
          }
          manifests_json='[]'
          for image in ghcr.io/oxibelt/oxibelt ghcr.io/oxibelt/oxibelt-dataplane ghcr.io/oxibelt/oxibelt-dataplane-strict ghcr.io/oxibelt/oxibelt-gateway-controller ghcr.io/oxibelt/oxibelt-tools ghcr.io/oxibelt/oxibelt-keysigner; do
            role="$(jq -er --arg image "${image}" '
              [.roles[] | select(.image == $image)] |
              if length == 1 then .[0].role else error("release plan role identity is not unique") end
            ' "${INDEPENDENT_IMAGE_PLAN}")"
            expected_children="$(jq -ce --arg role "${role}" '
              [.[] | select(.role == $role and (.artifactArch | IN("amd64", "arm64", "riscv64"))) |
                {artifactArch, digest, os, architecture}] | sort_by(.os, .architecture, .digest)
            ' <<<"${images_json}")"
            [[ "$(jq 'length' <<<"${expected_children}")" -eq 3 ]]
            release_tag="${image}:${RELEASE_VERSION}"
            alpine_tag="${image}:${RELEASE_VERSION}-alpine-musl"
            for index_name in release alpine; do
              if [[ "${index_name}" == release ]]; then index_tag="${release_tag}"; else index_tag="${alpine_tag}"; fi
              index_manifest="$(docker buildx imagetools inspect "${index_tag}" --format '{{json .Manifest}}')"
              index_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"${index_manifest}")"
              actual_children="$(normalize_index_children <<<"${index_manifest}")"
              actual_identity="$(jq -c '[.[] | {digest, os, architecture}]' <<<"${actual_children}")"
              expected_identity="$(jq -c '[.[] | {digest, os, architecture}]' <<<"${expected_children}")"
              if [[ "${actual_identity}" != "${expected_identity}" ]]; then
                echo "qualified index children did not match independent platform receipts: ${index_tag}" >&2
                exit 1
              fi
              qualified_children="$(jq -cn --argjson expected "${expected_children}" --argjson actual "${actual_children}" '
                [range(0; ($expected | length)) as $index | $expected[$index] + {
                  variant: $actual[$index].variant, mediaType: $actual[$index].mediaType, size: $actual[$index].size
                }]
              ')"
              manifests_json="$(jq -c --arg role "${role}" --arg image "${image}" --arg canonical_tag "${index_tag}" --arg digest "${index_digest}" --argjson children "${qualified_children}" '. + [{role: $role, image: $image, canonicalTag: $canonical_tag, digest: $digest, children: $children}]' <<<"${manifests_json}")"
              if [[ "${index_name}" == release ]]; then
                release_digest="${index_digest}"; release_children="${qualified_children}"
              else
                alpine_digest="${index_digest}"; alpine_children="${qualified_children}"
              fi
            done
            if [[ "${release_digest}" != "${alpine_digest}" || "${release_children}" != "${alpine_children}" ]]; then
              echo "qualified index tags for one role must resolve to one digest and child set: ${image}" >&2
              exit 1
            fi
            while IFS=$'\t' read -r source digest alias; do
              [[ -n "${alias}" ]] || continue
              aliases_json="$(jq -c --arg alias "${alias}" --arg source "${source}" --arg digest "${digest}" '. + [{alias: $alias, sourceTag: $source, sourceDigest: $digest, kind: "index"}]' <<<"${aliases_json}")"
            done < <(jq -r --arg release_tag "${release_tag}" --arg release_digest "${release_digest}" --arg alpine_tag "${alpine_tag}" --arg alpine_digest "${alpine_digest}" '
              .manifests[] | select(.canonicalGhcrTag == $release_tag or .canonicalGhcrTag == $alpine_tag) |
              [.canonicalGhcrTag, (if .canonicalGhcrTag == $release_tag then $release_digest else $alpine_digest end), .aliasGhcrTags[]] | @tsv
            ' "${INDEPENDENT_IMAGE_PLAN}")
          done
          jq -e '
            length == 12 and ([.[].canonicalTag] | unique | length == 12)
            and all(.[]; (.children | length == 3)
              and ([.children[].artifactArch] | sort == ["amd64", "arm64", "riscv64"])
              and ([.children[].digest] | unique | length == 3))
          ' <<<"${manifests_json}" >/dev/null
          jq -S -n --slurpfile identity "${IDENTITY}" --arg verifier_sha "${VERIFIER_SHA}" --argjson verifier_run_id "${GITHUB_RUN_ID}" --argjson verifier_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --argjson images "${images_json}" --argjson charts "${charts_json}" --argjson manifests "${manifests_json}" --argjson aliases "${aliases_json}" '
            $identity[0] + {kind: "release-qualification", verifier: {workflowPath: ".github/workflows/verify-release-rebuild.yml", workflowSha: $verifier_sha,
              runId: $verifier_run_id, runAttempt: $verifier_run_attempt, event: "workflow_run", conclusion: "success"},
              receipts: {images: ($images | sort_by(.role, .artifactArch)), charts: ($charts | sort_by(.chart))},
              manifests: ($manifests | sort_by(.image)), aliases: ($aliases | sort_by(.alias))}' >"${OUTPUT}"
          jq -e '.schemaVersion == 3 and .kind == "release-qualification" and (.releaseKind == "stable" or .releaseKind == "beta") and (.receipts.images | length) == 30 and (.receipts.charts | length) == 2 and (.manifests | length) == 12 and (.manifests | all(.children | length == 3)) and (if .releaseKind == "stable" then (.aliases | length) == 48 else .aliases == [] end)' "${OUTPUT}" >/dev/null

      - name: Upload sealed release qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: release-qualification-${{ needs.resolve.outputs.revision }}
          path: ${{ runner.temp }}/release-qualification.json
          if-no-files-found: error
          retention-days: 30
