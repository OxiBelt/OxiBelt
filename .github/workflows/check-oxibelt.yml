name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Docker performance profile to run after integration checks
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - benchmark
          - soak
      performance_iterations:
        description: Docker performance iterations per runner shard
        required: false
        default: "5"
        type: string
      performance_h2_profile:
        description: Record host perf evidence for the x86-64-v3 oxibelt-h2 smoke row
        required: false
        default: false
        type: boolean
      performance_profile_label:
        description: Record host perf evidence for one exact reverse-proxy load label
        required: false
        default: none
        type: choice
        options:
          - none
          - oxibelt-h1-keepalive
          - oxibelt-h2
          - oxibelt-h3
      performance_accepted_regression_reason:
        description: Accept current Docker performance regression gates and publish a new comparison baseline
        required: false
        default: ""
        type: string
      aggressive_long_run:
        description: Run the scheduled aggressive long-run job after Docker performance
        required: false
        default: false
        type: boolean
      aggressive_long_run_seconds:
        description: Aggressive long-run steady soak duration in seconds
        required: false
        default: "18000"
        type: string
      aggressive_long_run_concurrency:
        description: Aggressive long-run load concurrency
        required: false
        default: "256"
        type: string
      submit_dependency_snapshots:
        description: Submit Docker image dependency snapshots during manual runs
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  # Keep this job independent. If test jobs need it, a PR can intentionally
  # fail structure checks and cause branch-protected test jobs to be skipped.
  source-structure:
    name: Source structure checks
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Rust module size
        run: tests/scripts/check-rust-module-size.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Rust module dependency boundaries
        run: cargo test -p oxibelt --test module_decomposition_contract --locked

      - name: Data-plane Cargo package boundary
        run: bash tests/scripts/check-cargo-package-boundaries.sh

      - name: Native configuration schema drift
        run: bash tests/scripts/check-native-config-schema.sh

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate

      - name: Person proof UI asset uses pinned dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const exactVersion = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          const checkedFields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'overrides'];
          const invalid = [];

          const checkValue = (file, path, value) => {
            if (typeof value === 'string') {
              if (!exactVersion.test(value)) {
                invalid.push(`${file}:${path}=${value}`);
              }
              return;
            }

            if (value && typeof value === 'object' && !Array.isArray(value)) {
              for (const [key, nested] of Object.entries(value)) {
                checkValue(file, `${path}.${key}`, nested);
              }
            }
          };

          const file = 'ui/person-proof/package.json';
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          for (const field of checkedFields) {
            checkValue(file, field, manifest[field]);
          }

          if (invalid.length > 0) {
            console.error(`Person proof UI dependencies must use exact versions:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @oxibelt/person-proof-ui build
          pnpm --filter @oxibelt/person-proof-ui check:openapi
          git diff --exit-code source/assets/person-proof-challenge.html

  test:
    name: Test (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.97.0
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - parallel:
          - name: Cargo fmt
            run: cargo fmt --check

          - name: Tests rustfmt
            run: tests/scripts/check-tests-rustfmt.sh

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

      - name: Loom concurrency models
        if: matrix.runner == 'ubuntu-26.04'
        run: cargo test --all-features --locked loom_ -- --ignored --test-threads=1

  rust-advisory-checks:
    name: Rust advisory checks
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install Rust advisory tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny advisories
        run: cargo deny check advisories

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.fuzz_target }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz_target:
          - turn_protocol
          - tls_client_hello
          - http_semantics
          - http3_webtransport
          - websocket_frame
          - webrtc_turn
          - syscall_boundaries
          - native_config
          - oxirule_expression
          - admin_json_mutations
          - admin_mutation_envelope
          - cluster_rollout_state
          - http_body_coding
          - cache_metadata_key
          - gateway_api_translation
          - tls_certificate_metadata

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install nightly-2026-07-16 --profile minimal

      - name: Install pinned cargo-fuzz
        run: |
          cargo +nightly-2026-07-16 install cargo-fuzz --version 0.13.2 --locked
          test "$(cargo +nightly-2026-07-16 fuzz --version)" = "cargo-fuzz 0.13.2"

      - name: Run fuzz smoke (${{ matrix.fuzz_target }})
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        run: tests/scripts/run-fuzz-target.sh smoke ${{ matrix.fuzz_target }}

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-${{ matrix.fuzz_target }}-fuzz-artifacts
          path: ${{ runner.temp }}/oxibelt-fuzz-artifacts/${{ matrix.fuzz_target }}
          if-no-files-found: ignore
          retention-days: 90

  unsafe-validation:
    name: Unsafe validation (${{ matrix.check }})
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        check:
          - miri
          - address
          - thread

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install pinned nightly Rust
        run: |
          rustup toolchain install nightly-2026-07-16 --profile minimal --component rust-src
          if [[ "${{ matrix.check }}" == "miri" ]]; then
            rustup component add miri --toolchain nightly-2026-07-16
          fi

      - name: Run Miri contracts
        if: matrix.check == 'miri'
        run: cargo +nightly-2026-07-16 miri test -p oxibelt-unsafe-harness --lib miri_contracts --locked

      - name: Run AddressSanitizer syscall tests
        if: matrix.check == 'address'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          RUSTDOCFLAGS: -Zsanitizer=address
          RUSTFLAGS: -Zsanitizer=address
        run: cargo +nightly-2026-07-16 -Zbuild-std test --target x86_64-unknown-linux-gnu -p oxibelt-unsafe-harness --lib syscall_ --locked -- --test-threads=1

      - name: Run ThreadSanitizer concurrency test
        if: matrix.check == 'thread'
        env:
          RUSTDOCFLAGS: -Zsanitizer=thread
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: cargo +nightly-2026-07-16 -Zbuild-std test --target x86_64-unknown-linux-gnu -p oxibelt-unsafe-harness --lib concurrent_tcp_info_reads_use_borrowed_fd_without_races --locked -- --test-threads=1

  check-riscv64-cross:
    name: Check (riscv64 cross, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.97.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V GNU cross toolchain
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V GNU target
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=/usr/riscv64-linux-gnu
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

      - name: Pre-pull Docker BuildKit image
        if: matrix.target == 'riscv64gc-unknown-linux-musl'
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        if: matrix.target == 'riscv64gc-unknown-linux-musl'

      - name: Cargo check for RISC-V musl target
        if: matrix.target == 'riscv64gc-unknown-linux-musl'
        run: |
          docker buildx build \
            --platform linux/riscv64 \
            --target riscv64-musl-check \
            --build-arg OXIBELT_RUST_BUILDER_STAGE=builder-riscv64 \
            --build-arg OXIBELT_RUST_CACHE_ID=riscv64gc-musl-cross-rs-c12165aa \
            --progress plain \
            -f source/ops/Dockerfile.alpine \
            .

  generate-test-matrices:
    name: Generate integration test matrices
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read
    outputs:
      docker_config_runtime: ${{ steps.matrices.outputs.docker_config_runtime }}
      docker_proxy: ${{ steps.matrices.outputs.docker_proxy }}
      docker_protocol: ${{ steps.matrices.outputs.docker_protocol }}
      docker_waf: ${{ steps.matrices.outputs.docker_waf }}
      docker_cache: ${{ steps.matrices.outputs.docker_cache }}
      docker_state_data: ${{ steps.matrices.outputs.docker_state_data }}
      docker_ops: ${{ steps.matrices.outputs.docker_ops }}
      docker_security: ${{ steps.matrices.outputs.docker_security }}
      browser: ${{ steps.matrices.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Generate matrices
        id: matrices
        run: |
          cargo_run_with_retry() {
            local attempt=1
            local max_attempts=3
            local status=0
            local delay=5

            while ((attempt <= max_attempts)); do
              if cargo run "$@"; then
                return 0
              fi
              status=$?
              if ((attempt == max_attempts)); then
                return "${status}"
              fi
              printf 'cargo run failed with status %s; retrying in %ss (%s/%s): cargo run %s\n' \
                "${status}" "${delay}" "${attempt}" "${max_attempts}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          write_docker_matrix() {
            local output_name="$1"
            local group="$2"
            local matrix
            matrix="$(
              cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
                list --suite docker --format github-matrix --group "${group}"
            )"
            echo "${output_name}=${matrix}" >> "${GITHUB_OUTPUT}"
          }

          write_docker_matrix docker_config_runtime config-runtime
          write_docker_matrix docker_proxy proxy
          write_docker_matrix docker_protocol protocol
          write_docker_matrix docker_waf waf
          write_docker_matrix docker_cache cache
          write_docker_matrix docker_state_data state-data
          write_docker_matrix docker_ops ops
          write_docker_matrix docker_security security

          browser_matrix="$(
            cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite browser --format github-matrix
          )"
          echo "browser=${browser_matrix}" >> "${GITHUB_OUTPUT}"

  linux-target-builds:
    name: Linux target builds
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

  docker-alpine-musl-image-amd64:
    name: Docker image (Alpine musl, amd64, ${{ matrix.target_cpu }})
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64v2
            artifact_name: oxibelt-alpine-musl-amd64v2-image
            target_cpu: x86-64-v2
          - artifact_arch: amd64
            artifact_name: oxibelt-alpine-musl-amd64-image
            target_cpu: x86-64-v3
          - artifact_arch: amd64v4
            artifact_name: oxibelt-alpine-musl-amd64v4-image
            target_cpu: x86-64-v4

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/amd64" \
            "${{ matrix.artifact_arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.artifact_arch }}.tar
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.artifact_arch }}-build-metadata.json
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.artifact_arch }}-artifact-contract.json
          if-no-files-found: error
          retention-days: 0

  docker-alpine-musl-role-image-amd64:
    name: Docker role image (Alpine musl, amd64, ${{ matrix.role.name }})
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        role:
          - name: dataplane
            artifact_prefix: oxibelt-dataplane
          - name: dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - name: controller
            artifact_prefix: oxibelt-gateway-controller
          - name: tools
            artifact_prefix: oxibelt-tools
          - name: keysigner
            artifact_prefix: oxibelt-keysigner

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0

      - name: Build role-specific Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/amd64" \
            "amd64" \
            "${RUNNER_TEMP}/oxibelt-image" \
            "${{ matrix.role.name }}"

      - name: Validate strict data-plane image inventory
        if: matrix.role.name == 'dataplane-strict'
        run: |
          python3 tests/scripts/validate-strict-dataplane-image.py \
            "${RUNNER_TEMP}/oxibelt-image/${{ matrix.role.artifact_prefix }}-alpine-musl-amd64.tar"

      - name: Upload role-specific Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.role.artifact_prefix }}-alpine-musl-amd64-image
          path: |
            ${{ runner.temp }}/oxibelt-image/${{ matrix.role.artifact_prefix }}-alpine-musl-amd64.tar
            ${{ runner.temp }}/oxibelt-image/${{ matrix.role.artifact_prefix }}-alpine-musl-amd64-build-metadata.json
            ${{ runner.temp }}/oxibelt-image/${{ matrix.role.artifact_prefix }}-alpine-musl-amd64-artifact-contract.json
          if-no-files-found: error
          retention-days: 0

  docker-alpine-comparator-musl-image-amd64:
    name: Docker comparator image (Alpine musl, amd64, ${{ matrix.comparator }}, ${{ matrix.target_cpu }})
    runs-on: ubuntu-26.04
    needs:
      - pr-non-benchmark-summary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - comparator: nginx
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-nginx-x86-64-v2-image
            image_tar: oxibelt-performance-nginx-x86-64-v2.tar
          - comparator: nginx
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-nginx-x86-64-v3-image
            image_tar: oxibelt-performance-nginx-x86-64-v3.tar
          - comparator: caddy
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-caddy-x86-64-v2-image
            image_tar: oxibelt-performance-caddy-x86-64-v2.tar
          - comparator: caddy
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-caddy-x86-64-v3-image
            image_tar: oxibelt-performance-caddy-x86-64-v3.tar
          - comparator: openresty
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-openresty-x86-64-v2-image
            image_tar: oxibelt-performance-openresty-x86-64-v2.tar
          - comparator: openresty
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-openresty-x86-64-v3-image
            image_tar: oxibelt-performance-openresty-x86-64-v3.tar

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0

      - name: Build comparator Docker image artifact
        run: |
          tests/scripts/build-performance-comparator-image-artifact.sh \
            "${{ matrix.comparator }}" \
            "linux/amd64" \
            "${{ matrix.target_cpu }}" \
            "${RUNNER_TEMP}/oxibelt-comparator-image"

      - name: Upload comparator Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-comparator-image/${{ matrix.image_tar }}
          retention-days: 0

  docker-performance-probe-image:
    name: Docker performance probe image
    runs-on: ubuntu-26.04
    needs:
      - pr-non-benchmark-summary
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

