  check-riscv64-cross:
    name: Check (riscv64 cross, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-26.04
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.97.1
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V GNU cross toolchain
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )
          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V GNU target
        if: matrix.target == 'riscv64gc-unknown-linux-gnu'
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=/usr/riscv64-linux-gnu
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

      - name: Pre-pull Docker BuildKit image
        if: matrix.target == 'riscv64gc-unknown-linux-musl'
        run: tests/scripts/retry-docker-pull.sh "${OXIBELT_BUILDKIT_IMAGE}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        if: matrix.target == 'riscv64gc-unknown-linux-musl'
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Cargo check for RISC-V musl target
        if: matrix.target == 'riscv64gc-unknown-linux-musl'
        run: |
          docker buildx build \
            --platform linux/riscv64 \
            --target riscv64-musl-check \
            --build-arg OXIBELT_RUST_BUILDER_STAGE=builder-riscv64 \
            --build-arg OXIBELT_RUST_CACHE_ID=riscv64gc-musl-cross-rs-60372bf6 \
            --progress plain \
            -f source/ops/Dockerfile.alpine \
            .

  generate-test-matrices:
    name: Generate integration test matrices
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - node-dependency-admission
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read
    outputs:
      docker_config_runtime: ${{ steps.matrices.outputs.docker_config_runtime }}
      docker_proxy: ${{ steps.matrices.outputs.docker_proxy }}
      docker_protocol: ${{ steps.matrices.outputs.docker_protocol }}
      docker_waf: ${{ steps.matrices.outputs.docker_waf }}
      docker_cache: ${{ steps.matrices.outputs.docker_cache }}
      docker_state_data: ${{ steps.matrices.outputs.docker_state_data }}
      docker_ops: ${{ steps.matrices.outputs.docker_ops }}
      docker_security: ${{ steps.matrices.outputs.docker_security }}
      browser: ${{ steps.matrices.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Generate matrices
        id: matrices
        run: |
          cargo_run_with_retry() {
            local attempt=1
            local max_attempts=3
            local status=0
            local delay=5

            while ((attempt <= max_attempts)); do
              if cargo run "$@"; then
                return 0
              fi
              status=$?
              if ((attempt == max_attempts)); then
                return "${status}"
              fi
              printf 'cargo run failed with status %s; retrying in %ss (%s/%s): cargo run %s\n' \
                "${status}" "${delay}" "${attempt}" "${max_attempts}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          write_docker_matrix() {
            local output_name="$1"
            local group="$2"
            local matrix
            matrix="$(
              cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
                list --suite docker --format github-matrix --group "${group}"
            )"
            echo "${output_name}=${matrix}" >> "${GITHUB_OUTPUT}"
          }

          write_docker_matrix docker_config_runtime config-runtime
          write_docker_matrix docker_proxy proxy
          write_docker_matrix docker_protocol protocol
          write_docker_matrix docker_waf waf
          write_docker_matrix docker_cache cache
          write_docker_matrix docker_state_data state-data
          write_docker_matrix docker_ops ops
          write_docker_matrix docker_security security

          browser_matrix="$(
            cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite browser --format github-matrix
          )"
          echo "browser=${browser_matrix}" >> "${GITHUB_OUTPUT}"

