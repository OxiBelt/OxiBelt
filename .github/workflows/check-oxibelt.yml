          OXIBELT_ADMISSION_KIND_NODE_IMAGE: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          OXIBELT_ADMISSION_TIMEOUT_SECONDS: "900"
