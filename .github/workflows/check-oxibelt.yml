      - docker-integration-state-data
      - docker-integration-ops
      - docker-integration-security
      - remote-signer-dos-docker
      - browser-webdriver
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Build non-benchmark validation summary
        id: summarize
        env:
          OXIBELT_NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${OXIBELT_NEEDS_JSON}" >"${RUNNER_TEMP}/non-benchmark-needs.json"
          status=0
          bash tests/scripts/summarize-ci-needs.sh \
            "${RUNNER_TEMP}/non-benchmark-needs.json" \
            "${RUNNER_TEMP}/non-benchmark-summary.json" \
            "${RUNNER_TEMP}/non-benchmark-summary.md" || status="$?"
          if [[ -f "${RUNNER_TEMP}/non-benchmark-summary.md" ]]; then
            cat "${RUNNER_TEMP}/non-benchmark-summary.md" >>"${GITHUB_STEP_SUMMARY}"
          fi
          echo "status=${status}" >>"${GITHUB_OUTPUT}"

      - name: Upload non-benchmark validation summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: non-benchmark-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/non-benchmark-summary.json
            ${{ runner.temp }}/non-benchmark-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce non-benchmark validation result
        if: always()
        env:
          OXIBELT_SUMMARY_STATUS: ${{ steps.summarize.outputs.status }}
        run: test "${OXIBELT_SUMMARY_STATUS}" = "0"

