name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Docker performance profile to run after integration checks
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - benchmark
          - soak
      performance_iterations:
        description: Docker performance iterations per runner shard
        required: false
        default: "5"
        type: string
      performance_h2_profile:
        description: Record host perf evidence for the x86-64-v3 oxibelt-h2 smoke row
        required: false
        default: false
        type: boolean
      aggressive_long_run:
        description: Run the scheduled aggressive long-run job after Docker performance
        required: false
        default: false
        type: boolean
      aggressive_long_run_seconds:
        description: Aggressive long-run steady soak duration in seconds
        required: false
        default: "18000"
        type: string
      aggressive_long_run_concurrency:
        description: Aggressive long-run load concurrency
        required: false
        default: "256"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep this job independent. If test jobs need it, a PR can intentionally
  # fail structure checks and cause branch-protected test jobs to be skipped.
  source-structure:
    name: Source structure checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Rust module size
        run: tests/scripts/check-rust-module-size.sh

      - name: Person proof UI asset uses pinned npm dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const exactVersion = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          const checkedFields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'overrides'];
          const invalid = [];

          const checkValue = (file, path, value) => {
            if (typeof value === 'string') {
              if (!exactVersion.test(value)) {
                invalid.push(`${file}:${path}=${value}`);
              }
              return;
            }

            if (value && typeof value === 'object' && !Array.isArray(value)) {
              for (const [key, nested] of Object.entries(value)) {
                checkValue(file, `${path}.${key}`, nested);
              }
            }
          };

          const file = 'ui/person-proof/package.json';
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          for (const field of checkedFields) {
            checkValue(file, field, manifest[field]);
          }

          if (invalid.length > 0) {
            console.error(`npm dependencies must use exact versions:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE
          npm install --prefix ui/person-proof --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run --prefix ui/person-proof build
          npm run --prefix ui/person-proof check:openapi
          git diff --exit-code source/assets/person-proof-challenge.html

  test:
    name: Test (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.fuzz_target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz_target:
          - turn_protocol
          - tls_client_hello
          - http_semantics
          - http3_webtransport
          - websocket_frame
          - webrtc_turn

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked

      - name: Run fuzz smoke (${{ matrix.fuzz_target }})
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: cargo +nightly fuzz run ${{ matrix.fuzz_target }} -- -runs=256

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-${{ matrix.fuzz_target }}-fuzz-artifacts
          path: fuzz/artifacts/${{ matrix.fuzz_target }}
          if-no-files-found: ignore
          retention-days: 0

  test-riscv64-qemu:
    name: Test (riscv64 via QEMU, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: riscv64

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-musl --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )

          if [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            packages+=(
              clang
              libclang-dev
            )
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V target (${{ matrix.target }})
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-g++
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

  generate-test-matrices:
    name: Generate integration test matrices
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    outputs:
      docker_config_runtime: ${{ steps.matrices.outputs.docker_config_runtime }}
      docker_proxy: ${{ steps.matrices.outputs.docker_proxy }}
      docker_protocol: ${{ steps.matrices.outputs.docker_protocol }}
      docker_waf: ${{ steps.matrices.outputs.docker_waf }}
      docker_cache: ${{ steps.matrices.outputs.docker_cache }}
      docker_state_data: ${{ steps.matrices.outputs.docker_state_data }}
      docker_ops: ${{ steps.matrices.outputs.docker_ops }}
      docker_security: ${{ steps.matrices.outputs.docker_security }}
      browser: ${{ steps.matrices.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Generate matrices
        id: matrices
        run: |
          write_docker_matrix() {
            local output_name="$1"
            local group="$2"
            local matrix
            matrix="$(
              cargo run --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
                list --suite docker --format github-matrix --group "${group}"
            )"
            echo "${output_name}=${matrix}" >> "${GITHUB_OUTPUT}"
          }

          write_docker_matrix docker_config_runtime config-runtime
          write_docker_matrix docker_proxy proxy
          write_docker_matrix docker_protocol protocol
          write_docker_matrix docker_waf waf
          write_docker_matrix docker_cache cache
          write_docker_matrix docker_state_data state-data
          write_docker_matrix docker_ops ops
          write_docker_matrix docker_security security

          browser_matrix="$(
            cargo run --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite browser --format github-matrix
          )"
          echo "browser=${browser_matrix}" >> "${GITHUB_OUTPUT}"

  linux-target-builds:
    name: Linux target builds
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

  docker-alpine-musl-image-amd64:
    name: Docker image (Alpine musl, amd64, ${{ matrix.target_cpu }})
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64v2
            artifact_name: oxibelt-alpine-musl-amd64v2-image
            target_cpu: x86-64-v2
          - artifact_arch: amd64
            artifact_name: oxibelt-alpine-musl-amd64-image
            target_cpu: x86-64-v3
          - artifact_arch: amd64v4
            artifact_name: oxibelt-alpine-musl-amd64v4-image
            target_cpu: x86-64-v4

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # 4.0.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/amd64" \
            "${{ matrix.artifact_arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.artifact_arch }}.tar
          retention-days: 0

  docker-alpine-comparator-musl-image-amd64:
    name: Docker comparator image (Alpine musl, amd64, ${{ matrix.comparator }}, ${{ matrix.target_cpu }})
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - comparator: nginx
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-nginx-x86-64-v2-image
            image_tar: oxibelt-performance-nginx-x86-64-v2.tar
          - comparator: nginx
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-nginx-x86-64-v3-image
            image_tar: oxibelt-performance-nginx-x86-64-v3.tar
          - comparator: caddy
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-caddy-x86-64-v2-image
            image_tar: oxibelt-performance-caddy-x86-64-v2.tar
          - comparator: caddy
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-caddy-x86-64-v3-image
            image_tar: oxibelt-performance-caddy-x86-64-v3.tar

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # 4.0.0

      - name: Build comparator Docker image artifact
        run: |
          tests/scripts/build-performance-comparator-image-artifact.sh \
            "${{ matrix.comparator }}" \
            "linux/amd64" \
            "${{ matrix.target_cpu }}" \
            "${RUNNER_TEMP}/oxibelt-comparator-image"

      - name: Upload comparator Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-comparator-image/${{ matrix.image_tar }}
          retention-days: 0

  docker-alpine-musl-image-other:
    name: Docker image (Alpine musl, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    needs:
      - test
      - test-riscv64-qemu
      - fuzz-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu_platforms: ""
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-latest
            qemu_platforms: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        if: matrix.qemu_platforms != ''
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: ${{ matrix.qemu_platforms }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # 4.0.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-alpine-musl-${{ matrix.arch }}-image
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.arch }}.tar
          retention-days: 0

  docker-integration-config-runtime:
    name: Docker integration config-runtime (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.docker_config_runtime) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: tests/scripts/select-amd64-docker-image-artifact.sh auto

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run Docker integration matrix case
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
        run: tests/scripts/run-proxy-integration-matrix.sh "${{ matrix.category }}" "${{ matrix.case }}"

      - name: Upload Docker integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-${{ matrix.category }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 0

  docker-integration-proxy:
    name: Docker integration proxy (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.docker_proxy) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: tests/scripts/select-amd64-docker-image-artifact.sh auto

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run Docker integration matrix case
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
        run: tests/scripts/run-proxy-integration-matrix.sh "${{ matrix.category }}" "${{ matrix.case }}"

      - name: Upload Docker integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-${{ matrix.category }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 0

  docker-integration-protocol:
    name: Docker integration protocol (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.docker_protocol) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: tests/scripts/select-amd64-docker-image-artifact.sh auto

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run Docker integration matrix case
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
        run: tests/scripts/run-proxy-integration-matrix.sh "${{ matrix.category }}" "${{ matrix.case }}"

      - name: Upload Docker integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-${{ matrix.category }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 0

  docker-integration-waf:
    name: Docker integration waf (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.docker_waf) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: tests/scripts/select-amd64-docker-image-artifact.sh auto

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run Docker integration matrix case
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
        run: tests/scripts/run-proxy-integration-matrix.sh "${{ matrix.category }}" "${{ matrix.case }}"

      - name: Upload Docker integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-${{ matrix.category }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
          if-no-files-found: ignore
