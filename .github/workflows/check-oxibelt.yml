      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Validate Helm Pod distribution and lifecycle
        run: tests/scripts/check-helm-pod-lifecycle.sh

      - name: Validate Helm autoscaling configuration
        run: tests/scripts/check-helm-autoscaling.sh

      - name: Install Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.34.10
          install_only: true

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: tests/scripts/select-amd64-docker-image-artifact.sh auto

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run Kubernetes Pod distribution and lifecycle
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_KUBERNETES_POD_LIFECYCLE_TIMEOUT_SECONDS: "600"
          OXIBELT_RUN_KUBERNETES_POD_LIFECYCLE: "1"
        run: tests/scripts/run-kubernetes-pod-lifecycle.sh

  kubernetes-network-policy:
    name: Kubernetes NetworkPolicy (${{ matrix.cni }})
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - node-dependency-admission
      - check-riscv64-cross
      - fuzz-smoke
      - unsafe-validation
    permissions:
      contents: read
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        cni: [calico, cilium]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Validate Helm NetworkPolicy configuration
        run: tests/scripts/check-helm-network-policy.sh

      - name: Install kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.34.10
          install_only: true

      - name: Install Minikube
        env:
          MINIKUBE_VERSION: v1.38.1
          MINIKUBE_SHA256: 099477eaf248bcb5bcea8ce78a2898e93ac01461c35189da1848c3de82ecd22e
        run: |
          minikube_dir="${RUNNER_TEMP}/minikube"
          mkdir -p "${minikube_dir}/bin"
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64" \
            --output "${minikube_dir}/minikube"
          printf '%s  %s\n' "${MINIKUBE_SHA256}" "${minikube_dir}/minikube" | sha256sum --check --status
          install -m 0755 "${minikube_dir}/minikube" "${minikube_dir}/bin/minikube"
          echo "${minikube_dir}/bin" >> "${GITHUB_PATH}"

      - name: Run Kubernetes NetworkPolicy integration
        env:
          OXIBELT_NETWORK_POLICY_TIMEOUT_SECONDS: "600"
        run: tests/scripts/run-kubernetes-network-policy.sh --cni "${{ matrix.cni }}"

  kubernetes-current-compatibility:
    name: Kubernetes ${{ matrix.kubernetes }} and Helm v4.2.3 compatibility
    runs-on: ubuntu-26.04
    needs:
      - test
      - rust-advisory-checks
      - node-dependency-admission
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.34.8
            kube_version: 1.34.8
            kubectl: v1.34.10
            node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: v1.35.5
            kube_version: 1.35.5
            kubectl: v1.35.7
            node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: v1.36.1
            kube_version: 1.36.1
            kubectl: v1.36.3
            node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up current Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Validate Helm 4 configuration
        run: |
          tests/scripts/check-helm-admin-config.sh
          tests/scripts/check-helm-base-config.sh
          tests/scripts/check-helm-edge-secure-medium-profile.sh
          tests/scripts/check-helm-edge-secure-medium-v2.sh
          tests/scripts/check-helm-service-account-token.sh
          tests/scripts/check-helm-gateway-controller-ha.sh
          tests/scripts/check-helm-pod-lifecycle.sh
          tests/scripts/check-helm-autoscaling.sh
          tests/scripts/check-helm-network-policy.sh
          tests/scripts/check-helm-image-digest.sh

      - name: Install current Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: ${{ matrix.kubectl }}
          install_only: true

      - name: Validate chart resources against current Kubernetes
        env:
          KIND_NODE_IMAGE: ${{ matrix.node_image }}
          KUBERNETES_VERSION: ${{ matrix.kube_version }}
        run: |
          set -euo pipefail

          cluster_name="oxibelt-current-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            kind delete cluster --name "${cluster_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          kind create cluster \
            --name "${cluster_name}" \
            --image "${KIND_NODE_IMAGE}" \
            --wait 120s
          context="kind-${cluster_name}"
          namespace="oxibelt-current"

          kubectl --context "${context}" version
          kubectl --context "${context}" create namespace "${namespace}"
          kubectl --context "${context}" label namespace "${namespace}" \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/warn=restricted
          helm lint deploy/helm/oxibelt --kube-version "${KUBERNETES_VERSION}"
          helm lint deploy/helm/oxibelt-gateway-controller --kube-version "${KUBERNETES_VERSION}"
          helm template oxibelt-current deploy/helm/oxibelt --namespace "${namespace}" \
            --kube-version "${KUBERNETES_VERSION}" \
            --set-string configRollout.mode=kubernetes_immutable \
            | kubectl --context "${context}" --namespace "${namespace}" apply --dry-run=server --validate=strict --filename -
          helm template oxibelt-v2 deploy/helm/oxibelt --namespace "${namespace}" \
            --kube-version "${KUBERNETES_VERSION}" \
            -f deploy/helm/oxibelt/examples/edge-secure-medium-v2-values.yaml \
            | kubectl --context "${context}" --namespace "${namespace}" apply --dry-run=server --validate=strict --filename -
          helm template oxibelt-gateway-controller deploy/helm/oxibelt-gateway-controller \
            --namespace "${namespace}" \
            --kube-version "${KUBERNETES_VERSION}" \
            | kubectl --context "${context}" --namespace "${namespace}" apply --dry-run=server --validate=strict --filename -

