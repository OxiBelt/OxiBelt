name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Docker performance profile to run after integration checks
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - benchmark
          - soak
      performance_iterations:
        description: Docker performance iterations per runner shard
        required: false
        default: "5"
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Keep this job independent. If test jobs need it, a PR can intentionally
  # fail structure checks and cause branch-protected test jobs to be skipped.
  source-structure:
    name: Source structure checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Rust module size
        run: tests/scripts/check-rust-module-size.sh

      - name: Person proof UI asset uses pinned npm dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const exactVersion = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          const checkedFields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'overrides'];
          const invalid = [];

          const checkValue = (file, path, value) => {
            if (typeof value === 'string') {
              if (!exactVersion.test(value)) {
                invalid.push(`${file}:${path}=${value}`);
              }
              return;
            }

            if (value && typeof value === 'object' && !Array.isArray(value)) {
              for (const [key, nested] of Object.entries(value)) {
                checkValue(file, `${path}.${key}`, nested);
              }
            }
          };

          const file = 'ui/person-proof/package.json';
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          for (const field of checkedFields) {
            checkValue(file, field, manifest[field]);
          }

          if (invalid.length > 0) {
            console.error(`npm dependencies must use exact versions:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE
          npm install --prefix ui/person-proof --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run --prefix ui/person-proof build
          git diff --exit-code source/assets/person-proof-challenge.html

  test:
    name: Test (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  test-riscv64-qemu:
    name: Test (riscv64 via QEMU, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: riscv64

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-musl --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )

          if [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            packages+=(
              clang
              libclang-dev
            )
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V target (${{ matrix.target }})
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-g++
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

  generate-test-matrices:
    name: Generate integration test matrices
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
    permissions:
      contents: read
    outputs:
      docker: ${{ steps.matrices.outputs.docker }}
      browser: ${{ steps.matrices.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Generate matrices
        id: matrices
        run: |
          docker_matrix="$(
            cargo run --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite docker --format github-matrix
          )"
          browser_matrix="$(
            cargo run --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite browser --format github-matrix
          )"
          echo "docker=${docker_matrix}" >> "${GITHUB_OUTPUT}"
          echo "browser=${browser_matrix}" >> "${GITHUB_OUTPUT}"

  linux-target-builds:
    name: Linux target builds
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

  docker-alpine-musl-image-amd64:
    name: Docker image (Alpine musl, amd64)
    runs-on: ubuntu-latest
    needs:
      - test
      - test-riscv64-qemu
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # 4.0.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/amd64" \
            "amd64" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-amd64.tar
          retention-days: 0

  docker-alpine-musl-image-other:
    name: Docker image (Alpine musl, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    needs:
      - test
      - test-riscv64-qemu
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu_platforms: ""
          - arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-latest
            qemu_platforms: riscv64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        if: matrix.qemu_platforms != ''
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: ${{ matrix.qemu_platforms }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # 4.0.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-alpine-musl-${{ matrix.arch }}-image
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.arch }}.tar
          retention-days: 0

  docker-integration-matrix:
    name: Docker integration (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.docker) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/oxibelt-alpine-musl-amd64.tar"

      - name: Run Docker integration matrix case
        env:
          OXIBELT_DOCKER_IMAGE: oxibelt:alpine-musl-amd64
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
        run: tests/scripts/run-proxy-integration-matrix.sh "${{ matrix.category }}" "${{ matrix.case }}"

      - name: Upload Docker integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-${{ matrix.category }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-docker-logs/${{ matrix.category }}-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 7

  remote-signer-dos-docker:
    name: Docker remote signer DoS regression
    runs-on: ubuntu-latest
    needs:
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/oxibelt-alpine-musl-amd64.tar"

      - name: Run remote signer slowloris regression
        env:
          OXIBELT_DOCKER_IMAGE: oxibelt:alpine-musl-amd64
        run: tests/scripts/run-remote-signer-dos.sh

  browser-webdriver:
    name: Browser WebDriver (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - generate-test-matrices
      - docker-alpine-musl-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-test-matrices.outputs.browser) }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/oxibelt-alpine-musl-amd64.tar"

      - name: Run browser-to-proxy WebDriver check
        env:
          OXIBELT_DOCKER_IMAGE: oxibelt:alpine-musl-amd64
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-browser-logs/${{ matrix.browser }}-${{ matrix.case }}
        run: tests/scripts/run-browser-webdriver-check.sh "${{ matrix.browser }}" "${{ matrix.case }}"

      - name: Upload browser WebDriver diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-browser-${{ matrix.browser }}-${{ matrix.case }}-diagnostics
          path: ${{ runner.temp }}/oxibelt-browser-logs/${{ matrix.browser }}-${{ matrix.case }}
          if-no-files-found: ignore
          retention-days: 7

  docker-performance:
    name: Docker performance (${{ github.event_name == 'workflow_dispatch' && inputs.performance_profile || 'smoke' }}, ${{ matrix.serving_type }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    needs:
      - docker-integration-matrix
      - remote-signer-dos-docker
      - browser-webdriver
    permissions:
      actions: read
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        shard:
          - 1
          - 2
          - 3
          - 4
          - 5
        serving_type:
          - reverse-proxy
          - static-files
          - oxibelt-features
          - oxibelt-soak-stress
          - accept-multipliers
    env:
      PERFORMANCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_profile || 'smoke' }}
      PERFORMANCE_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_iterations || '5' }}
      PERFORMANCE_SERVING_TYPE: ${{ matrix.serving_type }}
      OXIBELT_PERF_REGRESSION_GATE_MODE: warn

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/oxibelt-alpine-musl-amd64.tar"

      - name: Run Docker performance profile
        env:
          OXIBELT_DOCKER_IMAGE: oxibelt:alpine-musl-amd64
          PERFORMANCE_SHARD: ${{ matrix.shard }}
        run: |
          if [[ ! "${PERFORMANCE_ITERATIONS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "performance_iterations must be a positive integer; got '${PERFORMANCE_ITERATIONS}'" >&2
            exit 2
          fi

          failed_iterations=()
          for iteration in $(seq 1 "${PERFORMANCE_ITERATIONS}"); do
            echo "Running Docker performance profile ${PERFORMANCE_PROFILE} serving type ${PERFORMANCE_SERVING_TYPE} shard ${PERFORMANCE_SHARD}, iteration ${iteration}/${PERFORMANCE_ITERATIONS}"
            status=0
            OXIBELT_TEST_ARTIFACT_DIR="${RUNNER_TEMP}/oxibelt-performance/${PERFORMANCE_SERVING_TYPE}/shard-${PERFORMANCE_SHARD}/run-${iteration}" \
              tests/scripts/run-proxy-performance.sh --profile "${PERFORMANCE_PROFILE}" --serving-type "${PERFORMANCE_SERVING_TYPE}" --comparators oxibelt,nginx,caddy || status=$?
            if [[ "${status}" != "0" ]]; then
              failed_iterations+=("${iteration}:${status}")
              echo "::error title=Docker performance iteration failed::profile=${PERFORMANCE_PROFILE} serving_type=${PERFORMANCE_SERVING_TYPE} shard=${PERFORMANCE_SHARD} iteration=${iteration} status=${status}"
            fi
          done

          if (( ${#failed_iterations[@]} > 0 )); then
            printf 'Docker performance failed in %d iteration(s): %s\n' "${#failed_iterations[@]}" "${failed_iterations[*]}" >&2
            exit 1
          fi

      - name: Upload Docker performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-performance-${{ env.PERFORMANCE_PROFILE }}-${{ matrix.serving_type }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/oxibelt-performance/${{ matrix.serving_type }}/shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 14

  docker-performance-summary:
    name: Docker performance summary
    runs-on: ubuntu-latest
    needs:
      - docker-performance
    if: always()
    permissions:
      actions: read
      contents: read
    env:
      PERFORMANCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_profile || 'smoke' }}
      PERFORMANCE_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.performance_iterations || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Download Docker performance artifacts
        id: download-performance-artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: oxibelt-docker-performance-${{ env.PERFORMANCE_PROFILE }}-*
          path: ${{ runner.temp }}/oxibelt-performance-artifacts

      - name: Check downloaded Docker performance artifacts
        id: performance-artifacts
        run: |
          if find "${RUNNER_TEMP}/oxibelt-performance-artifacts" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning title=Docker performance summary::no Docker performance artifacts were downloaded; skipping aggregation and regression gates"
            echo "found=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download previous Docker performance comparison
        id: download-performance-baseline
        if: steps.performance-artifacts.outputs.found == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/oxibelt-performance-baseline"
          mkdir -p "${baseline_dir}"

          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/check-oxibelt.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=20"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${runs_url}" > "${baseline_dir}/runs.json"

          baseline_run_id="$(jq -r --arg current "${GITHUB_RUN_ID}" 'first(.workflow_runs[] | select((.id | tostring) != $current) | .id) // empty' "${baseline_dir}/runs.json")"
          if [[ -z "${baseline_run_id}" ]]; then
            echo "::warning title=Docker performance delta::no previous successful Check OxiBelt run was found for ${GITHUB_REF_NAME}"
            exit 0
          fi

          artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${baseline_run_id}/artifacts?per_page=100"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${artifacts_url}" > "${baseline_dir}/artifacts.json"

          artifact_url="$(jq -r --arg name "oxibelt-docker-performance-${PERFORMANCE_PROFILE}-comparison" 'first(.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url) // empty' "${baseline_dir}/artifacts.json")"
          if [[ -z "${artifact_url}" ]]; then
            echo "::warning title=Docker performance delta::previous run ${baseline_run_id} has no reusable performance comparison artifact"
            exit 0
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -L "${artifact_url}" \
            -o "${baseline_dir}/comparison.zip"
          unzip -q -o "${baseline_dir}/comparison.zip" -d "${baseline_dir}/comparison"
          if [[ -f "${baseline_dir}/comparison/performance-comparison.json" ]]; then
            echo "baseline_report=${baseline_dir}/comparison/performance-comparison.json" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning title=Docker performance delta::baseline comparison artifact did not contain performance-comparison.json"
          fi

      - name: Aggregate Docker performance comparison
        if: steps.performance-artifacts.outputs.found == 'true'
        env:
          BASELINE_REPORT: ${{ steps.download-performance-baseline.outputs.baseline_report }}
        run: |
          aggregate_args=(
            --input-dir "${RUNNER_TEMP}/oxibelt-performance-artifacts"
            --output-dir "${RUNNER_TEMP}/oxibelt-performance-comparison"
            --profile "${PERFORMANCE_PROFILE}"
          )
          if [[ "${PERFORMANCE_ITERATIONS}" =~ ^[1-9][0-9]*$ ]]; then
            aggregate_args+=(--expected-runs "${PERFORMANCE_ITERATIONS}")
          else
            echo "::warning title=Docker performance summary::performance_iterations is not a positive integer; missing-run checks will be skipped"
          fi
          if [[ -n "${BASELINE_REPORT}" ]]; then
            aggregate_args+=(--baseline-report "${BASELINE_REPORT}")
          else
            echo "::warning title=Docker performance delta::baseline comparison artifact was not available; delta report will be skipped"
          fi

          cargo run --quiet --locked -p oxibelt --bin oxibelt-performance-aggregate -- "${aggregate_args[@]}"

      - name: Append Docker performance comparison summary
        if: steps.performance-artifacts.outputs.found == 'true'
        run: |
          cat "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.md" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-delta.md" ]]; then
            printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-delta.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker performance comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-performance-${{ env.PERFORMANCE_PROFILE }}-comparison
          path: ${{ runner.temp }}/oxibelt-performance-comparison
          if-no-files-found: ignore
          retention-days: 14

      - name: Evaluate Docker performance regression gates
        if: steps.performance-artifacts.outputs.found == 'true'
        run: |
          gate_status="$(jq -r '.regression_gates.status // "unknown"' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if [[ "${gate_status}" == "pass" ]]; then
            echo "Docker performance regression gates passed"
            exit 0
          fi

          jq -r '.regression_gates.violations[]? | "::error title=Docker performance regression gate::" + .message' \
            "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
          echo "Docker performance regression gates failed with status '${gate_status}'" >&2
          exit 1
