      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Validate strict hardening templates
        run: |
          tests/scripts/check-helm-strict-dataplane.sh
          tests/scripts/check-helm-edge-secure-medium-v2.sh

      - name: Install Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: v1.34.10
          install_only: true

      - name: Download AMD64 strict data-plane Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-dataplane-strict-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-dataplane-strict-image

      - name: Load strict data-plane Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-dataplane-strict-image/oxibelt-dataplane-strict-alpine-musl-amd64.tar"

      - name: Run strict seccomp and Landlock integration
        env:
          OXIBELT_STRICT_DOCKER_IMAGE: oxibelt-dataplane-strict:alpine-musl-amd64
          OXIBELT_STRICT_HARDENING_KIND_NODE_IMAGE: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          OXIBELT_STRICT_HARDENING_TIMEOUT_SECONDS: "420"
        run: tests/scripts/run-helm-strict-hardening-live.sh --provider kind

  kubernetes-supply-chain-admission:
