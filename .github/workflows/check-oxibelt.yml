name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  build-riscv64-qemu:
    name: Build (riscv64 via QEMU, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: riscv64

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-musl --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )

          if [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            packages+=(
              clang
              libclang-dev
            )
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V target (${{ matrix.target }})
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-g++
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

  docker-integration:
    name: Docker integration checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

      - name: Run proxy integration checks
        run: tests/scripts/run-proxy-integration.sh

  browser-webdriver:
    name: Browser WebDriver checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            browser_command: chromium
            driver_command: chromedriver
            port: 9515
          - browser: firefox
            browser_command: firefox
            driver_command: geckodriver
            port: 4444

    steps:
      - name: Add WebDriver directories to PATH
        run: |
          if [[ -n "${CHROMEWEBDRIVER:-}" ]]; then
            echo "${CHROMEWEBDRIVER}" >> "${GITHUB_PATH}"
          fi

          if [[ -n "${GECKOWEBDRIVER:-}" ]]; then
            echo "${GECKOWEBDRIVER}" >> "${GITHUB_PATH}"
          fi

      - name: Show browser and driver versions
        run: |
          ${{ matrix.browser_command }} --version
          ${{ matrix.driver_command }} --version

      - name: Run headless WebDriver smoke test
        env:
          BROWSER: ${{ matrix.browser }}
          BROWSER_COMMAND: ${{ matrix.browser_command }}
          DRIVER_COMMAND: ${{ matrix.driver_command }}
          DRIVER_PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail

          driver_log="${RUNNER_TEMP}/${DRIVER_COMMAND}.log"
          base_url="http://127.0.0.1:${DRIVER_PORT}"
          session_id=""
          driver_pid=""

          cleanup() {
            if [[ -n "${session_id}" ]]; then
              curl --silent --show-error --fail-with-body \
                --request DELETE "${base_url}/session/${session_id}" >/dev/null || true
            fi

            if [[ -n "${driver_pid}" ]]; then
              kill "${driver_pid}" >/dev/null 2>&1 || true
              wait "${driver_pid}" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          case "${BROWSER}" in
            chromium)
              browser_binary="$(command -v "${BROWSER_COMMAND}")"
              "${DRIVER_COMMAND}" --port="${DRIVER_PORT}" >"${driver_log}" 2>&1 &
              driver_pid="$!"
              capabilities="$(
                jq -n --arg binary "${browser_binary}" '{
                  capabilities: {
                    alwaysMatch: {
                      browserName: "chrome",
                      "goog:chromeOptions": {
                        binary: $binary,
                        args: [
                          "--headless=new",
                          "--no-sandbox",
                          "--disable-dev-shm-usage"
                        ]
                      }
                    }
                  }
                }'
              )"
              ;;
            firefox)
              "${DRIVER_COMMAND}" --port "${DRIVER_PORT}" >"${driver_log}" 2>&1 &
              driver_pid="$!"
              capabilities="$(
                jq -n '{
                  capabilities: {
                    alwaysMatch: {
                      browserName: "firefox",
                      "moz:firefoxOptions": {
                        args: [
                          "-headless"
                        ]
                      }
                    }
                  }
                }'
              )"
              ;;
            *)
              echo "Unsupported browser: ${BROWSER}" >&2
              exit 1
              ;;
          esac

          for _ in {1..30}; do
            if curl --silent --fail "${base_url}/status" >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --fail-with-body "${base_url}/status" >/dev/null

          session_response="$(
            curl --silent --show-error --fail-with-body \
              --header "Content-Type: application/json" \
              --request POST \
              --data "${capabilities}" \
              "${base_url}/session"
          )"
          session_id="$(jq -r '.value.sessionId // .sessionId // empty' <<<"${session_response}")"

          if [[ -z "${session_id}" ]]; then
            echo "Unable to create ${BROWSER} WebDriver session." >&2
            echo "${session_response}" >&2
            echo "Driver log:" >&2
            cat "${driver_log}" >&2
            exit 1
          fi

          test_url="data:text/html;charset=utf-8,<title>OxiBelt%20WebDriver</title><main>ready</main>"
          curl --silent --show-error --fail-with-body \
            --header "Content-Type: application/json" \
            --request POST \
            --data "$(jq -n --arg url "${test_url}" '{url: $url}')" \
            "${base_url}/session/${session_id}/url" >/dev/null

          result="$(
            curl --silent --show-error --fail-with-body \
              --header "Content-Type: application/json" \
              --request POST \
              --data '{
                "script": "return document.title + \":\" + document.querySelector(\"main\").textContent;",
                "args": []
              }' \
              "${base_url}/session/${session_id}/execute/sync" | jq -r ".value"
          )"

          if [[ "${result}" != "OxiBelt WebDriver:ready" ]]; then
            echo "Unexpected ${BROWSER} WebDriver result: ${result}" >&2
            echo "Driver log:" >&2
            cat "${driver_log}" >&2
            exit 1
          fi
