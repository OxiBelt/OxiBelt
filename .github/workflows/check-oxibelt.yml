    env:
      PERFORMANCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_profile'] || 'smoke' }}
      PERFORMANCE_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_iterations'] || '5' }}
      PERFORMANCE_H2_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_h2_profile'] || false }}
      PERFORMANCE_PROFILE_LABEL: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_profile_label'] || 'none' }}
      PERFORMANCE_SERVING_TYPE: ${{ matrix.serving_type }}
      OXIBELT_PERF_REGRESSION_GATE_MODE: warn

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Select AMD64 v2 Docker image artifact
        id: select-amd64-v2
        run: tests/scripts/select-amd64-docker-image-artifact.sh x86-64-v2 --allow-unsupported

      - name: Select AMD64 v3 Docker image artifact
        id: select-amd64-v3
        run: tests/scripts/select-amd64-docker-image-artifact.sh x86-64-v3 --allow-unsupported

      - name: Download AMD64 v2 Docker image artifact
        if: steps.select-amd64-v2.outputs.supported == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-v2.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image/x86-64-v2

      - name: Download AMD64 v3 Docker image artifact
        if: steps.select-amd64-v3.outputs.supported == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-v3.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image/x86-64-v3

      - name: Download AMD64 v2 nginx comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-nginx-x86-64-v2-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v2/nginx

      - name: Download AMD64 v2 Caddy comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-caddy-x86-64-v2-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v2/caddy

      - name: Download AMD64 v2 OpenResty comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-openresty-x86-64-v2-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v2/openresty

      - name: Download AMD64 v3 nginx comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-nginx-x86-64-v3-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v3/nginx

      - name: Download AMD64 v3 Caddy comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-caddy-x86-64-v3-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v3/caddy

      - name: Download AMD64 v3 OpenResty comparator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-openresty-x86-64-v3-image
          path: ${{ runner.temp }}/oxibelt-comparator-image/x86-64-v3/openresty

      - name: Download performance probe image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-performance-probe-image
          path: ${{ runner.temp }}/oxibelt-performance-probe-image

      - name: Download external benchmark image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-external-benchmark-image
          path: ${{ runner.temp }}/oxibelt-external-benchmark-image

      - name: Load AMD64 v2 OxiBelt Docker image
        if: steps.select-amd64-v2.outputs.supported == 'true'
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-v2.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/x86-64-v2/${OXIBELT_IMAGE_TAR}"

      - name: Load AMD64 v3 OxiBelt Docker image
        if: steps.select-amd64-v3.outputs.supported == 'true'
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-v3.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/x86-64-v3/${OXIBELT_IMAGE_TAR}"

      - name: Load AMD64 comparator Docker images
        run: |
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v2/nginx/oxibelt-performance-nginx-x86-64-v2.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v2/caddy/oxibelt-performance-caddy-x86-64-v2.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v2/openresty/oxibelt-performance-openresty-x86-64-v2.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v3/nginx/oxibelt-performance-nginx-x86-64-v3.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v3/caddy/oxibelt-performance-caddy-x86-64-v3.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-comparator-image/x86-64-v3/openresty/oxibelt-performance-openresty-x86-64-v3.tar"

      - name: Load performance probe Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-performance-probe-image/oxibelt-performance-probe.tar"

      - name: Load external benchmark Docker image
        run: docker load --input "${RUNNER_TEMP}/oxibelt-external-benchmark-image/oxibelt-external-benchmark-image.tar"

      - name: Install Linux perf and heap tooling for performance profiling
        if: github.event_name != 'workflow_dispatch' || inputs['performance_profile'] == 'smoke' || inputs['performance_h2_profile'] || inputs['performance_profile_label'] != 'none'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            heaptrack \
            linux-tools-common \
            linux-tools-generic \
            perl \
            zstd
          install_flamegraph_tooling() {
            local commit="41fee1f99f9276008b7cd112fca19dc3ea84ac32"
            local base_url="https://raw.githubusercontent.com/brendangregg/FlameGraph/${commit}"
            local install_dir="${RUNNER_TEMP}/flamegraph-${commit}"
            local ok=1
            mkdir -p "${install_dir}"

            download_flamegraph_script() {
              local script="$1"
              local sha256="$2"
              local target="${install_dir}/${script}"
              if ! curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 \
                  --output "${target}" "${base_url}/${script}"; then
                echo "::warning title=FlameGraph tooling::failed to download ${script}; CPU profile artifacts will use placeholder flamegraph SVGs"
                return 1
              fi
              if ! printf '%s  %s\n' "${sha256}" "${target}" | sha256sum --check --status; then
                echo "::warning title=FlameGraph tooling::${script} failed SHA256 verification; skipping FlameGraph script install"
                rm -f "${target}"
                return 1
              fi
              chmod 0755 "${target}"
            }

            download_flamegraph_script \
              flamegraph.pl \
              088f82e6848a4f12a56e1e8e8170ee6761fccf12e5615cd64630f6b087c99ea7 || ok=0
            download_flamegraph_script \
              stackcollapse-perf.pl \
              74faa47a29d8df07cb06731dfd8bb94dc4c165b9d811ac6b4c9449eea2ac25d8 || ok=0

            if [[ "${ok}" == "1" ]]; then
              if ! sudo install -m 0755 "${install_dir}/flamegraph.pl" /usr/local/bin/flamegraph.pl \
                  || ! sudo install -m 0755 "${install_dir}/stackcollapse-perf.pl" /usr/local/bin/stackcollapse-perf.pl; then
                echo "::warning title=FlameGraph tooling::failed to install verified FlameGraph scripts; CPU profile artifacts will use placeholder flamegraph SVGs"
              fi
            else
              echo "::warning title=FlameGraph tooling::verified FlameGraph scripts are unavailable; CPU profile artifacts will use placeholder flamegraph SVGs"
            fi
          }
          install_flamegraph_tooling
          if ! perf --version >/dev/null 2>&1; then
            perf_path="$(find /usr/lib/linux-tools* -type f -name perf | sort -V | tail -n 1)"
            if [[ -z "${perf_path}" ]]; then
              echo "perf binary was not installed by linux-tools packages" >&2
              exit 1
            fi
            sudo install -m 0755 "${perf_path}" /usr/local/bin/perf
          fi
          sudo sysctl kernel.perf_event_paranoid=-1
          sudo sysctl kernel.kptr_restrict=0

      - name: Run Docker performance profile
        env:
          AMD64_V2_SUPPORTED: ${{ steps.select-amd64-v2.outputs.supported }}
          AMD64_V2_IMAGE_TAG: ${{ steps.select-amd64-v2.outputs.image_tag }}
          AMD64_V2_MISSING_FEATURES: ${{ steps.select-amd64-v2.outputs.missing_features }}
          AMD64_V2_NGINX_IMAGE_TAG: oxibelt/performance-nginx:alpine-x86-64-v2
          AMD64_V2_CADDY_IMAGE_TAG: oxibelt/performance-caddy:alpine-x86-64-v2
          AMD64_V2_OPENRESTY_IMAGE_TAG: oxibelt/performance-openresty:alpine-x86-64-v2
          AMD64_V3_SUPPORTED: ${{ steps.select-amd64-v3.outputs.supported }}
          AMD64_V3_IMAGE_TAG: ${{ steps.select-amd64-v3.outputs.image_tag }}
          AMD64_V3_MISSING_FEATURES: ${{ steps.select-amd64-v3.outputs.missing_features }}
          AMD64_V3_NGINX_IMAGE_TAG: oxibelt/performance-nginx:alpine-x86-64-v3
          AMD64_V3_CADDY_IMAGE_TAG: oxibelt/performance-caddy:alpine-x86-64-v3
          AMD64_V3_OPENRESTY_IMAGE_TAG: oxibelt/performance-openresty:alpine-x86-64-v3
          PERFORMANCE_SHARD: ${{ matrix.shard }}
          OXIBELT_ACTIONS_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          if [[ ! "${PERFORMANCE_ITERATIONS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "performance_iterations must be a positive integer; got '${PERFORMANCE_ITERATIONS}'" >&2
            exit 2
          fi
          actions_var_or_default() {
            local name="$1"
            local fallback="$2"
            jq -r --arg name "${name}" --arg fallback "${fallback}" \
              '.[$name] // "" | if . == "" then $fallback else . end' \
              <<<"${OXIBELT_ACTIONS_VARS_JSON}"
          }
          OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE="$(actions_var_or_default OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE warn)"
          OXIBELT_PERF_DIAGNOSTIC_GATE_MODE="$(actions_var_or_default OXIBELT_PERF_DIAGNOSTIC_GATE_MODE warn)"
          unset OXIBELT_ACTIONS_VARS_JSON
          selected_profile_label="${PERFORMANCE_PROFILE_LABEL}"
          if [[ -z "${selected_profile_label}" || "${selected_profile_label}" == "none" ]]; then
            if [[ "${PERFORMANCE_H2_PROFILE}" == "true" ]]; then
              selected_profile_label="oxibelt-h2"
            else
              selected_profile_label="none"
            fi
          fi
          case "${selected_profile_label}" in
            none|oxibelt-h2|oxibelt-h3) ;;
            *)
              echo "performance_profile_label must be none, oxibelt-h2, or oxibelt-h3; got '${selected_profile_label}'" >&2
              exit 2
              ;;
          esac

          failed_iterations=()
          for target_cpu in x86-64-v2 x86-64-v3; do
            case "${target_cpu}" in
              x86-64-v2)
                supported="${AMD64_V2_SUPPORTED}"
                image_tag="${AMD64_V2_IMAGE_TAG}"
                nginx_image_tag="${AMD64_V2_NGINX_IMAGE_TAG}"
                caddy_image_tag="${AMD64_V2_CADDY_IMAGE_TAG}"
                openresty_image_tag="${AMD64_V2_OPENRESTY_IMAGE_TAG}"
                missing_features="${AMD64_V2_MISSING_FEATURES}"
                ;;
              x86-64-v3)
                supported="${AMD64_V3_SUPPORTED}"
                image_tag="${AMD64_V3_IMAGE_TAG}"
                nginx_image_tag="${AMD64_V3_NGINX_IMAGE_TAG}"
                caddy_image_tag="${AMD64_V3_CADDY_IMAGE_TAG}"
                openresty_image_tag="${AMD64_V3_OPENRESTY_IMAGE_TAG}"
                missing_features="${AMD64_V3_MISSING_FEATURES}"
                ;;
            esac

            target_artifact_dir="${RUNNER_TEMP}/oxibelt-performance/${PERFORMANCE_SERVING_TYPE}/shard-${PERFORMANCE_SHARD}/${target_cpu}"
            if [[ "${supported}" != "true" ]]; then
              mkdir -p "${target_artifact_dir}"
              jq -n \
                --arg profile "${PERFORMANCE_PROFILE}" \
                --arg serving_type "${PERFORMANCE_SERVING_TYPE}" \
                --arg required_target_cpu "${target_cpu}" \
                --arg missing_features "${missing_features}" \
                --argjson shard "${PERFORMANCE_SHARD}" \
                '{
                  schema_version: 1,
                  profile: $profile,
                  serving_type: $serving_type,
                  shard: $shard,
                  required_target_cpu: $required_target_cpu,
                  missing_features: $missing_features
                }' >"${target_artifact_dir}/unsupported-cpu.json"
              echo "::warning title=AMD64 target unsupported::Skipping Docker performance ${PERFORMANCE_PROFILE}/${PERFORMANCE_SERVING_TYPE}/shard-${PERFORMANCE_SHARD}/${target_cpu}; runner CPU is missing ${missing_features}"
              continue
            fi

            for iteration in $(seq 1 "${PERFORMANCE_ITERATIONS}"); do
              echo "Running Docker performance profile ${PERFORMANCE_PROFILE} serving type ${PERFORMANCE_SERVING_TYPE} shard ${PERFORMANCE_SHARD}, target ${target_cpu}, iteration ${iteration}/${PERFORMANCE_ITERATIONS}"
              status=0
              run_dir="${target_artifact_dir}/run-${iteration}"
              mkdir -p "${run_dir}"
              profile_env=()
              diagnostic_profile_env=()
              if [[ "${selected_profile_label}" != "none" \
                    && "${PERFORMANCE_PROFILE}" == "smoke" \
                    && "${PERFORMANCE_SERVING_TYPE}" == "reverse-proxy" \
                    && "${PERFORMANCE_SHARD}" == "1" \
                    && "${target_cpu}" == "x86-64-v3" \
                    && "${iteration}" == "1" ]]; then
                profile_env=(
                  OXIBELT_PERF_PROFILE_LABEL="${selected_profile_label}"
                  OXIBELT_PERF_PROFILE_FREQUENCY=99
                  OXIBELT_PERF_PROFILE_CALL_GRAPH=dwarf,8192
                )
              fi
              if [[ "${PERFORMANCE_PROFILE}" == "smoke" ]]; then
                diagnostic_profile_env=(
                  OXIBELT_PERF_DIAGNOSTIC_PROFILES=1
                  OXIBELT_PERF_DIAGNOSTIC_PROFILE_MODE=cpu-memory
                  OXIBELT_PERF_DIAGNOSTIC_EVENT=cpu-clock
                  OXIBELT_PERF_DIAGNOSTIC_FREQUENCY=49
                  OXIBELT_PERF_DIAGNOSTIC_COMPRESS=1
                )
              fi
              env -u OXIBELT_ACTIONS_VARS_JSON \
              "${profile_env[@]}" \
              "${diagnostic_profile_env[@]}" \
              OXIBELT_DOCKER_IMAGE="${image_tag}" \
              OXIBELT_NGINX_IMAGE="${nginx_image_tag}" \
              OXIBELT_CADDY_IMAGE="${caddy_image_tag}" \
              OXIBELT_OPENRESTY_IMAGE="${openresty_image_tag}" \
              OXIBELT_PERF_PROBE_IMAGE=oxibelt/perf-probe:ci \
              OXIBELT_EXTERNAL_BENCHMARK_IMAGE=oxibelt/external-benchmarks:ci \
              OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE="${OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE}" \
              OXIBELT_PERF_DIAGNOSTIC_GATE_MODE="${OXIBELT_PERF_DIAGNOSTIC_GATE_MODE}" \
              OXIBELT_NGINX_H3_MODE=required \
              OXIBELT_AMD64_TARGET_CPU="${target_cpu}" \
              OXIBELT_TEST_ARTIFACT_DIR="${run_dir}" \
                tests/scripts/run-proxy-performance.sh --profile "${PERFORMANCE_PROFILE}" --serving-type "${PERFORMANCE_SERVING_TYPE}" --comparators oxibelt,nginx,caddy,openresty || status=$?
              diagnostic_warning_count=0
              if [[ -s "${run_dir}/results.json" ]]; then
                diagnostic_warning_count="$(jq '[.[] | select((.diagnostic // false) == true and (.diagnostic_status // "") != "pass")] | length' "${run_dir}/results.json")"
              fi
              if [[ "${status}" == "0" && "${diagnostic_warning_count}" != "0" ]]; then
                iteration_status="diagnostic_warning"
                iteration_reason="completed with ${diagnostic_warning_count} diagnostic comparator warning(s)"
              elif [[ "${status}" == "0" ]]; then
                iteration_status="ok"
                iteration_reason="completed"
              else
                iteration_status="primary_failed"
                iteration_reason="run-proxy-performance exited with status ${status}"
              fi
              jq -n \
                --arg profile "${PERFORMANCE_PROFILE}" \
                --arg serving_type "${PERFORMANCE_SERVING_TYPE}" \
                --arg target_cpu "${target_cpu}" \
                --arg status "${iteration_status}" \
                --arg reason "${iteration_reason}" \
                --argjson shard "${PERFORMANCE_SHARD}" \
                --argjson iteration "${iteration}" \
                --argjson exit_code "${status}" \
                --argjson diagnostic_warnings "${diagnostic_warning_count}" \
                '{
                  schema_version: 1,
                  profile: $profile,
                  serving_type: $serving_type,
                  shard: $shard,
                  target_cpu: $target_cpu,
                  iteration: $iteration,
                  exit_code: $exit_code,
                  diagnostic_warnings: $diagnostic_warnings,
                  status: $status,
                  reason: $reason
                }' >"${run_dir}/iteration-status.json"
              if [[ "${status}" != "0" ]]; then
                failed_iterations+=("${target_cpu}:${iteration}:${status}")
                echo "::warning title=Docker performance iteration failed::profile=${PERFORMANCE_PROFILE} serving_type=${PERFORMANCE_SERVING_TYPE} shard=${PERFORMANCE_SHARD} target_cpu=${target_cpu} iteration=${iteration} status=${status}"
              fi
            done
          done

          if ! find "${RUNNER_TEMP}/oxibelt-performance/${PERFORMANCE_SERVING_TYPE}/shard-${PERFORMANCE_SHARD}" -path '*/run-*/results.json' -print -quit 2>/dev/null | grep -q .; then
            echo "::warning title=Docker performance shard produced no results::profile=${PERFORMANCE_PROFILE} serving_type=${PERFORMANCE_SERVING_TYPE} shard=${PERFORMANCE_SHARD}"
          fi

          if (( ${#failed_iterations[@]} > 0 )); then
            printf 'Docker performance recorded %d failed iteration(s): %s\n' "${#failed_iterations[@]}" "${failed_iterations[*]}" >&2
          fi

      - name: Prepare Docker performance summary input artifact
        if: always()
        env:
          PERFORMANCE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          raw_artifact_name="oxibelt-docker-performance-${PERFORMANCE_PROFILE}-${PERFORMANCE_SERVING_TYPE}-shard-${PERFORMANCE_SHARD}"
          tests/scripts/copy-performance-summary-input-artifacts.sh \
            "${RUNNER_TEMP}/oxibelt-performance/${PERFORMANCE_SERVING_TYPE}/shard-${PERFORMANCE_SHARD}" \
            "${RUNNER_TEMP}/oxibelt-performance-summary-input/${raw_artifact_name}"

      - name: Upload Docker performance summary input artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-performance-summary-input-${{ env.PERFORMANCE_PROFILE }}-${{ matrix.serving_type }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/oxibelt-performance-summary-input
          if-no-files-found: ignore
          retention-days: 0

      - name: Upload Docker performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-performance-${{ env.PERFORMANCE_PROFILE }}-${{ matrix.serving_type }}-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/oxibelt-performance/${{ matrix.serving_type }}/shard-${{ matrix.shard }}
          if-no-files-found: ignore
          retention-days: 0

  docker-performance-summary:
    name: Docker performance summary
    runs-on: ubuntu-latest
    needs:
      - docker-performance
    if: always()
    permissions:
      actions: read
      contents: read
    env:
      PERFORMANCE_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_profile'] || 'smoke' }}
      PERFORMANCE_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_iterations'] || '5' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Download Docker performance summary input artifacts
        id: download-performance-artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: oxibelt-docker-performance-summary-input-${{ env.PERFORMANCE_PROFILE }}-*
          path: ${{ runner.temp }}/oxibelt-performance-artifacts
          merge-multiple: true

      - name: Check downloaded Docker performance summary input artifacts
        id: performance-artifacts
        env:
          NEEDS_DOCKER_PERFORMANCE_RESULT: ${{ needs.docker-performance.result }}
        run: |
          if find "${RUNNER_TEMP}/oxibelt-performance-artifacts" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${NEEDS_DOCKER_PERFORMANCE_RESULT}" == "skipped" ]]; then
            echo "::warning title=Docker performance summary::no Docker performance summary input artifacts were downloaded because docker-performance was skipped; skipping aggregation and regression gates"
            echo "found=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error title=Docker performance summary::no Docker performance summary input artifacts were downloaded after docker-performance result '${NEEDS_DOCKER_PERFORMANCE_RESULT}'" >&2
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

      - name: Download previous Docker performance comparison
        if: steps.performance-artifacts.outputs.found == 'true'
        id: download-performance-baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          baseline_dir="${RUNNER_TEMP}/oxibelt-performance-baseline"
          mkdir -p "${baseline_dir}"

          declare -A seen_branches=()
          fallback_branches=()
          fallback_sources=()
          for candidate in "same_branch:${CURRENT_REF_NAME}" "base_branch:${PR_BASE_REF}" "default_branch:${DEFAULT_BRANCH}"; do
            source="${candidate%%:*}"
            branch="${candidate#*:}"
            if [[ -z "${branch}" || -n "${seen_branches[${branch}]:-}" ]]; then
              continue
            fi
            seen_branches["${branch}"]=1
            fallback_branches+=("${branch}")
            fallback_sources+=("${source}")
          done

          artifact_name="oxibelt-docker-performance-${PERFORMANCE_PROFILE}-comparison"
          for index in "${!fallback_branches[@]}"; do
            branch="${fallback_branches[${index}]}"
            source="${fallback_sources[${index}]}"
            runs_path="${baseline_dir}/runs-${index}.json"
            runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/check-oxibelt.yml/runs?branch=${branch}&status=success&per_page=20"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${runs_url}" > "${runs_path}"

            baseline_run_id="$(jq -r --arg current "${GITHUB_RUN_ID}" 'first(.workflow_runs[] | select((.id | tostring) != $current) | .id) // empty' "${runs_path}")"
            if [[ -z "${baseline_run_id}" ]]; then
              echo "::notice title=Docker performance delta::no previous successful Check OxiBelt run was found for ${branch}"
              continue
            fi
            baseline_sha="$(jq -r --arg id "${baseline_run_id}" 'first(.workflow_runs[] | select((.id | tostring) == $id) | .head_sha) // empty' "${runs_path}")"

            artifacts_path="${baseline_dir}/artifacts-${index}.json"
            artifacts_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${baseline_run_id}/artifacts?per_page=100"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${artifacts_url}" > "${artifacts_path}"

            artifact_url="$(jq -r --arg name "${artifact_name}" 'first(.artifacts[] | select(.name == $name and .expired == false) | .archive_download_url) // empty' "${artifacts_path}")"
            artifact_id="$(jq -r --arg name "${artifact_name}" 'first(.artifacts[] | select(.name == $name and .expired == false) | .id) // empty' "${artifacts_path}")"
            if [[ -z "${artifact_url}" ]]; then
              echo "::notice title=Docker performance delta::run ${baseline_run_id} on ${branch} has no reusable performance comparison artifact"
              continue
            fi

            comparison_dir="${baseline_dir}/comparison"
            rm -rf "${comparison_dir}"
            mkdir -p "${comparison_dir}"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -L "${artifact_url}" \
              -o "${baseline_dir}/comparison.zip"
            unzip -q -o "${baseline_dir}/comparison.zip" -d "${comparison_dir}"
            if [[ ! -f "${comparison_dir}/performance-comparison.json" ]]; then
              echo "::warning title=Docker performance delta::baseline comparison artifact from run ${baseline_run_id} did not contain performance-comparison.json"
              continue
            fi

            baseline_schema_version="$(jq -r '.schema_version // empty' "${comparison_dir}/performance-comparison.json")"
            fallback_json="$(printf '%s\n' "${fallback_sources[@]}" | jq -R . | jq -s .)"
            jq -n \
              --argjson fallback_order "${fallback_json}" \
              --arg source "${source}" \
              --arg branch "${branch}" \
              --arg run_id "${baseline_run_id}" \
              --arg sha "${baseline_sha}" \
              --arg artifact_id "${artifact_id}" \
              --arg artifact_name "${artifact_name}" \
              --arg schema_version "${baseline_schema_version}" \
              '{
                schema_version: 1,
                fallback_order: $fallback_order,
                selected: {
                  source: $source,
                  branch: $branch,
                  run_id: $run_id,
                  sha: $sha,
                  artifact_id: $artifact_id,
                  artifact_name: $artifact_name,
                  schema_version: (if $schema_version == "" then null else ($schema_version | tonumber) end)
                }
              }' > "${baseline_dir}/baseline-context.json"
            echo "baseline_report=${comparison_dir}/performance-comparison.json" >> "${GITHUB_OUTPUT}"
            echo "baseline_context=${baseline_dir}/baseline-context.json" >> "${GITHUB_OUTPUT}"
            echo "Selected Docker performance baseline run ${baseline_run_id} from ${source}:${branch}"
            exit 0
          done

          echo "::warning title=Docker performance delta::no reusable performance comparison baseline was found in same branch, PR base branch, or default branch"

      - name: Aggregate Docker performance comparison
        if: steps.performance-artifacts.outputs.found == 'true'
        env:
          BASELINE_REPORT: ${{ steps.download-performance-baseline.outputs.baseline_report }}
          BASELINE_CONTEXT: ${{ steps.download-performance-baseline.outputs.baseline_context }}
          PERFORMANCE_ACCEPTED_REGRESSION_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs['performance_accepted_regression_reason'] || '' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/oxibelt-performance-artifacts"
          aggregate_args=(
            --input-dir "${RUNNER_TEMP}/oxibelt-performance-artifacts"
            --output-dir "${RUNNER_TEMP}/oxibelt-performance-comparison"
            --profile "${PERFORMANCE_PROFILE}"
            --expected-shards 20
            --expected-target-cpus x86-64-v2,x86-64-v3
            --primary-target-cpu x86-64-v3
          )
          if [[ "${PERFORMANCE_ITERATIONS}" =~ ^[1-9][0-9]*$ ]]; then
            aggregate_args+=(--expected-runs "${PERFORMANCE_ITERATIONS}")
          else
            echo "::warning title=Docker performance summary::performance_iterations is not a positive integer; missing-run checks will be skipped"
          fi
          if [[ -n "${BASELINE_REPORT}" ]]; then
            aggregate_args+=(--baseline-report "${BASELINE_REPORT}")
            if [[ -n "${BASELINE_CONTEXT}" ]]; then
              aggregate_args+=(--baseline-context "${BASELINE_CONTEXT}")
            fi
          else
            echo "::warning title=Docker performance delta::baseline comparison artifact was not available; delta report will be skipped"
          fi
          if [[ -n "${PERFORMANCE_ACCEPTED_REGRESSION_REASON}" ]]; then
            aggregate_args+=(--accepted-regression-reason "${PERFORMANCE_ACCEPTED_REGRESSION_REASON}")
          fi

          cargo run --quiet --locked -p oxibelt --bin oxibelt-performance-aggregate -- "${aggregate_args[@]}"

      - name: Append Docker performance comparison summary
        if: steps.performance-artifacts.outputs.found == 'true'
        run: |
          cat "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.md" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-delta.md" ]]; then
            printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-delta.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Docker performance comparison
        if: always() && steps.performance-artifacts.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-performance-${{ env.PERFORMANCE_PROFILE }}-comparison
          path: ${{ runner.temp }}/oxibelt-performance-comparison
          if-no-files-found: ignore
          retention-days: 0

      - name: Evaluate Docker performance regression gates
        if: steps.performance-artifacts.outputs.found == 'true'
        env:
          OXIBELT_ACTIONS_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          actions_var_or_default() {
            local name="$1"
            local fallback="$2"
            jq -r --arg name "${name}" --arg fallback "${fallback}" \
              '.[$name] // "" | if . == "" then $fallback else . end' \
              <<<"${OXIBELT_ACTIONS_VARS_JSON}"
          }
          OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE="$(actions_var_or_default OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE warn)"
          OXIBELT_PERF_DIAGNOSTIC_GATE_MODE="$(actions_var_or_default OXIBELT_PERF_DIAGNOSTIC_GATE_MODE warn)"
          unset OXIBELT_ACTIONS_VARS_JSON
          results_files="$(jq -r '.artifact_discovery.results_files // 0' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          unsupported_count="$(jq -r '.artifact_discovery.unsupported_cpu.count // 0' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if [[ "${results_files}" == "0" ]]; then
            echo "Docker performance produced no results.json files; unsupported AMD64 target artifacts: ${unsupported_count}" >&2
            exit 1
          fi

          failed=0
          missing_expected_count="$(jq -r '(.artifact_discovery.missing_expected_paths // []) | length' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if (( missing_expected_count > 0 )); then
            jq -r '.artifact_discovery.missing_expected_paths[]? | "::warning title=Docker performance missing expected result::" + .' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
            echo "Docker performance is missing ${missing_expected_count} expected result path(s); sample quorum decides whether this blocks" >&2
          fi

          quorum_status="$(jq -r '.quorum.status // "unknown"' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if [[ "${quorum_status}" != "pass" ]]; then
            jq -r '.quorum.violations[]? | "::error title=Docker performance insufficient evidence::" + .' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
            echo "Docker performance sample quorum failed with status '${quorum_status}'" >&2
            failed=1
          fi

          external_diagnostic_count="$(jq -r '[.external_benchmarks[]? | select((.classification // "") == "benchmark_infrastructure_diagnostic") | {serving_type: (.serving_type // "unknown"), amd64_target_cpu: (.amd64_target_cpu // "unknown"), tool: (.tool // "unknown"), scenario: (.scenario // "unknown"), protocol: (.protocol // "unknown"), diagnostic_reason: (.diagnostic_reason // "benchmark infrastructure diagnostic")}] | unique | length' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if (( external_diagnostic_count > 0 )); then
            jq -r '[.external_benchmarks[]? | select((.classification // "") == "benchmark_infrastructure_diagnostic") | {serving_type: (.serving_type // "unknown"), amd64_target_cpu: (.amd64_target_cpu // "unknown"), tool: (.tool // "unknown"), scenario: (.scenario // "unknown"), protocol: (.protocol // "unknown"), diagnostic_reason: (.diagnostic_reason // "benchmark infrastructure diagnostic")}] | unique | .[] | "::warning title=External benchmark diagnostic::" + .tool + " " + .serving_type + " " + .scenario + "/" + .protocol + " on " + .amd64_target_cpu + ": " + .diagnostic_reason' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
            echo "Docker performance external benchmark validation reported ${external_diagnostic_count} infrastructure diagnostic group(s)" >&2
          fi

          external_failure_count="$(jq -r '[.external_benchmarks[]? | select((.classification // "") != "benchmark_infrastructure_diagnostic") | (.fail_count // 0)] | add // 0' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if (( external_failure_count > 0 )); then
            jq -r '.external_benchmarks[]? | select(((.classification // "") != "benchmark_infrastructure_diagnostic") and ((.fail_count // 0) > 0)) | "::warning title=External benchmark validation::" + .tool + " " + .comparator + " " + .scenario + "/" + .protocol + " failed " + ((.fail_count // 0) | tostring) + " sample(s)"' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
            echo "Docker performance external benchmark validation reported ${external_failure_count} failed sample(s)" >&2
            if [[ "${OXIBELT_EXTERNAL_BENCHMARK_GATE_MODE}" == "fail" ]]; then
              jq -r '.external_benchmarks[]? | select(((.classification // "") != "benchmark_infrastructure_diagnostic") and ((.fail_count // 0) > 0)) | "::error title=External benchmark validation gate::" + .tool + " " + .comparator + " " + .scenario + "/" + .protocol + " failed " + ((.fail_count // 0) | tostring) + " sample(s)"' \
                "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
              failed=1
            fi
          fi

          profile_environment_count="$(jq -r '[.profiling[]? | select((.classification // "") == "profiling_environment_unavailable") | {serving_type: (.serving_type // "unknown"), amd64_target_cpu: (.amd64_target_cpu // "unknown"), diagnostic_group: (.diagnostic_group // .scenario // "unknown"), protocol: (.protocol // "unknown"), profile_mode: (.profile_mode // "unknown"), diagnostic_reason: (.diagnostic_reason // "profiling unavailable in this environment")}] | unique | length' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if (( profile_environment_count > 0 )); then
            echo "::warning title=Docker performance diagnostic profiling::profiling unavailable in the current environment for ${profile_environment_count} comparator group(s): perf record failed with status 255; see performance-comparison.md"
            jq -r '[.profiling[]? | select((.classification // "") == "profiling_environment_unavailable") | {serving_type: (.serving_type // "unknown"), amd64_target_cpu: (.amd64_target_cpu // "unknown"), diagnostic_group: (.diagnostic_group // .scenario // "unknown"), protocol: (.protocol // "unknown"), profile_mode: (.profile_mode // "unknown"), diagnostic_reason: (.diagnostic_reason // "profiling unavailable in this environment")}] | unique | .[] | "Docker performance diagnostic profiling unavailable: " + .serving_type + " " + .diagnostic_group + "/" + .protocol + " " + .profile_mode + " on " + .amd64_target_cpu + ": " + .diagnostic_reason' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json" >&2
          fi

          profile_failure_count="$(jq -r '[.profiling[]? | select((.classification // "") != "profiling_environment_unavailable") | (.fail_count // 0)] | add // 0' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if (( profile_failure_count > 0 )); then
            echo "::warning title=Docker performance diagnostic profiling::Docker performance diagnostic profiling reported ${profile_failure_count} unavailable sample(s); see performance-comparison.md"
            echo "Docker performance diagnostic profiling reported ${profile_failure_count} unavailable sample(s); see performance-comparison.md" >&2
            if [[ "${OXIBELT_PERF_DIAGNOSTIC_GATE_MODE}" == "fail" ]]; then
              jq -r '.profiling[]? | select(((.classification // "") != "profiling_environment_unavailable") and ((.fail_count // 0) > 0)) | "::error title=Docker performance diagnostic profiling gate::" + .comparator + " " + .scenario + "/" + .protocol + " " + .profile_mode + " failed " + ((.fail_count // 0) | tostring) + " sample(s)"' \
                "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
              failed=1
            fi
          fi

          gate_status="$(jq -r '.regression_gates.status // "unknown"' "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json")"
          if [[ "${gate_status}" == "pass" && "${failed}" == "0" ]]; then
            echo "Docker performance regression gates passed"
            exit 0
          fi

          if [[ "${gate_status}" != "pass" ]]; then
            jq -r '.regression_gates.violations[]? | "::error title=Docker performance regression gate::" + .message' \
              "${RUNNER_TEMP}/oxibelt-performance-comparison/performance-comparison.json"
            echo "Docker performance regression gates failed with status '${gate_status}'" >&2
            failed=1
          fi
          exit "${failed}"

  docker-aggressive-long-run:
    name: Docker aggressive long-run
    runs-on: ubuntu-latest
    needs:
      - docker-performance
    if: needs.docker-performance.result == 'success' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs['aggressive_long_run']))
    permissions:
      actions: read
      contents: read
    timeout-minutes: 360
    env:
      AGGRESSIVE_LONG_RUN_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs['aggressive_long_run_seconds'] || '18000' }}
      AGGRESSIVE_LONG_RUN_CONCURRENCY: ${{ github.event_name == 'workflow_dispatch' && inputs['aggressive_long_run_concurrency'] || '256' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Select AMD64 Docker image artifact
        id: select-amd64-image
        run: |
          if ! tests/scripts/select-amd64-docker-image-artifact.sh x86-64-v3; then
            echo "::error title=AMD64 v3 unsupported::Docker aggressive long-run requires an x86-64-v3-capable runner; manually rerun this job to get a different runner."
            exit 1
          fi

      - name: Download AMD64 Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ steps.select-amd64-image.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_IMAGE_TAR: ${{ steps.select-amd64-image.outputs.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_IMAGE_TAR}"

      - name: Run aggressive long-run
        env:
          OXIBELT_DOCKER_IMAGE: ${{ steps.select-amd64-image.outputs.image_tag }}
          OXIBELT_AMD64_TARGET_CPU: ${{ steps.select-amd64-image.outputs.target_cpu }}
          OXIBELT_PERF_OXIBELT_AGGRESSIVE_SCENARIO: baseline-aggressive-long-run
          OXIBELT_PERF_SOAK_SECONDS: ${{ env.AGGRESSIVE_LONG_RUN_SECONDS }}
          OXIBELT_PERF_CONCURRENCY: ${{ env.AGGRESSIVE_LONG_RUN_CONCURRENCY }}
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-aggressive-long-run
        run: |
          if [[ ! "${AGGRESSIVE_LONG_RUN_SECONDS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "aggressive_long_run_seconds must be a positive integer; got '${AGGRESSIVE_LONG_RUN_SECONDS}'" >&2
            exit 2
          fi
          if [[ ! "${AGGRESSIVE_LONG_RUN_CONCURRENCY}" =~ ^[1-9][0-9]*$ ]]; then
            echo "aggressive_long_run_concurrency must be a positive integer; got '${AGGRESSIVE_LONG_RUN_CONCURRENCY}'" >&2
            exit 2
          fi

          tests/scripts/run-proxy-performance.sh \
            --profile soak \
            --serving-type oxibelt-aggressive-long-run \
            --comparators oxibelt

      - name: Append aggressive long-run summary
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/oxibelt-aggressive-long-run/summary.md" ]]; then
            cat "${RUNNER_TEMP}/oxibelt-aggressive-long-run/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload aggressive long-run artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-docker-aggressive-long-run-${{ github.run_id }}
          path: ${{ runner.temp }}/oxibelt-aggressive-long-run
          if-no-files-found: ignore
          retention-days: 0
