name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      performance_profile:
        description: Docker performance profile to run after integration checks
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - benchmark
          - soak
      performance_iterations:
        description: Docker performance iterations per runner shard
        required: false
        default: "5"
        type: string
      performance_h2_profile:
        description: Record host perf evidence for the x86-64-v3 oxibelt-h2 smoke row
        required: false
        default: false
        type: boolean
      performance_profile_label:
        description: Record host perf evidence for one exact reverse-proxy load label
        required: false
        default: none
        type: choice
        options:
          - none
          - oxibelt-h2
          - oxibelt-h3
      performance_accepted_regression_reason:
        description: Accept current Docker performance regression gates and publish a new comparison baseline
        required: false
        default: ""
        type: string
      aggressive_long_run:
        description: Run the scheduled aggressive long-run job after Docker performance
        required: false
        default: false
        type: boolean
      aggressive_long_run_seconds:
        description: Aggressive long-run steady soak duration in seconds
        required: false
        default: "18000"
        type: string
      aggressive_long_run_concurrency:
        description: Aggressive long-run load concurrency
        required: false
        default: "256"
        type: string
      submit_dependency_snapshots:
        description: Submit Docker image dependency snapshots during manual runs
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  # Keep this job independent. If test jobs need it, a PR can intentionally
  # fail structure checks and cause branch-protected test jobs to be skipped.
  source-structure:
    name: Source structure checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Rust module size
        run: tests/scripts/check-rust-module-size.sh

      - name: Person proof UI asset uses pinned npm dependencies
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const exactVersion = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          const checkedFields = ['dependencies', 'devDependencies', 'optionalDependencies', 'peerDependencies', 'overrides'];
          const invalid = [];

          const checkValue = (file, path, value) => {
            if (typeof value === 'string') {
              if (!exactVersion.test(value)) {
                invalid.push(`${file}:${path}=${value}`);
              }
              return;
            }

            if (value && typeof value === 'object' && !Array.isArray(value)) {
              for (const [key, nested] of Object.entries(value)) {
                checkValue(file, `${path}.${key}`, nested);
              }
            }
          };

          const file = 'ui/person-proof/package.json';
          const manifest = JSON.parse(readFileSync(file, 'utf8'));
          for (const field of checkedFields) {
            checkValue(file, field, manifest[field]);
          }

          if (invalid.length > 0) {
            console.error(`npm dependencies must use exact versions:\n${invalid.join('\n')}`);
            process.exit(1);
          }
          NODE
          npm install --prefix ui/person-proof --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run --prefix ui/person-proof build
          npm run --prefix ui/person-proof check:openapi
          git diff --exit-code source/assets/person-proof-challenge.html

  test:
    name: Test (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.96.0
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Tests rustfmt
        run: tests/scripts/check-tests-rustfmt.sh

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  rust-advisory-checks:
    name: Rust advisory checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Rust advisory tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Cargo audit
        run: cargo audit

      - name: Cargo deny advisories
        run: cargo deny check advisories

  fuzz-smoke:
    name: Fuzz smoke (${{ matrix.fuzz_target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fuzz_target:
          - turn_protocol
          - tls_client_hello
          - http_semantics
          - http3_webtransport
          - websocket_frame
          - webrtc_turn

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo +stable install cargo-fuzz --locked

      - name: Run fuzz smoke (${{ matrix.fuzz_target }})
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: cargo +nightly fuzz run ${{ matrix.fuzz_target }} -- -runs=256

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-${{ matrix.fuzz_target }}-fuzz-artifacts
          path: fuzz/artifacts/${{ matrix.fuzz_target }}
          if-no-files-found: ignore
          retention-days: 0

  test-riscv64-qemu:
    name: Test (riscv64 via QEMU, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.96.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: riscv64

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-musl --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )

          if [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            packages+=(
              clang
              libclang-dev
            )
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V target (${{ matrix.target }})
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-g++
          BINDGEN_EXTRA_CLANG_ARGS: --sysroot=/usr/riscv64-linux-gnu
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

  generate-test-matrices:
    name: Generate integration test matrices
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    outputs:
      docker_config_runtime: ${{ steps.matrices.outputs.docker_config_runtime }}
      docker_proxy: ${{ steps.matrices.outputs.docker_proxy }}
      docker_protocol: ${{ steps.matrices.outputs.docker_protocol }}
      docker_waf: ${{ steps.matrices.outputs.docker_waf }}
      docker_cache: ${{ steps.matrices.outputs.docker_cache }}
      docker_state_data: ${{ steps.matrices.outputs.docker_state_data }}
      docker_ops: ${{ steps.matrices.outputs.docker_ops }}
      docker_security: ${{ steps.matrices.outputs.docker_security }}
      browser: ${{ steps.matrices.outputs.browser }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Generate matrices
        id: matrices
        run: |
          cargo_run_with_retry() {
            local attempt=1
            local max_attempts=3
            local status=0
            local delay=5

            while ((attempt <= max_attempts)); do
              if cargo run "$@"; then
                return 0
              fi
              status=$?
              if ((attempt == max_attempts)); then
                return "${status}"
              fi
              printf 'cargo run failed with status %s; retrying in %ss (%s/%s): cargo run %s\n' \
                "${status}" "${delay}" "${attempt}" "${max_attempts}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
              attempt=$((attempt + 1))
            done
          }

          write_docker_matrix() {
            local output_name="$1"
            local group="$2"
            local matrix
            matrix="$(
              cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
                list --suite docker --format github-matrix --group "${group}"
            )"
            echo "${output_name}=${matrix}" >> "${GITHUB_OUTPUT}"
          }

          write_docker_matrix docker_config_runtime config-runtime
          write_docker_matrix docker_proxy proxy
          write_docker_matrix docker_protocol protocol
          write_docker_matrix docker_waf waf
          write_docker_matrix docker_cache cache
          write_docker_matrix docker_state_data state-data
          write_docker_matrix docker_ops ops
          write_docker_matrix docker_security security

          browser_matrix="$(
            cargo_run_with_retry --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite browser --format github-matrix
          )"
          echo "browser=${browser_matrix}" >> "${GITHUB_OUTPUT}"

  linux-target-builds:
    name: Linux target builds
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

  docker-alpine-musl-image-amd64:
    name: Docker image (Alpine musl, amd64, ${{ matrix.target_cpu }})
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64v2
            artifact_name: oxibelt-alpine-musl-amd64v2-image
            target_cpu: x86-64-v2
          - artifact_arch: amd64
            artifact_name: oxibelt-alpine-musl-amd64-image
            target_cpu: x86-64-v3
          - artifact_arch: amd64v4
            artifact_name: oxibelt-alpine-musl-amd64v4-image
            target_cpu: x86-64-v4

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/amd64" \
            "${{ matrix.artifact_arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.artifact_arch }}.tar
          retention-days: 0

  docker-alpine-comparator-musl-image-amd64:
    name: Docker comparator image (Alpine musl, amd64, ${{ matrix.comparator }}, ${{ matrix.target_cpu }})
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - comparator: nginx
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-nginx-x86-64-v2-image
            image_tar: oxibelt-performance-nginx-x86-64-v2.tar
          - comparator: nginx
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-nginx-x86-64-v3-image
            image_tar: oxibelt-performance-nginx-x86-64-v3.tar
          - comparator: caddy
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-caddy-x86-64-v2-image
            image_tar: oxibelt-performance-caddy-x86-64-v2.tar
          - comparator: caddy
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-caddy-x86-64-v3-image
            image_tar: oxibelt-performance-caddy-x86-64-v3.tar
          - comparator: openresty
            target_cpu: x86-64-v2
            artifact_name: oxibelt-performance-openresty-x86-64-v2-image
            image_tar: oxibelt-performance-openresty-x86-64-v2.tar
          - comparator: openresty
            target_cpu: x86-64-v3
            artifact_name: oxibelt-performance-openresty-x86-64-v3-image
            image_tar: oxibelt-performance-openresty-x86-64-v3.tar

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build comparator Docker image artifact
        run: |
          tests/scripts/build-performance-comparator-image-artifact.sh \
            "${{ matrix.comparator }}" \
            "linux/amd64" \
            "${{ matrix.target_cpu }}" \
            "${RUNNER_TEMP}/oxibelt-comparator-image"

      - name: Upload comparator Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-comparator-image/${{ matrix.image_tar }}
          retention-days: 0

  docker-performance-probe-image:
    name: Docker performance probe image
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build performance probe Docker image artifact
        run: |
          tests/scripts/build-performance-probe-image-artifact.sh \
            "linux/amd64" \
            "${RUNNER_TEMP}/oxibelt-performance-probe-image"

      - name: Upload performance probe Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-performance-probe-image
          path: ${{ runner.temp }}/oxibelt-performance-probe-image/oxibelt-performance-probe.tar
          retention-days: 0

  docker-external-benchmark-image:
    name: Docker external benchmark image
    runs-on: ubuntu-latest
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    permissions:
      contents: read
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build external benchmark Docker image artifact
        run: |
          tests/scripts/build-external-benchmark-image-artifact.sh \
            "linux/amd64" \
            "${RUNNER_TEMP}/oxibelt-external-benchmark-image"

      - name: Upload external benchmark Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-external-benchmark-image
          path: ${{ runner.temp }}/oxibelt-external-benchmark-image/oxibelt-external-benchmark-image.tar
          retention-days: 0

  docker-alpine-musl-image-other:
    name: Docker image (Alpine musl, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu_platforms: ""

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Setup QEMU
        if: matrix.qemu_platforms != ''
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: ${{ matrix.qemu_platforms }}

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-alpine-musl-${{ matrix.arch }}-image
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ matrix.arch }}.tar
          retention-days: 0

  docker-alpine-musl-image-riscv64:
    name: Docker image (Alpine musl, riscv64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - test
      - rust-advisory-checks
      - test-riscv64-qemu
      - fuzz-smoke

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3
        with:
          platforms: riscv64

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # 4.1.0

      - name: Build Docker image artifact
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "linux/riscv64" \
            "riscv64" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-alpine-musl-riscv64-image
          path: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-riscv64.tar
          retention-days: 0

  docker-image-trivy-scan:
    name: Docker image Trivy scan (${{ matrix.artifact_arch }})
    runs-on: ubuntu-latest
    needs:
      - docker-alpine-musl-image-amd64
      - docker-alpine-musl-image-other
      - docker-alpine-musl-image-riscv64
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64v2
            artifact_name: oxibelt-alpine-musl-amd64v2-image
            image_tar: oxibelt-alpine-musl-amd64v2.tar
            image_tag: oxibelt:alpine-musl-amd64v2
            scan_target: linux/amd64 x86-64-v2
          - artifact_arch: amd64
            artifact_name: oxibelt-alpine-musl-amd64-image
            image_tar: oxibelt-alpine-musl-amd64.tar
            image_tag: oxibelt:alpine-musl-amd64
            scan_target: linux/amd64 x86-64-v3
          - artifact_arch: amd64v4
            artifact_name: oxibelt-alpine-musl-amd64v4-image
            image_tar: oxibelt-alpine-musl-amd64v4.tar
            image_tag: oxibelt:alpine-musl-amd64v4
            scan_target: linux/amd64 x86-64-v4
          - artifact_arch: arm64
            artifact_name: oxibelt-alpine-musl-arm64-image
            image_tar: oxibelt-alpine-musl-arm64.tar
            image_tag: oxibelt:alpine-musl-arm64
            scan_target: linux/arm64
          - artifact_arch: riscv64
            artifact_name: oxibelt-alpine-musl-riscv64-image
            image_tar: oxibelt-alpine-musl-riscv64.tar
            image_tag: oxibelt:alpine-musl-riscv64
            scan_target: linux/riscv64

    steps:
      - name: Download OxiBelt Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-image/${{ matrix.artifact_arch }}

      - name: Load OxiBelt Docker image
        env:
          OXIBELT_ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          OXIBELT_IMAGE_TAR: ${{ matrix.image_tar }}
        run: docker load --input "${RUNNER_TEMP}/oxibelt-image/${OXIBELT_ARTIFACT_ARCH}/${OXIBELT_IMAGE_TAR}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image_tag }}
          format: json
          output: trivy-results-${{ matrix.artifact_arch }}.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Append Trivy vulnerability table
        env:
          OXIBELT_IMAGE_TAG: ${{ matrix.image_tag }}
          OXIBELT_SCAN_TARGET: ${{ matrix.scan_target }}
          TRIVY_JSON: trivy-results-${{ matrix.artifact_arch }}.json
        run: |
          {
            echo "### Trivy image scan: \`${OXIBELT_IMAGE_TAG}\`"
            echo
            echo "| Image | Target | Package | Installed | Fixed | Severity | Vulnerability | Title |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
            rows="$(
              jq -r --arg image "${OXIBELT_IMAGE_TAG}" --arg default_target "${OXIBELT_SCAN_TARGET}" '
                def cell:
                  tostring
                  | gsub("\\|"; "\\|")
                  | gsub("[\r\n]+"; " ");
                .Results[]? as $result
                | ($result.Target // $default_target) as $target
                | $result.Vulnerabilities[]?
                | [
                    $image,
                    $target,
                    (.PkgName // ""),
                    (.InstalledVersion // ""),
                    (.FixedVersion // ""),
                    (.Severity // ""),
                    (.VulnerabilityID // ""),
                    (.Title // "")
                  ]
                | map(cell)
                | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) | \(.[4]) | \(.[5]) | \(.[6]) | \(.[7]) |"
              ' "${TRIVY_JSON}"
            )"
            if [[ -z "${rows}" ]]; then
              echo "| ${OXIBELT_IMAGE_TAG} | ${OXIBELT_SCAN_TARGET} | none | - | - | - | - | No vulnerabilities reported |"
            else
              printf '%s\n' "${rows}"
            fi
            echo
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Trivy vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: trivy-oxibelt-${{ matrix.artifact_arch }}-json
          path: trivy-results-${{ matrix.artifact_arch }}.json
          if-no-files-found: error
          retention-days: 0

