name: Check OxiBelt

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.runner }} with rust-${{ matrix.rust_version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup component add rustfmt clippy --toolchain ${{ matrix.rust_version }}

      - name: Cargo fmt
        run: cargo fmt --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo test
        run: cargo test --all-features --locked

  build-riscv64-qemu:
    name: Build (riscv64 via QEMU, rust-${{ matrix.rust_version }}, target-${{ matrix.target }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        rust_version:
          - 1.95.0
        target:
          - riscv64gc-unknown-linux-gnu
          - riscv64gc-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: riscv64

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust_version }} --profile minimal
          rustup default ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-gnu --toolchain ${{ matrix.rust_version }}
          rustup target add riscv64gc-unknown-linux-musl --toolchain ${{ matrix.rust_version }}

      - name: Install RISC-V cross toolchain
        run: |
          sudo apt-get update
          packages=(
            gcc-riscv64-linux-gnu
            g++-riscv64-linux-gnu
            libc6-dev-riscv64-cross
            pkg-config
            cmake
            ninja-build
            perl
          )

          if [[ "${{ matrix.target }}" == "riscv64gc-unknown-linux-musl" ]]; then
            packages+=(
              clang
              libclang-dev
            )
          fi

          sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Cargo check for RISC-V target (${{ matrix.target }})
        env:
          AR_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          AR_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-ar
          CC_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-linux-gnu-g++
        run: |
          cargo check --all-targets --locked --target ${{ matrix.target }}

  docker-integration:
    name: Docker integration checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

      - name: Run proxy integration checks
        run: tests/scripts/run-proxy-integration.sh

  browser-webdriver:
    name: Browser WebDriver proxy checks (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            musl-tools \
            ninja-build \
            openssl \
            perl \
            pkg-config

      - name: Build GNU and musl targets
        run: tests/scripts/build-targets.sh

      - name: Run browser-to-proxy WebDriver check
        run: tests/scripts/run-browser-webdriver-check.sh "${{ matrix.browser }}"
