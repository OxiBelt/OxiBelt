  kubernetes-immutable-rollout:
    name: Kubernetes ${{ matrix.kubernetes }} immutable Gateway rollout
    runs-on: ubuntu-26.04
    needs:
      - docker-alpine-musl-role-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: v1.34.8
            kubectl: v1.34.10
            node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
          - kubernetes: v1.35.5
            kubectl: v1.35.7
            node_image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
          - kubernetes: v1.36.1
            kubectl: v1.36.3
            node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.3

      - name: Validate Helm Admin configuration
        run: tests/scripts/check-helm-admin-config.sh

      - name: Validate Helm base configuration
        run: tests/scripts/check-helm-base-config.sh

      - name: Validate Helm edge-secure-medium profile
        run: tests/scripts/check-helm-edge-secure-medium-profile.sh

      - name: Validate Helm edge-secure-medium v2 deployment envelope
        run: tests/scripts/check-helm-edge-secure-medium-v2.sh

      - name: Validate Helm strict data-plane profile
        run: tests/scripts/check-helm-strict-dataplane.sh

      - name: Validate Helm ServiceAccount token hardening
        run: tests/scripts/check-helm-service-account-token.sh

      - name: Validate Gateway controller high availability
        run: tests/scripts/check-helm-gateway-controller-ha.sh

      - name: Install Kind and kubectl
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.32.0
          kubectl_version: ${{ matrix.kubectl }}
          install_only: true

      - name: Download AMD64 data-plane Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-dataplane-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-dataplane-image

      - name: Download AMD64 Gateway Controller Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-gateway-controller-alpine-musl-amd64-image
          path: ${{ runner.temp }}/oxibelt-gateway-controller-image

      - name: Load role-specific OxiBelt Docker images
        run: |
          docker load --input "${RUNNER_TEMP}/oxibelt-dataplane-image/oxibelt-dataplane-alpine-musl-amd64.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-gateway-controller-image/oxibelt-gateway-controller-alpine-musl-amd64.tar"

      - name: Run Kubernetes immutable rollout
        env:
          OXIBELT_DATAPLANE_DOCKER_IMAGE: oxibelt-dataplane:alpine-musl-amd64
          OXIBELT_GATEWAY_CONTROLLER_DOCKER_IMAGE: oxibelt-gateway-controller:alpine-musl-amd64
          OXIBELT_KUBERNETES_KIND_NODE_IMAGE: ${{ matrix.node_image }}
          OXIBELT_KUBERNETES_ROLLOUT_TIMEOUT_SECONDS: "420"
        run: tests/scripts/run-kubernetes-immutable-rollout.sh

  kubernetes-strict-hardening:
    name: Kubernetes strict seccomp and Landlock hardening
    runs-on: ubuntu-26.04
    needs:
      - docker-alpine-musl-role-image-amd64
    permissions:
      actions: read
      contents: read
    timeout-minutes: 20

