name: Release OxiBelt image architecture

on:
  workflow_call:
    inputs:
      artifact_arch:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      qemu_platforms:
        required: false
        type: string
        default: ""
      release_ref:
        required: true
        type: string
      release_created:
        required: true
        type: string
      release_kind:
        required: true
        type: string
      release_revision:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_url:
        required: true
        type: string
    secrets:
      ghcr_token:
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_GHCR_IMAGE: ghcr.io/oxibelt/oxibelt

jobs:
  build:
    name: Build Docker image (${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      OXIBELT_DOCKER_PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Apply release metadata
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/oxibelt-release-metadata/Cargo.lock" Cargo.lock
          cp "${RUNNER_TEMP}/oxibelt-release-metadata/source/Cargo.toml" source/Cargo.toml

      - name: Setup QEMU
        if: inputs.qemu_platforms != ''
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8
        with:
          platforms: ${{ inputs.qemu_platforms }}

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Build Docker image artifact
        env:
          OXIBELT_DOCKER_IMAGE_CREATED: ${{ inputs.release_created }}
          OXIBELT_DOCKER_IMAGE_REF_NAME: ${{ inputs.release_version }}
          OXIBELT_DOCKER_IMAGE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_DOCKER_IMAGE_SOURCE: ${{ inputs.source_url }}
          OXIBELT_DOCKER_IMAGE_VERSION: ${{ inputs.release_version }}
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "${OXIBELT_DOCKER_PLATFORM}" \
            "${OXIBELT_ARTIFACT_ARCH}" \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Validate Docker image artifact
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          OXIBELT_RELEASE_KIND: ${{ inputs.release_kind }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${IMAGE_TAR}" "${OXIBELT_ARTIFACT_ARCH}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys
          import tarfile

          plan_path = pathlib.Path(sys.argv[1])
          image_tar = pathlib.Path(sys.argv[2])
          artifact_arch = sys.argv[3]
          version = sys.argv[4]
          kind = sys.argv[5]
          revision = sys.argv[6]
          source = sys.argv[7]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          image = "ghcr.io/oxibelt/oxibelt"

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 2:
              raise SystemExit("unsupported image release plan schema")
          if plan["image"] != image:
              raise SystemExit("release image must publish to ghcr.io/oxibelt/oxibelt")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("oxibelt-alpine-musl-amd64v2-image", "oxibelt-alpine-musl-amd64v2.tar", "amd64", "x86-64-v2"),
              "amd64": ("oxibelt-alpine-musl-amd64-image", "oxibelt-alpine-musl-amd64.tar", "amd64", "x86-64-v3"),
              "amd64v4": ("oxibelt-alpine-musl-amd64v4-image", "oxibelt-alpine-musl-amd64v4.tar", "amd64", "x86-64-v4"),
              "arm64": ("oxibelt-alpine-musl-arm64-image", "oxibelt-alpine-musl-arm64.tar", "arm64", None),
              "riscv64": ("oxibelt-alpine-musl-riscv64-image", "oxibelt-alpine-musl-riscv64.tar", "riscv64", None),
          }
          def expected_artifact_tags(arch):
              aliases = [f"{image}:{major}-alpine-musl-{arch}"] if kind == "stable" else []
              return f"{image}:{version}-alpine-musl-{arch}", aliases

          artifacts = {}
          for artifact in plan["artifacts"]:
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix: {sorted(artifacts)}")
          if artifact_arch not in artifacts:
              raise SystemExit(f"release plan is missing artifact {artifact_arch}")

          artifact_name, image_tar_name, docker_arch, target_cpu = expected[artifact_arch]
          artifact = artifacts[artifact_arch]
          if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar_name:
              raise SystemExit(f"unexpected artifact naming for {artifact_arch}")
          if image_tar.name != image_tar_name:
              raise SystemExit(f"unexpected image tar path for {artifact_arch}: {image_tar}")
          if artifact["dockerArchitecture"] != docker_arch:
              raise SystemExit(f"unexpected docker architecture for {artifact_arch}")
          if target_cpu is None:
              if "targetCpu" in artifact:
                  raise SystemExit(f"{artifact_arch} should not declare targetCpu")
          elif artifact.get("targetCpu") != target_cpu:
              raise SystemExit(f"{artifact_arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
          expected_tag, expected_aliases = expected_artifact_tags(artifact_arch)
          if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
              raise SystemExit(f"unexpected GHCR tags for {artifact_arch}")
          if artifact["sbomArtifactName"] != f"oxibelt-release-sbom-{artifact_arch}":
              raise SystemExit(f"unexpected SBOM artifact name for {artifact_arch}")
          if artifact["sbomFile"] != f"oxibelt-release-{artifact_arch}.cdx.json":
              raise SystemExit(f"unexpected SBOM file name for {artifact_arch}")

          if not image_tar.is_file():
              raise SystemExit(f"missing Docker image tar: {image_tar}")
          with tarfile.open(image_tar) as docker_tar:
              manifest_member = docker_tar.extractfile("manifest.json")
              if manifest_member is None:
                  raise SystemExit(f"{image_tar} is missing manifest.json")
              manifest = json.load(manifest_member)
              if len(manifest) != 1:
                  raise SystemExit(f"{image_tar} should contain exactly one image")
              config_member = docker_tar.extractfile(manifest[0]["Config"])
              if config_member is None:
                  raise SystemExit(f"{image_tar} is missing image config")
              config = json.load(config_member)

          labels = config.get("config", {}).get("Labels", {})
          for key, expected_value in {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.ref.name": version,
              "org.opencontainers.image.revision": revision,
              "org.opencontainers.image.source": source,
              "org.opencontainers.image.url": source,
          }.items():
              if labels.get(key) != expected_value:
                  raise SystemExit(f"{image_tar} label {key} was {labels.get(key)!r}, expected {expected_value!r}")
          if config.get("architecture") != docker_arch:
              raise SystemExit(f"{image_tar} architecture does not match release plan")
          entrypoint = config.get("config", {}).get("Entrypoint")
          if entrypoint != ["/usr/local/bin/oxibelt", "--config", "/etc/oxibelt/config/oxibelt.toml"]:
              raise SystemExit(f"{image_tar} has unexpected entrypoint: {entrypoint}")
          exposed = config.get("config", {}).get("ExposedPorts", {})
          if "8443/tcp" not in exposed or "8443/udp" not in exposed:
              raise SystemExit(f"{image_tar} must expose 8443/tcp and 8443/udp")
          PY

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-inputs.json
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan Docker image (${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    needs:
      - build
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load image for scanning
        id: trivy-image
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
        run: |
          set -euo pipefail

          image_ref="$(jq -r --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.artifactArch == $arch) | .localTag' "${IMAGE_PLAN}")"
          if [[ -z "${image_ref}" || "${image_ref}" == "null" ]]; then
            echo "release plan is missing local tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi
          docker load --input "${IMAGE_TAR}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.trivy-image.outputs.image_ref }}
          format: json
          output: trivy-results-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: image
          image-ref: ${{ steps.trivy-image.outputs.image_ref }}
          format: cyclonedx
          output: ${{ runner.temp }}/oxibelt-sbom-raw-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json

      - name: Inventory release binaries
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_REF: ${{ steps.trivy-image.outputs.image_ref }}
          INVENTORY_FILE: ${{ runner.temp }}/oxibelt-binaries-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          container_id="$(docker create "${IMAGE_REF}")"
          binary_root="$(mktemp -d "${RUNNER_TEMP}/oxibelt-binaries.XXXXXX")"
          cleanup() {
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
            rm -rf -- "${binary_root}"
          }
          trap cleanup EXIT

          inventory='[]'
          while read -r binary; do
            install_path="/usr/local/bin/${binary}"
            docker cp "${container_id}:${install_path}" "${binary_root}/${binary}"
            digest="$(sha256sum "${binary_root}/${binary}" | awk '{print $1}')"
            inventory="$(jq -c \
              --arg name "${binary}" \
              --arg path "${install_path}" \
              --arg version "${OXIBELT_RELEASE_VERSION}" \
              --arg sha256 "${digest}" \
              '. + [{name: $name, path: $path, version: $version, sha256: $sha256}]' \
              <<<"${inventory}")"
          done < <(jq -r '.sbom.binaries[]' "${IMAGE_PLAN}")

          jq -n --argjson binaries "${inventory}" \
            '{schemaVersion: 1, binaries: $binaries}' >"${INVENTORY_FILE}"

      - name: Enrich and validate platform SBOM
        env:
          BUILD_INPUTS: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-inputs.json
          BUILD_METADATA: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          METADATA_ROOT: ${{ runner.temp }}/oxibelt-release-metadata
          RAW_SBOM: ${{ runner.temp }}/oxibelt-sbom-raw-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          BINARY_INVENTORY: ${{ runner.temp }}/oxibelt-binaries-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          OXIBELT_RELEASE_CREATED: ${{ inputs.release_created }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          artifact_json="$(jq -c --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.artifactArch == $arch)' "${IMAGE_PLAN}")"
          sbom_file="$(jq -r '.sbomFile' <<<"${artifact_json}")"
          workflow="$(jq -r '.sbom.platformBuilderWorkflow' "${IMAGE_PLAN}")"
          build_digest="$(jq -r '."containerimage.digest"' "${BUILD_METADATA}")"
          if [[ ! "${build_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx metadata contains an invalid image digest: ${build_digest}" >&2
            exit 1
          fi
          if [[ "${sbom_file}" != "oxibelt-release-${OXIBELT_ARTIFACT_ARCH}.cdx.json" ]]; then
            echo "release plan has an invalid SBOM file for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/oxibelt-sbom"
          generated="$(date -u '+%Y-%m-%dT%H:%M:%S.%NZ')"
          node "${METADATA_ROOT}/release-tools/release_sbom.js" platform \
            --trivy "${RAW_SBOM}" \
            --build-metadata "${BUILD_METADATA}" \
            --build-inputs "${BUILD_INPUTS}" \
            --binaries "${BINARY_INVENTORY}" \
            --output "${RUNNER_TEMP}/oxibelt-sbom/${sbom_file}" \
            --image "${OXIBELT_GHCR_IMAGE}" \
            --digest "${build_digest}" \
            --version "${OXIBELT_RELEASE_VERSION}" \
            --revision "${OXIBELT_RELEASE_REVISION}" \
            --source "${OXIBELT_SOURCE_URL}" \
            --created "${OXIBELT_RELEASE_CREATED}" \
            --generated "${generated}" \
            --workflow "${workflow}"
          sbom_size="$(stat -c '%s' "${RUNNER_TEMP}/oxibelt-sbom/${sbom_file}")"
          if [[ "${sbom_size}" -gt 16777216 ]]; then
            echo "platform SBOM exceeds the 16 MiB attestation limit: ${sbom_size}" >&2
            exit 1
          fi

      - name: Upload platform SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-sbom/oxibelt-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Trivy vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: trivy-release-oxibelt-${{ env.OXIBELT_ARTIFACT_ARCH }}-json
          path: trivy-results-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish canonical GHCR image (${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    needs:
      - scan
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Validate Docker image artifact for publish
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          OXIBELT_RELEASE_KIND: ${{ inputs.release_kind }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${IMAGE_TAR}" "${OXIBELT_ARTIFACT_ARCH}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys
          import tarfile

          plan_path = pathlib.Path(sys.argv[1])
          image_tar = pathlib.Path(sys.argv[2])
          artifact_arch = sys.argv[3]
          version = sys.argv[4]
          kind = sys.argv[5]
          revision = sys.argv[6]
          source = sys.argv[7]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          image = "ghcr.io/oxibelt/oxibelt"

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 2:
              raise SystemExit("unsupported image release plan schema")
          if plan["image"] != image:
              raise SystemExit("release image must publish to ghcr.io/oxibelt/oxibelt")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("oxibelt-alpine-musl-amd64v2-image", "oxibelt-alpine-musl-amd64v2.tar", "amd64", "x86-64-v2"),
              "amd64": ("oxibelt-alpine-musl-amd64-image", "oxibelt-alpine-musl-amd64.tar", "amd64", "x86-64-v3"),
              "amd64v4": ("oxibelt-alpine-musl-amd64v4-image", "oxibelt-alpine-musl-amd64v4.tar", "amd64", "x86-64-v4"),
              "arm64": ("oxibelt-alpine-musl-arm64-image", "oxibelt-alpine-musl-arm64.tar", "arm64", None),
              "riscv64": ("oxibelt-alpine-musl-riscv64-image", "oxibelt-alpine-musl-riscv64.tar", "riscv64", None),
          }
          def expected_artifact_tags(arch):
              aliases = [f"{image}:{major}-alpine-musl-{arch}"] if kind == "stable" else []
              return f"{image}:{version}-alpine-musl-{arch}", aliases

          artifacts = {}
          for artifact in plan["artifacts"]:
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix: {sorted(artifacts)}")
          if artifact_arch not in artifacts:
              raise SystemExit(f"release plan is missing artifact {artifact_arch}")

          artifact_name, image_tar_name, docker_arch, target_cpu = expected[artifact_arch]
          artifact = artifacts[artifact_arch]
          if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar_name:
              raise SystemExit(f"unexpected artifact naming for {artifact_arch}")
          if image_tar.name != image_tar_name:
              raise SystemExit(f"unexpected image tar path for {artifact_arch}: {image_tar}")
          if artifact["dockerArchitecture"] != docker_arch:
              raise SystemExit(f"unexpected docker architecture for {artifact_arch}")
          if target_cpu is None:
              if "targetCpu" in artifact:
                  raise SystemExit(f"{artifact_arch} should not declare targetCpu")
          elif artifact.get("targetCpu") != target_cpu:
              raise SystemExit(f"{artifact_arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
          expected_tag, expected_aliases = expected_artifact_tags(artifact_arch)
          if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
              raise SystemExit(f"unexpected GHCR tags for {artifact_arch}")

          if not image_tar.is_file():
              raise SystemExit(f"missing Docker image tar: {image_tar}")
          with tarfile.open(image_tar) as docker_tar:
              manifest_member = docker_tar.extractfile("manifest.json")
              if manifest_member is None:
                  raise SystemExit(f"{image_tar} is missing manifest.json")
              manifest = json.load(manifest_member)
              if len(manifest) != 1:
                  raise SystemExit(f"{image_tar} should contain exactly one image")
              config_member = docker_tar.extractfile(manifest[0]["Config"])
              if config_member is None:
                  raise SystemExit(f"{image_tar} is missing image config")
              config = json.load(config_member)

          labels = config.get("config", {}).get("Labels", {})
          for key, expected_value in {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.ref.name": version,
              "org.opencontainers.image.revision": revision,
              "org.opencontainers.image.source": source,
              "org.opencontainers.image.url": source,
          }.items():
              if labels.get(key) != expected_value:
                  raise SystemExit(f"{image_tar} label {key} was {labels.get(key)!r}, expected {expected_value!r}")
          if config.get("architecture") != docker_arch:
              raise SystemExit(f"{image_tar} architecture does not match release plan")
          entrypoint = config.get("config", {}).get("Entrypoint")
          if entrypoint != ["/usr/local/bin/oxibelt", "--config", "/etc/oxibelt/config/oxibelt.toml"]:
              raise SystemExit(f"{image_tar} has unexpected entrypoint: {entrypoint}")
          exposed = config.get("config", {}).get("ExposedPorts", {})
          if "8443/tcp" not in exposed or "8443/udp" not in exposed:
              raise SystemExit(f"{image_tar} must expose 8443/tcp and 8443/udp")
          PY

      - name: Push canonical arch-specific GHCR tag
        id: publish
        env:
          BUILD_METADATA: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
        run: |
          set -euo pipefail

          artifact_json="$(jq -c --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.artifactArch == $arch)' "${IMAGE_PLAN}")"
          if [[ -z "${artifact_json}" ]]; then
            echo "release plan is missing artifact ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          local_tag="$(jq -r '.localTag' <<<"${artifact_json}")"
          if [[ -z "${local_tag}" || "${local_tag}" == "null" ]]; then
            echo "release plan is missing local tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          docker load --input "${IMAGE_TAR}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          if [[ -z "${canonical_tag}" || "${canonical_tag}" == "null" ]]; then
            echo "release plan is missing the canonical tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          expected_digest="$(jq -r '."containerimage.digest"' "${BUILD_METADATA}")"
          if [[ ! "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx metadata contains an invalid image digest: ${expected_digest}" >&2
            exit 1
          fi

          inspect_error="${RUNNER_TEMP}/canonical-inspect-${OXIBELT_ARTIFACT_ARCH}.log"
          if existing_descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' 2>"${inspect_error}")"; then
            existing_digest="$(jq -r '.digest' <<<"${existing_descriptor}")"
            if [[ "${existing_digest}" != "${expected_digest}" ]]; then
              echo "refusing to replace canonical tag ${canonical_tag}: ${existing_digest} != ${expected_digest}" >&2
              exit 1
            fi
          elif grep -Eqi 'manifest unknown|404 Not Found|not found' "${inspect_error}"; then
            docker tag "${local_tag}" "${canonical_tag}"
            docker push "${canonical_tag}"
          else
            cat "${inspect_error}" >&2
            echo "failed to determine whether canonical tag ${canonical_tag} already exists" >&2
            exit 1
          fi

          descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"${descriptor}")"
          image_architecture="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Image}}' | jq -r '.architecture')"
          expected_architecture="$(jq -r '.dockerArchitecture' <<<"${artifact_json}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid digest for ${canonical_tag}: ${digest}" >&2
            exit 1
          fi
          if [[ "${digest}" != "${expected_digest}" ]]; then
            echo "registry digest ${digest} does not match Buildx digest ${expected_digest}" >&2
            exit 1
          fi
          if [[ "${image_architecture}" != "${expected_architecture}" ]]; then
            echo "registry architecture ${image_architecture} does not match ${expected_architecture}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  attest:
    name: Attest platform SBOM (${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-sbom

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish platform SBOM attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ghcr.io/oxibelt/oxibelt
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/oxibelt-sbom/oxibelt-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          push-to-registry: true
          create-storage-record: false

  verify:
    name: Verify platform SBOM attestation (${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - attest
      - publish
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download expected platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-sbom

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Verify platform SBOM from OCI
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.ghcr_token }}
          METADATA_ROOT: ${{ runner.temp }}/oxibelt-release-metadata
          EXPECTED_SBOM: ${{ runner.temp }}/oxibelt-sbom/oxibelt-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
        run: |
          set -euo pipefail

          predicate_type="$(jq -r '.sbom.predicateType' "${METADATA_ROOT}/image-plan.json")"
          workflow="$(jq -r '.sbom.platformBuilderWorkflow' "${METADATA_ROOT}/image-plan.json")"
          gh attestation verify "oci://${OXIBELT_GHCR_IMAGE}@${DIGEST}" \
            --repo OxiBelt/OxiBelt \
            --signer-workflow "${workflow}" \
            --source-digest "${{ inputs.release_revision }}" \
            --source-ref "${{ inputs.release_ref }}" \
            --predicate-type "${predicate_type}" \
            --bundle-from-oci \
            --deny-self-hosted-runners \
            --format json >"${RUNNER_TEMP}/verified-attestations.json"

          jq -e 'length >= 1' "${RUNNER_TEMP}/verified-attestations.json" >/dev/null
          jq -e --slurpfile expected "${EXPECTED_SBOM}" '
            [.[] | .verificationResult.statement.predicate | select(. == $expected[0])]
            | length >= 1
          ' "${RUNNER_TEMP}/verified-attestations.json" >/dev/null
          jq -e . "${EXPECTED_SBOM}" >"${RUNNER_TEMP}/verified-sbom.cdx.json"
          node "${METADATA_ROOT}/release-tools/release_sbom.js" verify \
            --input "${RUNNER_TEMP}/verified-sbom.cdx.json" \
            --kind platform \
            --digest "${DIGEST}" \
            --revision "${{ inputs.release_revision }}" \
            --workflow "${workflow}" \
            --image "${OXIBELT_GHCR_IMAGE}" \
            --version "${{ inputs.release_version }}"

  promote:
    name: Promote verified GHCR aliases (${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
      - verify
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Promote digest to mutable aliases
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          artifact_json="$(jq -c --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.artifactArch == $arch)' "${IMAGE_PLAN}")"
          while read -r alias_tag; do
            [[ -n "${alias_tag}" ]] || continue
            docker buildx imagetools create --prefer-index=false --tag "${alias_tag}" "${OXIBELT_GHCR_IMAGE}@${DIGEST}"
            alias_digest="$(docker buildx imagetools inspect "${alias_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${alias_digest}" != "${DIGEST}" ]]; then
              echo "alias ${alias_tag} resolved to ${alias_digest}, expected ${DIGEST}" >&2
              exit 1
            fi
          done < <(jq -r '.aliasGhcrTags[]' <<<"${artifact_json}")
