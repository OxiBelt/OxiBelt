name: Publish OxiBelt image architecture

on:
  workflow_call:
    inputs:
      artifact_arch:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      image_role:
        required: true
        type: string
      image:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      release_created:
        required: true
        type: string
      release_kind:
        required: true
        type: string
      release_revision:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_url:
        required: true
        type: string
      transport_artifact_name:
        required: true
        type: string
      vulnerability_decision_artifact_name:
        required: true
        type: string
    secrets:
      ghcr_token:
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  OXIBELT_GHCR_IMAGE: ${{ inputs.image }}
  OXIBELT_IMAGE_ROLE: ${{ inputs.image_role }}
  OXIBELT_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}
  OXIBELT_TRANSPORT_ARTIFACT_NAME: ${{ inputs.transport_artifact_name }}


jobs:
  publish:
    name: Publish canonical GHCR image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_TRANSPORT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Download controlled vulnerability gate decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.vulnerability_decision_artifact_name }}
          path: ${{ runner.temp }}/oxibelt-vulnerability-decision

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.0
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Validate Docker image artifact for publish
        env:
          ARTIFACT_CONTRACT: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-artifact-contract.json
          BUILD_METADATA: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          OXIBELT_RELEASE_KIND: ${{ inputs.release_kind }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          PUBLISH_IDENTITY: ${{ runner.temp }}/oxibelt-image/publish-image-identity.json
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${IMAGE_TAR}" "${BUILD_METADATA}" "${ARTIFACT_CONTRACT}" "${PUBLISH_IDENTITY}" "${OXIBELT_IMAGE_ROLE}" "${OXIBELT_ARTIFACT_PREFIX}" "${OXIBELT_ARTIFACT_ARCH}" "${OXIBELT_GHCR_IMAGE}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys
          import tarfile

          maximum_json_bytes = 8 * 1024 * 1024
          maximum_image_bytes = 4 * 1024 * 1024 * 1024
          maximum_archive_members = 4096
          digest_pattern = re.compile(r"sha256:[0-9a-f]{64}\Z")

          plan_path = pathlib.Path(sys.argv[1])
          image_tar = pathlib.Path(sys.argv[2])
          metadata_path = pathlib.Path(sys.argv[3])
          contract_path = pathlib.Path(sys.argv[4])
          output_path = pathlib.Path(sys.argv[5])
          role = sys.argv[6]
          artifact_prefix = sys.argv[7]
          artifact_arch = sys.argv[8]
          image = sys.argv[9]
          version = sys.argv[10]
          kind = sys.argv[11]
          revision = sys.argv[12]
          source = sys.argv[13]

          def fail(message):
              raise SystemExit(message)

          def load_json(path, description):
              if not path.is_file():
                  fail(f"missing {description}: {path}")
              if path.stat().st_size > maximum_json_bytes:
                  fail(f"{description} exceeds the 8 MiB limit: {path}")
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as error:
                  fail(f"cannot read {description} {path}: {error}")

          def parse_digest(value, description):
              if not isinstance(value, str) or digest_pattern.fullmatch(value) is None:
                  fail(f"{description} is not a SHA-256 digest")
              return value

          def safe_member_name(value):
              if not isinstance(value, str) or "\x00" in value or "\\" in value:
                  fail(f"unsafe Docker archive member name: {value!r}")
              path = pathlib.PurePosixPath(value)
              if path.is_absolute() or any(part in ("", ".", "..") for part in path.parts):
                  fail(f"unsafe Docker archive member name: {value!r}")
              return path.as_posix()

          def read_regular_member(archive, name):
              try:
                  member = archive.getmember(name)
              except KeyError:
                  fail(f"Docker archive is missing {name}")
              if not member.isfile() or member.size > maximum_json_bytes:
                  fail(f"Docker archive member {name} is not a bounded regular file")
              stream = archive.extractfile(member)
              if stream is None:
                  fail(f"Docker archive member {name} cannot be read")
              return stream.read()

          def sha256_file(path):
              if not path.is_file():
                  fail(f"missing Docker image tar: {path}")
              if path.stat().st_size > maximum_image_bytes:
                  fail(f"Docker image tar exceeds the 4 GiB limit: {path}")
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return f"sha256:{digest.hexdigest()}"

          plan = load_json(plan_path, "image release plan")
          metadata = load_json(metadata_path, "Buildx metadata")
          contract = load_json(contract_path, "image artifact contract")

          if kind not in ("stable", "beta", "build"):
              fail(f"invalid release kind: {kind}")
          if not isinstance(plan, dict) or plan.get("schemaVersion") != 8:
              fail("unsupported image release plan schema")
          if not isinstance(metadata, dict):
              fail("Buildx metadata must be a JSON object")
          if not isinstance(contract, dict) or contract.get("schema") != 3:
              fail("unsupported image artifact contract schema")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")
          if plan["sourceRef"] != f"refs/tags/{version}" or plan["sourceDirty"] != "clean" or plan["buildKind"] != "official_release":
              raise SystemExit("release plan build identity is not an official clean tag tuple")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("amd64", "x86-64-v2"),
              "amd64": ("amd64", "x86-64-v3"),
              "amd64v4": ("amd64", "x86-64-v4"),
              "arm64": ("arm64", None),
              "riscv64": ("riscv64", None),
          }
          role_contracts = [item for item in plan["roles"] if item["role"] == role]
          if len(role_contracts) != 1:
              raise SystemExit(f"release plan must contain exactly one role contract for {role}")
          role_contract = role_contracts[0]
          if role_contract["image"] != image:
              raise SystemExit(f"release role {role} must publish to {image}")
          artifacts = {}
          for artifact in plan["artifacts"]:
              if artifact["role"] != role:
                  continue
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {role}/{arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix for {role}: {sorted(artifacts)}")
          if artifact_arch not in artifacts:
              raise SystemExit(f"release plan is missing artifact {role}/{artifact_arch}")

          docker_arch, target_cpu = expected[artifact_arch]
          artifact_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}-image"
          image_tar_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}.tar"
          artifact = artifacts[artifact_arch]
          if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar_name:
              raise SystemExit(f"unexpected artifact naming for {artifact_arch}")
          if image_tar.name != image_tar_name:
              raise SystemExit(f"unexpected image tar path for {artifact_arch}: {image_tar}")
          for key in ("image", "dockerTarget", "binaries", "entrypoint", "user", "ports", "embeddedAssets"):
              if artifact[key] != role_contract[key]:
                  raise SystemExit(f"artifact {role}/{artifact_arch} has inconsistent {key}")
          if artifact["dockerArchitecture"] != docker_arch:
              raise SystemExit(f"unexpected docker architecture for {artifact_arch}")
          if target_cpu is None:
              if "targetCpu" in artifact:
                  raise SystemExit(f"{artifact_arch} should not declare targetCpu")
          elif artifact.get("targetCpu") != target_cpu:
              raise SystemExit(f"{artifact_arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
          expected_tag = f"{image}:{version}-alpine-musl-{artifact_arch}"
          expected_aliases = [f"{image}:{major}-alpine-musl-{artifact_arch}"] if kind == "stable" else []
          if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
              raise SystemExit(f"unexpected GHCR tags for {artifact_arch}")
          expected_local_reference = f"{artifact_prefix}:alpine-musl-{artifact_arch}"
          if artifact.get("localTag") != expected_local_reference:
              fail("image release plan local tag does not match the matrix identity")

          expected_metadata_name = (
              f"{artifact_prefix}-alpine-musl-{artifact_arch}-build-metadata.json"
          )
          for field, expected_value in {
              "role": role,
              "artifact_arch": artifact_arch,
              "image_tar": image_tar_name,
              "build_metadata": expected_metadata_name,
          }.items():
              if contract.get(field) != expected_value:
                  fail(
                      f"image artifact contract {field} was "
                      f"{contract.get(field)!r}, expected {expected_value!r}"
                  )
          if metadata_path.name != expected_metadata_name:
              fail("downloaded build metadata filename does not match the matrix identity")
          if contract.get("image_tar_sha256") != sha256_file(image_tar):
              fail("Docker image tar digest does not match the artifact contract")

          config_digest = parse_digest(
              contract.get("config_digest"), "artifact contract config digest"
          )
          manifest_digest = parse_digest(
              contract.get("image_digest"), "artifact contract image digest"
          )
          if contract.get("descriptor_digest") != manifest_digest:
              fail("artifact contract descriptor and image digests differ")
          if metadata.get("containerimage.config.digest") != config_digest:
              fail("Buildx config digest does not match the artifact contract")
          if metadata.get("containerimage.digest") != manifest_digest:
              fail("Buildx image digest does not match the artifact contract")
          descriptor = metadata.get("containerimage.descriptor")
          if not isinstance(descriptor, dict) or descriptor.get("digest") != manifest_digest:
              fail("Buildx descriptor digest does not match the artifact contract")

          try:
              with tarfile.open(image_tar, mode="r:*") as docker_tar:
                  members = []
                  for member in docker_tar:
                      members.append(member)
                      if len(members) > maximum_archive_members:
                          fail("Docker archive exceeds the 4096-member limit")
                  names = [safe_member_name(member.name) for member in members]
                  if len(names) != len(set(names)):
                      fail("Docker archive contains duplicate member names")
                  manifest = json.loads(
                      read_regular_member(docker_tar, "manifest.json")
                  )
                  if not isinstance(manifest, list) or len(manifest) != 1:
                      fail("Docker archive must contain exactly one image")
                  entry = manifest[0]
                  if not isinstance(entry, dict):
                      fail("Docker archive manifest entry must be an object")
                  config_name = safe_member_name(entry.get("Config"))
                  config_bytes = read_regular_member(docker_tar, config_name)
                  archive_config_digest = (
                      f"sha256:{hashlib.sha256(config_bytes).hexdigest()}"
                  )
                  config_hash = archive_config_digest.removeprefix("sha256:")
                  if config_name not in (
                      f"{config_hash}.json",
                      f"blobs/sha256/{config_hash}",
                  ):
                      fail(
                          "Docker archive config path is not content addressed "
                          "by its digest"
                      )
                  if archive_config_digest != config_digest:
                      fail(
                          "Docker archive config digest does not match the "
                          "artifact contract"
                      )
                  if entry.get("RepoTags") != [expected_local_reference]:
                      fail("Docker archive repository tag does not match the release plan")

                  index = json.loads(read_regular_member(docker_tar, "index.json"))
                  if not isinstance(index, dict) or index.get("schemaVersion") != 2:
                      fail("Docker archive OCI index must use schema version 2")
                  manifests = index.get("manifests")
                  if not isinstance(manifests, list) or len(manifests) != 1:
                      fail("Docker archive OCI index must contain exactly one manifest")
                  archive_descriptor = manifests[0]
                  if not isinstance(archive_descriptor, dict):
                      fail("Docker archive OCI manifest descriptor must be an object")
                  if (
                      parse_digest(
                          archive_descriptor.get("digest"),
                          "Docker archive OCI manifest descriptor digest",
                      )
                      != manifest_digest
                  ):
                      fail(
                          "Docker archive OCI manifest descriptor does not match "
                          "the artifact contract"
                      )
                  manifest_hash = manifest_digest.removeprefix("sha256:")
                  manifest_bytes = read_regular_member(
                      docker_tar, f"blobs/sha256/{manifest_hash}"
                  )
                  if (
                      f"sha256:{hashlib.sha256(manifest_bytes).hexdigest()}"
                      != manifest_digest
                  ):
                      fail(
                          "Docker archive OCI manifest blob digest does not match "
                          "the artifact contract"
                      )
                  if archive_descriptor.get("size") != len(manifest_bytes):
                      fail("Docker archive OCI manifest descriptor size is invalid")
                  image_manifest = json.loads(manifest_bytes)
                  if (
                      not isinstance(image_manifest, dict)
                      or image_manifest.get("schemaVersion") != 2
                  ):
                      fail("Docker archive OCI image manifest must use schema version 2")
                  image_config = image_manifest.get("config")
                  if (
                      not isinstance(image_config, dict)
                      or parse_digest(
                          image_config.get("digest"),
                          "Docker archive OCI config descriptor digest",
                      )
                      != config_digest
                  ):
                      fail(
                          "Docker archive OCI image manifest config does not match "
                          "the validated config"
                      )
                  if image_config.get("size") != len(config_bytes):
                      fail("Docker archive OCI config descriptor size is invalid")
                  config = json.loads(config_bytes)
          except (OSError, tarfile.TarError, json.JSONDecodeError) as error:
              fail(f"invalid Docker archive {image_tar}: {error}")

          labels = config.get("config", {}).get("Labels", {})
          for key, expected_value in {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.ref.name": version,
              "org.opencontainers.image.revision": revision,
              "org.opencontainers.image.source": source,
              "org.opencontainers.image.url": source,
              "io.oxibelt.image.role": role,
          }.items():
              if labels.get(key) != expected_value:
                  raise SystemExit(f"{image_tar} label {key} was {labels.get(key)!r}, expected {expected_value!r}")
          if config.get("architecture") != docker_arch:
              raise SystemExit(f"{image_tar} architecture does not match release plan")
          image_config = config.get("config", {})
          entrypoint = image_config.get("Entrypoint")
          if entrypoint != role_contract["entrypoint"]:
              raise SystemExit(f"{image_tar} has unexpected entrypoint: {entrypoint}")
          if image_config.get("User") != role_contract["user"]:
              raise SystemExit(f"{image_tar} has unexpected user: {image_config.get('User')}")
          exposed = sorted(image_config.get("ExposedPorts", {}).keys())
          if exposed != sorted(role_contract["ports"]):
              raise SystemExit(f"{image_tar} has unexpected exposed ports: {exposed}")
          output_path.write_text(
              json.dumps(
                  {
                      "configDigest": config_digest,
                      "imageReference": expected_local_reference,
                      "manifestDigest": manifest_digest,
                  },
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify platform subject was admitted by the global vulnerability gate
        env:
          DECISION: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.json
          POLICY: ${{ runner.temp }}/oxibelt-release-metadata/policy/image-vulnerability-policy.json
          PUBLISH_IDENTITY: ${{ runner.temp }}/oxibelt-image/publish-image-identity.json
        run: |
          set -euo pipefail

          manifest_digest="$(jq -er '.manifestDigest' "${PUBLISH_IDENTITY}")"
          if [[ ! "${manifest_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "validated image manifest digest is invalid: ${manifest_digest}" >&2
            exit 1
          fi
          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/image_vulnerability_policy.mjs" verify-subject \
            --decision "${DECISION}" \
            --policy "${POLICY}" \
            --role "${OXIBELT_IMAGE_ROLE}" \
            --architecture "${OXIBELT_ARTIFACT_ARCH}" \
            --channel "${{ inputs.release_kind }}" \
            --revision "${{ inputs.release_revision }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --manifest-digest "${manifest_digest}"

      - name: Push canonical arch-specific GHCR tag
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          PUBLISH_IDENTITY: ${{ runner.temp }}/oxibelt-image/publish-image-identity.json
        run: |
          set -euo pipefail

          retry_command() {
            local attempts="$1"
            shift
            local delay=5
            local attempt status

            for attempt in $(seq 1 "${attempts}"); do
              "$@" && return 0
              status=$?
              if [[ "${attempt}" == "${attempts}" ]]; then
                return "${status}"
              fi
              printf 'Command failed with status %s; retrying in %ss (%s/%s): %s\n' \
                "${status}" "${delay}" "${attempt}" "${attempts}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          artifact_json="$(jq -c --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          if [[ -z "${artifact_json}" ]]; then
            echo "release plan is missing artifact ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          local_tag="$(jq -er '.imageReference' "${PUBLISH_IDENTITY}")"
          if [[ "$(jq -er '.localTag' <<<"${artifact_json}")" != "${local_tag}" ]]; then
            echo "validated local tag does not match the release plan" >&2
            exit 1
          fi

          config_digest="$(jq -er '.configDigest' "${PUBLISH_IDENTITY}")"
          expected_digest="$(jq -er '.manifestDigest' "${PUBLISH_IDENTITY}")"
          inspect_error="${RUNNER_TEMP}/publish-preexisting-${OXIBELT_ARTIFACT_ARCH}.log"
          if existing_image_id="$(docker image inspect --format '{{.Id}}' "${local_tag}" 2>"${inspect_error}")"; then
            echo "refusing to replace preexisting Docker image reference ${local_tag} (${existing_image_id})" >&2
            exit 1
          elif ! grep -Eiq 'no such (image|object)' "${inspect_error}"; then
            cat "${inspect_error}" >&2
            echo "cannot inspect Docker image reference ${local_tag}" >&2
            exit 1
          fi

          docker load --input "${IMAGE_TAR}"
          image_id="$(docker image inspect --format '{{.Id}}' "${local_tag}")"
          if [[ "${image_id}" != "${config_digest}" && "${image_id}" != "${expected_digest}" ]]; then
            echo "loaded image ID ${image_id} is not bound to the validated archive" >&2
            exit 1
          fi
          if [[ "$(docker image inspect --format '{{.Id}}' "${image_id}")" != "${image_id}" ]]; then
            echo "loaded image ID ${image_id} is not an exact daemon reference" >&2
            exit 1
          fi

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          if [[ -z "${canonical_tag}" || "${canonical_tag}" == "null" ]]; then
            echo "release plan is missing the canonical tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          if [[ ! "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "validated image manifest digest is invalid: ${expected_digest}" >&2
            exit 1
          fi

          inspect_error="${RUNNER_TEMP}/canonical-inspect-${OXIBELT_ARTIFACT_ARCH}.log"
          if existing_descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' 2>"${inspect_error}")"; then
            existing_digest="$(jq -r '.digest' <<<"${existing_descriptor}")"
            if [[ "${existing_digest}" != "${expected_digest}" ]]; then
              echo "refusing to replace canonical tag ${canonical_tag}: ${existing_digest} != ${expected_digest}" >&2
              exit 1
            fi
          elif grep -Eqi 'manifest unknown|404 Not Found|not found' "${inspect_error}"; then
            docker tag "${local_tag}" "${canonical_tag}"
            docker push "${canonical_tag}"
          else
            cat "${inspect_error}" >&2
            echo "failed to determine whether canonical tag ${canonical_tag} already exists" >&2
            exit 1
          fi

          descriptor="$(retry_command 3 docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"${descriptor}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid digest for ${canonical_tag}: ${digest}" >&2
            exit 1
          fi
          if [[ "${digest}" != "${expected_digest}" ]]; then
            echo "registry digest ${digest} does not match Buildx digest ${expected_digest}" >&2
            exit 1
          fi

          image_architecture="$(retry_command 3 docker buildx imagetools inspect "${OXIBELT_GHCR_IMAGE}@${digest}" --format '{{json .Image}}' | jq -r '.architecture')"
          expected_architecture="$(jq -r '.dockerArchitecture' <<<"${artifact_json}")"
          if [[ "${image_architecture}" != "${expected_architecture}" ]]; then
            echo "registry architecture ${image_architecture} does not match ${expected_architecture}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  attest:
    name: Attest platform image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-sbom

      - name: Download platform rebuild recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-rebuild-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-rebuild

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.0
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Validate immutable platform attestation subject
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          RELEASE_REF: ${{ inputs.release_ref }}
          REBUILD_RECIPE: ${{ runner.temp }}/oxibelt-platform-rebuild/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.rebuild.json
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_SBOM: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact_json="$(jq -ce --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          local_tag="$(jq -r '.localTag' <<<"${artifact_json}")"
          platform="$(jq -r '.platform' <<<"${artifact_json}")"
          target_cpu="$(jq -r '.targetCpu // "architecture-default"' <<<"${artifact_json}")"
          [[ "$(jq -r '.image' <<<"${artifact_json}")" == "${OXIBELT_GHCR_IMAGE}" ]]

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "${resolved_digest}" != "${DIGEST}" ]]; then
            echo "canonical platform tag ${canonical_tag} resolved to ${resolved_digest}, expected ${DIGEST}" >&2
            exit 1
          fi

          jq -e \
            --arg local_tag "${local_tag}" \
            --arg role "${OXIBELT_IMAGE_ROLE}" \
            --arg version "${RELEASE_VERSION}" \
            --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" \
            --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            --arg platform "${platform}" \
            --arg target_cpu "${target_cpu}" \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${DIGEST}" '
            .bomFormat == "CycloneDX"
            and (.specVersion == "1.6" or .specVersion == "1.7")
            and (.serialNumber | type == "string" and length > 0)
            and .metadata.component.type == "container"
            and .metadata.component.name == $local_tag
            and .metadata.component.version == $version
            and .metadata.component["bom-ref"] == $local_tag
            and .metadata.component.hashes == [{alg: "SHA-256", content: ($digest | ltrimstr("sha256:"))}]
            and ([.metadata.component.properties[].name] | length == 9 and (unique | length == 9))
            and ([.metadata.component.properties[] | {key: .name, value: .value}] | from_entries) == {
              "io.oxibelt.image.role": $role,
              "io.oxibelt.release.version": $version,
              "io.oxibelt.release.revision": $revision,
              "io.oxibelt.release.ref": $ref,
              "io.oxibelt.artifact.arch": $arch,
              "io.oxibelt.oci.platform": $platform,
              "io.oxibelt.target.cpu": $target_cpu,
              "io.oxibelt.image.repository": $image,
              "io.oxibelt.image.digest": $digest
            }
          ' "${RELEASE_SBOM}" >/dev/null
          jq -e \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${DIGEST}" \
            --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" \
            --arg role "${OXIBELT_IMAGE_ROLE}" \
            --arg arch "${OXIBELT_ARTIFACT_ARCH}" '
              .schemaVersion == 1
              and .predicateType == "https://oxibelt.dev/attestations/rebuild/v1"
              and .kind == "platform"
              and .subject == {name: $image, digest: $digest}
              and .source.revision == $revision
              and .source.ref == $ref
              and .build.role == $role
              and .build.artifactArch == $arch
              and .output.artifactContract.schema == 3
            ' "${REBUILD_RECIPE}" >/dev/null

      - name: Publish signed platform provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: false

      - name: Publish signed platform SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          push-to-registry: false

      - name: Publish signed platform rebuild recipe
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          predicate-type: https://oxibelt.dev/attestations/rebuild/v1
          predicate-path: ${{ runner.temp }}/oxibelt-platform-rebuild/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.rebuild.json
          push-to-registry: false

  verify:
    name: Verify platform attestations (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
      - attest
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-sbom

      - name: Download platform rebuild recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-rebuild-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-rebuild

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.0
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Verify GitHub API platform attestations
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          REBUILD_RECIPE: ${{ runner.temp }}/oxibelt-platform-rebuild/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.rebuild.json
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_SBOM: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
        run: |
          set -euo pipefail

          retry_attestation() {
            local output="$1"
            shift
            local attempt delay=5
            for attempt in 1 2 3 4; do
              if "$@" >"${output}"; then
                return 0
              fi
              if [[ "${attempt}" == 4 ]]; then
                return 1
              fi
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          artifact_json="$(jq -ce --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "${resolved_digest}" != "${DIGEST}" ]]; then
            echo "canonical platform tag ${canonical_tag} resolved to ${resolved_digest}, expected ${DIGEST}" >&2
            exit 1
          fi

          subject="oci://${OXIBELT_GHCR_IMAGE}@${DIGEST}"
          common_args=(
            "${subject}"
            --repo OxiBelt/OxiBelt
            --signer-workflow OxiBelt/OxiBelt/.github/workflows/release-image-arch.yml
            --signer-digest "${RELEASE_REVISION}"
            --source-digest "${RELEASE_REVISION}"
            --source-ref "${RELEASE_REF}"
            --cert-oidc-issuer https://token.actions.githubusercontent.com
            --deny-self-hosted-runners
            --limit 100
            --format json
          )
          retry_attestation "${RUNNER_TEMP}/platform-provenance.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://slsa.dev/provenance/v1
          retry_attestation "${RUNNER_TEMP}/platform-sbom.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://cyclonedx.org/bom
          retry_attestation "${RUNNER_TEMP}/platform-rebuild.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://oxibelt.dev/attestations/rebuild/v1

          expected_signer="https://github.com/OxiBelt/OxiBelt/.github/workflows/release-image-arch.yml@${RELEASE_REF}"
          for kind in provenance sbom; do
            args=(
              verify
              --attestations "${RUNNER_TEMP}/platform-${kind}.json"
              --subject-name "${OXIBELT_GHCR_IMAGE}"
              --subject-digest "${DIGEST}"
              --signer-workflow "${expected_signer}"
              --source-repository OxiBelt/OxiBelt
              --source-ref "${RELEASE_REF}"
              --source-revision "${RELEASE_REVISION}"
              --workflow-path .github/workflows/release.yml
            )
            if [[ "${kind}" == sbom ]]; then
              args+=(--expected-sbom "${RELEASE_SBOM}")
            fi
            node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/release_sbom.mjs" "${args[@]}"
          done

          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/rebuild_recipe.mjs" extract \
            --attestations "${RUNNER_TEMP}/platform-rebuild.json" \
            --subject-name "${OXIBELT_GHCR_IMAGE}" \
            --subject-digest "${DIGEST}" \
            --signer-workflow "${expected_signer}" \
            --source-repository OxiBelt/OxiBelt \
            --source-ref "${RELEASE_REF}" \
            --source-revision "${RELEASE_REVISION}" \
            --predicate-type https://oxibelt.dev/attestations/rebuild/v1 \
            --output "${RUNNER_TEMP}/verified-platform-rebuild.json"
          jq -e --slurpfile expected "${REBUILD_RECIPE}" '. == $expected[0]' \
            "${RUNNER_TEMP}/verified-platform-rebuild.json" >/dev/null

  promote:
    name: Promote canonical GHCR aliases (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
      - verify
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download controlled vulnerability gate decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ inputs.vulnerability_decision_artifact_name }}
          path: ${{ runner.temp }}/oxibelt-vulnerability-decision

      - name: Revalidate admitted platform subject before promotion
        env:
          DECISION: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.json
          DIGEST: ${{ needs.publish.outputs.digest }}
          POLICY: ${{ runner.temp }}/oxibelt-release-metadata/policy/image-vulnerability-policy.json
        run: |
          set -euo pipefail

          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/image_vulnerability_policy.mjs" verify-subject \
            --decision "${DECISION}" \
            --policy "${POLICY}" \
            --role "${OXIBELT_IMAGE_ROLE}" \
            --architecture "${OXIBELT_ARTIFACT_ARCH}" \
            --channel "${{ inputs.release_kind }}" \
            --revision "${{ inputs.release_revision }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --manifest-digest "${DIGEST}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.0
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Promote digest to mutable aliases
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          artifact_json="$(jq -c --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          while read -r alias_tag; do
            [[ -n "${alias_tag}" ]] || continue
            docker buildx imagetools create --prefer-index=false --tag "${alias_tag}" "${OXIBELT_GHCR_IMAGE}@${DIGEST}"
            alias_digest="$(docker buildx imagetools inspect "${alias_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${alias_digest}" != "${DIGEST}" ]]; then
              echo "alias ${alias_tag} resolved to ${alias_digest}, expected ${DIGEST}" >&2
              exit 1
            fi
          done < <(jq -r '.aliasGhcrTags[]' <<<"${artifact_json}")
