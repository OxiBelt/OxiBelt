name: Release OxiBelt image architecture

on:
  workflow_call:
    inputs:
      artifact_arch:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      artifact_prefix:
        required: true
        type: string
      image_role:
        required: true
        type: string
      image:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      release_ref:
        required: true
        type: string
      release_created:
        required: true
        type: string
      release_kind:
        required: true
        type: string
      release_revision:
        required: true
        type: string
      release_version:
        required: true
        type: string
      source_url:
        required: true
        type: string
    secrets:
      ghcr_token:
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_GHCR_IMAGE: ${{ inputs.image }}
  OXIBELT_IMAGE_ROLE: ${{ inputs.image_role }}
  OXIBELT_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix }}

jobs:
  build:
    name: Build Docker image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
      contents: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      OXIBELT_DOCKER_PLATFORM: ${{ inputs.platform }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          ref: ${{ inputs.release_revision }}
          fetch-depth: 0

      - name: Validate immutable release checkout
        env:
          EXPECTED_REVISION: ${{ inputs.release_revision }}
        run: |
          set -euo pipefail

          if [[ ! "${EXPECTED_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release revision must be a full lowercase Git commit: ${EXPECTED_REVISION}" >&2
            exit 1
          fi
          actual_revision="$(git rev-parse HEAD)"
          if [[ "${actual_revision}" != "${EXPECTED_REVISION}" ]]; then
            echo "release checkout is ${actual_revision}, expected ${EXPECTED_REVISION}" >&2
            exit 1
          fi

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Apply release metadata
        run: |
          set -euo pipefail
          cp -R "${RUNNER_TEMP}/oxibelt-release-metadata/workspace/." .

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh moby/buildkit:buildx-stable-1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Build Docker image artifact
        env:
          OXIBELT_DOCKER_IMAGE_CREATED: ${{ inputs.release_created }}
          OXIBELT_DOCKER_IMAGE_REF_NAME: ${{ inputs.release_version }}
          OXIBELT_DOCKER_IMAGE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_DOCKER_IMAGE_SOURCE: ${{ inputs.source_url }}
          OXIBELT_DOCKER_IMAGE_VERSION: ${{ inputs.release_version }}
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            "${OXIBELT_DOCKER_PLATFORM}" \
            "${OXIBELT_ARTIFACT_ARCH}" \
            "${RUNNER_TEMP}/oxibelt-image" \
            "${OXIBELT_IMAGE_ROLE}"

      - name: Validate Docker image artifact
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          OXIBELT_RELEASE_KIND: ${{ inputs.release_kind }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${IMAGE_TAR}" "${OXIBELT_IMAGE_ROLE}" "${OXIBELT_ARTIFACT_PREFIX}" "${OXIBELT_ARTIFACT_ARCH}" "${OXIBELT_GHCR_IMAGE}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys
          import tarfile

          plan_path = pathlib.Path(sys.argv[1])
          image_tar = pathlib.Path(sys.argv[2])
          role = sys.argv[3]
          artifact_prefix = sys.argv[4]
          artifact_arch = sys.argv[5]
          image = sys.argv[6]
          version = sys.argv[7]
          kind = sys.argv[8]
          revision = sys.argv[9]
          source = sys.argv[10]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 6:
              raise SystemExit("unsupported image release plan schema")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("amd64", "x86-64-v2"),
              "amd64": ("amd64", "x86-64-v3"),
              "amd64v4": ("amd64", "x86-64-v4"),
              "arm64": ("arm64", None),
              "riscv64": ("riscv64", None),
          }
          role_contracts = [item for item in plan["roles"] if item["role"] == role]
          if len(role_contracts) != 1:
              raise SystemExit(f"release plan must contain exactly one role contract for {role}")
          role_contract = role_contracts[0]
          if role_contract["image"] != image:
              raise SystemExit(f"release role {role} must publish to {image}")
          artifacts = {}
          for artifact in plan["artifacts"]:
              if artifact["role"] != role:
                  continue
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {role}/{arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix for {role}: {sorted(artifacts)}")
          if artifact_arch not in artifacts:
              raise SystemExit(f"release plan is missing artifact {role}/{artifact_arch}")

          docker_arch, target_cpu = expected[artifact_arch]
          artifact_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}-image"
          image_tar_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}.tar"
          artifact = artifacts[artifact_arch]
          if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar_name:
              raise SystemExit(f"unexpected artifact naming for {role}/{artifact_arch}")
          if image_tar.name != image_tar_name:
              raise SystemExit(f"unexpected image tar path for {artifact_arch}: {image_tar}")
          for key in ("image", "dockerTarget", "binaries", "entrypoint", "user", "ports", "embeddedAssets"):
              if artifact[key] != role_contract[key]:
                  raise SystemExit(f"artifact {role}/{artifact_arch} has inconsistent {key}")
          if artifact["dockerArchitecture"] != docker_arch:
              raise SystemExit(f"unexpected docker architecture for {artifact_arch}")
          if target_cpu is None:
              if "targetCpu" in artifact:
                  raise SystemExit(f"{artifact_arch} should not declare targetCpu")
          elif artifact.get("targetCpu") != target_cpu:
              raise SystemExit(f"{artifact_arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
          expected_tag = f"{image}:{version}-alpine-musl-{artifact_arch}"
          expected_aliases = [f"{image}:{major}-alpine-musl-{artifact_arch}"] if kind == "stable" else []
          if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
              raise SystemExit(f"unexpected GHCR tags for {artifact_arch}")

          if not image_tar.is_file():
              raise SystemExit(f"missing Docker image tar: {image_tar}")
          with tarfile.open(image_tar) as docker_tar:
              manifest_member = docker_tar.extractfile("manifest.json")
              if manifest_member is None:
                  raise SystemExit(f"{image_tar} is missing manifest.json")
              manifest = json.load(manifest_member)
              if len(manifest) != 1:
                  raise SystemExit(f"{image_tar} should contain exactly one image")
              config_member = docker_tar.extractfile(manifest[0]["Config"])
              if config_member is None:
                  raise SystemExit(f"{image_tar} is missing image config")
              config = json.load(config_member)

          labels = config.get("config", {}).get("Labels", {})
          for key, expected_value in {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.ref.name": version,
              "org.opencontainers.image.revision": revision,
              "org.opencontainers.image.source": source,
              "org.opencontainers.image.url": source,
              "io.oxibelt.image.role": role,
          }.items():
              if labels.get(key) != expected_value:
                  raise SystemExit(f"{image_tar} label {key} was {labels.get(key)!r}, expected {expected_value!r}")
          if config.get("architecture") != docker_arch:
              raise SystemExit(f"{image_tar} architecture does not match release plan")
          image_config = config.get("config", {})
          entrypoint = image_config.get("Entrypoint")
          if entrypoint != role_contract["entrypoint"]:
              raise SystemExit(f"{image_tar} has unexpected entrypoint: {entrypoint}")
          if image_config.get("User") != role_contract["user"]:
              raise SystemExit(f"{image_tar} has unexpected user: {image_config.get('User')}")
          exposed = sorted(image_config.get("ExposedPorts", {}).keys())
          if exposed != sorted(role_contract["ports"]):
              raise SystemExit(f"{image_tar} has unexpected exposed ports: {exposed}")
          PY

          if [[ "${OXIBELT_IMAGE_ROLE}" == "dataplane-strict" ]]; then
            python3 tests/scripts/validate-strict-dataplane-image.py "${IMAGE_TAR}"
          fi

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
            ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          if-no-files-found: error
          retention-days: 1

  scan:
    name: Scan Docker image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    needs:
      - build
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Load image for scanning
        id: trivy-image
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
        run: |
          set -euo pipefail

          image_ref="$(jq -r --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.role == $role and .artifactArch == $arch) | .localTag' "${IMAGE_PLAN}")"
          if [[ -z "${image_ref}" || "${image_ref}" == "null" ]]; then
            echo "release plan is missing local tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi
          docker load --input "${IMAGE_TAR}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ steps.trivy-image.outputs.image_ref }}
          format: json
          output: trivy-results-${{ env.OXIBELT_ARTIFACT_PREFIX }}-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Generate CycloneDX platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: ${{ steps.trivy-image.outputs.image_ref }}
          format: cyclonedx
          output: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}-raw.cdx.json
          vuln-type: os,library

      - name: Validate release binaries
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_REF: ${{ steps.trivy-image.outputs.image_ref }}
          INVENTORY_FILE: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-binaries-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          container_id="$(docker create "${IMAGE_REF}")"
          binary_root="$(mktemp -d "${RUNNER_TEMP}/oxibelt-binaries.XXXXXX")"
          cleanup() {
            docker rm -f "${container_id}" >/dev/null 2>&1 || true
            rm -rf -- "${binary_root}"
          }
          trap cleanup EXIT

          inventory='[]'
          case "${OXIBELT_ARTIFACT_ARCH}" in
            amd64v2|amd64|amd64v4) expected_machine="Advanced Micro Devices X86-64" ;;
            arm64) expected_machine="AArch64" ;;
            riscv64) expected_machine="RISC-V" ;;
            *)
              echo "unsupported release artifact architecture: ${OXIBELT_ARTIFACT_ARCH}" >&2
              exit 1
              ;;
          esac

          while read -r binary; do
            install_path="/usr/local/bin/${binary}"
            docker cp "${container_id}:${install_path}" "${binary_root}/${binary}"
            binary_path="${binary_root}/${binary}"
            elf_class="$(readelf -hW "${binary_path}" | awk -F: '/^[[:space:]]*Class:/{sub(/^[[:space:]]*/, "", $2); print $2}')"
            elf_machine="$(readelf -hW "${binary_path}" | awk -F: '/^[[:space:]]*Machine:/{sub(/^[[:space:]]*/, "", $2); print $2}')"
            if [[ "${elf_class}" != "ELF64" || "${elf_machine}" != "${expected_machine}" ]]; then
              echo "${install_path} is ${elf_class}/${elf_machine}, expected ELF64/${expected_machine}" >&2
              exit 1
            fi
            if readelf -lW "${binary_path}" | grep -F ' INTERP ' >/dev/null; then
              echo "${install_path} must not request a program interpreter" >&2
              exit 1
            fi
            if readelf -dW "${binary_path}" | grep -F '(NEEDED)' >/dev/null; then
              echo "${install_path} must not declare dynamic shared-library dependencies" >&2
              exit 1
            fi

            digest="$(sha256sum "${binary_path}" | awk '{print $1}')"
            inventory="$(jq -c \
              --arg name "${binary}" \
              --arg path "${install_path}" \
              --arg version "${OXIBELT_RELEASE_VERSION}" \
              --arg sha256 "${digest}" \
              '. + [{name: $name, path: $path, version: $version, sha256: $sha256}]' \
              <<<"${inventory}")"
          done < <(jq -r --arg role "${OXIBELT_IMAGE_ROLE}" '.roles[] | select(.role == $role) | .binaries[]' "${IMAGE_PLAN}")

          jq -n --argjson binaries "${inventory}" \
            '{schemaVersion: 1, binaries: $binaries}' >"${INVENTORY_FILE}"

      - name: Validate and enrich platform SBOM
        env:
          BINARY_INVENTORY: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-binaries-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          BUILD_METADATA: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          RAW_SBOM: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}-raw.cdx.json
          RELEASE_SBOM: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
        run: |
          set -euo pipefail

          image_digest="$(jq -r '."containerimage.digest"' "${BUILD_METADATA}")"
          if [[ ! "${image_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx metadata contains an invalid image digest: ${image_digest}" >&2
            exit 1
          fi
          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/release_sbom.mjs" platform \
            --image-plan "${IMAGE_PLAN}" \
            --trivy-sbom "${RAW_SBOM}" \
            --binary-inventory "${BINARY_INVENTORY}" \
            --role "${OXIBELT_IMAGE_ROLE}" \
            --artifact-arch "${OXIBELT_ARTIFACT_ARCH}" \
            --image-digest "${image_digest}" \
            --output "${RELEASE_SBOM}"

      - name: Upload Trivy vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: trivy-release-${{ env.OXIBELT_ARTIFACT_PREFIX }}-${{ env.OXIBELT_ARTIFACT_ARCH }}-json
          path: trivy-results-${{ env.OXIBELT_ARTIFACT_PREFIX }}-${{ env.OXIBELT_ARTIFACT_ARCH }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload platform SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish canonical GHCR image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ${{ inputs.runner }}
    needs:
      - scan
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}
      OXIBELT_ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-image

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Validate Docker image artifact for publish
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
          OXIBELT_RELEASE_KIND: ${{ inputs.release_kind }}
          OXIBELT_RELEASE_REVISION: ${{ inputs.release_revision }}
          OXIBELT_RELEASE_VERSION: ${{ inputs.release_version }}
          OXIBELT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${IMAGE_TAR}" "${OXIBELT_IMAGE_ROLE}" "${OXIBELT_ARTIFACT_PREFIX}" "${OXIBELT_ARTIFACT_ARCH}" "${OXIBELT_GHCR_IMAGE}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys
          import tarfile

          plan_path = pathlib.Path(sys.argv[1])
          image_tar = pathlib.Path(sys.argv[2])
          role = sys.argv[3]
          artifact_prefix = sys.argv[4]
          artifact_arch = sys.argv[5]
          image = sys.argv[6]
          version = sys.argv[7]
          kind = sys.argv[8]
          revision = sys.argv[9]
          source = sys.argv[10]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 6:
              raise SystemExit("unsupported image release plan schema")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("amd64", "x86-64-v2"),
              "amd64": ("amd64", "x86-64-v3"),
              "amd64v4": ("amd64", "x86-64-v4"),
              "arm64": ("arm64", None),
              "riscv64": ("riscv64", None),
          }
          role_contracts = [item for item in plan["roles"] if item["role"] == role]
          if len(role_contracts) != 1:
              raise SystemExit(f"release plan must contain exactly one role contract for {role}")
          role_contract = role_contracts[0]
          if role_contract["image"] != image:
              raise SystemExit(f"release role {role} must publish to {image}")
          artifacts = {}
          for artifact in plan["artifacts"]:
              if artifact["role"] != role:
                  continue
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {role}/{arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix for {role}: {sorted(artifacts)}")
          if artifact_arch not in artifacts:
              raise SystemExit(f"release plan is missing artifact {role}/{artifact_arch}")

          docker_arch, target_cpu = expected[artifact_arch]
          artifact_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}-image"
          image_tar_name = f"{artifact_prefix}-alpine-musl-{artifact_arch}.tar"
          artifact = artifacts[artifact_arch]
          if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar_name:
              raise SystemExit(f"unexpected artifact naming for {artifact_arch}")
          if image_tar.name != image_tar_name:
              raise SystemExit(f"unexpected image tar path for {artifact_arch}: {image_tar}")
          for key in ("image", "dockerTarget", "binaries", "entrypoint", "user", "ports", "embeddedAssets"):
              if artifact[key] != role_contract[key]:
                  raise SystemExit(f"artifact {role}/{artifact_arch} has inconsistent {key}")
          if artifact["dockerArchitecture"] != docker_arch:
              raise SystemExit(f"unexpected docker architecture for {artifact_arch}")
          if target_cpu is None:
              if "targetCpu" in artifact:
                  raise SystemExit(f"{artifact_arch} should not declare targetCpu")
          elif artifact.get("targetCpu") != target_cpu:
              raise SystemExit(f"{artifact_arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
          expected_tag = f"{image}:{version}-alpine-musl-{artifact_arch}"
          expected_aliases = [f"{image}:{major}-alpine-musl-{artifact_arch}"] if kind == "stable" else []
          if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
              raise SystemExit(f"unexpected GHCR tags for {artifact_arch}")

          if not image_tar.is_file():
              raise SystemExit(f"missing Docker image tar: {image_tar}")
          with tarfile.open(image_tar) as docker_tar:
              manifest_member = docker_tar.extractfile("manifest.json")
              if manifest_member is None:
                  raise SystemExit(f"{image_tar} is missing manifest.json")
              manifest = json.load(manifest_member)
              if len(manifest) != 1:
                  raise SystemExit(f"{image_tar} should contain exactly one image")
              config_member = docker_tar.extractfile(manifest[0]["Config"])
              if config_member is None:
                  raise SystemExit(f"{image_tar} is missing image config")
              config = json.load(config_member)

          labels = config.get("config", {}).get("Labels", {})
          for key, expected_value in {
              "org.opencontainers.image.version": version,
              "org.opencontainers.image.ref.name": version,
              "org.opencontainers.image.revision": revision,
              "org.opencontainers.image.source": source,
              "org.opencontainers.image.url": source,
              "io.oxibelt.image.role": role,
          }.items():
              if labels.get(key) != expected_value:
                  raise SystemExit(f"{image_tar} label {key} was {labels.get(key)!r}, expected {expected_value!r}")
          if config.get("architecture") != docker_arch:
              raise SystemExit(f"{image_tar} architecture does not match release plan")
          image_config = config.get("config", {})
          entrypoint = image_config.get("Entrypoint")
          if entrypoint != role_contract["entrypoint"]:
              raise SystemExit(f"{image_tar} has unexpected entrypoint: {entrypoint}")
          if image_config.get("User") != role_contract["user"]:
              raise SystemExit(f"{image_tar} has unexpected user: {image_config.get('User')}")
          exposed = sorted(image_config.get("ExposedPorts", {}).keys())
          if exposed != sorted(role_contract["ports"]):
              raise SystemExit(f"{image_tar} has unexpected exposed ports: {exposed}")
          PY

          if [[ "${OXIBELT_IMAGE_ROLE}" == "dataplane-strict" ]]; then
            python3 tests/scripts/validate-strict-dataplane-image.py "${IMAGE_TAR}"
          fi

      - name: Push canonical arch-specific GHCR tag
        id: publish
        env:
          BUILD_METADATA: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}-build-metadata.json
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          IMAGE_TAR: ${{ runner.temp }}/oxibelt-image/${{ env.OXIBELT_ARTIFACT_PREFIX }}-alpine-musl-${{ env.OXIBELT_ARTIFACT_ARCH }}.tar
        run: |
          set -euo pipefail

          retry_command() {
            local attempts="$1"
            shift
            local delay=5
            local attempt status

            for attempt in $(seq 1 "${attempts}"); do
              "$@" && return 0
              status=$?
              if [[ "${attempt}" == "${attempts}" ]]; then
                return "${status}"
              fi
              printf 'Command failed with status %s; retrying in %ss (%s/%s): %s\n' \
                "${status}" "${delay}" "${attempt}" "${attempts}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          artifact_json="$(jq -c --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          if [[ -z "${artifact_json}" ]]; then
            echo "release plan is missing artifact ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          local_tag="$(jq -r '.localTag' <<<"${artifact_json}")"
          if [[ -z "${local_tag}" || "${local_tag}" == "null" ]]; then
            echo "release plan is missing local tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          docker load --input "${IMAGE_TAR}"
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          if [[ -z "${canonical_tag}" || "${canonical_tag}" == "null" ]]; then
            echo "release plan is missing the canonical tag for ${OXIBELT_ARTIFACT_ARCH}" >&2
            exit 1
          fi

          expected_digest="$(jq -r '."containerimage.digest"' "${BUILD_METADATA}")"
          if [[ ! "${expected_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx metadata contains an invalid image digest: ${expected_digest}" >&2
            exit 1
          fi

          inspect_error="${RUNNER_TEMP}/canonical-inspect-${OXIBELT_ARTIFACT_ARCH}.log"
          if existing_descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' 2>"${inspect_error}")"; then
            existing_digest="$(jq -r '.digest' <<<"${existing_descriptor}")"
            if [[ "${existing_digest}" != "${expected_digest}" ]]; then
              echo "refusing to replace canonical tag ${canonical_tag}: ${existing_digest} != ${expected_digest}" >&2
              exit 1
            fi
          elif grep -Eqi 'manifest unknown|404 Not Found|not found' "${inspect_error}"; then
            docker tag "${local_tag}" "${canonical_tag}"
            docker push "${canonical_tag}"
          else
            cat "${inspect_error}" >&2
            echo "failed to determine whether canonical tag ${canonical_tag} already exists" >&2
            exit 1
          fi

          descriptor="$(retry_command 3 docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}')"
          digest="$(jq -r '.digest' <<<"${descriptor}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid digest for ${canonical_tag}: ${digest}" >&2
            exit 1
          fi
          if [[ "${digest}" != "${expected_digest}" ]]; then
            echo "registry digest ${digest} does not match Buildx digest ${expected_digest}" >&2
            exit 1
          fi

          image_architecture="$(retry_command 3 docker buildx imagetools inspect "${OXIBELT_GHCR_IMAGE}@${digest}" --format '{{json .Image}}' | jq -r '.architecture')"
          expected_architecture="$(jq -r '.dockerArchitecture' <<<"${artifact_json}")"
          if [[ "${image_architecture}" != "${expected_architecture}" ]]; then
            echo "registry architecture ${image_architecture} does not match ${expected_architecture}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  attest:
    name: Attest platform image (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-sbom

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Validate immutable platform attestation subject
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_SBOM: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          artifact_json="$(jq -ce --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          local_tag="$(jq -r '.localTag' <<<"${artifact_json}")"
          platform="$(jq -r '.platform' <<<"${artifact_json}")"
          target_cpu="$(jq -r '.targetCpu // "architecture-default"' <<<"${artifact_json}")"
          [[ "$(jq -r '.image' <<<"${artifact_json}")" == "${OXIBELT_GHCR_IMAGE}" ]]

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "${resolved_digest}" != "${DIGEST}" ]]; then
            echo "canonical platform tag ${canonical_tag} resolved to ${resolved_digest}, expected ${DIGEST}" >&2
            exit 1
          fi

          jq -e \
            --arg local_tag "${local_tag}" \
            --arg role "${OXIBELT_IMAGE_ROLE}" \
            --arg version "${RELEASE_VERSION}" \
            --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" \
            --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            --arg platform "${platform}" \
            --arg target_cpu "${target_cpu}" \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${DIGEST}" '
            .bomFormat == "CycloneDX"
            and (.specVersion == "1.6" or .specVersion == "1.7")
            and (.serialNumber | type == "string" and length > 0)
            and .metadata.component.type == "container"
            and .metadata.component.name == $local_tag
            and .metadata.component.version == $version
            and .metadata.component["bom-ref"] == $local_tag
            and .metadata.component.hashes == [{alg: "SHA-256", content: ($digest | ltrimstr("sha256:"))}]
            and ([.metadata.component.properties[].name] | length == 9 and (unique | length == 9))
            and ([.metadata.component.properties[] | {key: .name, value: .value}] | from_entries) == {
              "io.oxibelt.image.role": $role,
              "io.oxibelt.release.version": $version,
              "io.oxibelt.release.revision": $revision,
              "io.oxibelt.release.ref": $ref,
              "io.oxibelt.artifact.arch": $arch,
              "io.oxibelt.oci.platform": $platform,
              "io.oxibelt.target.cpu": $target_cpu,
              "io.oxibelt.image.repository": $image,
              "io.oxibelt.image.digest": $digest
            }
          ' "${RELEASE_SBOM}" >/dev/null

      - name: Publish signed platform provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: false

      - name: Publish signed platform SBOM
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
          push-to-registry: false

  verify:
    name: Verify platform attestations (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
      - attest
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download platform SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-sbom-${{ env.OXIBELT_ARTIFACT_ARCH }}
          path: ${{ runner.temp }}/oxibelt-platform-sbom

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Verify GitHub API platform attestations
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_SBOM: ${{ runner.temp }}/oxibelt-platform-sbom/${{ env.OXIBELT_ARTIFACT_PREFIX }}-release-${{ env.OXIBELT_ARTIFACT_ARCH }}.cdx.json
        run: |
          set -euo pipefail

          retry_attestation() {
            local output="$1"
            shift
            local attempt delay=5
            for attempt in 1 2 3 4; do
              if "$@" >"${output}"; then
                return 0
              fi
              if [[ "${attempt}" == 4 ]]; then
                return 1
              fi
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          artifact_json="$(jq -ce --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" \
            '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
          if [[ "${resolved_digest}" != "${DIGEST}" ]]; then
            echo "canonical platform tag ${canonical_tag} resolved to ${resolved_digest}, expected ${DIGEST}" >&2
            exit 1
          fi

          subject="oci://${OXIBELT_GHCR_IMAGE}@${DIGEST}"
          common_args=(
            "${subject}"
            --repo OxiBelt/OxiBelt
            --signer-workflow OxiBelt/OxiBelt/.github/workflows/release-image-arch.yml
            --signer-digest "${RELEASE_REVISION}"
            --source-digest "${RELEASE_REVISION}"
            --source-ref "${RELEASE_REF}"
            --cert-oidc-issuer https://token.actions.githubusercontent.com
            --deny-self-hosted-runners
            --limit 100
            --format json
          )
          retry_attestation "${RUNNER_TEMP}/platform-provenance.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://slsa.dev/provenance/v1
          retry_attestation "${RUNNER_TEMP}/platform-sbom.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://cyclonedx.org/bom

          expected_signer="https://github.com/OxiBelt/OxiBelt/.github/workflows/release-image-arch.yml@${RELEASE_REF}"
          for kind in provenance sbom; do
            args=(
              verify
              --attestations "${RUNNER_TEMP}/platform-${kind}.json"
              --subject-name "${OXIBELT_GHCR_IMAGE}"
              --subject-digest "${DIGEST}"
              --signer-workflow "${expected_signer}"
              --source-repository OxiBelt/OxiBelt
              --source-ref "${RELEASE_REF}"
              --source-revision "${RELEASE_REVISION}"
              --workflow-path .github/workflows/release.yml
            )
            if [[ "${kind}" == sbom ]]; then
              args+=(--expected-sbom "${RELEASE_SBOM}")
            fi
            node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/release_sbom.mjs" "${args[@]}"
          done

  promote:
    name: Promote canonical GHCR aliases (${{ inputs.image_role }}/${{ inputs.artifact_arch }})
    runs-on: ubuntu-26.04
    needs:
      - publish
      - verify
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      OXIBELT_ARTIFACT_ARCH: ${{ inputs.artifact_arch }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.35.0

      - name: Promote digest to mutable aliases
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.ghcr_token }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
        run: |
          set -euo pipefail

          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          artifact_json="$(jq -c --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${OXIBELT_ARTIFACT_ARCH}" '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
          while read -r alias_tag; do
            [[ -n "${alias_tag}" ]] || continue
            docker buildx imagetools create --prefer-index=false --tag "${alias_tag}" "${OXIBELT_GHCR_IMAGE}@${DIGEST}"
            alias_digest="$(docker buildx imagetools inspect "${alias_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${alias_digest}" != "${DIGEST}" ]]; then
              echo "alias ${alias_tag} resolved to ${alias_digest}, expected ${DIGEST}" >&2
              exit 1
            fi
          done < <(jq -r '.aliasGhcrTags[]' <<<"${artifact_json}")
