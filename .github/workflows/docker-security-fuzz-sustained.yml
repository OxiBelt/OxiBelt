name: Sustained Docker security fuzzing

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sustained-docker-security-fuzz-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  prepare:
    name: Prepare sustained Docker security fuzzing
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Generate security fuzz matrix
        id: matrix
        run: |
          matrix="$(
            cargo run --quiet --locked -p oxibelt --bin oxibelt-docker-integration-matrix -- \
              list --suite security-fuzz --format github-matrix
          )"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

      - name: Pre-pull Docker BuildKit image
        run: tests/scripts/retry-docker-pull.sh "${OXIBELT_BUILDKIT_IMAGE}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # 4.3.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Build Alpine OxiBelt image once
        run: |
          tests/scripts/build-docker-image-artifact.sh \
            linux/amd64 \
            amd64v2 \
            "${RUNNER_TEMP}/oxibelt-image"

      - name: Build integration helper images once
        run: |
          tests/scripts/build-docker-integration-helper-images-artifact.sh \
            linux/amd64 \
            "${RUNNER_TEMP}/oxibelt-integration-helper-images"

      - name: Upload sustained Docker security fuzz images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: sustained-docker-security-fuzz-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oxibelt-image/oxibelt-alpine-musl-amd64v2.tar
            ${{ runner.temp }}/oxibelt-integration-helper-images/oxibelt-docker-integration-helper-images.tar
          if-no-files-found: error
          retention-days: 1

  campaign:
    name: Sustained Docker security fuzz (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Download sustained Docker security fuzz images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: sustained-docker-security-fuzz-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oxibelt-security-fuzz-images

      - name: Load OxiBelt and helper images
        run: |
          docker load --input "${RUNNER_TEMP}/oxibelt-security-fuzz-images/oxibelt-image/oxibelt-alpine-musl-amd64v2.tar"
          docker load --input "${RUNNER_TEMP}/oxibelt-security-fuzz-images/oxibelt-integration-helper-images/oxibelt-docker-integration-helper-images.tar"

      - name: Run fifteen-minute Docker security fuzz campaign
        env:
          OXIBELT_DOCKER_IMAGE: oxibelt:alpine-musl-amd64v2
          OXIBELT_MOCK_UPSTREAM_IMAGE: oxibelt/mock-upstream:ci
          OXIBELT_PROTOCOL_PROBE_IMAGE: oxibelt/protocol-probe:ci
          OXIBELT_POSTGRES_IMAGE: oxibelt/postgres:ci
          OXIBELT_REQUIRE_PRELOADED_HELPER_IMAGES: "1"
          OXIBELT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/oxibelt-docker-security-fuzz/${{ matrix.target }}
        run: tests/scripts/run-docker-security-fuzz.sh campaign "${{ matrix.target }}" 900

      - name: Upload Docker security fuzz failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: sustained-docker-security-fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oxibelt-docker-security-fuzz/${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 90
