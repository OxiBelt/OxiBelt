name: Release OxiBelt images

on:
  release:
    types: [published]
  push:
    tags:
      - "*.*.*-build.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict release tag to publish, such as 15.2.0, 15.2.0-beta.1, or 15.2.0-build.4f43abcd
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_BUILDKIT_IMAGE: moby/buildkit:buildx-stable-1@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec
  OXIBELT_GHCR_IMAGE: ghcr.io/oxibelt/oxibelt
  OXIBELT_SOURCE_URL: https://github.com/OxiBelt/OxiBelt

jobs:
  resolve-release-source:
    name: Resolve immutable release source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release-ref.outputs.created }}
      release_ref: ${{ steps.release-ref.outputs.release_ref }}
      revision: ${{ steps.release-ref.outputs.revision }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Validate release ref matches checkout
        id: release-ref
        env:
          OXIBELT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          set -euo pipefail

          release_ref="${OXIBELT_RELEASE_REF}"
          if [[ "${release_ref}" != refs/tags/* ]]; then
            echo "release ref must start with refs/tags/: ${release_ref}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${release_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "release tag ${release_ref} resolves to ${tag_commit}, but checkout is ${head_commit}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "${release_ref}" || "${GITHUB_SHA}" != "${tag_commit}" ]]; then
            echo "releases must run from ${release_ref}@${tag_commit}, not ${GITHUB_REF}@${GITHUB_SHA}" >&2
            exit 1
          fi

          commit_epoch="$(git show -s --format=%ct "${head_commit}")"
          if [[ ! "${commit_epoch}" =~ ^[0-9]+$ ]]; then
            echo "release commit timestamp is invalid: ${commit_epoch}" >&2
            exit 1
          fi
          created="$(date -u --date="@${commit_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "created=${created}"
            echo "release_ref=${release_ref}"
            echo "revision=${head_commit}"
          } >> "${GITHUB_OUTPUT}"

  source-validation:
    name: Verify canonical non-benchmark source validation
    runs-on: ubuntu-26.04
    needs:
      - resolve-release-source
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      validated_ref: ${{ steps.verify.outputs.validated_ref }}
      validated_revision: ${{ steps.verify.outputs.validated_revision }}

    steps:
      - name: Verify newest canonical validation for exact revision
        id: verify
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OXIBELT_CANONICAL_BRANCH: ${{ github.event.repository.default_branch }}
          OXIBELT_CANONICAL_REPOSITORY: OxiBelt/OxiBelt
          OXIBELT_CANONICAL_WORKFLOW: .github/workflows/check-oxibelt.yml
          OXIBELT_EXPECTED_APP_ID: "15368"
          OXIBELT_EXPECTED_APP_SLUG: github-actions
          OXIBELT_EXPECTED_REF: ${{ needs.resolve-release-source.outputs.release_ref }}
          OXIBELT_EXPECTED_REVISION: ${{ needs.resolve-release-source.outputs.revision }}
          OXIBELT_EXPECTED_SUMMARY: Non-benchmark validation summary
        with:
          github-token: ${{ github.token }}
          script: |
            const {
              OXIBELT_CANONICAL_BRANCH: canonicalBranch,
              OXIBELT_CANONICAL_REPOSITORY: canonicalRepository,
              OXIBELT_CANONICAL_WORKFLOW: canonicalWorkflow,
              OXIBELT_EXPECTED_APP_ID: expectedAppIdText,
              OXIBELT_EXPECTED_APP_SLUG: expectedAppSlug,
              OXIBELT_EXPECTED_REF: expectedRef,
              OXIBELT_EXPECTED_REVISION: expectedRevision,
              OXIBELT_EXPECTED_SUMMARY: expectedSummary,
            } = process.env

            if (`${context.repo.owner}/${context.repo.repo}` !== canonicalRepository) {
              core.setFailed(`release validation must run in ${canonicalRepository}`)
              return
            }
            if (!canonicalBranch || !canonicalWorkflow || !expectedSummary) {
              core.setFailed('canonical validation identity is incomplete')
              return
            }
            if (!expectedRef?.startsWith('refs/tags/')) {
              core.setFailed(`release ref must start with refs/tags/: ${expectedRef}`)
              return
            }
            if (!/^[0-9a-f]{40}$/.test(expectedRevision ?? '')) {
              core.setFailed(`release revision must be a full lowercase Git commit: ${expectedRevision}`)
              return
            }
            if (!/^[1-9][0-9]*$/.test(expectedAppIdText ?? '')) {
              core.setFailed(`expected check app id is malformed: ${expectedAppIdText}`)
              return
            }
            const expectedAppId = Number(expectedAppIdText)

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                ...context.repo,
                workflow_id: canonicalWorkflow,
                branch: canonicalBranch,
                event: 'push',
                head_sha: expectedRevision,
                per_page: 100,
              },
            )
            const canonicalRuns = runs.filter((run) =>
              run.path === canonicalWorkflow &&
              run.event === 'push' &&
              run.head_branch === canonicalBranch &&
              run.head_sha === expectedRevision &&
              run.repository?.full_name === canonicalRepository &&
              run.head_repository?.full_name === canonicalRepository
            )
            canonicalRuns.sort((left, right) => right.id - left.id)
            const run = canonicalRuns[0]
            if (!run) {
              core.setFailed(
                `no canonical ${canonicalWorkflow} push run exists for ${canonicalBranch}@${expectedRevision}`,
              )
              return
            }
            if (!Number.isInteger(run.run_attempt) || run.run_attempt < 1) {
              core.setFailed(`canonical workflow run ${run.id} has invalid attempt ${run.run_attempt}`)
              return
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                ...context.repo,
                run_id: run.id,
                attempt_number: run.run_attempt,
                per_page: 100,
              },
            )
            const summaries = jobs.filter((job) => job.name === expectedSummary)
            if (summaries.length !== 1) {
              core.setFailed(
                `canonical workflow run ${run.id} attempt ${run.run_attempt} has ${summaries.length} ${expectedSummary} jobs`,
              )
              return
            }
            const summary = summaries[0]
            if (
              summary.status !== 'completed' ||
              summary.conclusion !== 'success' ||
              summary.head_sha !== expectedRevision
            ) {
              core.setFailed(
                `${expectedSummary} is ${summary.status}/${summary.conclusion} for ${summary.head_sha}, expected completed/success for ${expectedRevision}`,
              )
              return
            }

            const checkRunMatch = /\/check-runs\/([1-9][0-9]*)$/.exec(summary.check_run_url ?? '')
            if (!checkRunMatch) {
              core.setFailed(`${expectedSummary} does not expose a canonical check run URL`)
              return
            }
            const checkRun = await github.rest.checks.get({
              ...context.repo,
              check_run_id: Number(checkRunMatch[1]),
            })
            const check = checkRun.data
            if (
              check.name !== expectedSummary ||
              check.head_sha !== expectedRevision ||
              check.status !== 'completed' ||
              check.conclusion !== 'success' ||
              check.app?.id !== expectedAppId ||
              check.app?.slug !== expectedAppSlug ||
              check.details_url !== summary.html_url
            ) {
              core.setFailed(
                `${expectedSummary} check identity or successful exact-revision conclusion did not match`,
              )
              return
            }

            const finalRun = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: run.id,
            })
            if (
              finalRun.data.run_attempt !== run.run_attempt ||
              finalRun.data.path !== canonicalWorkflow ||
              finalRun.data.event !== 'push' ||
              finalRun.data.head_branch !== canonicalBranch ||
              finalRun.data.head_sha !== expectedRevision ||
              finalRun.data.repository?.full_name !== canonicalRepository ||
              finalRun.data.head_repository?.full_name !== canonicalRepository
            ) {
              core.setFailed(
                `canonical workflow run ${run.id} changed identity or attempt during validation`,
              )
              return
            }

            core.info(
              `accepted ${expectedSummary} from ${run.html_url} attempt ${run.run_attempt}`,
            )
            core.setOutput('validated_ref', expectedRef)
            core.setOutput('validated_revision', expectedRevision)

  enforce-source-validation:
    name: Enforce exact source validation
    runs-on: ubuntu-26.04
    needs:
      - resolve-release-source
      - source-validation
    if: always()
    permissions: {}

    steps:
      - name: Enforce validated release source
        env:
          EXPECTED_REF: ${{ needs.resolve-release-source.outputs.release_ref }}
          EXPECTED_REVISION: ${{ needs.resolve-release-source.outputs.revision }}
          RESOLVER_RESULT: ${{ needs.resolve-release-source.result }}
          SOURCE_VALIDATION_RESULT: ${{ needs.source-validation.result }}
          VALIDATED_REF: ${{ needs.source-validation.outputs.validated_ref }}
          VALIDATED_REVISION: ${{ needs.source-validation.outputs.validated_revision }}
        run: |
          set -euo pipefail

          failed=0
          if [[ "${RESOLVER_RESULT}" != "success" ]]; then
            echo "release source resolution result is ${RESOLVER_RESULT}, expected success" >&2
            failed=1
          fi
          if [[ "${SOURCE_VALIDATION_RESULT}" != "success" ]]; then
            echo "source validation result is ${SOURCE_VALIDATION_RESULT}, expected success" >&2
            failed=1
          fi
          if [[ ! "${EXPECTED_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "resolved release revision is malformed: ${EXPECTED_REVISION}" >&2
            failed=1
          fi
          if [[ "${EXPECTED_REF}" != refs/tags/* ]]; then
            echo "resolved release ref is malformed: ${EXPECTED_REF}" >&2
            failed=1
          fi
          if [[ "${VALIDATED_REVISION}" != "${EXPECTED_REVISION}" ]]; then
            echo "validated source revision ${VALIDATED_REVISION} does not match ${EXPECTED_REVISION}" >&2
            failed=1
          fi
          if [[ "${VALIDATED_REF}" != "${EXPECTED_REF}" ]]; then
            echo "validated source ref ${VALIDATED_REF} does not match ${EXPECTED_REF}" >&2
            failed=1
          fi
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

          {
            echo "Release source validation passed."
            echo
            echo "- Ref: \`${EXPECTED_REF}\`"
            echo "- Revision: \`${EXPECTED_REVISION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release-contract:
    name: Verify release changelog and published notes
    runs-on: ubuntu-26.04
    needs:
      - resolve-release-source
      - enforce-source-validation
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.receipt.outputs.kind }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enable hash-pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install Node dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Bind release notes to the exact tag commit
        env:
          OXIBELT_BODY_OUTPUT: ${{ runner.temp }}/release-body.md
          OXIBELT_RECEIPT_OUTPUT: ${{ runner.temp }}/release-contract.json
          OXIBELT_RELEASE_REF: ${{ needs.resolve-release-source.outputs.release_ref }}
          OXIBELT_RELEASE_REVISION: ${{ needs.resolve-release-source.outputs.revision }}
        run: |
          set -euo pipefail
          pnpm run release-contract:candidate \
            --ref "${OXIBELT_RELEASE_REF}" \
            --revision "${OXIBELT_RELEASE_REVISION}" \
            --receipt-output "${OXIBELT_RECEIPT_OUTPUT}" \
            --body-output "${OXIBELT_BODY_OUTPUT}"

      - name: Read validated release kind
        id: receipt
        env:
          OXIBELT_EVENT_NAME: ${{ github.event_name }}
          OXIBELT_RECEIPT: ${{ runner.temp }}/release-contract.json
        run: |
          set -euo pipefail
          kind="$(jq -er 'select(.schemaVersion == 1 and (.kind == "stable" or .kind == "beta" or .kind == "build")) | .kind' "${OXIBELT_RECEIPT}")"
          if [[ "${kind}" == "build" && "${OXIBELT_EVENT_NAME}" == "release" ]]; then
            echo "build tags must not have or publish from a GitHub Release" >&2
            exit 1
          fi
          printf 'kind=%s\n' "${kind}" >>"${GITHUB_OUTPUT}"

      - name: Read published stable or beta release
        if: steps.receipt.outputs.kind == 'stable' || steps.receipt.outputs.kind == 'beta'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OXIBELT_RELEASE_JSON: ${{ runner.temp }}/github-release.json
          OXIBELT_RELEASE_TAG: ${{ needs.resolve-release-source.outputs.release_ref }}
        with:
          script: |
            const fs = require('fs')
            if (context.repo.owner !== 'OxiBelt' || context.repo.repo !== 'OxiBelt') {
              core.setFailed('release publication validation may run only in OxiBelt/OxiBelt')
              return
            }
            const prefix = 'refs/tags/'
            if (!process.env.OXIBELT_RELEASE_TAG.startsWith(prefix)) {
              core.setFailed('release ref is not an exact tag ref')
              return
            }
            const tag = process.env.OXIBELT_RELEASE_TAG.slice(prefix.length)
            const response = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            })
            const release = response.data
            const bounded = {
              tag_name: release.tag_name,
              name: release.name,
              body: release.body,
              draft: release.draft,
              prerelease: release.prerelease
            }
            const encoded = `${JSON.stringify(bounded, null, 2)}\n`
            if (Buffer.byteLength(encoded, 'utf8') > 262144) {
              core.setFailed('GitHub release metadata exceeds the 256 KiB validation bound')
              return
            }
            fs.writeFileSync(process.env.OXIBELT_RELEASE_JSON, encoded, {
              encoding: 'utf8',
              flag: 'wx',
              mode: 0o600
            })

      - name: Verify published notes are canonical
        if: steps.receipt.outputs.kind == 'stable' || steps.receipt.outputs.kind == 'beta'
        env:
          OXIBELT_BODY: ${{ runner.temp }}/release-body.md
          OXIBELT_RECEIPT: ${{ runner.temp }}/release-contract.json
          OXIBELT_RELEASE_JSON: ${{ runner.temp }}/github-release.json
        run: |
          set -euo pipefail
          pnpm run release-contract:verify \
            --receipt "${OXIBELT_RECEIPT}" \
            --release "${OXIBELT_RELEASE_JSON}" \
            --expected-state published \
            --expected-body "${OXIBELT_BODY}"

      - name: Upload verified release contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: release-contract-${{ needs.resolve-release-source.outputs.revision }}
          path: |
            ${{ runner.temp }}/release-contract.json
            ${{ runner.temp }}/release-body.md
          if-no-files-found: error
          retention-days: 1

  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-26.04
    needs:
      - resolve-release-source
      - enforce-source-validation
      - release-contract
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release-ref.outputs.created }}
      kind: ${{ steps.image-plan.outputs.kind }}
      release_ref: ${{ steps.release-ref.outputs.release_ref }}
      revision: ${{ steps.release-ref.outputs.revision }}
      version: ${{ steps.image-plan.outputs.version }}

    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.revision }}
          fetch-depth: 0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download verified release contract
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: release-contract-${{ needs.resolve-release-source.outputs.revision }}
          path: ${{ runner.temp }}/release-contract

      - name: Validate repository-owned image vulnerability policy
        run: pnpm run image-vulnerability-policy:check

      - name: Compile release attestation helpers
        run: |
          set -euo pipefail

          helper_root="${RUNNER_TEMP}/oxibelt-release-helper"
          mkdir -p "${helper_root}"
          pnpm exec tsc devops/sources/release_sbom.ts devops/sources/rebuild_recipe.ts devops/sources/image_vulnerability_policy.ts \
            --ignoreConfig \
            --module NodeNext \
            --moduleResolution NodeNext \
            --target ES2022 \
            --types node \
            --outDir "${helper_root}"
          mv "${helper_root}/release_sbom.js" "${helper_root}/release_sbom.mjs"
          mv "${helper_root}/rebuild_recipe.js" "${helper_root}/rebuild_recipe.mjs"
          mv "${helper_root}/image_vulnerability_policy.js" "${helper_root}/image_vulnerability_policy.mjs"
          OXIBELT_RELEASE_HELPER="file://${helper_root}/release_sbom.mjs" \
            node --input-type=module --eval \
              'await import(process.env.OXIBELT_RELEASE_HELPER)'
          OXIBELT_REBUILD_HELPER="file://${helper_root}/rebuild_recipe.mjs" \
            node --input-type=module --eval \
              'await import(process.env.OXIBELT_REBUILD_HELPER)'
          OXIBELT_VULNERABILITY_POLICY_HELPER="file://${helper_root}/image_vulnerability_policy.mjs" \
            node --input-type=module --eval \
              'await import(process.env.OXIBELT_VULNERABILITY_POLICY_HELPER)'
          node "${helper_root}/image_vulnerability_policy.mjs" validate-policy \
            --policy supply-chain/image-vulnerability-policy.json

      - name: Validate release ref matches checkout
        id: release-ref
        env:
          OXIBELT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          set -euo pipefail

          release_ref="${OXIBELT_RELEASE_REF}"
          if [[ "${release_ref}" != refs/tags/* ]]; then
            echo "release ref must start with refs/tags/: ${release_ref}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${release_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "release tag ${release_ref} resolves to ${tag_commit}, but checkout is ${head_commit}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "${release_ref}" || "${GITHUB_SHA}" != "${tag_commit}" ]]; then
            echo "releases must run from ${release_ref}@${tag_commit}, not ${GITHUB_REF}@${GITHUB_SHA}" >&2
            exit 1
          fi

          commit_epoch="$(git show -s --format=%ct "${head_commit}")"
          if [[ ! "${commit_epoch}" =~ ^[0-9]+$ ]]; then
            echo "release commit timestamp is invalid: ${commit_epoch}" >&2
            exit 1
          fi
          created="$(date -u --date="@${commit_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "created=${created}"
            echo "release_ref=${release_ref}"
            echo "revision=${head_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply release version
        env:
          OXIBELT_IMAGE_PLAN_OUTPUT: ${{ runner.temp }}/oxibelt-release/image-plan.json
          OXIBELT_RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          OXIBELT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          OXIBELT_RELEASE_REVISION: ${{ steps.release-ref.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oxibelt-release"
          pnpm run versioning:release

      - name: Validate image release plan
        id: image-plan
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release/image-plan.json
          OXIBELT_RELEASE_REVISION: ${{ steps.release-ref.outputs.revision }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${OXIBELT_RELEASE_REVISION}" <<'PY'
          import json
          import re
          import sys

          plan_path = sys.argv[1]
          revision = sys.argv[2]
          plan = json.load(open(plan_path, encoding="utf-8"))
          image = "ghcr.io/oxibelt/oxibelt"
          tag = plan["tag"]
          kind = plan["kind"]
          strict_tag = re.compile(
              r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-beta\.(0|[1-9][0-9]*)|-build\.([0-9a-f]{8}))?$"
          )

          if tag.startswith("v") or not strict_tag.fullmatch(tag):
              raise SystemExit(f"invalid strict OxiBelt release tag: {tag}")
          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 8:
              raise SystemExit("unsupported image release plan schema")
          if plan["version"] != tag:
              raise SystemExit("image plan version does not match release tag")
          if kind == "build" and not tag.endswith(revision[:8].lower()):
              raise SystemExit(f"build release tag {tag} must end with revision prefix {revision[:8].lower()}")
          if plan["image"] != image:
              raise SystemExit("release image must publish to ghcr.io/oxibelt/oxibelt")
          if plan["revision"] != revision:
              raise SystemExit("image plan revision does not match checked-out commit")
          if plan["sourceRef"] != f"refs/tags/{tag}" or plan["sourceDirty"] != "clean" or plan["buildKind"] != "official_release":
              raise SystemExit("image plan does not contain the official clean-tag build identity")

          major = tag.split(".", 1)[0]
          expected_roles = {
              "standalone": (image, "standalone", ["oxibelt", "oxibeltctl", "oxibelt-keysigner", "oxibelt-netport-switcher"], ["/usr/local/bin/oxibelt", "--config", "/etc/oxibelt/config/oxibelt.toml"], "10001:10001", ["8443/tcp", "8443/udp"], ["admin-openapi", "person-proof"], "oxibelt"),
              "dataplane": (f"{image}-dataplane", "dataplane", ["oxibelt"], ["/usr/local/bin/oxibelt", "--config", "/etc/oxibelt/config/oxibelt.toml"], "10001:10001", ["8443/tcp", "8443/udp"], ["admin-openapi", "person-proof"], "oxibelt-dataplane"),
              "dataplane-strict": (f"{image}-dataplane-strict", "dataplane-strict", ["oxibelt-dataplane-strict"], ["/usr/local/bin/oxibelt-dataplane-strict", "--config", "/etc/oxibelt/config/oxibelt.toml"], "10001:10001", ["8443/tcp", "8443/udp"], ["person-proof"], "oxibelt-dataplane-strict"),
              "controller": (f"{image}-gateway-controller", "controller", ["oxibelt-gateway-controller"], ["/usr/local/bin/oxibelt-gateway-controller"], "10001:10001", [], [], "oxibelt-gateway-controller"),
              "tools": (f"{image}-tools", "tools", ["oxibeltctl"], ["/usr/local/bin/oxibeltctl"], "10001:10001", [], [], "oxibelt-tools"),
              "keysigner": (f"{image}-keysigner", "keysigner", ["oxibelt-keysigner"], ["/usr/local/bin/oxibelt-keysigner"], "10002:10002", [], [], "oxibelt-keysigner"),
          }
          roles = {role["role"]: role for role in plan["roles"]}
          if set(roles) != set(expected_roles) or len(roles) != len(plan["roles"]):
              raise SystemExit("unexpected or duplicate image role contract")

          expected_arches = {
              "amd64v2": ("linux/amd64", "amd64", "x86-64-v2"),
              "amd64": ("linux/amd64", "amd64", "x86-64-v3"),
              "amd64v4": ("linux/amd64", "amd64", "x86-64-v4"),
              "arm64": ("linux/arm64", "arm64", None),
              "riscv64": ("linux/riscv64", "riscv64", None),
          }
          artifacts = {(artifact["role"], artifact["artifactArch"]): artifact for artifact in plan["artifacts"]}
          if len(artifacts) != 30 or len(artifacts) != len(plan["artifacts"]):
              raise SystemExit("release plan must contain exactly 30 unique role/architecture artifacts")
          for role, contract in expected_roles.items():
              role_image, docker_target, binaries, entrypoint, user, ports, embedded_assets, prefix = contract
              expected_role = {
                  "role": role,
                  "image": role_image,
                  "dockerTarget": docker_target,
                  "binaries": binaries,
                  "entrypoint": entrypoint,
                  "user": user,
                  "ports": ports,
                  "embeddedAssets": embedded_assets,
              }
              if roles[role] != expected_role:
                  raise SystemExit(f"unexpected {role} image contract")
              for arch, (platform, docker_arch, target_cpu) in expected_arches.items():
                  artifact = artifacts[(role, arch)]
                  expected_artifact = {
                      **expected_role,
                      "artifactArch": arch,
                      "artifactName": f"{prefix}-alpine-musl-{arch}-image",
                      "imageTar": f"{prefix}-alpine-musl-{arch}.tar",
                      "localTag": f"{prefix}:alpine-musl-{arch}",
                      "platform": platform,
                      "dockerArchitecture": docker_arch,
                      "canonicalGhcrTag": f"{role_image}:{tag}-alpine-musl-{arch}",
                      "aliasGhcrTags": [f"{role_image}:{major}-alpine-musl-{arch}"] if kind == "stable" else [],
                  }
                  if target_cpu is not None:
                      expected_artifact["targetCpu"] = target_cpu
                  if artifact != expected_artifact:
                      raise SystemExit(f"unexpected artifact contract for {role}/{arch}")

          manifests = {(manifest["role"], manifest["name"]): manifest for manifest in plan["manifests"]}
          if len(manifests) != 12 or len(manifests) != len(plan["manifests"]):
              raise SystemExit("release plan must contain exactly 12 unique role manifests")
          for role, contract in expected_roles.items():
              role_image = contract[0]
              expected_manifests = {
                  "release": (f"{role_image}:{tag}", [f"{role_image}:latest"] if kind == "stable" else []),
                  "alpine-musl": (f"{role_image}:{tag}-alpine-musl", [f"{role_image}:{major}-alpine-musl", f"{role_image}:alpine-musl"] if kind == "stable" else []),
              }
              for name, (canonical_tag, aliases) in expected_manifests.items():
                  expected_manifest = {
                      "role": role,
                      "image": role_image,
                      "name": name,
                      "artifactArchs": ["amd64", "arm64", "riscv64"],
                      "canonicalGhcrTag": canonical_tag,
                      "aliasGhcrTags": aliases,
                  }
                  if manifests[(role, name)] != expected_manifest:
                      raise SystemExit(f"unexpected manifest contract for {role}/{name}")

          PY

          {
            echo "version=$(jq -r '.version' "${IMAGE_PLAN}")"
            echo "kind=$(jq -r '.kind' "${IMAGE_PLAN}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release worktree changes
        run: |
          set -euo pipefail

          git diff --check HEAD --
          unexpected_files="$(git diff --name-only HEAD -- | while read -r path; do
            case "${path}" in
              Cargo.lock|Cargo.toml|source/Cargo.toml|source/apps/*/Cargo.toml|source/crates/*/Cargo.toml) ;;
              *) printf '%s\n' "${path}" ;;
            esac
          done)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "unexpected release worktree changes:" >&2
            printf '%s\n' "${unexpected_files}" >&2
            exit 1
          fi

      - name: Prepare release metadata artifact
        run: |
          set -euo pipefail
          metadata_root="${RUNNER_TEMP}/oxibelt-release-metadata"
          workspace_root="${metadata_root}/workspace"
          mkdir -p "${workspace_root}"
          install -D -m 0644 Cargo.toml "${workspace_root}/Cargo.toml"
          install -D -m 0644 Cargo.lock "${workspace_root}/Cargo.lock"
          install -D -m 0644 package.json "${workspace_root}/package.json"
          while read -r manifest_path; do
            relative_path="${manifest_path#"${GITHUB_WORKSPACE}/"}"
            if [[ "${relative_path}" == "${manifest_path}" || "${relative_path}" == "Cargo.toml" ]]; then
              continue
            fi
            install -D -m 0644 "${relative_path}" "${workspace_root}/${relative_path}"
          done < <(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[].manifest_path' | sort -u)
          cp "${RUNNER_TEMP}/oxibelt-release/image-plan.json" "${metadata_root}/image-plan.json"
          install -D -m 0644 \
            "${RUNNER_TEMP}/release-contract/release-contract.json" \
            "${metadata_root}/release-contract/release-contract.json"
          install -D -m 0644 \
            "${RUNNER_TEMP}/release-contract/release-body.md" \
            "${metadata_root}/release-contract/release-body.md"
          install -D -m 0644 \
            "${RUNNER_TEMP}/oxibelt-release-helper/release_sbom.mjs" \
            "${metadata_root}/helper/release_sbom.mjs"
          install -D -m 0644 \
            "${RUNNER_TEMP}/oxibelt-release-helper/rebuild_recipe.mjs" \
            "${metadata_root}/helper/rebuild_recipe.mjs"
          install -D -m 0644 \
            "${RUNNER_TEMP}/oxibelt-release-helper/image_vulnerability_policy.mjs" \
            "${metadata_root}/helper/image_vulnerability_policy.mjs"
          install -D -m 0644 \
            supply-chain/image-vulnerability-policy.json \
            "${metadata_root}/policy/image-vulnerability-policy.json"
          install -D -m 0644 \
            tests/scripts/select-amd64-docker-image-artifact.sh \
            "${metadata_root}/helper/select-amd64-docker-image-artifact.sh"
          install -D -m 0755 \
            tests/scripts/run-riscv64-release-image-smoke.py \
            "${metadata_root}/helper/run-riscv64-release-image-smoke.py"
          install -D -m 0644 \
            tests/scripts/validate-strict-dataplane-image.py \
            "${metadata_root}/helper/validate-strict-dataplane-image.py"
          install -D -m 0644 \
            tests/fixtures/riscv64-release-image-smoke/oxibelt.toml \
            "${metadata_root}/helper/riscv64-release-image-smoke/oxibelt.toml"
          install -D -m 0644 \
            tests/fixtures/riscv64-release-image-smoke/controller-empty-list.json \
            "${metadata_root}/helper/riscv64-release-image-smoke/controller-empty-list.json"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata
          if-no-files-found: error
          retention-days: 1

  helm-chart-prepare:
    name: Prepare immutable Helm OCI charts
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
    if: needs.prepare-release.outputs.kind == 'stable' || needs.prepare-release.outputs.kind == 'beta'
    permissions:
      contents: read

    steps:
      - name: Checkout exact release chart source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup canonical Helm packager
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Enable hash-pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install

      - name: Install chart-planning dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Package both exact-version charts from tracked release inputs
        env:
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/oxibelt-helm-chart-release"
          mkdir -m 0700 "${output}"
          node --import tsx devops/sources/helm_chart_release.ts prepare \
            --workspace-path . \
            --ref "${RELEASE_REF}" \
            --revision "${RELEASE_REVISION}" \
            --output-directory "${output}"
          node --import tsx devops/sources/helm_chart_release.ts verify \
            --workspace-path . \
            --ref "${RELEASE_REF}" \
            --revision "${RELEASE_REVISION}" \
            --output-directory "${output}"

      - name: Upload immutable chart packages and plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: helm-chart-release-${{ needs.prepare-release.outputs.revision }}
          path: ${{ runner.temp }}/oxibelt-helm-chart-release
          if-no-files-found: error
          retention-days: 1

  helm-chart-publish:
    name: Publish exact-version Helm OCI charts
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - helm-chart-prepare
      - release-vulnerability-gate
    if: >-
      github.repository == 'OxiBelt/OxiBelt' &&
      (needs.prepare-release.outputs.kind == 'stable' || needs.prepare-release.outputs.kind == 'beta')
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      oxibelt_digest: ${{ steps.publish.outputs.oxibelt_digest }}
      controller_digest: ${{ steps.publish.outputs.controller_digest }}

    steps:
      - name: Checkout exact release helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}
          fetch-depth: 1
          persist-credentials: false

      - name: Enable hash-pinned pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack install

      - name: Install receipt dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup canonical Helm publisher
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Install pinned ORAS acquisition client
        env:
          GOBIN: ${{ runner.temp }}/oras-bin
        run: |
          set -euo pipefail
          mkdir -m 0700 "${GOBIN}"
          go install oras.land/oras/cmd/oras@v1.3.3
          "${GOBIN}/oras" version | grep -E '(^|[[:space:]])1\.3\.3($|[[:space:]])'

      - name: Download immutable chart packages and plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: helm-chart-release-${{ needs.prepare-release.outputs.revision }}
          path: ${{ runner.temp }}/oxibelt-helm-chart-release

      - name: Publish only exact chart versions and capture raw OCI evidence
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORAS_BIN: ${{ runner.temp }}/oras-bin/oras
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          charts="${RUNNER_TEMP}/oxibelt-helm-chart-release"
          evidence="${RUNNER_TEMP}/oxibelt-helm-oci-evidence"
          mkdir -m 0700 "${evidence}"
          printf '%s' "${GH_TOKEN}" | helm registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          printf '%s' "${GH_TOKEN}" | "${ORAS_BIN}" login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for chart in oxibelt oxibelt-gateway-controller; do
            repository="ghcr.io/oxibelt/charts/${chart}"
            archive="${charts}/${chart}-${RELEASE_VERSION}.tgz"
            inspect_error="${RUNNER_TEMP}/${chart}-inspect.log"
            if "${ORAS_BIN}" manifest fetch --descriptor "${repository}:${RELEASE_VERSION}" >"${evidence}/${chart}-descriptor.json" 2>"${inspect_error}"; then
              :
            elif grep -Eqi 'manifest unknown|404|not found' "${inspect_error}"; then
              helm push "${archive}" oci://ghcr.io/oxibelt/charts
              "${ORAS_BIN}" manifest fetch --descriptor "${repository}:${RELEASE_VERSION}" >"${evidence}/${chart}-descriptor.json"
            else
              cat "${inspect_error}" >&2
              exit 1
            fi
            digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' "${evidence}/${chart}-descriptor.json")"
            "${ORAS_BIN}" manifest fetch --output "${evidence}/${chart}-manifest.json" "${repository}@${digest}"
            config_digest="$(jq -er '.config.digest | select(test("^sha256:[0-9a-f]{64}$"))' "${evidence}/${chart}-manifest.json")"
            "${ORAS_BIN}" blob fetch --output "${evidence}/${chart}-config.json" "${repository}@${config_digest}"
            if [[ "${chart}" == oxibelt ]]; then output_name=oxibelt_digest; else output_name=controller_digest; fi
            echo "${output_name}=${digest}" >>"${GITHUB_OUTPUT}"
          done

          node --import tsx devops/sources/helm_chart_oci_release.ts build-receipt \
            --plan "${charts}/helm-chart-release-plan.json" \
            --oxibelt-archive "${charts}/oxibelt-${RELEASE_VERSION}.tgz" \
            --oxibelt-descriptor "${evidence}/oxibelt-descriptor.json" \
            --oxibelt-manifest "${evidence}/oxibelt-manifest.json" \
            --oxibelt-config "${evidence}/oxibelt-config.json" \
            --controller-archive "${charts}/oxibelt-gateway-controller-${RELEASE_VERSION}.tgz" \
            --controller-descriptor "${evidence}/oxibelt-gateway-controller-descriptor.json" \
            --controller-manifest "${evidence}/oxibelt-gateway-controller-manifest.json" \
            --controller-config "${evidence}/oxibelt-gateway-controller-config.json" \
            --output "${evidence}/helm-chart-publish-receipt.json"

      - name: Upload bounded chart publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: helm-chart-oci-evidence-${{ needs.prepare-release.outputs.revision }}
          path: ${{ runner.temp }}/oxibelt-helm-oci-evidence
          if-no-files-found: error
          retention-days: 1

  helm-chart-attest:
    name: Attest Helm OCI chart rebuild evidence
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - helm-chart-prepare
      - helm-chart-publish
    if: >-
      github.repository == 'OxiBelt/OxiBelt' &&
      (needs.prepare-release.outputs.kind == 'stable' || needs.prepare-release.outputs.kind == 'beta')
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read

    steps:
      - name: Checkout exact release helper and source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          ref: ${{ needs.prepare-release.outputs.revision }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup canonical Helm rebuild packager
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Enable hash-pinned pnpm and install dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack install
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Download chart publication inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: helm-chart-*-${{ needs.prepare-release.outputs.revision }}
          path: ${{ runner.temp }}/oxibelt-chart-inputs

      - name: Rebuild exact package bytes and validate schema-v3 predicate
        env:
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          published="${RUNNER_TEMP}/oxibelt-chart-inputs/helm-chart-release-${RELEASE_REVISION}"
          evidence="${RUNNER_TEMP}/oxibelt-chart-inputs/helm-chart-oci-evidence-${RELEASE_REVISION}"
          rebuilt="${RUNNER_TEMP}/oxibelt-helm-chart-rebuilt"
          mkdir -m 0700 "${rebuilt}"
          node --import tsx devops/sources/helm_chart_release.ts prepare \
            --workspace-path . --ref "${RELEASE_REF}" --revision "${RELEASE_REVISION}" --output-directory "${rebuilt}"
          node --import tsx devops/sources/helm_chart_oci_release.ts build-predicate \
            --receipt "${evidence}/helm-chart-publish-receipt.json" \
            --rebuilt-plan "${rebuilt}/helm-chart-release-plan.json" \
            --published-oxibelt "${published}/oxibelt-${RELEASE_VERSION}.tgz" \
            --rebuilt-oxibelt "${rebuilt}/oxibelt-${RELEASE_VERSION}.tgz" \
            --published-controller "${published}/oxibelt-gateway-controller-${RELEASE_VERSION}.tgz" \
            --rebuilt-controller "${rebuilt}/oxibelt-gateway-controller-${RELEASE_VERSION}.tgz" \
            --output "${RUNNER_TEMP}/helm-chart-rebuild-v3.json"
          node --import tsx devops/sources/helm_chart_oci_release.ts validate-predicate \
            --input "${RUNNER_TEMP}/helm-chart-rebuild-v3.json"

      - name: Publish signed oxibelt chart rebuild predicate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/charts/oxibelt
          subject-digest: ${{ needs.helm-chart-publish.outputs.oxibelt_digest }}
          predicate-type: https://oxibelt.dev/attestations/helm-chart-rebuild/v3
          predicate-path: ${{ runner.temp }}/helm-chart-rebuild-v3.json
          push-to-registry: false

      - name: Publish signed controller chart rebuild predicate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/oxibelt/charts/oxibelt-gateway-controller
          subject-digest: ${{ needs.helm-chart-publish.outputs.controller_digest }}
          predicate-type: https://oxibelt.dev/attestations/helm-chart-rebuild/v3
          predicate-path: ${{ runner.temp }}/helm-chart-rebuild-v3.json
          push-to-registry: false

  helm-chart-verify:
    name: Verify Helm OCI attestation API readback
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - helm-chart-publish
      - helm-chart-attest
    if: >-
      github.repository == 'OxiBelt/OxiBelt' &&
      (needs.prepare-release.outputs.kind == 'stable' || needs.prepare-release.outputs.kind == 'beta')
    permissions:
      attestations: read
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - chart: oxibelt
            repository: ghcr.io/oxibelt/charts/oxibelt
            digest_output: oxibelt_digest
          - chart: oxibelt-gateway-controller
            repository: ghcr.io/oxibelt/charts/oxibelt-gateway-controller
            digest_output: controller_digest

    steps:
      - name: Verify signed chart predicate through GitHub API
        env:
          DIGEST: ${{ matrix.chart == 'oxibelt' && needs.helm-chart-publish.outputs.oxibelt_digest || needs.helm-chart-publish.outputs.controller_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${{ matrix.repository }}@${DIGEST}" \
            --repo OxiBelt/OxiBelt \
            --signer-workflow OxiBelt/OxiBelt/.github/workflows/release.yml \
            --signer-digest "${RELEASE_REVISION}" \
            --source-digest "${RELEASE_REVISION}" \
            --source-ref "${RELEASE_REF}" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --predicate-type https://oxibelt.dev/attestations/helm-chart-rebuild/v3 \
            --limit 100 \
            --format json >"${RUNNER_TEMP}/${{ matrix.chart }}-attestations.json"
          jq -e 'length >= 1' "${RUNNER_TEMP}/${{ matrix.chart }}-attestations.json" >/dev/null

  release-image-arch-scan:
    name: Build and scan release image (${{ matrix.image_role }}/${{ matrix.artifact_arch }})
    needs:
      - prepare-release
      - enforce-source-validation
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image_role:
          - standalone
          - dataplane
          - dataplane-strict
          - controller
          - tools
          - keysigner
        artifact_arch:
          - amd64v2
          - amd64
          - amd64v4
          - arm64
          - riscv64
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
          - artifact_arch: amd64v2
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: amd64v4
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
          - artifact_arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-26.04
    uses: ./.github/workflows/release-image-arch-scan.yml
    with:
      artifact_arch: ${{ matrix.artifact_arch }}
      artifact_name: ${{ format('{0}-alpine-musl-{1}-image', matrix.artifact_prefix, matrix.artifact_arch) }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      image_role: ${{ matrix.image_role }}
      image: ${{ matrix.image }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      release_ref: ${{ needs.prepare-release.outputs.release_ref }}
      release_created: ${{ needs.prepare-release.outputs.created }}
      release_kind: ${{ needs.prepare-release.outputs.kind }}
      release_revision: ${{ needs.prepare-release.outputs.revision }}
      release_version: ${{ needs.prepare-release.outputs.version }}
      source_url: https://github.com/OxiBelt/OxiBelt
      transport_artifact_name: ${{ format('release-{0}-{1}-alpine-musl-{2}-image', github.run_id, matrix.artifact_prefix, matrix.artifact_arch) }}

  release-vulnerability-gate:
    name: Enforce global release image vulnerability policy
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - release-image-arch-scan
    if: ${{ always() && needs.prepare-release.result == 'success' }}
    permissions:
      actions: read
    outputs:
      vulnerability_decision_artifact_name: ${{ steps.decision-identity.outputs.artifact_name }}
      vulnerability_decision_run_attempt: ${{ steps.decision-identity.outputs.run_attempt }}

    steps:
      - name: Capture controlled vulnerability gate producer identity
        id: decision-identity
        run: |
          set -euo pipefail

          printf 'artifact_name=release-vulnerability-decision-%s-%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          printf 'run_attempt=%s\n' "${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download all digest-bound vulnerability scan evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: trivy-release-${{ github.run_id }}-*
          path: ${{ runner.temp }}/oxibelt-vulnerability-scans
          merge-multiple: false

      - name: Evaluate complete release image vulnerability matrix
        id: evaluate
        continue-on-error: true
        env:
          DECISION: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.json
          DECISION_MARKDOWN: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.md
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          POLICY: ${{ runner.temp }}/oxibelt-release-metadata/policy/image-vulnerability-policy.json
          SCAN_ROOT: ${{ runner.temp }}/oxibelt-vulnerability-scans
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${DECISION}")" "${SCAN_ROOT}"
          scan_bundle_args=()
          while IFS= read -r -d '' bundle; do
            scan_bundle_args+=(--scan-bundle "${bundle}")
          done < <(find "${SCAN_ROOT}" -mindepth 1 -maxdepth 1 -print0 | sort -z)

          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/image_vulnerability_policy.mjs" evaluate \
            --policy "${POLICY}" \
            --image-plan "${IMAGE_PLAN}" \
            "${scan_bundle_args[@]}" \
            --revision "${{ needs.prepare-release.outputs.revision }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output "${DECISION}" \
            --markdown-output "${DECISION_MARKDOWN}"

      - name: Publish vulnerability gate summary
        if: always()
        env:
          DECISION_MARKDOWN: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.md
        run: |
          if [[ -s "${DECISION_MARKDOWN}" ]]; then
            cat "${DECISION_MARKDOWN}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "The vulnerability evaluator did not produce a Markdown decision." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload controlled vulnerability gate decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ steps.decision-identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/oxibelt-vulnerability-decision
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce vulnerability gate result
        if: always()
        env:
          DECISION: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.json
          DECISION_MARKDOWN: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.md
          EVALUATION_OUTCOME: ${{ steps.evaluate.outcome }}
          SCAN_MATRIX_RESULT: ${{ needs.release-image-arch-scan.result }}
        run: |
          set -euo pipefail

          failed=0
          if [[ "${SCAN_MATRIX_RESULT}" != "success" ]]; then
            echo "release image scan matrix result is ${SCAN_MATRIX_RESULT}, expected success" >&2
            failed=1
          fi
          if [[ "${EVALUATION_OUTCOME}" != "success" ]]; then
            echo "release image vulnerability evaluation result is ${EVALUATION_OUTCOME}, expected success" >&2
            failed=1
          fi
          for output in "${DECISION}" "${DECISION_MARKDOWN}"; do
            if [[ ! -s "${output}" ]]; then
              echo "release image vulnerability evaluation did not produce ${output}" >&2
              failed=1
            fi
          done
          if [[ -s "${DECISION}" ]] && ! jq -e '.decision == "allow"' "${DECISION}" >/dev/null; then
            echo "release image vulnerability decision is not allow" >&2
            failed=1
          fi
          if [[ "${failed}" != "0" ]]; then
            exit 1
          fi

  release-image-arch:
    name: Publish release image (${{ matrix.image_role }}/${{ matrix.artifact_arch }})
    needs:
      - prepare-release
      - release-vulnerability-gate
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image_role:
          - standalone
          - dataplane
          - dataplane-strict
          - controller
          - tools
          - keysigner
        artifact_arch:
          - amd64v2
          - amd64
          - amd64v4
          - arm64
          - riscv64
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
          - artifact_arch: amd64v2
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: amd64
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: amd64v4
            platform: linux/amd64
            runner: ubuntu-26.04
          - artifact_arch: arm64
            platform: linux/arm64
            runner: ubuntu-26.04-arm
          - artifact_arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-26.04
    uses: ./.github/workflows/release-image-arch.yml
    with:
      artifact_arch: ${{ matrix.artifact_arch }}
      artifact_name: ${{ format('{0}-alpine-musl-{1}-image', matrix.artifact_prefix, matrix.artifact_arch) }}
      artifact_prefix: ${{ matrix.artifact_prefix }}
      image_role: ${{ matrix.image_role }}
      image: ${{ matrix.image }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      release_ref: ${{ needs.prepare-release.outputs.release_ref }}
      release_created: ${{ needs.prepare-release.outputs.created }}
      release_kind: ${{ needs.prepare-release.outputs.kind }}
      release_revision: ${{ needs.prepare-release.outputs.revision }}
      release_version: ${{ needs.prepare-release.outputs.version }}
      source_url: https://github.com/OxiBelt/OxiBelt
      transport_artifact_name: ${{ format('release-{0}-{1}-alpine-musl-{2}-image', github.run_id, matrix.artifact_prefix, matrix.artifact_arch) }}
      vulnerability_decision_artifact_name: ${{ needs.release-vulnerability-gate.outputs.vulnerability_decision_artifact_name }}
      vulnerability_decision_run_attempt: ${{ needs.release-vulnerability-gate.outputs.vulnerability_decision_run_attempt }}
    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  ghcr-manifest-publish:
    name: Publish canonical GHCR multi-arch manifests (${{ matrix.image_role }})
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - release-vulnerability-gate
      - release-image-arch
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
    env:
      OXIBELT_ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
      OXIBELT_GHCR_IMAGE: ${{ matrix.image }}
      OXIBELT_IMAGE_ROLE: ${{ matrix.image_role }}
      OXIBELT_VULNERABILITY_DECISION_ARTIFACT_NAME: ${{ needs.release-vulnerability-gate.outputs.vulnerability_decision_artifact_name }}
      OXIBELT_VULNERABILITY_DECISION_RUN_ATTEMPT: ${{ needs.release-vulnerability-gate.outputs.vulnerability_decision_run_attempt }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Validate controlled vulnerability gate producer identity
        run: |
          set -euo pipefail

          producer_attempt="${OXIBELT_VULNERABILITY_DECISION_RUN_ATTEMPT}"
          consumer_attempt="${GITHUB_RUN_ATTEMPT}"
          expected_name="release-vulnerability-decision-${GITHUB_RUN_ID}-${producer_attempt}"
          if [[ -z "${OXIBELT_VULNERABILITY_DECISION_ARTIFACT_NAME}" ]] \
            || [[ ! "${producer_attempt}" =~ ^[1-9][0-9]*$ ]] \
            || [[ ! "${consumer_attempt}" =~ ^[1-9][0-9]*$ ]] \
            || [[ "${OXIBELT_VULNERABILITY_DECISION_ARTIFACT_NAME}" != "${expected_name}" ]]; then
            echo "invalid controlled vulnerability gate producer identity" >&2
            exit 1
          fi
          if (( 10#${producer_attempt} > 10#${consumer_attempt} )); then
            echo "controlled vulnerability gate producer attempt is newer than this consumer" >&2
            exit 1
          fi

      - name: Download controlled vulnerability gate decision
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ env.OXIBELT_VULNERABILITY_DECISION_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/oxibelt-vulnerability-decision

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Validate manifest release plan
        env:
          METADATA_ROOT: ${{ runner.temp }}/oxibelt-release-metadata
          OXIBELT_RELEASE_KIND: ${{ needs.prepare-release.outputs.kind }}
          OXIBELT_RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
          OXIBELT_RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          OXIBELT_SOURCE_URL: ${{ env.OXIBELT_SOURCE_URL }}
        run: |
          set -euo pipefail

          python3 - "${METADATA_ROOT}/image-plan.json" "${OXIBELT_IMAGE_ROLE}" "${OXIBELT_GHCR_IMAGE}" "${OXIBELT_ARTIFACT_PREFIX}" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys

          plan_path = pathlib.Path(sys.argv[1])
          role = sys.argv[2]
          image = sys.argv[3]
          artifact_prefix = sys.argv[4]
          version = sys.argv[5]
          kind = sys.argv[6]
          revision = sys.argv[7]
          source = sys.argv[8]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 8:
              raise SystemExit("unsupported image release plan schema")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")
          if plan["sourceRef"] != f"refs/tags/{version}" or plan["sourceDirty"] != "clean" or plan["buildKind"] != "official_release":
              raise SystemExit("release plan does not contain the official clean-tag build identity")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("amd64", "x86-64-v2"),
              "amd64": ("amd64", "x86-64-v3"),
              "amd64v4": ("amd64", "x86-64-v4"),
              "arm64": ("arm64", None),
              "riscv64": ("riscv64", None),
          }
          def expected_artifact_tags(arch):
              aliases = [f"{image}:{major}-alpine-musl-{arch}"] if kind == "stable" else []
              return f"{image}:{version}-alpine-musl-{arch}", aliases

          artifacts = {}
          for artifact in plan["artifacts"]:
              if artifact["role"] != role:
                  continue
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix: {sorted(artifacts)}")
          for arch, (docker_arch, target_cpu) in expected.items():
              artifact = artifacts[arch]
              artifact_name = f"{artifact_prefix}-alpine-musl-{arch}-image"
              image_tar = f"{artifact_prefix}-alpine-musl-{arch}.tar"
              if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar:
                  raise SystemExit(f"unexpected artifact naming for {arch}")
              if artifact["dockerArchitecture"] != docker_arch:
                  raise SystemExit(f"unexpected docker architecture for {arch}")
              if target_cpu is None:
                  if "targetCpu" in artifact:
                      raise SystemExit(f"{arch} should not declare targetCpu")
              elif artifact.get("targetCpu") != target_cpu:
                  raise SystemExit(f"{arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
              expected_tag, expected_aliases = expected_artifact_tags(arch)
              if artifact["canonicalGhcrTag"] != expected_tag or artifact["aliasGhcrTags"] != expected_aliases:
                  raise SystemExit(f"unexpected GHCR tags for {arch}")

          expected_manifests = {
              "release": (["amd64", "arm64", "riscv64"], f"{image}:{version}", []),
              "alpine-musl": (["amd64", "arm64", "riscv64"], f"{image}:{version}-alpine-musl", []),
          }
          if kind == "stable":
              expected_manifests["release"][2].append(f"{image}:latest")
              expected_manifests["alpine-musl"][2].extend([f"{image}:{major}-alpine-musl", f"{image}:alpine-musl"])
          manifests = {}
          for manifest in plan["manifests"]:
              if manifest["role"] != role:
                  continue
              name = manifest["name"]
              if name in manifests:
                  raise SystemExit(f"duplicate release manifest for {name}")
              manifests[name] = manifest
          if set(manifests) != set(expected_manifests):
              raise SystemExit(f"unexpected manifest matrix: {sorted(manifests)}")
          for name, (artifact_archs, canonical_tag, alias_tags) in expected_manifests.items():
              manifest = manifests[name]
              if manifest["artifactArchs"] != artifact_archs:
                  raise SystemExit(f"unexpected manifest architectures for {name}")
              if manifest["canonicalGhcrTag"] != canonical_tag or manifest["aliasGhcrTags"] != alias_tags:
                  raise SystemExit(f"unexpected manifest GHCR tags for {name}")
          PY

      - name: Validate admitted manifest children before registry login
        env:
          ADMITTED_CHILDREN: ${{ runner.temp }}/oxibelt-admitted-children/children.json
          DECISION: ${{ runner.temp }}/oxibelt-vulnerability-decision/image-vulnerability-decision.json
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          POLICY: ${{ runner.temp }}/oxibelt-release-metadata/policy/image-vulnerability-policy.json
        run: |
          set -euo pipefail

          source_refs='[]'
          expected_descriptors='[]'
          child_descriptors='[]'
          for artifact_arch in amd64 arm64 riscv64; do
            artifact_json="$(jq -c --arg role "${OXIBELT_IMAGE_ROLE}" --arg arch "${artifact_arch}" '.artifacts[] | select(.role == $role and .artifactArch == $arch)' "${IMAGE_PLAN}")"
            canonical_tag="$(jq -r '.canonicalGhcrTag' <<<"${artifact_json}")"
            expected_architecture="$(jq -r '.dockerArchitecture' <<<"${artifact_json}")"
            manifest_descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}')"
            digest="$(jq -r '.digest' <<<"${manifest_descriptor}")"
            image_descriptor="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Image}}')"
            actual_os="$(jq -r '.os' <<<"${image_descriptor}")"
            actual_architecture="$(jq -r '.architecture' <<<"${image_descriptor}")"
            actual_variant="$(jq -r '.variant // ""' <<<"${image_descriptor}")"
            if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ || "${actual_os}" != linux || "${actual_architecture}" != "${expected_architecture}" || -n "${actual_variant}" ]]; then
              echo "invalid published child ${canonical_tag}: ${digest}/${actual_os}/${actual_architecture}" >&2
              exit 1
            fi
            node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/image_vulnerability_policy.mjs" verify-subject \
              --decision "${DECISION}" \
              --policy "${POLICY}" \
              --role "${OXIBELT_IMAGE_ROLE}" \
              --architecture "${artifact_arch}" \
              --channel "${{ needs.prepare-release.outputs.kind }}" \
              --revision "${{ needs.prepare-release.outputs.revision }}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-attempt "${OXIBELT_VULNERABILITY_DECISION_RUN_ATTEMPT}" \
              --manifest-digest "${digest}"
            source_refs="$(jq -c --arg source_ref "${OXIBELT_GHCR_IMAGE}@${digest}" '. + [$source_ref]' <<<"${source_refs}")"
            expected_descriptors="$(jq -c \
              --arg digest "${digest}" \
              --arg os "${actual_os}" \
              --arg architecture "${actual_architecture}" \
              --arg variant "${actual_variant}" \
              '. + [{digest: $digest, os: $os, architecture: $architecture, variant: (if $variant == "" then null else $variant end)}]' \
              <<<"${expected_descriptors}")"
            child_descriptors="$(jq -c \
              --arg artifact_arch "${artifact_arch}" \
              --arg digest "${digest}" \
              --arg os "${actual_os}" \
              --arg architecture "${actual_architecture}" \
              --arg variant "${actual_variant}" \
              '. + [{artifactArch: $artifact_arch, digest: $digest, os: $os, architecture: $architecture, variant: (if $variant == "" then null else $variant end)}]' \
              <<<"${child_descriptors}")"
          done
          mkdir -p "$(dirname "${ADMITTED_CHILDREN}")"
          jq -n \
            --argjson source_refs "${source_refs}" \
            --argjson expected_descriptors "${expected_descriptors}" \
            --argjson child_descriptors "${child_descriptors}" \
            '{sourceRefs: $source_refs, expectedDescriptors: $expected_descriptors, childDescriptors: $child_descriptors}' \
            >"${ADMITTED_CHILDREN}"

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish canonical multi-arch manifests
        id: publish
        env:
          ADMITTED_CHILDREN: ${{ runner.temp }}/oxibelt-admitted-children/children.json
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
        run: |
          set -euo pipefail

          retry_inspect() {
            local output="$1"
            shift
            local attempt status delay=5

            for attempt in 1 2 3; do
              if "$@" >"${output}"; then
                return 0
              else
                status=$?
              fi
              if [[ "${attempt}" == 3 ]]; then
                return "${status}"
              fi
              printf 'Registry inspect failed with status %s; retrying in %ss (%s/3): %s\n' \
                "${status}" "${delay}" "${attempt}" "$*" >&2
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          mapfile -t source_refs < <(jq -r '.sourceRefs[]' "${ADMITTED_CHILDREN}")
          expected_descriptors="$(jq -c '.expectedDescriptors' "${ADMITTED_CHILDREN}")"
          child_descriptors="$(jq -c '.childDescriptors' "${ADMITTED_CHILDREN}")"
          mapfile -t canonical_tags < <(jq -r --arg role "${OXIBELT_IMAGE_ROLE}" '.manifests[] | select(.role == $role) | .canonicalGhcrTag' "${IMAGE_PLAN}")
          if [[ "${#source_refs[@]}" -ne 3 || "${#canonical_tags[@]}" -ne 2 ]]; then
            echo "release index requires three child manifests and two canonical tags" >&2
            exit 1
          fi

          primary_tag="${canonical_tags[0]}"
          inspect_output="${RUNNER_TEMP}/canonical-index-inspect.json"
          inspect_error="${RUNNER_TEMP}/primary-index-inspect.log"
          if docker buildx imagetools inspect "${primary_tag}" --format '{{json .Manifest}}' >/dev/null 2>"${inspect_error}"; then
            :
          elif grep -Eqi 'manifest unknown|404 Not Found|not found' "${inspect_error}"; then
            docker buildx imagetools create --tag "${primary_tag}" "${source_refs[@]}"
          else
            cat "${inspect_error}" >&2
            echo "failed to determine whether canonical index ${primary_tag} already exists" >&2
            exit 1
          fi

          retry_inspect "${inspect_output}" \
            docker buildx imagetools inspect "${primary_tag}" --format '{{json .Manifest}}'
          published_index="$(<"${inspect_output}")"
          actual_descriptors="$(jq -c '[.manifests[] | {digest: .digest, os: .platform.os, architecture: .platform.architecture, variant: (.platform.variant // null)}]' <<<"${published_index}")"
          if [[ "${actual_descriptors}" != "${expected_descriptors}" ]]; then
            echo "refusing to accept canonical index ${primary_tag} with unexpected platform descriptors" >&2
            echo "expected: ${expected_descriptors}" >&2
            echo "actual:   ${actual_descriptors}" >&2
            exit 1
          fi
          digest="$(jq -r '.digest' <<<"${published_index}")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid index digest for ${primary_tag}: ${digest}" >&2
            exit 1
          fi

          for canonical_tag in "${canonical_tags[@]:1}"; do
            inspect_error="${RUNNER_TEMP}/secondary-index-inspect.log"
            if existing="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' 2>"${inspect_error}")"; then
              existing_digest="$(jq -r '.digest' <<<"${existing}")"
              if [[ "${existing_digest}" != "${digest}" ]]; then
                echo "refusing to replace canonical index ${canonical_tag}: ${existing_digest} != ${digest}" >&2
                exit 1
              fi
            elif grep -Eqi 'manifest unknown|404 Not Found|not found' "${inspect_error}"; then
              docker buildx imagetools create --prefer-index=true --tag "${canonical_tag}" "${OXIBELT_GHCR_IMAGE}@${digest}"
            else
              cat "${inspect_error}" >&2
              echo "failed to determine whether canonical index ${canonical_tag} already exists" >&2
              exit 1
            fi
            retry_inspect "${inspect_output}" \
              docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}'
            existing="$(<"${inspect_output}")"
            canonical_digest="$(jq -r '.digest' <<<"${existing}")"
            if [[ "${canonical_digest}" != "${digest}" ]]; then
              echo "canonical index ${canonical_tag} resolved to ${canonical_digest}, expected ${digest}" >&2
              exit 1
            fi
          done

          mkdir -p "${RUNNER_TEMP}/oxibelt-index-metadata"
          jq -n \
            --arg role "${OXIBELT_IMAGE_ROLE}" \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${digest}" \
            --argjson children "${child_descriptors}" \
            '{schemaVersion: 2, role: $role, image: $image, digest: $digest, children: $children}' \
            >"${RUNNER_TEMP}/oxibelt-index-metadata/index-metadata.json"

      - name: Upload immutable index metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-metadata
          path: ${{ runner.temp }}/oxibelt-index-metadata/index-metadata.json
          if-no-files-found: error
          retention-days: 1

  ghcr-index-sbom:
    name: Compose multi-arch index SBOM (${{ matrix.image_role }})
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - ghcr-manifest-publish
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
    env:
      OXIBELT_ARTIFACT_PREFIX: ${{ matrix.artifact_prefix }}
      OXIBELT_IMAGE_ROLE: ${{ matrix.image_role }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download immutable index metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-metadata
          path: ${{ runner.temp }}/oxibelt-index-metadata

      - name: Download platform SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: ${{ matrix.artifact_prefix }}-release-sbom-*
          path: ${{ runner.temp }}/oxibelt-platform-sboms
          merge-multiple: true

      - name: Download platform rebuild recipes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: ${{ matrix.artifact_prefix }}-release-rebuild-*
          path: ${{ runner.temp }}/oxibelt-platform-rebuild
          merge-multiple: true

      - name: Validate platform SBOMs and compose index SBOM
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          INDEX_METADATA: ${{ runner.temp }}/oxibelt-index-metadata/index-metadata.json
          INDEX_SBOM: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          PLATFORM_SBOMS: ${{ runner.temp }}/oxibelt-platform-sboms
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${INDEX_SBOM}")"
          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/release_sbom.mjs" index \
            --image-plan "${IMAGE_PLAN}" \
            --index-metadata "${INDEX_METADATA}" \
            --role "${OXIBELT_IMAGE_ROLE}" \
            --platform-sbom "${PLATFORM_SBOMS}/${OXIBELT_ARTIFACT_PREFIX}-release-amd64.cdx.json" \
            --platform-sbom "${PLATFORM_SBOMS}/${OXIBELT_ARTIFACT_PREFIX}-release-arm64.cdx.json" \
            --platform-sbom "${PLATFORM_SBOMS}/${OXIBELT_ARTIFACT_PREFIX}-release-riscv64.cdx.json" \
            --output "${INDEX_SBOM}"

      - name: Compose index rebuild recipe
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          INDEX_METADATA: ${{ runner.temp }}/oxibelt-index-metadata/index-metadata.json
          INDEX_REBUILD: ${{ runner.temp }}/oxibelt-index-rebuild/${{ matrix.artifact_prefix }}-release-index.rebuild.json
          INDEX_SBOM: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          PLATFORM_REBUILDS: ${{ runner.temp }}/oxibelt-platform-rebuild
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "${INDEX_REBUILD}")"
          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/rebuild_recipe.mjs" index \
            --image-plan "${IMAGE_PLAN}" \
            --index-metadata "${INDEX_METADATA}" \
            --index-sbom "${INDEX_SBOM}" \
            --platform-recipe "${PLATFORM_REBUILDS}/${OXIBELT_ARTIFACT_PREFIX}-release-amd64.rebuild.json" \
            --platform-recipe "${PLATFORM_REBUILDS}/${OXIBELT_ARTIFACT_PREFIX}-release-arm64.rebuild.json" \
            --platform-recipe "${PLATFORM_REBUILDS}/${OXIBELT_ARTIFACT_PREFIX}-release-riscv64.rebuild.json" \
            --role "${OXIBELT_IMAGE_ROLE}" \
            --output "${INDEX_REBUILD}"

      - name: Upload index SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-sbom
          path: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload index rebuild recipe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-rebuild
          path: ${{ runner.temp }}/oxibelt-index-rebuild/${{ matrix.artifact_prefix }}-release-index.rebuild.json
          if-no-files-found: error
          retention-days: 1

  ghcr-index-attest:
    name: Attest multi-arch index (${{ matrix.image_role }})
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - ghcr-manifest-publish
      - ghcr-index-sbom
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
    env:
      OXIBELT_GHCR_IMAGE: ${{ matrix.image }}
      OXIBELT_IMAGE_ROLE: ${{ matrix.image_role }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download immutable index metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-metadata
          path: ${{ runner.temp }}/oxibelt-index-metadata

      - name: Download index SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-sbom
          path: ${{ runner.temp }}/oxibelt-index-sbom

      - name: Download index rebuild recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-rebuild
          path: ${{ runner.temp }}/oxibelt-index-rebuild

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Validate immutable index attestation subject
        id: identity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          INDEX_METADATA: ${{ runner.temp }}/oxibelt-index-metadata/index-metadata.json
          INDEX_REBUILD: ${{ runner.temp }}/oxibelt-index-rebuild/${{ matrix.artifact_prefix }}-release-index.rebuild.json
          INDEX_SBOM: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail

          jq -e --arg role "${OXIBELT_IMAGE_ROLE}" --arg image "${OXIBELT_GHCR_IMAGE}" '
            .schemaVersion == 2
            and .role == $role
            and .image == $image
            and (.digest | test("^sha256:[0-9a-f]{64}$"))
            and ([.children[].artifactArch] == ["amd64", "arm64", "riscv64"])
            and (all(.children[];
              .os == "linux"
              and .architecture == .artifactArch
              and .variant == null
              and (.digest | test("^sha256:[0-9a-f]{64}$"))
            ))
          ' "${INDEX_METADATA}" >/dev/null
          digest="$(jq -r '.digest' "${INDEX_METADATA}")"
          jq -e \
            --slurpfile index "${INDEX_METADATA}" \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${digest}" \
            --arg role "${OXIBELT_IMAGE_ROLE}" \
            --arg version "${RELEASE_VERSION}" \
            --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" '
            def property_map: [.properties[] | {key: .name, value: .value}] | from_entries;
            .bomFormat == "CycloneDX"
            and .specVersion == "1.7"
            and (.serialNumber | type == "string" and length > 0)
            and .metadata.component.type == "container"
            and .metadata.component.name == $image
            and .metadata.component.version == $version
            and .metadata.component["bom-ref"] == ($image + "@" + $digest)
            and .metadata.component.hashes == [{alg: "SHA-256", content: ($digest | ltrimstr("sha256:"))}]
            and (.metadata.component | property_map) == {
              "io.oxibelt.image.role": $role,
              "io.oxibelt.release.version": $version,
              "io.oxibelt.release.revision": $revision,
              "io.oxibelt.release.ref": $ref,
              "io.oxibelt.image.repository": $image,
              "io.oxibelt.image.digest": $digest,
              "io.oxibelt.sbom.inventory": "separate-platform-attestation"
            }
            and ([.components[] | {
              artifactArch: (property_map["io.oxibelt.artifact.arch"]),
              digest: (property_map["io.oxibelt.image.digest"]),
              platform: (property_map["io.oxibelt.oci.platform"]),
              name,
              version,
              bomRef: .["bom-ref"],
              hashes
            }] | sort_by(.bomRef)) == ([$index[0].children[] | {
              artifactArch,
              digest,
              platform: (.os + "/" + .architecture),
              name: ($image + ":" + $version + "-alpine-musl-" + .artifactArch),
              version: .digest,
              bomRef: ($image + "@" + .digest),
              hashes: [{alg: "SHA-256", content: (.digest | ltrimstr("sha256:"))}]
            }] | sort_by(.bomRef))
            and .dependencies == [{
              ref: ($image + "@" + $digest),
              dependsOn: [$index[0].children[].digest | $image + "@" + .]
            }]
          ' "${INDEX_SBOM}" >/dev/null
          jq -e \
            --arg image "${OXIBELT_GHCR_IMAGE}" \
            --arg digest "${digest}" \
            --arg revision "${RELEASE_REVISION}" \
            --arg ref "${RELEASE_REF}" \
            --arg role "${OXIBELT_IMAGE_ROLE}" '
              .schemaVersion == 1
              and .predicateType == "https://oxibelt.dev/attestations/rebuild/v1"
              and .kind == "index"
              and .subject == {name: $image, digest: $digest}
              and .source.revision == $revision
              and .source.ref == $ref
              and .output.indexMetadata.role == $role
              and ([.output.children[].artifactArch] == ["amd64", "arm64", "riscv64"])
            ' "${INDEX_REBUILD}" >/dev/null

          printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mapfile -t canonical_tags < <(jq -r --arg role "${OXIBELT_IMAGE_ROLE}" '.manifests[] | select(.role == $role) | .canonicalGhcrTag' "${IMAGE_PLAN}")
          if [[ "${#canonical_tags[@]}" -ne 2 ]]; then
            echo "release index requires exactly two canonical tags" >&2
            exit 1
          fi
          for canonical_tag in "${canonical_tags[@]}"; do
            resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${resolved_digest}" != "${digest}" ]]; then
              echo "canonical index tag ${canonical_tag} resolved to ${resolved_digest}, expected ${digest}" >&2
              exit 1
            fi
          done
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Publish signed index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          push-to-registry: false

      - name: Publish signed index SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          sbom-path: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          push-to-registry: false

      - name: Publish signed index rebuild recipe
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          predicate-type: https://oxibelt.dev/attestations/rebuild/v1
          predicate-path: ${{ runner.temp }}/oxibelt-index-rebuild/${{ matrix.artifact_prefix }}-release-index.rebuild.json
          push-to-registry: false

  ghcr-index-verify:
    name: Verify multi-arch index attestations (${{ matrix.image_role }})
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - ghcr-manifest-publish
      - ghcr-index-attest
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_role: standalone
            image: ghcr.io/oxibelt/oxibelt
            artifact_prefix: oxibelt
          - image_role: dataplane
            image: ghcr.io/oxibelt/oxibelt-dataplane
            artifact_prefix: oxibelt-dataplane
          - image_role: dataplane-strict
            image: ghcr.io/oxibelt/oxibelt-dataplane-strict
            artifact_prefix: oxibelt-dataplane-strict
          - image_role: controller
            image: ghcr.io/oxibelt/oxibelt-gateway-controller
            artifact_prefix: oxibelt-gateway-controller
          - image_role: tools
            image: ghcr.io/oxibelt/oxibelt-tools
            artifact_prefix: oxibelt-tools
          - image_role: keysigner
            image: ghcr.io/oxibelt/oxibelt-keysigner
            artifact_prefix: oxibelt-keysigner
    env:
      OXIBELT_GHCR_IMAGE: ${{ matrix.image }}
      OXIBELT_IMAGE_ROLE: ${{ matrix.image_role }}

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Download immutable index metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-metadata
          path: ${{ runner.temp }}/oxibelt-index-metadata

      - name: Download index SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-sbom
          path: ${{ runner.temp }}/oxibelt-index-sbom

      - name: Download index rebuild recipe
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ matrix.artifact_prefix }}-release-index-rebuild
          path: ${{ runner.temp }}/oxibelt-index-rebuild

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          version: v0.36.1
          driver-opts: image=${{ env.OXIBELT_BUILDKIT_IMAGE }}

      - name: Verify GitHub API index attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
          INDEX_METADATA: ${{ runner.temp }}/oxibelt-index-metadata/index-metadata.json
          INDEX_REBUILD: ${{ runner.temp }}/oxibelt-index-rebuild/${{ matrix.artifact_prefix }}-release-index.rebuild.json
          INDEX_SBOM: ${{ runner.temp }}/oxibelt-index-sbom/${{ matrix.artifact_prefix }}-release-index.cdx.json
          RELEASE_REF: ${{ needs.prepare-release.outputs.release_ref }}
          RELEASE_REVISION: ${{ needs.prepare-release.outputs.revision }}
        run: |
          set -euo pipefail

          retry_attestation() {
            local output="$1"
            shift
            local attempt delay=5
            for attempt in 1 2 3 4; do
              if "$@" >"${output}"; then
                return 0
              fi
              if [[ "${attempt}" == 4 ]]; then
                return 1
              fi
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }

          digest="$(jq -r '.digest' "${INDEX_METADATA}")"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          mapfile -t canonical_tags < <(jq -r --arg role "${OXIBELT_IMAGE_ROLE}" '.manifests[] | select(.role == $role) | .canonicalGhcrTag' "${IMAGE_PLAN}")
          if [[ "${#canonical_tags[@]}" -ne 2 ]]; then
            echo "release index requires exactly two canonical tags" >&2
            exit 1
          fi
          for canonical_tag in "${canonical_tags[@]}"; do
            resolved_digest="$(docker buildx imagetools inspect "${canonical_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${resolved_digest}" != "${digest}" ]]; then
              echo "canonical index tag ${canonical_tag} resolved to ${resolved_digest}, expected ${digest}" >&2
              exit 1
            fi
          done

          subject="oci://${OXIBELT_GHCR_IMAGE}@${digest}"
          common_args=(
            "${subject}"
            --repo OxiBelt/OxiBelt
            --signer-workflow OxiBelt/OxiBelt/.github/workflows/release.yml
            --signer-digest "${RELEASE_REVISION}"
            --source-digest "${RELEASE_REVISION}"
            --source-ref "${RELEASE_REF}"
            --cert-oidc-issuer https://token.actions.githubusercontent.com
            --deny-self-hosted-runners
            --limit 100
            --format json
          )
          retry_attestation "${RUNNER_TEMP}/index-provenance.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://slsa.dev/provenance/v1
          retry_attestation "${RUNNER_TEMP}/index-sbom.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://cyclonedx.org/bom
          retry_attestation "${RUNNER_TEMP}/index-rebuild.json" gh attestation verify \
            "${common_args[@]}" --predicate-type https://oxibelt.dev/attestations/rebuild/v1

          expected_signer="https://github.com/OxiBelt/OxiBelt/.github/workflows/release.yml@${RELEASE_REF}"
          for kind in provenance sbom; do
            args=(
              verify
              --attestations "${RUNNER_TEMP}/index-${kind}.json"
              --subject-name "${OXIBELT_GHCR_IMAGE}"
              --subject-digest "${digest}"
              --signer-workflow "${expected_signer}"
              --source-repository OxiBelt/OxiBelt
              --source-ref "${RELEASE_REF}"
              --source-revision "${RELEASE_REVISION}"
              --workflow-path .github/workflows/release.yml
            )
            if [[ "${kind}" == sbom ]]; then
              args+=(--expected-sbom "${INDEX_SBOM}")
            fi
            node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/release_sbom.mjs" "${args[@]}"
          done

          node "${RUNNER_TEMP}/oxibelt-release-metadata/helper/rebuild_recipe.mjs" extract \
            --attestations "${RUNNER_TEMP}/index-rebuild.json" \
            --subject-name "${OXIBELT_GHCR_IMAGE}" \
            --subject-digest "${digest}" \
            --signer-workflow "${expected_signer}" \
            --source-repository OxiBelt/OxiBelt \
            --source-ref "${RELEASE_REF}" \
            --source-revision "${RELEASE_REVISION}" \
            --predicate-type https://oxibelt.dev/attestations/rebuild/v1 \
            --output "${RUNNER_TEMP}/verified-index-rebuild.json"
          jq -e --slurpfile expected "${INDEX_REBUILD}" '. == $expected[0]' \
            "${RUNNER_TEMP}/verified-index-rebuild.json" >/dev/null
