name: Release OxiBelt images

on:
  release:
    types: [published]
  push:
    tags:
      - "*.*.*-build.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Strict release tag to publish, such as 15.2.0, 15.2.0-beta.1, or 15.2.0-build.4f43abcd
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  OXIBELT_GHCR_IMAGE: ghcr.io/oxibelt/oxibelt
  OXIBELT_SOURCE_URL: https://github.com/OxiBelt/OxiBelt

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      created: ${{ steps.release-ref.outputs.created }}
      kind: ${{ steps.image-plan.outputs.kind }}
      release_ref: ${{ steps.release-ref.outputs.release_ref }}
      revision: ${{ steps.release-ref.outputs.revision }}
      version: ${{ steps.image-plan.outputs.version }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release ref matches checkout
        id: release-ref
        env:
          OXIBELT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
        run: |
          set -euo pipefail

          release_ref="${OXIBELT_RELEASE_REF}"
          if [[ "${release_ref}" != refs/tags/* ]]; then
            echo "release ref must start with refs/tags/: ${release_ref}" >&2
            exit 1
          fi

          tag_commit="$(git rev-parse "${release_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "release tag ${release_ref} resolves to ${tag_commit}, but checkout is ${head_commit}" >&2
            exit 1
          fi

          created="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "created=${created}"
            echo "release_ref=${release_ref}"
            echo "revision=${head_commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Apply release version
        env:
          OXIBELT_IMAGE_PLAN_OUTPUT: ${{ runner.temp }}/oxibelt-release/image-plan.json
          OXIBELT_RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
          OXIBELT_RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          OXIBELT_RELEASE_REVISION: ${{ steps.release-ref.outputs.revision }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oxibelt-release"
          pnpm run versioning:release

      - name: Validate image release plan
        id: image-plan
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release/image-plan.json
          OXIBELT_RELEASE_REVISION: ${{ steps.release-ref.outputs.revision }}
        run: |
          set -euo pipefail

          python3 - "${IMAGE_PLAN}" "${OXIBELT_RELEASE_REVISION}" <<'PY'
          import json
          import re
          import sys

          plan_path = sys.argv[1]
          revision = sys.argv[2]
          plan = json.load(open(plan_path, encoding="utf-8"))
          image = "ghcr.io/oxibelt/oxibelt"
          tag = plan["tag"]
          kind = plan["kind"]
          strict_tag = re.compile(
              r"^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-beta\.(0|[1-9][0-9]*)|-build\.([0-9a-f]{8}))?$"
          )

          if tag.startswith("v") or not strict_tag.fullmatch(tag):
              raise SystemExit(f"invalid strict OxiBelt release tag: {tag}")
          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 1:
              raise SystemExit("unsupported image release plan schema")
          if plan["version"] != tag:
              raise SystemExit("image plan version does not match release tag")
          if kind == "build" and not tag.endswith(revision[:8].lower()):
              raise SystemExit(f"build release tag {tag} must end with revision prefix {revision[:8].lower()}")
          if plan["image"] != image:
              raise SystemExit("release image must publish to ghcr.io/oxibelt/oxibelt")
          if plan["revision"] != revision:
              raise SystemExit("image plan revision does not match checked-out commit")

          major = tag.split(".", 1)[0]
          expected = {
              "amd64v2": ("oxibelt-alpine-musl-amd64v2-image", "oxibelt-alpine-musl-amd64v2.tar", "amd64"),
              "amd64": ("oxibelt-alpine-musl-amd64-image", "oxibelt-alpine-musl-amd64.tar", "amd64"),
              "amd64v4": ("oxibelt-alpine-musl-amd64v4-image", "oxibelt-alpine-musl-amd64v4.tar", "amd64"),
              "arm64": ("oxibelt-alpine-musl-arm64-image", "oxibelt-alpine-musl-arm64.tar", "arm64"),
              "riscv64": ("oxibelt-alpine-musl-riscv64-image", "oxibelt-alpine-musl-riscv64.tar", "riscv64"),
          }
          def expected_artifact_tags(arch):
              tags = [f"{image}:{tag}-alpine-musl-{arch}"]
              if kind == "stable":
                  tags.append(f"{image}:{major}-alpine-musl-{arch}")
              return tags

          artifacts = {}
          for artifact in plan["artifacts"]:
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix: {sorted(artifacts)}")
          for arch, (artifact_name, image_tar, docker_arch) in expected.items():
              artifact = artifacts[arch]
              if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar:
                  raise SystemExit(f"unexpected artifact naming for {arch}")
              if artifact["dockerArchitecture"] != docker_arch:
                  raise SystemExit(f"unexpected docker architecture for {arch}")
              expected_tags = expected_artifact_tags(arch)
              if artifact["ghcrTags"] != expected_tags:
                  raise SystemExit(f"unexpected GHCR tags for {arch}: {artifact['ghcrTags']!r}")

          expected_manifests = {
              "release": (["amd64", "arm64", "riscv64"], [f"{image}:{tag}"]),
              "alpine-musl": (["amd64", "arm64", "riscv64"], [f"{image}:{tag}-alpine-musl"]),
          }
          if kind == "stable":
              expected_manifests["release"][1].append(f"{image}:latest")
              expected_manifests["alpine-musl"][1].extend([f"{image}:{major}-alpine-musl", f"{image}:alpine-musl"])
          manifests = {}
          for manifest in plan["manifests"]:
              name = manifest["name"]
              if name in manifests:
                  raise SystemExit(f"duplicate release manifest for {name}")
              manifests[name] = manifest
          if set(manifests) != set(expected_manifests):
              raise SystemExit(f"unexpected manifest matrix: {sorted(manifests)}")
          for name, (artifact_archs, ghcr_tags) in expected_manifests.items():
              manifest = manifests[name]
              if manifest["artifactArchs"] != artifact_archs:
                  raise SystemExit(f"unexpected manifest architectures for {name}")
              if manifest["ghcrTags"] != ghcr_tags:
                  raise SystemExit(f"unexpected manifest GHCR tags for {name}: {manifest['ghcrTags']!r}")
          PY

          {
            echo "version=$(jq -r '.version' "${IMAGE_PLAN}")"
            echo "kind=$(jq -r '.kind' "${IMAGE_PLAN}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release worktree changes
        run: |
          set -euo pipefail

          git diff --check HEAD --

          unexpected_files="$(git diff --name-only HEAD -- . ':(exclude)Cargo.lock' ':(exclude)source/Cargo.toml')"
          if [[ -n "${unexpected_files}" ]]; then
            echo "unexpected release worktree changes:" >&2
            printf '%s\n' "${unexpected_files}" >&2
            exit 1
          fi

      - name: Prepare release metadata artifact
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/oxibelt-release-metadata/source"
          cp Cargo.lock "${RUNNER_TEMP}/oxibelt-release-metadata/Cargo.lock"
          cp source/Cargo.toml "${RUNNER_TEMP}/oxibelt-release-metadata/source/Cargo.toml"
          cp "${RUNNER_TEMP}/oxibelt-release/image-plan.json" "${RUNNER_TEMP}/oxibelt-release-metadata/image-plan.json"

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata
          if-no-files-found: error
          retention-days: 1

  release-image-arch:
    name: Release image (${{ matrix.artifact_arch }})
    needs:
      - validate
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_arch: amd64v2
            artifact_name: oxibelt-alpine-musl-amd64v2-image
            platform: linux/amd64
            runner: ubuntu-26.04
            qemu_platforms: ""
          - artifact_arch: amd64
            artifact_name: oxibelt-alpine-musl-amd64-image
            platform: linux/amd64
            runner: ubuntu-26.04
            qemu_platforms: ""
          - artifact_arch: amd64v4
            artifact_name: oxibelt-alpine-musl-amd64v4-image
            platform: linux/amd64
            runner: ubuntu-26.04
            qemu_platforms: ""
          - artifact_arch: arm64
            artifact_name: oxibelt-alpine-musl-arm64-image
            platform: linux/arm64
            runner: ubuntu-26.04-arm
            qemu_platforms: ""
          - artifact_arch: riscv64
            artifact_name: oxibelt-alpine-musl-riscv64-image
            platform: linux/riscv64
            runner: ubuntu-26.04
            qemu_platforms: riscv64
    uses: ./.github/workflows/release-image-arch.yml
    with:
      artifact_arch: ${{ matrix.artifact_arch }}
      artifact_name: ${{ matrix.artifact_name }}
      platform: ${{ matrix.platform }}
      runner: ${{ matrix.runner }}
      qemu_platforms: ${{ matrix.qemu_platforms }}
      release_ref: ${{ needs.validate.outputs.release_ref }}
      release_created: ${{ needs.validate.outputs.created }}
      release_kind: ${{ needs.validate.outputs.kind }}
      release_revision: ${{ needs.validate.outputs.revision }}
      release_version: ${{ needs.validate.outputs.version }}
      source_url: https://github.com/OxiBelt/OxiBelt
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}

  ghcr-manifest-publish:
    name: Publish GHCR multi-arch manifests
    runs-on: ubuntu-26.04
    needs:
      - validate
      - release-image-arch
    if: github.repository == 'OxiBelt/OxiBelt'
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: oxibelt-release-metadata
          path: ${{ runner.temp }}/oxibelt-release-metadata

      - name: Validate manifest release plan
        env:
          METADATA_ROOT: ${{ runner.temp }}/oxibelt-release-metadata
          OXIBELT_RELEASE_KIND: ${{ needs.validate.outputs.kind }}
          OXIBELT_RELEASE_REVISION: ${{ needs.validate.outputs.revision }}
          OXIBELT_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          OXIBELT_SOURCE_URL: ${{ env.OXIBELT_SOURCE_URL }}
        run: |
          set -euo pipefail

          python3 - "${METADATA_ROOT}/image-plan.json" "${OXIBELT_RELEASE_VERSION}" "${OXIBELT_RELEASE_KIND}" "${OXIBELT_RELEASE_REVISION}" "${OXIBELT_SOURCE_URL}" <<'PY'
          import json
          import pathlib
          import sys

          plan_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          kind = sys.argv[3]
          revision = sys.argv[4]
          source = sys.argv[5]
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          image = "ghcr.io/oxibelt/oxibelt"

          if kind not in ("stable", "beta", "build"):
              raise SystemExit(f"invalid release kind: {kind}")
          if plan["schemaVersion"] != 1:
              raise SystemExit("unsupported image release plan schema")
          if plan["image"] != image:
              raise SystemExit("release image must publish to ghcr.io/oxibelt/oxibelt")
          if plan["tag"] != version or plan["version"] != version or plan["kind"] != kind or plan["revision"] != revision:
              raise SystemExit("release plan identity does not match workflow outputs")
          if plan["source"] != source:
              raise SystemExit("release plan source URL does not match workflow source")

          major = version.split(".", 1)[0]
          expected = {
              "amd64v2": ("oxibelt-alpine-musl-amd64v2-image", "oxibelt-alpine-musl-amd64v2.tar", "amd64", "x86-64-v2"),
              "amd64": ("oxibelt-alpine-musl-amd64-image", "oxibelt-alpine-musl-amd64.tar", "amd64", "x86-64-v3"),
              "amd64v4": ("oxibelt-alpine-musl-amd64v4-image", "oxibelt-alpine-musl-amd64v4.tar", "amd64", "x86-64-v4"),
              "arm64": ("oxibelt-alpine-musl-arm64-image", "oxibelt-alpine-musl-arm64.tar", "arm64", None),
              "riscv64": ("oxibelt-alpine-musl-riscv64-image", "oxibelt-alpine-musl-riscv64.tar", "riscv64", None),
          }
          def expected_artifact_tags(arch):
              tags = [f"{image}:{version}-alpine-musl-{arch}"]
              if kind == "stable":
                  tags.append(f"{image}:{major}-alpine-musl-{arch}")
              return tags

          artifacts = {}
          for artifact in plan["artifacts"]:
              arch = artifact["artifactArch"]
              if arch in artifacts:
                  raise SystemExit(f"duplicate release artifact for {arch}")
              artifacts[arch] = artifact
          if set(artifacts) != set(expected):
              raise SystemExit(f"unexpected artifact matrix: {sorted(artifacts)}")
          for arch, (artifact_name, image_tar, docker_arch, target_cpu) in expected.items():
              artifact = artifacts[arch]
              if artifact["artifactName"] != artifact_name or artifact["imageTar"] != image_tar:
                  raise SystemExit(f"unexpected artifact naming for {arch}")
              if artifact["dockerArchitecture"] != docker_arch:
                  raise SystemExit(f"unexpected docker architecture for {arch}")
              if target_cpu is None:
                  if "targetCpu" in artifact:
                      raise SystemExit(f"{arch} should not declare targetCpu")
              elif artifact.get("targetCpu") != target_cpu:
                  raise SystemExit(f"{arch} targetCpu was {artifact.get('targetCpu')!r}, expected {target_cpu!r}")
              expected_tags = expected_artifact_tags(arch)
              if artifact["ghcrTags"] != expected_tags:
                  raise SystemExit(f"unexpected GHCR tags for {arch}: {artifact['ghcrTags']!r}")

          expected_manifests = {
              "release": (["amd64", "arm64", "riscv64"], [f"{image}:{version}"]),
              "alpine-musl": (["amd64", "arm64", "riscv64"], [f"{image}:{version}-alpine-musl"]),
          }
          if kind == "stable":
              expected_manifests["release"][1].append(f"{image}:latest")
              expected_manifests["alpine-musl"][1].extend([f"{image}:{major}-alpine-musl", f"{image}:alpine-musl"])
          manifests = {}
          for manifest in plan["manifests"]:
              name = manifest["name"]
              if name in manifests:
                  raise SystemExit(f"duplicate release manifest for {name}")
              manifests[name] = manifest
          if set(manifests) != set(expected_manifests):
              raise SystemExit(f"unexpected manifest matrix: {sorted(manifests)}")
          for name, (artifact_archs, ghcr_tags) in expected_manifests.items():
              manifest = manifests[name]
              if manifest["artifactArchs"] != artifact_archs:
                  raise SystemExit(f"unexpected manifest architectures for {name}")
              if manifest["ghcrTags"] != ghcr_tags:
                  raise SystemExit(f"unexpected manifest GHCR tags for {name}: {manifest['ghcrTags']!r}")
          PY

      - name: Login to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish multi-arch manifests
        env:
          IMAGE_PLAN: ${{ runner.temp }}/oxibelt-release-metadata/image-plan.json
        run: |
          set -euo pipefail

          jq -r '.manifests[] | @base64' "${IMAGE_PLAN}" | while read -r manifest_b64; do
            manifest_json="$(printf '%s' "${manifest_b64}" | base64 --decode)"
            mapfile -t manifest_tags < <(jq -r '.ghcrTags[]' <<<"${manifest_json}")
            mapfile -t source_tags < <(
              jq -r --argjson manifest "${manifest_json}" '
                .artifacts as $artifacts
                | $manifest.artifactArchs[]
                | . as $artifact_arch
                | $artifacts[]
                | select(.artifactArch == $artifact_arch)
                | .ghcrTags[0]
              ' "${IMAGE_PLAN}"
            )

            if [[ "${#source_tags[@]}" -eq 0 ]]; then
              echo "manifest ${manifest_json} has no source tags" >&2
              exit 1
            fi
            for source_tag in "${source_tags[@]}"; do
              docker manifest inspect "${source_tag}" >/dev/null
            done

            for manifest_tag in "${manifest_tags[@]}"; do
              docker manifest rm "${manifest_tag}" >/dev/null 2>&1 || true
              docker manifest create "${manifest_tag}" "${source_tags[@]}"
              docker manifest push "${manifest_tag}"
            done
          done
