[package]
name = "oxibeltctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["cli"]
cli = ["dep:sequoia-openpgp"]
crypto-ring = ["oxibelt/crypto-ring", "rustls/ring"]
mutation-pqc = ["oxibelt/mutation-pqc"]
fuzzing = []

[lib]
name = "oxibeltctl"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes.workspace = true
clap.workspace = true
crc32fast.workspace = true
flate2.workspace = true
getrandom.workspace = true
der = "0.8.1"
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["server"] }
hyper-rustls.workspace = true
hyper-util = { workspace = true, features = ["server"] }
jiff.workspace = true
libc.workspace = true
oxibelt = { workspace = true, features = ["admin-runtime", "config-tooling"] }
oxibelt-build-identity.workspace = true
oxibelt-deployment-diagnostics.workspace = true
rustls.workspace = true
sequoia-openpgp = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
tempfile.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true
webpki-roots.workspace = true
x509-cert = "0.3.0"
zeroize.workspace = true

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys.workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
openssl-sys.workspace = true

[lints]
workspace = true

[[bin]]
name = "oxibeltctl"
path = "src/main.rs"
required-features = ["cli"]
