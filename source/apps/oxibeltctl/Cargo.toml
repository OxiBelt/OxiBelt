[package]
name = "oxibeltctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = []
crypto-ring = ["oxibelt/crypto-ring", "rustls/ring"]
mutation-pqc = ["oxibelt/mutation-pqc", "aws-lc-rs/unstable"]

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
bytes.workspace = true
clap.workspace = true
getrandom.workspace = true
http.workspace = true
libc.workspace = true
oxibelt.workspace = true
oxibelt-deployment-diagnostics.workspace = true
rustls.workspace = true
sequoia-openpgp.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys.workspace = true

[target.'cfg(all(target_arch = "aarch64", target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
openssl-sys.workspace = true

[lints]
workspace = true

[[bin]]
name = "oxibeltctl"
path = "src/main.rs"
