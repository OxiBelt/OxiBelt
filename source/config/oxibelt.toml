[waf]
enabled = false
mode = "enforcing" # enforcing | monitor
fail_policy = "closed"
duplicate_metadata_policy = "fail_closed"
# rulepack_files = ["rulepacks/*.oxirule-rulepack.toml"]
# rule_group_files = ["groups/*.oxirule-group.toml"]
# Rulepack v2 manifests may include [[exceptions]] for scoped false-positive
# tuning by rule_ids/rule_names/tags plus routes/methods/path_prefixes/source_cidrs.

# [waf.http_body_compression]
