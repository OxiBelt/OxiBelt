[[upstreams]]
name = "app"
origin = "https://app.internal.example"
max_http_version = "h2"
connect_timeout_ms = 3000
request_timeout_ms = 30000
first_byte_timeout_ms = 30000
read_timeout_ms = 30000
send_timeout_ms = 30000
idle_timeout_ms = 75000
pool_max_idle_per_host = 128
preserve_host = false
websocket = true
webrtc = true
webtransport = true
proxy_protocol_egress = "off"

[upstreams.tls.ech]
mode = "disabled"

[upstreams.tls.resumption]
# Ignored while the effective upstream revocation policy is enabled.
mode = "enabled" # enabled | disabled
session_cache_size = 1024
tls12 = "session_id_or_tickets" # disabled | session_id_only | session_id_or_tickets

