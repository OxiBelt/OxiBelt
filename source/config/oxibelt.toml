include = ["conf.d/*.toml"]

[config]
strict_unknown_fields = true
warn_on_deprecated_fields = true
lb_policy_compat_profile = "strict" # strict | nginx | caddy

[logging]
level = "info"

[logging.access_log]
enabled = false
stdout = true

[access_log.system]
enabled = false

[access_log.waf]
enabled = true

[access_log.admin]
enabled = false

[access_log.stdout]
enabled = true
schema = "ocsf" # ocsf | ecs

[access_log.otlp]
enabled = false
endpoint = "http://127.0.0.1:4318/v1/logs"
trusted_ca_certs = []
schema = "ocsf" # ocsf | ecs
queue_capacity = 1024
batch_size = 64
export_timeout_ms = 3000
service_name = "oxibelt"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"
main_runtime = "compio" # compio | tokio_hyper | auto
direct_h1_io = "compio" # auto | tokio_hyper | compio

[runtime.worker_multipliers]
runtime = 1.0
accept = 0.5
quic_socket = 1.0

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[runtime.drain]
graceful_timeout_ms = 30000
long_connection_close_delay_ms = 300000
shutdown_delay_ms = 0

[runtime.hot_reload]
mode = "off"
poll_interval_ms = 2000

[runtime.netport_switcher]
enabled = false
socket_dir = "/run/oxibelt-netport-switcher"
main_uid = 10001
main_gid = 10001
io_timeout_ms = 5000
pidfd_supervision = true

[runtime.hardening]
close_range = "auto" # auto | off | required

[runtime.hardening.seccomp]
mode = "off" # off | log | enforce

[runtime.hardening.landlock]
mode = "off" # off | enforce
read_paths = []
read_write_paths = []

[listeners]
https_binds = ["0.0.0.0:8443"]
http_binds = ["0.0.0.0:8080"]
http_mode = "redirect_to_https"
http1 = true
http2 = true
http3 = true

[listeners.proxy_protocol]
enabled = false
version = "any"
trusted_sources = []

[crypto]
# TLS uses rustls' AWS-LC provider by default. `ring` is available only when
# OxiBelt is built with the `crypto-ring` Cargo feature and does not support the
# default post-quantum hybrid x25519mlkem768 key exchange group.
tls_provider = "aws_lc_rs" # aws_lc_rs | ring
# Direct OxiBelt primitives default to RustCrypto. Set the global provider here,
# then override individual primitives below when needed.
primitive_provider = "rustcrypto" # rustcrypto | aws_lc_rs
# `auto` is the portable default. Forcing software or hardware backends requires
# an OxiBelt binary built with the matching RustCrypto dependency cfgs.
primitive_backend = "auto" # auto | hardware | software | soft | exact backend

[crypto.primitives]
aes_gcm = "rustcrypto" # rustcrypto | aws_lc_rs
chacha20poly1305 = "rustcrypto" # rustcrypto | aws_lc_rs
hkdf = "rustcrypto" # rustcrypto | aws_lc_rs
hmac_sha256 = "rustcrypto" # rustcrypto | aws_lc_rs
sha2 = "rustcrypto" # rustcrypto | aws_lc_rs

[crypto.primitive_backends]
aes_gcm = "auto" # auto | software | hardware | soft | aes-avx256 | aes-avx512
chacha20poly1305 = "auto" # auto | software | hardware | soft | chacha20-sse2 | chacha20-avx2 | chacha20-avx512
hkdf = "auto" # auto | software | hardware | soft | x86-sha | aarch64-sha2 | riscv-zknh
hmac_sha256 = "auto" # auto | software | hardware | soft | x86-sha | aarch64-sha2 | riscv-zknh
sha2 = "auto" # auto | software | hardware | soft | x86-sha | aarch64-sha2 | riscv-zknh

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"
# Optional names owned by the default certificate. Unknown or missing SNI uses
# this certificate unless require_sni or reject_unknown_sni is enabled.
server_names = []
require_sni = false
reject_unknown_sni = false
min_version = "tls1.3"
max_version = "tls1.3"
ssl_early_data = "off" # off | safe_methods | on
session_tickets = true
session_ticket_rotation_seconds = 86400

[tls.1_3]
key_exchange_groups = ["x25519mlkem768", "x25519", "secp256r1", "secp384r1"]
ciphers = ["TLS_AES_256_GCM_SHA384", "TLS_AES_128_GCM_SHA256", "TLS_CHACHA20_POLY1305_SHA256"]

[tls.1_2]
groups = [
  "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256",
  "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
  "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
  "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256",
]

# Additional downstream certificates selected by TLS SNI. Multi-certificate
# downstream TLS keeps resumption, QUIC 0-RTT, and TCP early data disabled
# unless tls.resumption.multi_certificate = "partition_by_sni" is set with
# require_sni = true and reject_unknown_sni = true.
# [[tls.certificates]]
# server_names = ["iam.example.me"]
# cert_chain = "iam-fullchain.pem"
# private_key = "iam-privkey.pem"
#
# [[tls.certificates]]
# server_names = ["admin.example.me"]
# cert_chain = "admin-fullchain.pem"
# private_key = "admin-privkey.pem"
#
# [tls.certificates.ocsp]
# mode = "static_file"
# response_file = "admin-ocsp.der"

[tls.resumption]
mode = "stateful" # off | stateful | stateless
multi_certificate = "off" # off | partition_by_sni
session_cache_size = 4096
tls13_ticket_count = 2
rotation_seconds = 86400

# [tls.remote_signer]
# enabled = true
# socket_path = "/run/oxibelt-keysigner/sign.sock"
# key_id = "edge-default"
# token_env = "OXIBELT_KEYSIGNER_TOKEN"
# token_file = "keysigner-token.b64"
# token_reload_interval_ms = 1000
# connect_timeout_ms = 250
# sign_timeout_ms = 1000
# pool_max_idle_connections = 64
# allow_tls12_unstructured_signing = false

[tls.client_auth]
mode = "off"
ca_certs = []
verify_depth = 4

[tls.ocsp]
mode = "disabled"
# mode = "static_file"
# response_file = "ocsp.der"
# mode = "live_fetch"
# responder_url = "https://ocsp.example.test/status"
# request_timeout_ms = 3000
# max_response_bytes = 16384
# refresh_jitter_pct = 10
# clock_skew_seconds = 300

[tls.crlite]
mode = "disabled"
# mode = "enforce"
# mode = "managed"
# filter_file = "crlite.filter"
# filter_sha256 = ""
# max_filter_bytes = 33554432
# max_filter_age_seconds = 86400
# failure_policy = "fail_closed"
# coverage_policy = "allow_unknown"

[tls.crlite.managed]
# storage = "disk" # memory | tmpfs | disk
# cache_dir = "/var/lib/oxibelt/crlite"
# tmpfs_dir = "/dev/shm/oxibelt-crlite"
# max_cache_bytes = 67108864
# refresh_interval_seconds = 21600
# request_timeout_ms = 3000

[quic]
retry = true
zero_rtt = "off"
# For stable QUIC Retry/stateless reset tokens across restarts, generate
# 64 random bytes, base64 encode them, and mount the file under the cert dir:
#   openssl rand -base64 64 > /etc/oxibelt/cert/quic-host-key.b64
# host_key_file = "quic-host-key.b64"

[quic.alt_svc]
enabled = true
max_age_seconds = 86400
persist = false
# Use this when the client-visible HTTP/3 UDP port differs from the bind port,
# for example a container published as 443:8443/udp.
# [[quic.alt_svc.port_overrides]]
# bind = "0.0.0.0:8443"
# advertised_port = 443

[quic.transport]
max_concurrent_bidi_streams = 512
max_concurrent_uni_streams = 512
idle_timeout_ms = 30000
keep_alive_interval_ms = 0
stream_receive_window_bytes = 1250000
receive_window_bytes = 8388608
send_window_bytes = 10000000
send_fairness = true
datagram_receive_buffer_bytes = 1048576
datagram_send_buffer_bytes = 1048576
max_udp_payload_size = 1472
gso = true
initial_mtu = 1200
min_mtu = 1200

[quic.transport.mtu_discovery]
enabled = true
upper_bound = 1452
interval_ms = 600000
black_hole_cooldown_ms = 60000
minimum_change = 20

# Endpoint-specific overrides inherit from [quic.transport].
#[quic.downstream.transport]
#keep_alive_interval_ms = 10000
#receive_window_bytes = 8388608
#
#[quic.upstream.transport]
#stream_receive_window_bytes = 2097152
#
#[quic.upstream.transport.mtu_discovery]
#upper_bound = 1472

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = "auto"
reuse_port = true

[quic.upstream_pool]
enabled = true
max_connections_per_upstream = 1
max_lifetime_ms = 600000

# [sni_forward]
# enabled = true
# client_hello_max_bytes = 65536
# client_hello_parse_methods = ["single_record"]
# idle_timeout_ms = 75000
# quic_max_sessions = 8192
# quic_local_queue_capacity = 1024
# default_target = "10.0.10.20:443"
#
# [[sni_forward.rules]]
# name = "legacy-tls"
# server_names = ["legacy.example.com", "*.legacy.example.com"]
# target = "10.0.10.10:443"
# protocols = ["tcp_tls", "quic"]
# connect_timeout_ms = 3000
# idle_timeout_ms = 75000
# tcp_proxy_protocol_egress = "off"

[proxy]
trusted_ca_certs = []

[proxy.upstream_revocation.ocsp]
mode = "disabled" # disabled | live_fetch
failure_policy = "fail_closed" # fail_closed | degraded_allow
request_timeout_ms = 3000
max_response_bytes = 16384
refresh_jitter_pct = 10
clock_skew_seconds = 300

[proxy.upstream_revocation.crlite]
mode = "disabled" # disabled | enforce | managed
# filter_file = "upstream-crlite.filter"
# filter_sha256 = ""
max_filter_bytes = 33554432
max_filter_age_seconds = 86400
failure_policy = "fail_closed" # fail_closed | degraded_allow
coverage_policy = "allow_unknown" # allow_unknown | require_good

[proxy.upstream_revocation.crlite.managed]
storage = "disk" # memory | tmpfs | disk
cache_dir = "/var/lib/oxibelt/upstream-crlite"
tmpfs_dir = "/dev/shm/oxibelt-upstream-crlite"
max_cache_bytes = 67108864
refresh_interval_seconds = 21600
request_timeout_ms = 3000

[proxy.forwarded_headers]
mode = "overwrite"
client_ip_source = "resolved"

[proxy.real_ip]
enabled = false
trusted_proxies = []
header = "x-forwarded-for"
recursive = true
fail_on_untrusted_forwarded_headers = false

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.upgrades]
websocket = true
generic_http_upgrade = false
connect_tunneling = false

[proxy.grpc_web]
enabled = false

[proxy.retry]
enabled = false
tries = 2
timeout_ms = 5000
total_budget_ms = 5000
per_attempt_timeout_ms = 1000
on = ["connect_error", "read_timeout", "502", "503", "504"]
retry_non_idempotent = false
backoff_base_ms = 0
backoff_max_ms = 0
jitter = false
reselect_pool_on_retry = true
exclude_failed_pool_upstreams = true
report_passive_health = true

[proxy.buffering]
request = "streaming"  # streaming | memory | spool | reject_if_too_large
response = "streaming" # streaming | memory | spool | reject_if_too_large
max_memory_body_bytes = 1048576
max_temp_file_bytes = 0
# temp_dir = "/var/cache/oxibelt"

[proxy.static_files]
sendfile = "auto" # off | auto
sendfile_write_strategy = "auto" # auto | split | msg_more | tcp_cork
sendfile_chunk_bytes = 1048576
inline_max_bytes = 16384
open_file_cache_max_entries = 0
open_file_cache_ttl_ms = 0
hot_object_cache_max_bytes = 0
hot_object_cache_max_file_bytes = 65536

[proxy.http]
early_hints = "drop"
trailers = "pass"
expect_continue = "auto"
priority = "pass"
sse_auto_streaming = true
direct_h1_small_request_body_max_bytes = 16384

[proxy.http2]
adaptive_window = true
# initial_stream_window_bytes = 1048576
# initial_connection_window_bytes = 16777216
# max_frame_size_bytes = 65535
max_concurrent_streams = 1024
max_send_buf_size = 1048576
keep_alive_interval_ms = 0
keep_alive_timeout_ms = 20000
keep_alive_while_idle = false

[proxy.http3]
inline_bodyless_fast_path = false

[proxy.http.grpc]
enabled = true
respect_grpc_timeout = true
retry = "off"

[proxy.http.errors]
mode = "legacy_plain"

