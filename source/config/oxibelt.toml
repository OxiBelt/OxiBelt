[[routes]]
name = "app-root"
hosts = ["example.com", "www.example.com"]
path_prefix = "/"
upstream = "app"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false
# external_auth = "edge-auth"

[[routes]]
name = "api-v1"
hosts = ["api.example.com"]
path_prefix = "/v1"
replace_prefix_with = "/"
upstream = "app"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false
# external_auth = "edge-auth"

