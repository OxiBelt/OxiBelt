[[routes]]
name = "app-root"
hosts = ["example.com", "www.example.com"]
path_prefix = "/"
upstream = "app"
generic_http_upgrade = false
connect_tunneling = false
grpc_web = false
# external_auth = "edge-auth"
# security_headers = "default" # default | off | named policy

