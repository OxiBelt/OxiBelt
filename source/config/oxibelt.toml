# id = "admin"
# subject = "admin@example.com"
# groups = ["platform-admins"]

## When [admin.workload_identity].enabled = true, use exact mTLS mappings to
## an IPM principal. Supported claims are spiffe_id, san_uri, and san_dns.
## spiffe_id requires one canonical SPIFFE URI SAN; san_dns is lowercase exact
## matching without wildcards. Multiple identities may rotate onto one principal.
# [[ipm.trust]]
# source = "mtls"
# claim = "spiffe_id"
# value = "spiffe://example.test/ns/edge/sa/controller"
# principal = "admin"

