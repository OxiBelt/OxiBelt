[admin.tls]
enabled = false
min_version = "tls1.3"
max_version = "tls1.3"
session_tickets = false
require_sni = true
reject_unknown_sni = true

[admin.tls.resumption]
mode = "off" # off | stateful | stateless
session_cache_size = 1024
tls13_ticket_count = 2
rotation_seconds = 86400

[admin.tls.client_auth]
mode = "off"
ca_certs = []
verify_depth = 4

[metrics]
enabled = false
bind = "127.0.0.1:9090"
format = "prometheus"
detail = "detailed" # basic | detailed
histogram_buckets_ms = [1, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]

[telemetry.tracing]
enabled = false
endpoint = "http://127.0.0.1:4318/v1/traces"
service_name = "oxibelt"
sample_ratio = 1.0
export_timeout_ms = 3000
propagate_trace_context = true

[health]
enabled = false
bind = "127.0.0.1:9091"
ready_path = "/ready"
live_path = "/live"

# Process-wide overload shedding is compatible opt-in. When enabled, OxiBelt
# samples cgroup/process pressure and automatically recovers after the
# configured hysteresis window. See docs/Configuration.md for all thresholds.
[overload]
enabled = false
sample_interval = "250ms"
soft_enter_samples = 2
recovery_samples = 8
recovery_ratio = 0.90
signal_stale_timeout_ms = 2000

# Process-local bounded admission remains active independently of pressure
# sampling. Capacity is resolved per OxiBelt process from cgroup limits (or
# Kubernetes requests when no hard cgroup limit is present), so replica count
# scales aggregate capacity linearly.
[circuit_breakers]
enabled = true
response_status = 503
capacity_retry_after_ms = 1000

[circuit_breakers.global]
max_active_requests = "auto"
max_pending_requests = "auto"
pending_queue_timeout_ms = 50
max_connections = "auto"
max_streams = "auto"
max_body_inspection_jobs = "auto"
max_decompression_jobs = "auto"

[circuit_breakers.route_defaults]
max_active_requests = "auto"
max_pending_requests = "auto"
pending_queue_timeout_ms = 50
max_connections = "auto"
max_streams = "auto"
max_body_inspection_jobs = "auto"
max_decompression_jobs = "auto"

[circuit_breakers.pool_defaults]
max_active_requests = "auto"
max_pending_requests = "auto"
pending_queue_timeout_ms = 50
max_connections = "auto"
max_streams = "auto"
max_body_inspection_jobs = "auto"
max_decompression_jobs = "auto"

[circuit_breakers.retry_budget]
percent = 0.10
min_concurrency = 1
max_concurrency = "auto"
max_queue = "auto"
queue_timeout_ms = 25

[circuit_breakers.failure]
enabled = true
on = ["connect_error", "first_byte_timeout", "response_read_timeout", "protocol_error", "502", "503", "504"]
consecutive_failures = 5
minimum_requests = 20
failure_ratio = 0.50
window_ms = 10000
open_timeout_ms = 1000
max_open_timeout_ms = 30000
half_open_max_probes = 1
half_open_successes = 2

# Priority admission reserves are strict and require trusted local IPM or a
# verified TCP mTLS route match. Low-priority defaults cap `background` at 50%
# and `crawler` at 25%; public routes never obtain a reserve from HTTP headers.
[circuit_breakers.priority]
enabled = true

# [[circuit_breakers.priority.classes]]
# name = "security_callback"
# reserved_requests = 8
# max_share = 0.50
# max_pending_requests = 8
# pending_queue_timeout_ms = 50
# rejection_policy = "queue" # queue | reject

[security.headers]
hsts = false
hsts_max_age_seconds = 31536000
hsts_include_subdomains = true
hsts_preload = false
# x_content_type_options = "nosniff"
# referrer_policy = "strict-origin-when-cross-origin"
# permissions_policy = "default"

# [[security.header_policies]]
# name = "api"
# hsts = true
# hsts_max_age_seconds = 31536000
# hsts_include_subdomains = true
# hsts_preload = false
# x_content_type_options = "nosniff"
# referrer_policy = "same-origin"
# permissions_policy = "geolocation=()"

[database.mitigation]
enabled = false
mode = "managed" # managed | existing
connection_url_env = "OXIBELT_MITIGATION_DATABASE_URL"
# backend = "cluster" # PostgreSQL shared_state backend to reuse instead of connection_url/env
table = "oxibelt_mitigation_events"
namespace = "oxibelt"
max_connections = 4
connect_timeout_ms = 3000
queue_capacity = 8192
dedupe_window_ms = 60000
ttl_seconds = 300
failure_policy = "open" # open | closed

[database.mitigation.tls]
mode = "off"
# ca_cert = "postgres-ca.pem"
# client_cert = "postgres-client.pem"
# client_key = "postgres-client.key"

[shared_state]
enabled = false
namespace = "oxibelt"
# allow preserves existing redis:// deployments; use deny for remote/secure profiles.
redis_plaintext_policy = "allow" # allow | loopback_only | deny
instance_id_env = "OXIBELT_INSTANCE_ID"
udp_flow_identity_key_env = "OXIBELT_UDP_FLOW_IDENTITY_KEY"
# default_backend = "cluster"
operation_timeout_ms = 500
# Shared-state enumeration is cursor-based and bounded by these limits.
enumeration_page_size = 128
enumeration_max_items_per_operation = 4096
connection_lease_ms = 120000
cache_lock_ms = 10000
# rate_limits_backend = "cluster"
# connection_limits_backend = "cluster"
# udp_flows_backend = "cluster"
# person_proof_backend = "cluster"
# upstream_health_backend = "cluster"
# sticky_sessions_backend = "cluster"
# cache_backend = "cluster"
# reload_backend = "cluster"
# dynamic_policy_backend = "cluster"

[shared_state.failure_policies]
# These defaults preserve the existing post-activation behavior. They do not
# relax backend startup/prewarm requirements.
rate_limits = "fail_closed"
connection_limits = "reject_new_only"
udp_flows = "reject_new_only"
person_proof = "fail_closed"
upstream_health = "stale_snapshot"
sticky_sessions = "local_fallback"
cache = "local_fallback"
reload = "fail_open"

# [[shared_state.backends]]
# name = "cluster"
# kind = "redis" # redis | postgres
# connection_url_env = "OXIBELT_SHARED_STATE_URL"
# For verified TLS use `rediss://redis.edge.svc:6380/0`; avoid URL userinfo.
# max_connections = 4
# connect_timeout_ms = 3000
#
# [shared_state.backends.redis_pool]
# min_idle_connections = 0
# max_waiters = 16 # defaults to 4 * max_connections
# pool_wait_timeout_ms = 500 # defaults to shared_state.operation_timeout_ms
# command_timeout_ms = 500 # defaults to shared_state.operation_timeout_ms
# idle_timeout_ms = 60000
# health_check_interval_ms = 15000
# reconnect_min_backoff_ms = 50
# reconnect_max_backoff_ms = 5000
# circuit_breaker_failure_threshold = 5
# circuit_breaker_open_timeout_ms = 1000
#
# [shared_state.backends.redis_tls]
# trust_store = "custom" # webpki | native | custom
# server_name = "redis.edge.svc" # defaults to the rediss:// host
# ca_cert = "redis/cluster/ca.pem" # required only with trust_store = "custom"
# # client_cert = "redis/cluster/client.pem" # optional mTLS
# # client_key = "redis/cluster/client-key.pem"
# # server_spki_sha256 = ["sha256/<base64-encoded-32-byte-SPKI-hash>"]
#
# [shared_state.backends.redis_auth]
# # username_file = "redis/cluster/username" # optional Redis ACL username
# password_file = "redis/cluster/password" # AUTH password; username + password sends ACL AUTH
#
# [shared_state.backends.tls]
# mode = "off" # PostgreSQL only: off | verify_full
# ca_cert = "postgres-ca.pem"
# client_cert = "postgres-client.pem"
# client_key = "postgres-client.key"

[dynamic_policy]
enabled = false
# backend = "cluster" # PostgreSQL shared_state backend used as the policy source
refresh_interval_ms = 2000
max_policies = 10000
fail_policy = "use_last_good" # use_last_good | fail_closed_on_startup | disabled_on_error
default_status = 429
default_body = "Blocked by dynamic policy"

[dynamic_policy.automation_api]
enabled = false
require_ttl = true
signature_key_env = "OXIBELT_DYNAMIC_POLICY_HMAC_KEY"
# default_source_quota = 1000 # shared by all sources without an explicit source_quotas entry

# [[dynamic_policy.automation_api.source_quotas]]
# source = "vaultwarden"
# max_active_policies = 100
# [[dynamic_policy.automation_api.source_quotas]]
# source = "oxibeltctl"
# max_active_policies = 200
# [[dynamic_policy.automation_api.source_quotas]]
# source = "oxibeltctl-profile"
# max_active_policies = 100 # local oxibeltctl mitigation profiles

[dynamic_policy.matching]
trust_route_name = true
normalize_path = true
ipv4_prefix_bits = 24
ipv6_prefix_bits = 56
token_bindings = ["user_agent", "tls_fingerprint", "route", "direct_peer_ip_network_prefix"]
composite_identity_parts = ["client_ip_prefix", "user_agent", "tls_fingerprint", "asn"]

