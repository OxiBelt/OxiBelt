[compression]
enabled = true
gzip = true
deflate = true
zstd = true
br = true
min_size_bytes = 1024
statuses = [200]
mime_types = [
  "text/*",
  "application/json",
  "application/*+json",
  "application/javascript",
  "application/xml",
  "application/*+xml",
  "image/svg+xml",
]
level = 1
vary = true
proxied = ["expired", "no-cache"]
upstream_accept_encoding = "strip"
max_concurrent_responses = 0

[cache]
enabled = false
store = "memory" # memory | tmpfs | disk | memory_then_disk
tmpfs_dir = "/dev/shm/oxibelt-cache"
# disk_dir = "/var/cache/oxibelt"
max_size_bytes = 1073741824
# memory_max_size_bytes = 536870912
# disk_max_size_bytes = 10737418240
memory_auto_fraction = 0.5
default_ttl_seconds = 60
cache_methods = ["GET", "HEAD"]
cache_key = "{scheme}:{host}:{uri}"
partition_key = ""
respect_cache_control = true
stream_large_objects = true
stream_chunk_bytes = 1048576
copy_file_range = "auto" # auto | off | required
stale_if_error_seconds = 30
stale_while_revalidate_seconds = 30
lock = true
lock_wait_timeout_ms = 10000
tag_headers = ["Surrogate-Key", "Cache-Tag"]
max_tags_per_entry = 32
max_tag_bytes = 128
max_vary_fields = 8
max_vary_variants_per_key = 64
bypass_request_headers = ["Authorization", "Cookie", "Proxy-Authorization"]
background_refresh = true
background_refresh_max_concurrent = 16
negative_statuses = []
negative_ttl_seconds = 0
# external_handler = "massive"

[cache.surrogate]
enabled = true
strip_response_header = true

[cache.admission]
statuses = [200, 203, 204, 301, 308]
content_types = []
max_body_bytes = 0
min_hits = 1
max_tracked_keys = 16384

[cache.stale_if_error]
connect_error = true
read_timeout = true
statuses = []
max_upstream_stale_seconds = 0

# [[cache.external_handlers]]
# name = "massive"
# kind = "http"
# endpoint = "https://cache-handler.internal.example/v1/cache/"
# token_env = "OXIBELT_EXTERNAL_CACHE_TOKEN"
# connect_timeout_ms = 250
# request_timeout_ms = 30000
# max_metadata_bytes = 1048576
# max_body_bytes = 1073741824
# max_inflight_requests = 64
# fail_policy = "local_only"

[admin]
enabled = false
bind = "127.0.0.1:9092"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
transport = "auto" # auto | tls | plaintext_allowlist | plaintext
allow_insecure_plaintext = false
plaintext_allowed_source_cidrs = ["127.0.0.0/8", "::1/128"]

[admin.audit]
enabled = false
mode = "durable_required" # durable_required | durable_required_for_actions | best_effort; enforcing remains a legacy alias
acknowledgement = "postgres" # postgres | fsynced_spool
required_actions = [] # non-empty exact action IDs only with durable_required_for_actions
# backend = "cluster" # legacy alias for admin.audit.store.backend
queue_capacity = 1024

[admin.audit.store]
enabled = false
backend = "cluster" # PostgreSQL shared_state backend for oxibelt_admin_audit
kind = "postgres"

[admin.audit.export]
enabled = true
sinks = ["access_log"]
required_sinks = [] # legacy PostgreSQL requirement; prefer acknowledgement = "postgres"

[admin.audit.spool]
enabled = false
# directory = "/var/lib/oxibelt/admin-audit" # required when enabled; use an exclusive writable volume
max_bytes = 67108864
max_events = 16384
max_event_bytes = 65536

[admin.audit.integrity]
# Set both fields to add HMAC-SHA256 authentication to the audit hash chain.
# hmac_key_env = "OXIBELT_ADMIN_AUDIT_HMAC_KEY" # exactly 32 base64-encoded bytes
# hmac_key_id = "audit-2026-07"

[admin.audit.anchor]
enabled = false
record_interval = 1024
time_interval_ms = 60000
deployment_epoch_env = "OXIBELT_DEPLOYMENT_EPOCH"
max_pending_checkpoints = 1024
max_pending_bytes = 16777216

[admin.audit.anchor.sink]
kind = "postgres"
# backend = "audit-anchor" # separately administered PostgreSQL shared_state backend
# authority_id = "production-audit-anchor"
submit_timeout_ms = 5000

[admin.audit.anchor.signer]
kind = "keysigner"
# socket_path = "/run/oxibelt-audit-keysigner/signer.sock"
# key_id = "audit-anchor-2026-07"
# public_key_file = "admin-audit/audit-anchor-2026-07.ed25519.pub" # raw 32-byte Ed25519 key under source/cert
token_env = "OXIBELT_AUDIT_KEYSIGNER_TOKEN"
# token_file = "admin-audit/keysigner-token.b64" # alternative 32-byte base64 token under source/cert
token_reload_interval_ms = 1000
connect_timeout_ms = 250
sign_timeout_ms = 1000

[admin.operations]
enabled = true
persistence = "auto" # auto | ephemeral | postgres
# backend = "cluster" # named PostgreSQL shared_state backend; inferred from Admin audit for postgres
artifact_key_env = "OXIBELT_ADMIN_OPERATION_ARTIFACT_KEY" # exactly 32 base64-encoded bytes when postgres is selected
lease_seconds = 15
lease_renew_seconds = 5
max_lifetime_seconds = 86400
artifact_max_bytes = 16777216
checkpoint_max_bytes = 1048576
max_running = 4
max_queued = 64
max_stored = 256
retention_seconds = 3600
event_buffer = 256
result_max_bytes = 16777216
websocket = true
webtransport = true
webtransport_max_sessions = 64

[admin.http3]
enabled = false
# bind = "127.0.0.1:9092" # UDP; defaults to admin.bind when omitted

[admin.cache_purge_signing]
enabled = false
key_env = "OXIBELT_CACHE_PURGE_HMAC_KEY"
max_skew_seconds = 300
nonce_ttl_seconds = 600

# Opt-in binding of a verified Admin client certificate to the IPM principal
# authorized by its bearer credential. Requires transport = "tls", required
# admin TLS client authentication, IPM, and Admin audit.
[admin.workload_identity]
enabled = false
bearer_mode = "required" # required | optional
revoked_certificate_fingerprints_sha256 = [] # 64-character lowercase SHA-256 leaf fingerprints

# Durable replay protection for high-risk Admin mutations. `optional` validates
# supplied envelopes; `required` rejects protected mutations without one. Both
# modes require a PostgreSQL shared-state backend and enforcing durable audit.
[admin.mutations]
mode = "off" # off | optional | required
# backend = "cluster"
max_validity_seconds = 600
max_clock_skew_seconds = 30
retention_seconds = 86400
max_response_bytes = 1048576
artifact_key_env = "OXIBELT_ADMIN_MUTATION_ARTIFACT_KEY"

# [[admin.mutations.signers]]
# id = "gateway-controller-2026-07"
# principal = "admin"
# suite = "ed25519" # ed25519 | ed25519_ml_dsa_44
# ed25519_public_key_file = "admin-mutation/controller.ed25519.pub"
# ml_dsa_44_public_key_file = "admin-mutation/controller.ml-dsa-44.spki"

[admin.mutations.rollout]
# For fixed-member rollout, set mode = "admin_cluster", a non-empty cluster_id,
# members = ["edge-a", "edge-b", ...], OXIBELT_CONFIG_ROLLOUT_MODE=admin_cluster,
# OXIBELT_INSTANCE_ID to this process's member ID, a shared artifact key, and
# runtime.hot_reload.mode = "off".
mode = "single_instance" # single_instance | admin_cluster
cluster_id = ""
members = []
instance_id_env = "OXIBELT_INSTANCE_ID"
heartbeat_interval_seconds = 5
stale_after_seconds = 15
phase_timeout_seconds = 300
rollback_timeout_seconds = 300
canary_observation_seconds = 30

[ipm]
enabled = false
namespace = "oxibelt"
# backend = "cluster" # optional PostgreSQL shared_state backend for oxibelt_ipm_* tables
fail_closed = true

[ipm.break_glass]
# Argon2id memory limit for break-glass access token hashes.
# The default is 128 MiB; values may be raised up to 16384 MiB.
argon2id_memory_mib = 128
access_mode = "direct" # direct | two_factor_activation
max_activation_seconds = 900

