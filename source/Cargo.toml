[package]
name = "oxibelt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autobins = false

[features]
default = ["admin-runtime"]
admin-runtime = []
config-tooling = ["dep:jsonschema"]
crypto-ring = ["rustls/ring"]
fuzzing = []
mutation-pqc = ["admin-runtime", "aws-lc-rs/unstable"]

[dependencies]
anyhow = "1.0.103"
aho-corasick = "1.1.4"
arc-swap = "1.9.2"
aws-lc-rs = { version = "1.17.1", default-features = false }
argon2 = { version = "0.5.3", features = ["std"] }
async-compression = { version = "0.4.42", features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22.1"
brotli = "8.0.4"
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
clap = { version = "4.6.2", features = ["derive"] }
clubcard-crlite = { version = "0.5.1", default-features = false, features = ["builder"] }
der = "0.8.1"
deadpool = { version = "0.13.0", default-features = false, features = ["managed", "rt_tokio_1"] }
glob = "0.3.3"
http = "1.4.2"
httpdate = "1.0.3"
http-body-util = "0.1.4"
jsonschema = { workspace = true, optional = true }
futures-util = "0.3.32"
fastwebsockets = { version = "0.10.0", features = ["unstable-split"] }
flate2 = "1.1.9"
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = { version = "0.0.10", default-features = false, features = ["datagram"] }
h3-webtransport = "0.1.2"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
httparse = "1.10.1"
hyper = { version = "1.10.1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "http2", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
libc = "0.2.186"
md-5 = "0.11.0"
nix = { version = "0.31.3", default-features = false, features = ["fs", "net", "process", "signal", "socket", "zerocopy"] }
regex = "1.13.1"
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-native-certs = "0.8.4"
rustix = { version = "1.1.4", features = ["net", "process", "std"] }
webpki = { package = "rustls-webpki", version = "0.103.13" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = "0.11.0"
socket2 = "0.6.5"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
subtle = "2.6.1"
strsim.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "early-data", "logging", "tls12"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.3"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
unicode-normalization = "0.1.25"
url = { version = "2.5.8", features = ["serde"] }
webpki-roots = "1.0.8"
web-transport-quinn = { version = "0.11.10", default-features = false, features = ["aws-lc-rs"] }
quic-parser = { version = "0.1.5", default-features = false, features = ["aws-lc-rs"] }
x509-cert = "0.3.0"
# `x509-ocsp 0.2.1` still exposes `x509-cert 0.2` types in its public API.
# Keep this alias isolated to the OCSP implementation until those crates converge.
x509-cert-v2 = { package = "x509-cert", version = "0.2.5" }
x509-ocsp = { version = "0.2.1", features = ["builder"] }
zstd = "0.13.3"
zeroize = "1.9.0"
compio = { version = "0.19.1", default-features = false, features = ["io-uring", "polling", "runtime"] }
compio-driver = { version = "0.12.4", default-features = false, features = ["io-uring", "polling"] }
crc32fast = "1.5.0"
memchr = "2.8.3"
online-dsl-forge = "0.2.0"
oxibelt-control-protocol.workspace = true

[target.'cfg(all(target_arch = "riscv64", target_os = "linux", target_env = "musl"))'.dependencies]
aws-lc-rs = { version = "1.17.1", default-features = false, features = ["bindgen"] }

[dev-dependencies]
clubcard = { version = "0.3.3", features = ["builder"] }
criterion = { version = "0.8.2", default-features = false }
loom = "0.7.2"
pretty_assertions = "1.4.1"
proc-macro2 = "1.0.106"
syn = { version = "2.0.119", features = ["full", "visit"] }
tokio = { version = "1.52.4", features = ["test-util"] }

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

[[bin]]
name = "oxibelt"
path = "src/main.rs"
required-features = ["admin-runtime"]

[[bin]]
name = "oxibelt-docker-integration-matrix"
path = "../tests/rust/oxibelt-docker-integration-matrix.rs"

[[bin]]
name = "oxibelt-performance-aggregate"
path = "../tests/rust/oxibelt-performance-aggregate.rs"

