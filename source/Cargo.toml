[package]
name = "oxibelt"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[features]
default = []
fuzzing = []

[dependencies]
anyhow = "1.0.102"
aho-corasick = "1.1.4"
arc-swap = "1.9.1"
argon2 = { version = "0.5.3", features = ["std"] }
async-compression = { version = "0.4.42", features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
base64 = "0.22.1"
brotli = "8.0.4"
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
clubcard-crlite = { version = "0.4.0", default-features = false, features = ["builder"] }
der = "0.8.0"
glob = "0.3.3"
gateway-api = "0.21.0"
http = "1.4.2"
httpdate = "1.0.3"
http-body-util = "0.1.3"
futures-util = "0.3.32"
fastwebsockets = { version = "0.10.0", features = ["unstable-split"] }
flate2 = "1.1.9"
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
httparse = "1.10.1"
hyper = { version = "1.10.1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "http2", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
# gateway-api 0.21.0 still depends on k8s-openapi 0.27.x and needs a version feature.
k8s-openapi-v027 = { package = "k8s-openapi", version = "0.27.1", features = ["v1_35"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
libc = "0.2.186"
md-5 = "0.11.0"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "socket", "zerocopy"] }
regex = "1.12.4"
ring = "0.17.14"
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["net", "std"] }
sequoia-openpgp = { version = "2.3.0", default-features = false, features = ["crypto-openssl"] }
webpki = { package = "rustls-webpki", version = "0.103.13" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha1 = { version = "0.11.0", features = ["oid"] }
socket2 = "0.6.4"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
tokio-util = { version = "0.7.18", features = ["io"] }
toml = "1.1.2"
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
unicode-normalization = "0.1.25"
url = { version = "2.5.8", features = ["serde"] }
webpki-roots = "1.0.8"
web-transport-quinn = { version = "0.11.9", default-features = false, features = ["aws-lc-rs"] }
quic-parser = { version = "0.1.5", features = ["ring"] }
x509-cert = "0.2.5"
x509-ocsp = { version = "0.2.1", features = ["builder"] }
zstd = "0.13.3"
monoio = { version = "0.2.4", default-features = false, features = ["async-cancel", "bytes", "iouring", "legacy", "macros", "utils"] }

[target.'cfg(all(target_arch = "riscv64", target_os = "linux", target_env = "musl"))'.dependencies]
aws-lc-rs = { version = "1.17.0", default-features = false, features = ["bindgen"] }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux", target_env = "musl"))'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[target.'cfg(target_arch = "riscv64")'.dependencies]
openssl-sys = { version = "0.9.117", features = ["vendored"] }

[dev-dependencies]
clubcard = { version = "0.3.3", features = ["builder"] }
pretty_assertions = "1.4.1"

[[bin]]
name = "oxibelt-docker-integration-matrix"
path = "../tests/rust/oxibelt-docker-integration-matrix.rs"

[[bin]]
name = "oxibelt-performance-aggregate"
path = "../tests/rust/oxibelt-performance-aggregate.rs"

[[test]]
name = "config_and_routes"
path = "../tests/rust/config_and_routes.rs"

[[test]]
name = "tls_client_roots"
path = "../tests/rust/tls_client_roots.rs"

[[test]]
name = "stream_listener_limits"
path = "../tests/rust/stream_listener_limits.rs"

[[test]]
name = "sni_forward"
path = "../tests/rust/sni_forward.rs"

[[test]]
name = "pq_negotiation_support"
path = "../tests/rust/pq_negotiation_support.rs"

[[test]]
name = "waf"
path = "../tests/rust/waf.rs"

[[test]]
name = "kernel_extension_security"
path = "../tests/rust/kernel_extension_security.rs"

[[test]]
name = "ci_workflow_integrity"
path = "../tests/rust/ci_workflow_integrity.rs"

[[test]]
name = "performance_gate_integrity"
path = "../tests/rust/performance_gate_integrity.rs"

[[test]]
name = "performance_aggregate"
path = "../tests/rust/performance_aggregate.rs"

[[test]]
name = "admin_openapi_contract"
path = "../tests/rust/admin_openapi_contract.rs"

[[test]]
name = "feature_status_contract"
path = "../tests/rust/feature_status_contract.rs"

[[test]]
name = "observability_assets"
path = "../tests/rust/observability_assets.rs"
