[package]
name = "oxibelt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[features]
default = []
fuzzing = []

[dependencies]
anyhow = "1"
aho-corasick = "1.1.4"
arc-swap = "1"
argon2 = { version = "0.5", features = ["std"] }
async-compression = { version = "0.4", features = ["brotli", "gzip", "tokio", "zlib", "zstd"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
der = "0.7"
glob = "0.3"
http = "1"
httpdate = "1"
http-body-util = "0.1"
futures-util = "0.3"
fastwebsockets = { version = "0.10", features = ["unstable-split"] }
h3 = "0.0.8"
h3-datagram = "0.0.2"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
httparse = "1.10.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
libc = "0.2"
md-5 = "0.11"
nix = { version = "0.31", default-features = false, features = ["fs", "zerocopy"] }
regex = "1"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2"
webpki = { package = "rustls-webpki", version = "0.103" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = { version = "0.10", features = ["oid"] }
socket2 = "0.6"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
subtle = "2.6"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
webpki-roots = "1"
web-transport-quinn = { version = "0.11", default-features = false, features = ["aws-lc-rs"] }
quic-parser = { version = "0.1.5", features = ["ring"] }
x509-cert = "0.2"
x509-ocsp = { version = "0.2", features = ["builder"] }

[target.'cfg(all(target_arch = "riscv64", target_os = "linux", target_env = "musl"))'.dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["bindgen"] }

[dev-dependencies]
pretty_assertions = "1"

[[bin]]
name = "oxibelt-docker-integration-matrix"
path = "../tests/rust/oxibelt-docker-integration-matrix.rs"

[[bin]]
name = "oxibelt-performance-aggregate"
path = "../tests/rust/oxibelt-performance-aggregate.rs"

[[test]]
name = "config_and_routes"
path = "../tests/rust/config_and_routes.rs"

[[test]]
name = "tls_client_roots"
path = "../tests/rust/tls_client_roots.rs"

[[test]]
name = "stream_listener_limits"
path = "../tests/rust/stream_listener_limits.rs"

[[test]]
name = "sni_forward"
path = "../tests/rust/sni_forward.rs"

[[test]]
name = "pq_negotiation_support"
path = "../tests/rust/pq_negotiation_support.rs"

[[test]]
name = "waf"
path = "../tests/rust/waf.rs"

[[test]]
name = "kernel_extension_security"
path = "../tests/rust/kernel_extension_security.rs"

[[test]]
name = "ci_workflow_integrity"
path = "../tests/rust/ci_workflow_integrity.rs"

[[test]]
name = "performance_gate_integrity"
path = "../tests/rust/performance_gate_integrity.rs"

[[test]]
name = "performance_aggregate"
path = "../tests/rust/performance_aggregate.rs"

[[test]]
name = "admin_openapi_contract"
path = "../tests/rust/admin_openapi_contract.rs"

[[test]]
name = "observability_assets"
path = "../tests/rust/observability_assets.rs"
