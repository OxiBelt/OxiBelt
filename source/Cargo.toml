[package]
name = "oxibelt"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "http2", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "std"] }
url = { version = "2", features = ["serde"] }
webpki-roots = "1"

[target.'cfg(all(target_arch = "riscv64", target_os = "linux", target_env = "musl"))'.dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["bindgen"] }

[dev-dependencies]
pretty_assertions = "1"

[[test]]
name = "config_and_routes"
path = "../tests/rust/config_and_routes.rs"

[[test]]
name = "tls_client_roots"
path = "../tests/rust/tls_client_roots.rs"

[[test]]
name = "pq_negotiation_support"
path = "../tests/rust/pq_negotiation_support.rs"
