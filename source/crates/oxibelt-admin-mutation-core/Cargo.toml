[package]
name = "oxibelt-admin-mutation-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
fuzzing = []
mutation-pqc = []

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
http = "1.5.0"
oxibelt-crypto-primitives.workspace = true
oxibelt-build-identity.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["sync", "time"] }
zeroize = "1.9.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
