[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "riscv64gc-unknown-linux-gnu",
  "riscv64gc-unknown-linux-musl",
]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
maximum-db-staleness = "P7D"
unused-ignored-advisory = "deny"
ignore = []

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"
allow-wildcard-paths = true
highlight = "simplest-path"
deny = [
  { crate = "native-tls", use-instead = "rustls", reason = "OxiBelt standardizes network TLS on the reviewed rustls boundary" },
  { crate = "openssl", use-instead = "rustls", reason = "High-level OpenSSL use is forbidden; the reviewed Sequoia boundary is limited to openssl-sys" },
  { crate = "aws-lc-rs", deny-multiple-versions = true, reason = "Keep one cryptographic provider line" },
  { crate = "http", deny-multiple-versions = true, reason = "Keep one HTTP type-system line at the proxy boundary" },
  { crate = "hyper", deny-multiple-versions = true, reason = "Keep one HTTP implementation line at the proxy boundary" },
  { crate = "jsonschema", deny-multiple-versions = true, reason = "Keep one configuration-schema validator line" },
  { crate = "k8s-openapi", deny-multiple-versions = true, reason = "Keep one Kubernetes API schema line" },
  { crate = "kube", deny-multiple-versions = true, reason = "Keep one Kubernetes client line" },
  { crate = "openssl-sys", deny-multiple-versions = true, reason = "Keep the reviewed Sequoia OpenSSL FFI boundary singular" },
  { crate = "quinn", deny-multiple-versions = true, reason = "Keep one QUIC implementation line" },
  { crate = "rustls", deny-multiple-versions = true, reason = "Keep one TLS implementation line" },
  { crate = "sequoia-openpgp", deny-multiple-versions = true, reason = "Keep one signing parser and cryptography line" },
  { crate = "serde", deny-multiple-versions = true, reason = "Keep one serialization framework line" },
  { crate = "serde_json", deny-multiple-versions = true, reason = "Keep one JSON parser line" },
  { crate = "sqlx", deny-multiple-versions = true, reason = "Keep one database client line" },
  { crate = "toml", deny-multiple-versions = true, reason = "Keep one configuration parser line" },
  { crate = "zstd", deny-multiple-versions = true, reason = "Keep one compression implementation line" },
]

[bans.workspace-dependencies]
duplicates = "warn"
include-path-dependencies = true
unused = "deny"

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { crate = "buffered-reader@1.4.1", allow = ["LGPL-2.0-or-later"] },
  { crate = "clubcard@0.3.3", allow = ["MPL-2.0"] },
  { crate = "clubcard-crlite@0.5.1", allow = ["MPL-2.0"] },
  { crate = "sequoia-openpgp@2.4.1", allow = ["LGPL-2.0-or-later"] },
]

[licenses.private]
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
unused-allowed-source = "deny"
