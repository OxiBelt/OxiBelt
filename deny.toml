[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
  # RUSTSEC-2025-0141 is currently transitive through clubcard-crlite 0.3.2.
  # No patched upstream release is available, and replacing the CRLite parser
  # is a larger revocation-format compatibility change tracked separately.
  "RUSTSEC-2025-0141",
  # RUSTSEC-2023-0071 is currently transitive through pgp 0.19.0 for OpenPGP
  # parsing and detached signature verification. OxiBelt does not use pgp for
  # RSA private-key decryption or signing, and no patched pgp/rsa release is
  # available for this dependency path.
  "RUSTSEC-2023-0071",
]
