notes = "Reviewed the complete checksum-matched h2 0.4.15-to-0.4.16 production-source delta. The HTTP/2 receive path now charges a capped 25,600-byte framing-overhead budget for small and empty DATA frames, replenishing only when payload is delivered and issuing ENHANCE_YOUR_CALM on exhaustion, which bounds the advisory's queued-empty-frame resource attack. The remaining changes preserve protocol safety: 1xx push accounting is one-time, dropped buffered data releases capped flow-control capacity, trailers retain a waker, resets after received EOS preserve readable data, and zero-byte writes fail instead of spinning. Send buffering flushes outside stream locks; trailer headers receive existing RFC validation; HPACK reuses only fully copied scratch buffers and replaces its generated 4-bit decoder table with a bounds-checked 8-bit representation that rejects invalid EOS and padding. No dependency, feature, build-script, FFI, or unsafe-code change was introduced."

