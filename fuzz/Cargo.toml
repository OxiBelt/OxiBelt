[package]
name = "oxibelt-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
oxibelt = { path = "../source", features = ["fuzzing", "mutation-pqc"] }
oxibelt-gateway-controller = { path = "../source/apps/oxibelt-gateway-controller", features = ["fuzzing"] }
oxibeltctl = { path = "../source/apps/oxibeltctl", default-features = false, features = ["fuzzing"] }

[lints]
workspace = true

[[bin]]
name = "turn_protocol"
path = "fuzz_targets/turn_protocol.rs"
test = false
doc = false
bench = false

