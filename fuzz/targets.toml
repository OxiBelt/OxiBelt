version = 1

[program]
max_seed_files_per_target = 128
max_seed_bytes_per_target = 524288
max_working_corpus_files_per_target = 16384
max_cached_corpus_files_per_target = 8192
max_cached_corpus_bytes_per_target = 67108864
pr_runs = 256
campaign_seconds = 900
input_timeout_seconds = 10
rss_limit_mb = 3072
allocation_limit_mb = 512
pr_leak_detection = false
campaign_leak_detection = true

[[target]]
name = "turn_protocol"
owner = "TURN protocol and edge listener maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes interpreted as bounded STUN messages, TURN ChannelData, attributes, and authentication material."
invariants = ["parsing and validation never panic", "round trips preserve the bounded protocol representation", "malformed lengths and attributes fail closed"]
unsupported_states = ["live UDP or TCP sockets", "relay allocation", "external credential lookup"]
seed_dir = "fuzz/seeds/turn_protocol"
dictionary = "fuzz/dictionaries/turn.dict"
coverage_landmarks = ["source/src/turn/protocol.rs:parse_stun", "source/src/turn/protocol.rs:parse_channel_data"]
regression_path = "tests/fixtures/fuzz-regressions/turn_protocol"
leak_policy = "enabled"

[[target]]
name = "tls_client_hello"
owner = "TLS and SNI forwarding maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes interpreted as raw and TLS-record-framed ClientHello messages."
invariants = ["record reassembly remains bounded", "SNI normalization rejects invalid names", "malformed handshakes never panic"]
unsupported_states = ["live TLS handshakes", "private keys", "remote signers"]
seed_dir = "fuzz/seeds/tls_client_hello"
dictionary = "fuzz/dictionaries/tls.dict"
coverage_landmarks = ["source/src/sni_forward/client_hello.rs:tls_record_client_hello_sni", "source/src/sni_forward/client_hello.rs:raw_client_hello_sni"]
regression_path = "tests/fixtures/fuzz-regressions/tls_client_hello"
leak_policy = "enabled"

[[target]]
name = "http_semantics"
owner = "HTTP proxy semantics maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped to bounded methods, URIs, hosts, authorities, versions, and header maps."
invariants = ["hop-by-hop fields do not cross the upstream boundary", "URI rewriting stays bounded and valid", "ambiguous host and authority inputs fail closed"]
unsupported_states = ["network I/O", "upstream connection reuse", "streaming bodies"]
seed_dir = "fuzz/seeds/http_semantics"
dictionary = "fuzz/dictionaries/http.dict"
coverage_landmarks = ["source/src/proxy/http/headers.rs:add_forwarded_headers", "source/src/proxy/http/uri.rs:rewrite_uri"]
regression_path = "tests/fixtures/fuzz-regressions/http_semantics"
leak_policy = "enabled"

[[target]]
name = "compio_h1_response"
owner = "Compio direct-H1 response protocol maintainers"
max_input_bytes = 131072
input_contract = "Untrusted structured input supplies at most 128 KiB of upstream HTTP/1 response bytes, at most thirty-two fragmentation sizes, and nine selectors mapped to validated small protocol limits."
invariants = ["incremental parsing and every terminal outcome remain deterministic without panicking", "response-head, chunk-metadata, and trailer buffering never exceed the validated selected limits", "malformed framing fails closed without making the connection reusable"]
unsupported_states = ["live upstream or downstream sockets", "transport timeouts and background task cancellation", "changes to the established Hyper implementation"]
seed_dir = "fuzz/seeds/compio_h1_response"
dictionary = "fuzz/dictionaries/http.dict"
coverage_landmarks = ["source/src/fuzzing.rs:exercise_compio_h1_response", "source/src/proxy/http/fast_path/direct_h1/response_protocol/mod.rs:ResponseProtocolEngine"]
regression_path = "tests/fixtures/fuzz-regressions/compio_h1_response"
leak_policy = "enabled"

[[target]]
name = "http3_webtransport"
owner = "HTTP/3 and WebTransport maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped to bounded HTTP/3 request metadata, early-data state, and WebTransport protocol headers."
invariants = ["extended CONNECT classification is deterministic", "early-data decisions fail closed", "protocol token parsing stays bounded"]
unsupported_states = ["live QUIC connections", "WebTransport session tasks", "datagram forwarding"]
seed_dir = "fuzz/seeds/http3_webtransport"
dictionary = "fuzz/dictionaries/http.dict"
coverage_landmarks = ["source/src/proxy/http3.rs:is_webtransport_request", "source/src/proxy/http/webtransport.rs:parse_webtransport_protocols"]
regression_path = "tests/fixtures/fuzz-regressions/http3_webtransport"
leak_policy = "enabled"

[[target]]
name = "websocket_frame"
owner = "WebSocket and stream WAF maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped to at most eight bounded WebSocket data and control frames."
invariants = ["frame parsing and ownership never panic", "control-frame limits remain enforced", "WAF inspection consumes only bounded prefixes"]
unsupported_states = ["live upgraded connections", "unbounded message reassembly", "background session tasks"]
seed_dir = "fuzz/seeds/websocket_frame"
dictionary = "fuzz/dictionaries/websocket.dict"
coverage_landmarks = ["source/src/fuzzing.rs:exercise_websocket_frame", "source/src/proxy/stream_waf.rs:read_owned_frame"]
regression_path = "tests/fixtures/fuzz-regressions/websocket_frame"
leak_policy = "enabled"

[[target]]
name = "webrtc_turn"
owner = "WebRTC TURN authentication maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped to bounded STUN and TURN authentication, nonce, fingerprint, and address cases."
