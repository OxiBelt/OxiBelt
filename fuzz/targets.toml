version = 1

[program]
max_seed_files_per_target = 128
max_seed_bytes_per_target = 524288
max_working_corpus_files_per_target = 16384
max_cached_corpus_files_per_target = 8192
max_cached_corpus_bytes_per_target = 67108864
pr_runs = 256
campaign_seconds = 900
input_timeout_seconds = 10
rss_limit_mb = 3072
allocation_limit_mb = 512
pr_leak_detection = false
campaign_leak_detection = true

[[target]]
name = "turn_protocol"
owner = "TURN protocol and edge listener maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes interpreted as bounded STUN messages, TURN ChannelData, attributes, and authentication material."
invariants = ["parsing and validation never panic", "round trips preserve the bounded protocol representation", "malformed lengths and attributes fail closed"]
unsupported_states = ["live UDP or TCP sockets", "relay allocation", "external credential lookup"]
seed_dir = "fuzz/seeds/turn_protocol"
dictionary = "fuzz/dictionaries/turn.dict"
coverage_landmarks = ["source/src/turn/protocol.rs:parse_stun", "source/src/turn/protocol.rs:parse_channel_data"]
regression_path = "tests/fixtures/fuzz-regressions/turn_protocol"
leak_policy = "enabled"

[[target]]
name = "tls_client_hello"
owner = "TLS and SNI forwarding maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes interpreted as raw and TLS-record-framed ClientHello messages plus bounded QUIC Initial CRYPTO ranges."
invariants = ["record and QUIC CRYPTO reassembly remain bounded", "overlap conflicts are rejected without panics", "SNI normalization rejects invalid names", "malformed handshakes never panic"]
unsupported_states = ["live TLS handshakes", "private keys", "remote signers"]
seed_dir = "fuzz/seeds/tls_client_hello"
dictionary = "fuzz/dictionaries/tls.dict"
coverage_landmarks = ["source/src/sni_forward/client_hello.rs:tls_record_client_hello_sni", "source/src/sni_forward/client_hello.rs:raw_client_hello_sni", "source/src/sni_forward/quic/initial.rs:merge_crypto_segment"]
regression_path = "tests/fixtures/fuzz-regressions/tls_client_hello"
leak_policy = "enabled"

[[target]]
name = "http_semantics"
owner = "HTTP proxy semantics maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped to bounded methods, URIs, hosts, authorities, versions, and header maps."
invariants = ["hop-by-hop fields do not cross the upstream boundary", "URI rewriting stays bounded and valid", "ambiguous host and authority inputs fail closed"]
unsupported_states = ["network I/O", "upstream connection reuse", "streaming bodies"]
seed_dir = "fuzz/seeds/http_semantics"
dictionary = "fuzz/dictionaries/http.dict"
coverage_landmarks = ["source/src/proxy/http/headers.rs:add_forwarded_headers", "source/src/proxy/http/uri.rs:rewrite_uri"]
regression_path = "tests/fixtures/fuzz-regressions/http_semantics"
leak_policy = "enabled"

[[target]]
name = "path_security_semantics"
owner = "HTTP routing, URI, and static-file security maintainers"
max_input_bytes = 4096
input_contract = "Bounded structured request-target, query, route-prefix, rewrite, and origin-form selectors projected into production path boundaries."
invariants = ["accepted downstream paths cannot normalize into parent traversal", "lexical static resolution remains beneath its configured root", "origin-form and absolute-form path decisions are deterministic"]
unsupported_states = ["filesystem access or opening static files", "live downstream or upstream connections"]
seed_dir = "fuzz/seeds/path_security_semantics"
dictionary = "fuzz/dictionaries/path_security.dict"
coverage_landmarks = ["source/src/fuzzing/security_semantics.rs:exercise_path_security_semantics", "source/src/proxy/http/uri.rs:validate_downstream_path", "source/src/proxy/http/static_files/path.rs:resolve_request_path"]
regression_path = "tests/fixtures/fuzz-regressions/path_security_semantics"
leak_policy = "enabled"

[[target]]
name = "waf_request_evaluation"
owner = "WAF request evaluation and body-inspection maintainers"
max_input_bytes = 16384
input_contract = "Bounded structured request path, headers, body, representation transform, protocol selector, and content-coding selector evaluated by a fixed in-memory WAF ruleset."
invariants = ["defined meaning-preserving malicious mutations remain blocked", "fixed-rule action resolution is deterministic", "body decoding remains bounded and malformed coding does not panic"]
unsupported_states = ["filesystem-backed rule loading", "network, database, or runtime state"]
seed_dir = "fuzz/seeds/waf_request_evaluation"
dictionary = "fuzz/dictionaries/waf_evaluation.dict"
coverage_landmarks = ["source/src/waf/fuzz_security.rs:evaluate", "source/src/waf/person_proof_request.rs:evaluate_request", "source/src/proxy/http/waf_body_coding.rs:fuzz_decode_body"]
regression_path = "tests/fixtures/fuzz-regressions/waf_request_evaluation"
leak_policy = "enabled"

[[target]]
name = "auth_request_semantics"
owner = "External-auth and HTTP header security maintainers"
max_input_bytes = 4096
input_contract = "Bounded Authorization, identity-header, security-sensitive trailer, auth-result, fail-policy, and route-path selectors projected through production auth helpers."
invariants = ["untrusted identity headers are stripped before auth decisions", "explicit denial never becomes fail-open success", "sensitive trailers cannot cross the upstream boundary"]
unsupported_states = ["external auth network clients", "credential environment lookup or live identity providers"]
seed_dir = "fuzz/seeds/auth_request_semantics"
dictionary = "fuzz/dictionaries/auth_request.dict"
coverage_landmarks = ["source/src/external_auth.rs:fuzz_auth_request_semantics", "source/src/external_auth.rs:finish_auth_check", "source/src/proxy/http/headers.rs:sanitize_request_trailers_for_upstream"]
regression_path = "tests/fixtures/fuzz-regressions/auth_request_semantics"
leak_policy = "enabled"

[[target]]
