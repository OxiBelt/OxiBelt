regression_path = "tests/fixtures/fuzz-regressions/webrtc_turn"
leak_policy = "enabled"

[[target]]
name = "syscall_boundaries"
owner = "Runtime hardening and unsafe-code maintainers"
max_input_bytes = 4096
input_contract = "Untrusted bytes mapped only to reversible ABI conversion, batching, access-mask, socket-option, and file-offset planning."
invariants = ["numeric conversions reject overflow", "batch plans remain within fixed limits", "no process-wide syscall is invoked"]
unsupported_states = ["applying Landlock rules", "changing process socket state", "performing filesystem or network I/O"]
seed_dir = "fuzz/seeds/syscall_boundaries"
coverage_landmarks = ["source/src/hardening/syscalls.rs:landlock_handled_access_fs", "source/src/tcp_hop/syscalls.rs:tcp_info_layout"]
regression_path = "tests/fixtures/fuzz-regressions/syscall_boundaries"
leak_policy = "enabled"

[[target]]
name = "native_config"
owner = "Native configuration loader maintainers"
max_input_bytes = 65536
input_contract = "Untrusted bytes describe an in-memory graph of at most eight TOML documents of at most 8 KiB each."
invariants = ["include traversal and cycles fail closed", "glob expansion is sorted and deterministic", "merge conflicts preserve origin diagnostics"]
unsupported_states = ["host filesystem access", "environment-variable lookup", "runtime configuration publication"]
