[package]
name = "oxibelt-owned-embedded-runtime-api-fixture"
version = "0.0.0"
edition = "2024"
publish = false
build = false

# This fixture is deliberately its own workspace, rather than a member of the
# OxiBelt workspace. It represents a downstream library consumer.
[workspace]

[dependencies]
anyhow = "1.0.104"
oxibelt = { path = "../../../source" }
tokio = { version = "=1.53.1", features = ["sync"] }

# This standalone downstream workspace must resolve the same reviewed Hyper
# source as the repository workspace. Cargo patches are not inherited across
# workspace roots.
[patch.crates-io]
h2 = { path = "../../../source/third_party/h2" }
hyper = { path = "../../../source/third_party/hyper" }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"
