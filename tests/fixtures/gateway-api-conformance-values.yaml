# Listener sockets used by the Gateway API v1.6.1 GATEWAY-TCP and GATEWAY-UDP
# core profiles. These remain operator-declared even in conformance: the
# controller maps Gateway listener ports to these numeric targetPorts but never
# mutates the data-plane Service or workload.
service:
  additionalPorts:
    - { name: tcp-9300, protocol: TCP, port: 9300, targetPort: 9300 }
    - { name: tcp-9301, protocol: TCP, port: 9301, targetPort: 9301 }
    - { name: tcp-9302, protocol: TCP, port: 9302, targetPort: 9302 }
    - { name: tcp-9310, protocol: TCP, port: 9310, targetPort: 9310 }
    - { name: tcp-9311, protocol: TCP, port: 9311, targetPort: 9311 }
    - { name: tcp-9312, protocol: TCP, port: 9312, targetPort: 9312 }
    - { name: tcp-9313, protocol: TCP, port: 9313, targetPort: 9313 }
    - { name: tcp-9320, protocol: TCP, port: 9320, targetPort: 9320 }
    - { name: tcp-9321, protocol: TCP, port: 9321, targetPort: 9321 }
    - { name: udp-5300, protocol: UDP, port: 5300, targetPort: 5300 }
    - { name: udp-5301, protocol: UDP, port: 5301, targetPort: 5301 }
    - { name: udp-5302, protocol: UDP, port: 5302, targetPort: 5302 }
    - { name: udp-5310, protocol: UDP, port: 5310, targetPort: 5310 }
    - { name: udp-5311, protocol: UDP, port: 5311, targetPort: 5311 }
    - { name: udp-5312, protocol: UDP, port: 5312, targetPort: 5312 }
