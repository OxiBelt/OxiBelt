[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 1
main_runtime = "tokio_hyper"

[runtime.accept]
workers = 1
reuse_port = false
backlog = 128
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http_bind = "0.0.0.0:8080"
http_mode = "proxy"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"
min_version = "tls1.3"
max_version = "tls1.3"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[health]
enabled = true
bind = "0.0.0.0:9091"
ready_path = "/ready"
live_path = "/live"

[[upstreams]]
name = "unused-smoke-upstream"
origin = "http://127.0.0.1:1"
max_http_version = "h1"

[[routes]]
name = "riscv64-release-smoke"
hosts = ["smoke.oxibelt.test"]
path_prefix = "/"

[routes.actions.redirect]
status = 308
location_template = "/smoke-ok"
