[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[compression]
enabled = true
gzip = true
deflate = false
zstd = false
br = false
min_size_bytes = 1
statuses = [200]
mime_types = ["text/plain"]

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[waf.http_body_compression]
mode = "off"
encodings = ["gzip"]
max_decoded_body_bytes = 256
max_expansion_ratio = 50
decode_timeout_ms = 1000
max_concurrent_bodies = 1

[waf.limits]
max_body_inspection_bytes = 512

[[waf.rules]]
name = "decoded-request-body"
phase = "request"
priority = 10
when = "Request.Body.contains('compressed-secret')"

[[waf.rules.actions]]
type = "reject"
status = 403
body = "compressed request blocked"

[[waf.rules]]
name = "decoded-response-body"
phase = "response"
priority = 10
when = "Response.Body.contains('response-secret')"

[[waf.rules.actions]]
type = "reject_response"
status = 502
body = "compressed response blocked"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[routes.waf.http_body_compression]
mode = "transform"
