[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[cache]
enabled = true
store = "memory"
disk_dir = "/tmp"
max_size_bytes = 1048576
disk_max_size_bytes = 1048576
default_ttl_seconds = 60
cache_methods = ["GET"]
respect_cache_control = true

[[cache.policies]]
name = "assets"
store = "memory"
disk_max_size_bytes = 1048576

[[cache.policies.rules]]
mime_types = ["text/css"]
store = "disk"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "assets"
hosts = ["example.test"]
path_prefix = "/assets"
upstream = "http-upstream"
cache = "assets"
