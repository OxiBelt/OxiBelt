[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[shared_state]
enabled = true
namespace = "matrix-cache-groups-redis-coherence"
instance_id_env = "OXIBELT_INSTANCE_ID"
default_backend = "cluster"
operation_timeout_ms = 5000
connection_lease_ms = 30000
cache_lock_ms = 5000
cache_backend = "cluster"

[[shared_state.backends]]
name = "cluster"
kind = "redis"
connection_url = "redis://mock-redis:6379/0"
max_connections = 4
connect_timeout_ms = 1000

[proxy]
trusted_ca_certs = []

[cache]
enabled = true
store = "memory"
max_size_bytes = 1048576
default_ttl_seconds = 60
cache_methods = ["GET"]
respect_cache_control = true
stale_while_revalidate_seconds = 30
stale_if_error_seconds = 30
background_refresh = true
background_refresh_max_concurrent = 2

[cache.groups]
enabled = true

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
cache = "default"
