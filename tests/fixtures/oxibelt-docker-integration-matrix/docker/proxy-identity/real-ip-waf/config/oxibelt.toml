[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.real_ip]
enabled = true
trusted_proxies = ["0.0.0.0/0"]
header = "x-forwarded-for"
recursive = true
fail_on_untrusted_forwarded_headers = true

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[[waf.rules]]
name = "block-real-ip"
phase = "request"
priority = 10
when = "Request.Client.Ip.inCidr('203.0.113.0/24')"

[[waf.rules.actions]]
type = "reject"
status = 451
body = "real ip blocked"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
