[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"


[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[[waf.rules]]
name = "tag-response-object-request"
phase = "request"
priority = 1
when = "Request.Http.Path.endsWith('/response-object')"

[[waf.rules.actions]]
type = "set_tag"
key = "LoginRequest"
value = "true"

[[waf.rules]]
name = "response-object-model"
phase = "response"
priority = 10
when = """
Request.Http.Path.endsWith('/response-object') &&
Response.Cookies.has('upstream_session') &&
Response.Cookies.get('upstream_session') == 'present' &&
Response.Cookies.getAll('upstream_session').Count == 1 &&
Response.Tags.get('LoginRequest') == 'true' &&
Response.Transport.Network == 'tcp' &&
Response.Transport.RemoteIp != '' &&
Response.Transport.RemotePort > 0 &&
Response.Transport.IsEncrypted &&
Response.Transport.Tcp != null &&
Response.Transport.Udp == null
"""

[[waf.rules.actions]]
type = "set_response_header"
name = "X-Waf-Response-Object"
value = "matched"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
