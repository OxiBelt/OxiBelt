[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[waf.person_proof]
session_path = "/.oxibelt/person-proof/session"
verify_path = "/.oxibelt/person-proof/verify"
openapi_path = "/.oxibelt/person-proof/openapi.json"

[[waf.rules]]
name = "provider-person-proof"
phase = "request"
priority = 10
when = "Request.Http.Path.startsWith('/app/provider-proof') && Request.Client.PersonProof.State != 'valid'"

[[waf.rules.actions]]
type = "require_person_proof"
person_proof_mode = "custom_provider"
token_validity_seconds = 60
clearance.cookie.key = "__matrix_provider_person_proof"
token_bindings = ["user_agent", "route", "direct_peer_ip_network_prefix"]
single_use = true
success_tag = "PersonProof"
custom_frontend_url = "/person-proof/index.html"
challenge_redirect_status = 303
provider = "matrix-provider"
provider_metadata = { fixture = "provider-replay-consumes-session" }
provider_endpoint = "http://mock-http:18080/status/200?sequence_key=provider-replay-consumes-session&body_sequence=%7B%22success%22%3Afalse%7D%7C%7B%22success%22%3Atrue%7D&content_type=application/json"
provider_timeout_ms = 1000
provider_fail_policy = "closed"
send_remote_ip = true

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "person-proof-ui"
hosts = ["example.test"]
path_prefix = "/person-proof"
static_root = "person-proof"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
