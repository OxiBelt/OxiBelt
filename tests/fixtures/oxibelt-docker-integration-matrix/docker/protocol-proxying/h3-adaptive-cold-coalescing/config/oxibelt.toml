[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = false
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[metrics]
enabled = true
bind = "0.0.0.0:9090"
format = "prometheus"
detail = "detailed"

[quic.upstream.resolution]
max_endpoint_count = 16
min_ttl_ms = 1000
max_ttl_ms = 30000
negative_ttl_ms = 1000
address_family_stagger_ms = 250
max_connect_attempts = 4
cooldown_base_ms = 1000
cooldown_max_ms = 30000

[quic.upstream_pool]
enabled = true
max_connections_per_upstream = 1
max_lifetime_ms = 600000

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = true
max_http_version = "h3"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "h3-upstream"
origin = "https://valid.discovery.test.:18445/h3-origin"
max_http_version = "h3"
connect_timeout_ms = 3000
request_timeout_ms = 30000
idle_timeout_ms = 75000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls]
server_name = "mock-h3"

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "h3-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "h3-upstream"
