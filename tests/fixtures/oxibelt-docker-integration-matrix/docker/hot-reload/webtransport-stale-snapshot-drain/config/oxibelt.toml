[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true

[runtime.drain]
graceful_timeout_ms = 5000
long_connection_close_delay_ms = 5000
shutdown_delay_ms = 0

[runtime.hot_reload]
mode = "full"
poll_interval_ms = 2000

[listeners]
https_bind = "0.0.0.0:8443"
http1 = false
http2 = false
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = true
max_http_version = "h3"

[limits]
max_connections = 64
max_connections_per_ip = 64
max_webtransport_sessions = 64
max_webtransport_sessions_per_ip = 64
max_webtransport_sessions_per_connection = 4
connection_limit_identity = "proxy_protocol"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[upstreams]]
name = "alt-upstream"
origin = "http://mock-alt:18081/alt"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[upstreams]]
name = "webtransport-upstream"
origin = "https://mock-webtransport:18446/wt-origin"
max_http_version = "h3"
connect_timeout_ms = 3000
request_timeout_ms = 30000
idle_timeout_ms = 75000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "webtransport-route"
hosts = ["example.test"]
path_prefix = "/wt"
upstream = "webtransport-upstream"

[[routes]]
name = "http-route"
hosts = ["example.test"]
path_prefix = "/app"
upstream = "http-upstream"
