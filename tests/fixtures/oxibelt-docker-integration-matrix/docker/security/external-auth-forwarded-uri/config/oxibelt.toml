[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = false
http2 = true
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[external_auth]]
name = "edge-auth"
provider = "authelia"
endpoint = "http://mock-http:18080/status/418"
timeout_ms = 1000
fail_policy = "closed"
max_response_body_bytes = 8192

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 5000
first_byte_timeout_ms = 5000
read_timeout_ms = 5000
send_timeout_ms = 5000
preserve_host = false

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "vault-admin"
hosts = ["vault.example.test"]
path_prefix = "/"
upstream = "http-upstream"
external_auth = "edge-auth"

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = "auto"
reuse_port = true
