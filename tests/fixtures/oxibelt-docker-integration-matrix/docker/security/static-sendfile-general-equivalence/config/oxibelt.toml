[logging]
level = "info"

[logging.access_log]
enabled = true
stdout = true

[access_log.system]
enabled = true

[access_log.stdout]
enabled = true
schema = "ecs"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http_bind = "0.0.0.0:8080"
http_mode = "proxy"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = false

[proxy.static_files]
sendfile = "auto"

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[routes]]
name = "static-equivalence"
hosts = ["static-equivalence.example.test"]
path_prefix = "/static"
static_root = "public"
