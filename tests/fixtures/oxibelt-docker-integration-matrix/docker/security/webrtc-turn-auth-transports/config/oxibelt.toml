[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = false
max_http_version = "h1"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[[turn_upstream_pools]]
name = "turn-udp"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "turn-udp-a"
origin = "turn://mock-turn-udp:3478"

[[turn_upstream_pools]]
name = "turn-tcp"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "turn-tcp-a"
origin = "turn+tcp://mock-turn-tcp:3479"

[[turn_upstream_pools]]
name = "turn-tls"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "turn-tls-a"
origin = "turns://mock-turn-tls:5349"

[[webrtc_turn_listeners]]
name = "turn-auth"
mode = "proxy_pool"
bind_udp = "0.0.0.0:3478"
bind_tcp = "0.0.0.0:3479"
bind_tls = "0.0.0.0:5349"
realm = "turn.example.test"
idle_timeout_ms = 5000
udp_pool = "turn-udp"
tcp_pool = "turn-tcp"
tls_pool = "turn-tls"

[webrtc_turn_listeners.auth]
mode = "validate"
nonce_ttl_seconds = 60

[[webrtc_turn_listeners.auth.static_credentials]]
username = "turn-user"
password = "turn-password"
