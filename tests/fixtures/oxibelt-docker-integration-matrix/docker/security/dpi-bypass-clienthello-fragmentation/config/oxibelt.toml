[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = false
max_http_version = "h1"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[sni_forward]
enabled = true
client_hello_max_bytes = 65536
idle_timeout_ms = 5000

[[sni_forward.rules]]
name = "dpi-sni-forward"
server_names = ["sni-forward.test"]
target = "mock-https:18443"
protocols = ["tcp_tls"]
connect_timeout_ms = 3000
idle_timeout_ms = 5000
tcp_proxy_protocol_egress = "off"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
