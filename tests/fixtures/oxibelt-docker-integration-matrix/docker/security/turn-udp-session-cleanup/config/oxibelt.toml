[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = false
max_http_version = "h1"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[[turn_upstream_pools]]
name = "turn-udp"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "turn-a"
origin = "turn://mock-turn:3478"

[[webrtc_turn_listeners]]
name = "turn-proxy"
mode = "proxy_pool"
bind_udp = "0.0.0.0:3478"
idle_timeout_ms = 300
udp_pool = "turn-udp"

[webrtc_turn_listeners.auth]
mode = "pass_through"
