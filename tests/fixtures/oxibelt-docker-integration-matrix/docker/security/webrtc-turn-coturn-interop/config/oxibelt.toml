[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = false
max_http_version = "h1"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[[turn_upstream_pools]]
name = "coturn-udp"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "coturn-udp"
origin = "turn://coturn:3478"

[[turn_upstream_pools]]
name = "coturn-tcp"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "coturn-tcp"
origin = "turn+tcp://coturn:3478"

[[turn_upstream_pools]]
name = "coturn-tls"

[turn_upstream_pools.health_check]
enabled = false

[[turn_upstream_pools.servers]]
id = "coturn-tls"
origin = "turns://coturn:5349"

[turn_upstream_pools.servers.tls]
server_name = "coturn"

[[webrtc_turn_listeners]]
name = "coturn-proxy"
mode = "proxy_pool"
bind_udp = "0.0.0.0:3478"
bind_tcp = "0.0.0.0:3479"
bind_tls = "0.0.0.0:5349"
realm = "turn.example.test"
idle_timeout_ms = 30000
udp_pool = "coturn-udp"
tcp_pool = "coturn-tcp"
tls_pool = "coturn-tls"

[webrtc_turn_listeners.auth]
mode = "validate"
nonce_ttl_seconds = 60

[[webrtc_turn_listeners.auth.static_credentials]]
username = "turn-user"
password = "turn-password"

[[webrtc_turn_listeners]]
name = "oxibelt-edge-dual-stack"
mode = "edge_relay"
bind_udp = "0.0.0.0:4478"
bind_tcp = "0.0.0.0:4479"
bind_tls = "0.0.0.0:6349"
realm = "turn.example.test"
idle_timeout_ms = 30000

[[webrtc_turn_listeners.relay_families]]
family = "ipv4"
public_ip = "127.0.0.1"
relay_bind_ip = "0.0.0.0"

[webrtc_turn_listeners.relay_families.relay_port_range]
start = 55000
end = 55063

[[webrtc_turn_listeners.relay_families]]
family = "ipv6"
public_ip = "::1"
relay_bind_ip = "::"

[webrtc_turn_listeners.relay_families.relay_port_range]
start = 55100
end = 55163

[webrtc_turn_listeners.peer_policy]
allow_loopback_peers = true

[webrtc_turn_listeners.auth]
mode = "enforce"
nonce_ttl_seconds = 60

[[webrtc_turn_listeners.auth.static_credentials]]
username = "turn-user"
password = "turn-password"
