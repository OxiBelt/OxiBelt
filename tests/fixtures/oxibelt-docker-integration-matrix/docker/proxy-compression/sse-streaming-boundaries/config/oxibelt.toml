[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h3"

[proxy.buffering]
response = "streaming"

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = "auto"
reuse_port = true

[compression]
enabled = true
gzip = false
deflate = false
zstd = false
br = false
mime_types = ["application/octet-stream"]

[[compression.policies]]
name = "sse-events"
enabled = true
gzip = true
deflate = true
zstd = true
br = true
min_size_bytes = 1
statuses = [200]
mime_types = ["text/event-stream"]
level = 1
vary = true

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "incremental-h1"
origin = "http://incremental-h1:18084/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 10000
preserve_host = false

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "sse-compression"
hosts = ["example.test"]
path_prefix = "/sse-compression"
upstream = "incremental-h1"
compression = "sse-events"
