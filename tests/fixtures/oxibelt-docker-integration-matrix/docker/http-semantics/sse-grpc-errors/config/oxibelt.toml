[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.buffering]
response = "memory"
max_memory_body_bytes = 1048576

[proxy.http]
sse_auto_streaming = true

[proxy.http.grpc]
enabled = true
respect_grpc_timeout = true
retry = "off"

[proxy.http.errors]
mode = "json"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false

[upstreams.tls.ech]
mode = "disabled"

[[upstreams]]
name = "missing-upstream"
origin = "http://missing-upstream:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 250
request_timeout_ms = 1000
preserve_host = false

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "events-route"
hosts = ["example.test"]
path_prefix = "/events"
upstream = "http-upstream"

[[routes]]
name = "missing-route"
hosts = ["missing.example.test"]
path_prefix = "/"
upstream = "missing-upstream"

[[routes]]
name = "grpc-route"
hosts = ["grpc.example.test"]
path_prefix = "/"
upstream = "missing-upstream"
