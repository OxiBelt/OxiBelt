[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 1
main_runtime = "compio"
direct_h1_io = "compio"

[runtime.accept]
workers = 1
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.buffering]
request = "streaming"
response = "streaming"

[metrics]
enabled = true
bind = "0.0.0.0:9090"
detail = "detailed"

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[circuit_breakers]
enabled = true

[circuit_breakers.global]
max_active_requests = 16
max_pending_requests = 4
pending_queue_timeout_ms = 250
max_connections = 4
max_streams = 16
max_body_inspection_jobs = 1
max_decompression_jobs = 1

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 10000
first_byte_timeout_ms = 3000
read_timeout_ms = 2500
send_timeout_ms = 3000
idle_timeout_ms = 10000
pool_max_idle_per_host = 4
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
