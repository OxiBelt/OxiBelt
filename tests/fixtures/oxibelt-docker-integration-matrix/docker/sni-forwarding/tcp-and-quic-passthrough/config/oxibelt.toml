[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = 1
reuse_port = false

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[metrics]
enabled = true
bind = "0.0.0.0:9090"
detail = "detailed"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[sni_forward]
enabled = true
default_target = "mock-https:18443"
client_hello_max_bytes = 65536
idle_timeout_ms = 5000

[sni_forward.quic_initial_reassembly]
max_pending_sessions = 64
max_fragments_per_session = 64
max_datagrams_per_session = 64
max_buffered_datagram_bytes_per_session = 131072
max_total_buffered_bytes = 4194304
timeout_ms = 10000

[[sni_forward.rules]]
name = "tcp-explicit"
server_names = ["sni-forward.test"]
target = "mock-https:18443"
protocols = ["tcp_tls"]
connect_timeout_ms = 3000
idle_timeout_ms = 5000
tcp_proxy_protocol_egress = "off"

[[sni_forward.rules]]
name = "quic-explicit"
server_names = ["quic-forward.test"]
target = "mock-h3:18445"
protocols = ["quic"]
connect_timeout_ms = 3000
idle_timeout_ms = 5000

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
