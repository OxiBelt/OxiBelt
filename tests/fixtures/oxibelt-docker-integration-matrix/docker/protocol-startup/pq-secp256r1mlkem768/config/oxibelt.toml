[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"


[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10
[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["fullchain.pem"]

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[[routes]]
name = "pq-sni"
hosts = ["proxy"]
path_prefix = "/"
upstream = "http-upstream"

[routes.tls.1_3]
key_exchange_groups = ["x25519mlkem768", "secp256r1mlkem768", "x25519", "secp256r1", "secp384r1"]


[[upstreams]]
name = "pq-enabled"
origin = "https://openssl-pq:8443/"
max_http_version = "h1"
[upstreams.tls]
server_name = "proxy"
enable_secp256r1mlkem768 = true

[[upstreams]]
name = "pq-disabled"
origin = "https://openssl-pq:8443/"
max_http_version = "h1"
[upstreams.tls]
server_name = "proxy"

[[routes]]
name = "pq-enabled"
hosts = ["example.test"]
path_prefix = "/pq-enabled"
upstream = "pq-enabled"

[[routes]]
name = "pq-disabled"
hosts = ["example.test"]
path_prefix = "/pq-disabled"
upstream = "pq-disabled"
