[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[database.mitigation]
enabled = true
mode = "existing"
connection_url = "postgres://oxibelt:oxibelt@mock-postgres:5432/oxibelt"
table = "existing_mitigation_events"
namespace = "matrix-existing"
max_connections = 2
connect_timeout_ms = 5000
queue_capacity = 32
dedupe_window_ms = 600000
ttl_seconds = 300
failure_policy = "closed"

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[[waf.rules]]
name = "emit-existing-mitigation"
id = "emit-existing-mitigation"
phase = "request"
priority = 10
when = "Request.Http.Path == '/app/existing-mitigation'"

[[waf.rules.actions]]
type = "emit_mitigation"
intent = "observe"
provider = "matrix-isp"
reason = "existing-table-smoke"
target = "'198.51.100.44'"
failure_policy = "closed"

[[waf.rules.actions.fields]]
name = "path"
value = "Request.Http.Path"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
compression = "off"
