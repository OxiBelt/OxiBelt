[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"


[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10
[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[security.headers]
hsts = true
hsts_max_age_seconds = 63072000
hsts_preload = true
x_content_type_options = "nosniff"
referrer_policy = "no-referrer"
permissions_policy = "geolocation=(), camera=()"

[[security.header_policies]]
name = "api"
hsts = true
hsts_max_age_seconds = 15768000
hsts_include_subdomains = false
hsts_preload = false
x_content_type_options = "api-nosniff"
referrer_policy = "same-origin"
permissions_policy = "microphone=()"

[[security.header_policies]]
name = "static"
x_content_type_options = "static-nosniff"
referrer_policy = "strict-origin"

[compression]
enabled = true
gzip = true
deflate = true
zstd = true

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[[waf.rules]]
name = "terminal-security-headers"
phase = "request"
priority = 10
when = "Request.Http.Path == '/terminal/security-headers'"

[[waf.rules.actions]]
type = "reject"
status = 451
body = "blocked by security header test"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = true
webrtc = true
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "api-route"
hosts = ["example.test"]
path_prefix = "/api"
upstream = "http-upstream"
compression = "off"
security_headers = "api"

[[routes]]
name = "off-route"
hosts = ["example.test"]
path_prefix = "/off"
upstream = "http-upstream"
compression = "off"
security_headers = "off"

[[routes]]
name = "static-route"
hosts = ["example.test"]
path_prefix = "/static"
static_root = "public"
compression = "off"
security_headers = "static"

[[routes]]
name = "redirect-route"
hosts = ["example.test"]
path_prefix = "/redirect"
security_headers = "api"

[routes.actions.redirect]
status = 308
location_template = "/new{path_suffix}?{query}"

[[routes]]
name = "terminal-route"
hosts = ["example.test"]
path_prefix = "/terminal"
upstream = "http-upstream"
compression = "off"
security_headers = "api"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"
compression = "off"
