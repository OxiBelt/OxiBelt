[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.retry]
enabled = true
tries = 2
on = ["503"]

[[upstream_pools]]
name = "default-pool"
algorithm = "weighted_least_conn"

[[upstream_pools.servers]]
id = "bad"
origin = "http://mock-http:18080/status/503"

[[upstream_pools.servers]]
id = "good"
origin = "http://mock-alt:18081/alt"

[[upstream_pools]]
name = "retry-pool"
algorithm = "weighted_least_conn"

[[upstream_pools.servers]]
id = "bad"
origin = "http://mock-http:18080/status/503"

[[upstream_pools.servers]]
id = "good"
origin = "http://mock-alt:18081/alt"

[[routes]]
name = "default-post"
hosts = ["default.example.test"]
path_prefix = "/"
upstream_pool = "default-pool"

[[routes]]
name = "retry-post"
hosts = ["retry.example.test"]
path_prefix = "/"
upstream_pool = "retry-pool"

[routes.retry]
retry_non_idempotent = true
