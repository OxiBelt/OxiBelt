[logging]
level = "info"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"


[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10
[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[[upstream_pools]]
name = "grpc-pool"
algorithm = "round_robin"

[[upstream_pools.servers]]
origin = "http://mock-h2c:18082/h2c-origin"

[upstream_pools.health_check]
enabled = true
mode = "active"
protocol = "grpc"
interval_ms = 500
timeout_ms = 1000
healthy_threshold = 1
unhealthy_threshold = 1
grpc_service = ""
grpc_expected_statuses = ["SERVING"]

[[routes]]
name = "grpc-health-route"
hosts = ["example.test"]
path_prefix = "/"
upstream_pool = "grpc-pool"
