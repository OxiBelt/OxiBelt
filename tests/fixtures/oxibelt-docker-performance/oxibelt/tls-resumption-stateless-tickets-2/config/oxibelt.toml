[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.worker_multipliers]
runtime = 1.0
accept = 1.0
quic_socket = 1.0

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http_bind = "0.0.0.0:8080"
http_mode = "proxy"
http1 = true
http2 = true
http3 = true

[limits]
max_connections = 200000
max_connections_per_ip = 200000
max_webtransport_sessions = 200000
max_webtransport_sessions_per_ip = 200000
max_requests_per_connection = 10000000

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.resumption]
mode = "stateless"
session_cache_size = 4096
tls13_ticket_count = 2
rotation_seconds = 86400

[tls.ocsp]
mode = "disabled"

[metrics]
enabled = true
bind = "0.0.0.0:9090"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.http2]
adaptive_window = true
max_concurrent_streams = 1024
max_send_buf_size = 1048576
keep_alive_interval_ms = 0
keep_alive_timeout_ms = 20000
keep_alive_while_idle = false

[proxy.static_files]
sendfile = "auto"
inline_max_bytes = 16384

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "perf-upstream"
origin = "http://perf-upstream:18080"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
pool_max_idle_per_host = 128
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[[routes]]
name = "static-route"
hosts = ["example.test"]
path_prefix = "/static"
static_root = "/etc/oxibelt/static"

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "perf-upstream"

[quic]
retry = true
host_key_file = "quic-host-key.b64"

[quic.transport]
max_concurrent_bidi_streams = 512
max_concurrent_uni_streams = 512
idle_timeout_ms = 30000
datagram_receive_buffer_bytes = 1048576
datagram_send_buffer_bytes = 1048576
max_udp_payload_size = 1472
gso = true

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = "auto"
reuse_port = true
