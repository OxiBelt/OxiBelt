[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"

[runtime.worker_multipliers]
runtime = 1.0
accept = 0.5
quic_socket = 1.0

[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http_bind = "0.0.0.0:8080"
http_mode = "proxy"
http1 = true
http2 = true
http3 = false

[limits]
max_connections = 200000
max_connections_per_ip = 200000
max_webtransport_sessions = 200000
max_webtransport_sessions_per_ip = 200000
max_requests_per_connection = 10000000

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[proxy.http2]
adaptive_window = false
initial_stream_window_bytes = 1048576
initial_connection_window_bytes = 16777216
max_frame_size_bytes = 65535
max_concurrent_streams = 1024
max_send_buf_size = 1048576
keep_alive_interval_ms = 0
keep_alive_timeout_ms = 20000
keep_alive_while_idle = false

[compression]
enabled = false

[waf]
enabled = true
mode = "enforcing"
fail_policy = "closed"

[[waf.pattern_sets]]
name = "text-search-miss"
kind = "contains"
patterns = [
  "never-match-00", "never-match-01", "never-match-02", "never-match-03",
  "never-match-04", "never-match-05", "never-match-06", "never-match-07",
  "never-match-08", "never-match-09", "never-match-10", "never-match-11",
  "never-match-12", "never-match-13", "never-match-14", "never-match-15",
  "never-match-16", "never-match-17", "never-match-18", "never-match-19",
  "never-match-20", "never-match-21", "never-match-22", "never-match-23",
  "never-match-24", "never-match-25", "never-match-26", "never-match-27",
  "never-match-28", "never-match-29", "never-match-30", "never-match-31",
]

[[waf.pattern_sets]]
name = "text-search-overlap"
kind = "contains"
patterns = ["aba", "bab", "aba", "baba"]

[[waf.rules]]
name = "text-search-multi-pattern-miss-overlap"
phase = "request"
priority = 10
when = "!Request.Http.Path.containsAny('text-search-miss') && Request.Http.Path.containsAny('text-search-overlap')"

[[waf.rules.actions]]
type = "reject"
status = 403
body = "text search diagnostic matched"

[[upstreams]]
name = "perf-upstream"
origin = "http://perf-upstream:18080"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
pool_max_idle_per_host = 128
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "perf-upstream"
