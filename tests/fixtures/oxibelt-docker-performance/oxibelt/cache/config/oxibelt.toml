[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = "auto"


[runtime.accept]
workers = "auto"
reuse_port = true
backlog = 8192
accept_error_backoff_ms = 10
[listeners]
https_bind = "0.0.0.0:8443"
http_bind = "0.0.0.0:8080"
http_mode = "proxy"
http1 = true
http2 = true
http3 = false

[limits]
max_connections = 200000
max_connections_per_ip = 200000
max_webtransport_sessions = 200000
max_webtransport_sessions_per_ip = 200000
max_requests_per_connection = 10000000

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[proxy.auto_upgrade]
enabled = true
max_http_version = "h2"

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[cache]
enabled = true
store = "memory"
max_size_bytes = 16777216
default_ttl_seconds = 60
cache_methods = ["GET"]
respect_cache_control = true
stream_large_objects = true
stream_chunk_bytes = 32768

[[upstreams]]
name = "perf-upstream"
origin = "http://perf-upstream:18080"
max_http_version = "h1"
connect_timeout_ms = 3000
request_timeout_ms = 30000
preserve_host = false
websocket = false
webrtc = false
webtransport = false

[[routes]]
name = "main-route"
hosts = ["example.test"]
path_prefix = "/"
upstream = "perf-upstream"
cache = "default"
