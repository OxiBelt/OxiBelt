[package]
name = "perf-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
futures-util = "0.3.32"
h2 = "0.4.14"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
hdrhistogram = "7.5.4"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["http1", "http2", "server", "service", "tokio"] }
quinn = { version = "0.11.9", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde_json = "1.0.145"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
