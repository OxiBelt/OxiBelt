[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 1

[runtime.accept]
workers = 1
reuse_port = false
backlog = 1024
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = []

[admin]
enabled = true
bind = "0.0.0.0:9092"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
transport = "plaintext_allowlist"
plaintext_allowed_source_cidrs = ["172.16.0.0/12", "10.0.0.0/8"]

[admin.audit]
enabled = true
mode = "durable_required"
backend = "admin-state"
queue_capacity = 128

[admin.audit.store]
enabled = true
kind = "postgres"
backend = "admin-state"

[admin.mutations]
mode = "optional"
backend = "admin-state"
max_validity_seconds = 300
max_clock_skew_seconds = 30
retention_seconds = 600
max_response_bytes = 65536

[[admin.mutations.signers]]
id = "security-fuzz-signer"
principal = "admin"
suite = "ed25519"
ed25519_public_key_file = "admin-mutation/signer.ed25519.pub"

[[admin.mutations.signers]]
id = "security-fuzz-denied-signer"
principal = "denied"
suite = "ed25519"
ed25519_public_key_file = "admin-mutation/signer.ed25519.pub"

[admin.mutations.rollout]
mode = "single_instance"

[ipm]
enabled = true

[shared_state]
enabled = true
namespace = "security-fuzz-admin"
default_backend = "admin-state"
operation_timeout_ms = 3000

[[shared_state.backends]]
name = "admin-state"
kind = "postgres"
connection_url_env = "OXIBELT_SECURITY_FUZZ_POSTGRES_URL"
max_connections = 4
connect_timeout_ms = 3000

[shared_state.backends.tls]
mode = "off"

[[ipm.principals]]
id = "admin"
subject = "admin@example.test"
[[ipm.credentials]]
name = "admin"
principal = "admin"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
[[ipm.policies]]
name = "admin"
[[ipm.policies.statements]]
effect = "allow"
actions = ["*"]
resources = ["*"]
[[ipm.bindings]]
principal = "admin"
policy = "admin"

[[ipm.principals]]
id = "denied"
subject = "denied@example.test"
[[ipm.credentials]]
name = "denied"
principal = "denied"
bearer_token_env = "OXIBELT_DENIED_TOKEN"
[[ipm.policies]]
name = "denied"
[[ipm.policies.statements]]
effect = "deny"
actions = ["config:Load", "config:ReloadDownstreamTls"]
resources = ["*"]
[[ipm.bindings]]
principal = "denied"
policy = "denied"

[compression]
enabled = false

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "http-upstream"
origin = "http://mock-http:18080/origin"
max_http_version = "h1"
connect_timeout_ms = 1000
request_timeout_ms = 3000
preserve_host = false

[[routes]]
name = "main"
hosts = ["example.test"]
path_prefix = "/"
upstream = "http-upstream"

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = 1
reuse_port = false
