[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 1

[runtime.accept]
workers = 1
reuse_port = false
backlog = 1024
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = false
http3 = false

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = false
max_http_version = "h1"

[admin]
enabled = true
bind = "0.0.0.0:9092"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
transport = "plaintext_allowlist"
plaintext_allowed_source_cidrs = ["172.16.0.0/12", "10.0.0.0/8"]

[ipm]
enabled = true

[[ipm.principals]]
id = "admin"
subject = "admin@example.test"

[[ipm.credentials]]
name = "admin"
principal = "admin"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"

[[ipm.policies]]
name = "admin"

[[ipm.policies.statements]]
effect = "allow"
actions = ["*"]
resources = ["*"]

[[ipm.bindings]]
principal = "admin"
policy = "admin"

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[turn_upstream_pools]]
name = "udp"
[turn_upstream_pools.health_check]
enabled = false
[[turn_upstream_pools.servers]]
id = "udp-a"
origin = "turn://mock-turn-udp:3478"

[[turn_upstream_pools]]
name = "tcp"
[turn_upstream_pools.health_check]
enabled = false
[[turn_upstream_pools.servers]]
id = "tcp-a"
origin = "turn+tcp://mock-turn-tcp:3479"

[[turn_upstream_pools]]
name = "tls"
[turn_upstream_pools.health_check]
enabled = false
[[turn_upstream_pools.servers]]
id = "tls-a"
origin = "turns://mock-turn-tls:5349"

[[webrtc_turn_listeners]]
name = "turn"
mode = "proxy_pool"
bind_udp = "0.0.0.0:3478"
bind_tcp = "0.0.0.0:3479"
bind_tls = "0.0.0.0:5349"
realm = "turn.example.test"
idle_timeout_ms = 1000
udp_pool = "udp"
tcp_pool = "tcp"
tls_pool = "tls"

[webrtc_turn_listeners.auth]
mode = "validate"
nonce_ttl_seconds = 60

[[webrtc_turn_listeners.auth.static_credentials]]
username = "turn-user"
password = "turn-password"

[[webrtc_turn_listeners]]
name = "turn-edge"
mode = "edge_relay"
bind_udp = "0.0.0.0:3480"
realm = "turn.example.test"
idle_timeout_ms = 1000
public_ip = "192.0.2.1"
relay_bind_ip = "0.0.0.0"

[webrtc_turn_listeners.relay_port_range]
start = 55000
end = 55007

[webrtc_turn_listeners.limits]
max_allocations_per_listener = 1
max_allocations_per_client = 1
max_permissions_per_allocation = 1
max_channels_per_allocation = 1
max_allocation_lifetime_seconds = 1

[webrtc_turn_listeners.auth]
mode = "enforce"
nonce_ttl_seconds = 30

[[webrtc_turn_listeners.auth.static_credentials]]
username = "turn-user"
password = "turn-password"
