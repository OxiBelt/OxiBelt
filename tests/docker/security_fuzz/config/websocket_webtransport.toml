[logging]
level = "warn"

[runtime]
linux_only = true
read_only_rootfs_compatible = true
memory_only_state = true
unprivileged_mode = true
worker_threads = 1

[runtime.accept]
workers = 1
reuse_port = false
backlog = 1024
accept_error_backoff_ms = 10

[listeners]
https_bind = "0.0.0.0:8443"
http1 = true
http2 = true
http3 = true

[tls]
cert_chain = "fullchain.pem"
private_key = "privkey.pem"

[tls.ocsp]
mode = "disabled"

[proxy]
trusted_ca_certs = ["upstream-ca.pem"]

[proxy.auto_upgrade]
enabled = true
max_http_version = "h3"

[admin]
enabled = true
bind = "0.0.0.0:9092"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
transport = "plaintext_allowlist"
plaintext_allowed_source_cidrs = ["172.16.0.0/12", "10.0.0.0/8"]

[ipm]
enabled = true

[[ipm.principals]]
id = "admin"
subject = "admin@example.test"
[[ipm.credentials]]
name = "admin"
principal = "admin"
bearer_token_env = "OXIBELT_ADMIN_TOKEN"
[[ipm.policies]]
name = "admin"
[[ipm.policies.statements]]
effect = "allow"
actions = ["*"]
resources = ["*"]
[[ipm.bindings]]
principal = "admin"
policy = "admin"

[compression]
enabled = false

[limits]
max_connections = 64
max_connections_per_ip = 64
max_webtransport_sessions = 8
max_webtransport_sessions_per_ip = 4
max_webtransport_sessions_per_connection = 2

[waf]
enabled = false
mode = "enforcing"
fail_policy = "closed"

[[upstreams]]
name = "ws"
origin = "http://mock-websocket:18081"
max_http_version = "h1"
connect_timeout_ms = 1000
request_timeout_ms = 3000
preserve_host = false
websocket = true

[[upstreams]]
name = "wt"
origin = "https://mock-webtransport:18446/wt-origin"
max_http_version = "h3"
connect_timeout_ms = 1000
request_timeout_ms = 3000
preserve_host = false
webtransport = true

[upstreams.tls.ech]
mode = "disabled"

[[routes]]
name = "ws"
hosts = ["example.test"]
path_prefix = "/ws"
upstream = "ws"

[[routes]]
name = "wt"
hosts = ["example.test"]
path_prefix = "/wt"
upstream = "wt"

[quic.socket]
receive_buffer_bytes = 16777216
send_buffer_bytes = 16777216
workers = 1
reuse_port = false
