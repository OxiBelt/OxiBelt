[package]
name = "protocol-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22.1"
bytes = "1.12.0"
futures-util = "0.3.32"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false, features = ["datagram"] }
http = "1.4.2"
http-body-util = "0.1.3"
hyper = { version = "1.10.1", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["http2", "server", "service", "tokio"] }
hmac = "0.13.0"
md-5 = "0.11.0"
quinn = { version = "0.11.11", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde_json = "1.0.150"
sha1 = "0.11.0"
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
url = "2.5.8"
web-transport-quinn = { version = "0.11.9", default-features = false, features = ["aws-lc-rs"] }
