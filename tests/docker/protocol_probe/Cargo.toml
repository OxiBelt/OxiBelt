[package]
name = "protocol-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1.12.1"
futures-util = "0.3.34"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", default-features = false, features = ["datagram"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["http2", "server", "service", "tokio"] }
hmac = "0.13.0"
md-5 = "0.11.0"
quinn = { version = "0.11.11", default-features = false, features = ["log", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
url = "2.5.8"
web-transport-quinn = { version = "0.12.0", default-features = false, features = ["aws-lc-rs"] }
