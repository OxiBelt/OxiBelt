[package]
name = "pq-probe"
version = "0.0.0"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
anyhow = "1.0.104"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
