[workspace]
members = [
  "source",
  "source/apps/oxibelt-gateway-controller",
  "source/apps/oxibelt-keysigner",
  "source/apps/oxibelt-netport-switcher",
  "source/apps/oxibeltctl",
  "source/crates/oxibelt-control-http",
  "source/crates/oxibelt-control-protocol",
  "source/crates/oxibelt-deployment-diagnostics",
  "fuzz",
  "tests/unsafe_harness",
]
default-members = [
  "source",
  "source/apps/oxibelt-gateway-controller",
  "source/apps/oxibelt-keysigner",
  "source/apps/oxibelt-netport-switcher",
  "source/apps/oxibeltctl",
  "source/crates/oxibelt-control-http",
  "source/crates/oxibelt-control-protocol",
  "source/crates/oxibelt-deployment-diagnostics",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.103"
aws-lc-rs = { version = "1.17.1", default-features = false }
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3.3"
getrandom = "0.4.3"
http = "1.4.2"
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "http2", "webpki-tokio"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
k8s-openapi = { version = "0.28.0", features = ["v1_35"] }
kube = { version = "4.0.0", default-features = false, features = ["client", "runtime", "rustls-tls", "aws-lc-rs"] }
libc = "0.2.186"
nix = { version = "0.31.3", default-features = false, features = ["fs", "net", "process", "signal", "socket", "zerocopy"] }
oxibelt = { path = "source" }
oxibelt-control-http = { path = "source/crates/oxibelt-control-http" }
oxibelt-control-protocol = { path = "source/crates/oxibelt-control-protocol" }
oxibelt-deployment-diagnostics = { path = "source/crates/oxibelt-deployment-diagnostics" }
openssl-sys = { version = "0.9.117", features = ["vendored"] }
pretty_assertions = "1.4.1"
rustls = { version = "0.23.42", default-features = false, features = ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"] }
rustix = { version = "1.1.4", features = ["net", "process", "std"] }
sequoia-openpgp = { version = "=2.4.1", default-features = false, features = ["crypto-openssl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "std"] }
url = { version = "2.5.8", features = ["serde"] }
webpki-roots = "1.0.8"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
